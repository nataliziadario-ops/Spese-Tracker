<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrazione pagamento — Spese</title>
<style>
  :root{
    --bg:#EDEFEA;--surface:#FFFFFF;--border:#E1E4DE;--ink:#1B1F1C;--ink-soft:#6B7268;
    --accent:#146356;--accent-dark:#0E4B41;--red:#B3422E;--red-soft:#F5DED8;--green-soft:#DCEAE6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px 24px;max-width:400px;width:100%;text-align:center;box-shadow:0 4px 18px rgba(27,31,28,0.08);}
  .emoji{font-size:44px;margin-bottom:8px;}
  h1{font-size:18px;margin:0 0 6px;}
  p{font-size:14px;color:var(--ink-soft);margin:0 0 4px;line-height:1.5;}
  .detail{font-size:16px;font-weight:700;color:var(--ink);margin:10px 0;}
  .msg{margin-top:14px;padding:12px;border-radius:10px;font-size:13px;text-align:left;white-space:pre-wrap;word-break:break-word;display:none;}
  .msg.err{display:block;background:var(--red-soft);color:#7E2E1E;}
  .msg.ok{display:block;background:var(--green-soft);color:var(--accent-dark);}
  button,a.btn{display:block;width:100%;margin-top:12px;padding:13px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;}
  a.btn.secondary{background:var(--surface);color:var(--ink);border:1.5px solid var(--border);}
  .spinner{width:34px;height:34px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:8px auto 12px;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="card">
  <div class="emoji" id="icon">💸</div>
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Registrazione in corso…</h1>
  <div class="detail" id="detail"></div>
  <p id="sub">Invio del pagamento all'app Spese.</p>
  <div class="msg" id="msg"></div>
  <button id="retryBtn" style="display:none;">Riprova</button>
  <a class="btn secondary" href="index.html" id="openApp" style="display:none;">Apri l'app Spese</a>
</div>

<script>
(function(){
  var STORAGE_KEY='expense-tracker-state-v3';
  var SYNC_CONFIG_KEY='expense-tracker-sync-config-v1';

  function qs(name){
    try{
      var p=new URLSearchParams(window.location.search);
      var v=p.get(name);
      return v===null?null:v;
    }catch(e){return null;}
  }

  // Importo: accetta "12,34", "12.34", "12,34 €", "€ 12.34", "EUR 12,34"...
  function cleanAmount(raw){
    if(!raw)return null;
    var s=String(raw).replace(/\+/g,' ').trim();
    var m=s.match(/[0-9][0-9.,]*/);
    if(!m)return null;
    var num=m[0];
    // rimuove separatori di migliaia lasciando il decimale
    var lc=num.lastIndexOf(','),ld=num.lastIndexOf('.');
    if(lc>-1&&ld>-1){
      if(lc>ld)num=num.replace(/\./g,'');
      else{num=num.replace(/,/g,'');num=num.replace('.',',');}
    }else if(ld>-1){
      if(num.length-ld-1===3&&num.indexOf('.')===ld)num=num.replace('.','');
      else num=num.replace('.',',');
    }
    return num;
  }
  function cleanText(raw){
    if(!raw)return '';
    return String(raw).replace(/\+/g,' ').trim().slice(0,80);
  }

  function fromStorage(){
    var out={token:null,pid:null};
    try{
      var st=window.localStorage.getItem(STORAGE_KEY);
      if(st){var s=JSON.parse(st);out.token=s.inboxToken||null;}
      var cf=window.localStorage.getItem(SYNC_CONFIG_KEY);
      if(cf){var c=JSON.parse(cf);out.pid=(c.firebaseConfig&&c.firebaseConfig.projectId)||null;}
    }catch(e){}
    return out;
  }

  var icon=document.getElementById('icon');
  var spinner=document.getElementById('spinner');
  var title=document.getElementById('title');
  var detail=document.getElementById('detail');
  var sub=document.getElementById('sub');
  var msg=document.getElementById('msg');
  var retryBtn=document.getElementById('retryBtn');
  var openApp=document.getElementById('openApp');

  function fail(text){
    spinner.style.display='none';
    icon.textContent='⚠️';
    title.textContent='Registrazione non riuscita';
    sub.textContent='';
    msg.className='msg err';
    msg.textContent=text;
    retryBtn.style.display='block';
    openApp.style.display='block';
  }
  function success(text){
    spinner.style.display='none';
    icon.textContent='✅';
    title.textContent='Registrato!';
    sub.textContent='Il movimento è stato inviato all\'app Spese. Puoi chiudere questa pagina.';
    msg.className='msg ok';
    msg.textContent=text;
    openApp.style.display='block';
  }

  async function run(){
    var stored=fromStorage();
    var token=cleanText(qs('token'))||stored.token;
    var pid=cleanText(qs('pid'))||stored.pid;
    var importo=cleanAmount(qs('importo')||qs('i'));
    var negozio=cleanText(qs('negozio')||qs('n'))||'Apple Pay';

    if(!importo){
      fail('Importo mancante o non riconosciuto nell\'indirizzo.\n\nL\'automazione deve aprire un indirizzo tipo:\n…/registra.html?importo=12,34&negozio=NOME\n\ncon la variabile Importo inserita dopo «importo=».');
      return;
    }
    if(!token||!pid){
      fail('Token o project ID mancanti.\n\nAggiungili all\'indirizzo dell\'automazione:\n…/registra.html?pid=IL-TUO-PROJECT-ID&token=IL-TUO-TOKEN&importo=…\n\nEntrambi si ricavano dall\'indirizzo che copi dall\'app in Conti → «Copia indirizzo»: il project ID è la parola dopo /projects/, il token è il codice dopo /inbox/.');
      return;
    }

    var text='Pagamento di '+importo+' € presso '+negozio;
    detail.textContent=text;

    var url='https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(pid)+'/databases/(default)/documents/inbox/'+encodeURIComponent(token)+'/items';
    var body={fields:{title:{stringValue:'Apple Pay'},text:{stringValue:text}}};

    try{
      var resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(resp.ok){
        success('«'+text+'»\n\nSe «Registra automaticamente» è acceso, lo trovi già nello storico; altrimenti è nella card "Dalle notifiche" in cima al Riepilogo.');
      }else{
        var t=await resp.text();
        var hint='';
        if(resp.status===403)hint='\n\n→ Le regole di sicurezza Firebase non permettono la scrittura (vedi Passo 1 di GUIDA-NOTIFICHE.md).';
        else if(resp.status===404)hint='\n\n→ Project ID o token non validi: ricontrolla i parametri pid e token nell\'indirizzo dell\'automazione.';
        fail('Errore '+resp.status+' dal server.'+hint+'\n\n'+t.slice(0,300));
      }
    }catch(e){
      fail('Errore di rete: '+(e&&e.message?e.message:e)+'\n\nControlla la connessione e riprova.');
    }
  }

  retryBtn.onclick=function(){
    retryBtn.style.display='none';
    msg.className='msg';
    spinner.style.display='block';
    icon.textContent='💸';
    title.textContent='Registrazione in corso…';
    run();
  };

  run();
})();
</script>
</body>
</html>
