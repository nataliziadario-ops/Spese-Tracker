/* ================================================================
   CAROTA PREMIUM 2 — STATISTICHE AVANZATE
   Costruite sui dati gia' presenti: nessun dato nuovo da raccogliere.
   Contiene: confronto con il mese scorso, proiezione di fine mese,
   top categorie con variazione, andamento 12 mesi, giorno piu' costoso.
================================================================ */
function monthKeyBack(n){
  var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(n||0));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthLabelShort(mk){
  try{
    var p=mk.split('-'),d=new Date(+p[0],+p[1]-1,1);
    return new Intl.DateTimeFormat(currentLocale(),{month:'short'}).format(d);
  }catch(e){return mk;}
}
function monthTotals(mk){
  var ex=0,inc=0;
  (state.transactions||[]).forEach(function(t){
    if(!t.date||t.date.slice(0,7)!==mk)return;
    if(t.type==='income')inc+=t.amount;else ex+=t.amount;
  });
  return {exp:ex,inc:inc,saved:inc-ex};
}
function deltaHTML(cur,prev,lowerIsBetter){
  if(!prev){return '<span class="stat-delta neutral">—</span>';}
  var d=(cur-prev)/Math.abs(prev)*100;
  var up=d>0,good=lowerIsBetter?!up:up;
  var sign=up?'+':'−';
  return '<span class="stat-delta '+(Math.abs(d)<0.5?'neutral':(good?'good':'bad'))+'">'+sign+Math.abs(d).toFixed(0)+'%</span>';
}
function expByCategory(mk){
  var map={};
  (state.transactions||[]).forEach(function(t){
    if(!t.date||t.date.slice(0,7)!==mk||t.type==='income')return;
    map[t.categoryId]=(map[t.categoryId]||0)+t.amount;
  });
  return map;
}
function heaviestWeekday(){
  var sums=[0,0,0,0,0,0,0],counts=[0,0,0,0,0,0,0],any=false;
  var limit=monthKeyBack(5);
  (state.transactions||[]).forEach(function(t){
    if(!t.date||t.type==='income')return;
    if(t.date.slice(0,7)<limit)return;
    var p=t.date.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
    var w=d.getDay();
    if(isNaN(w))return;
    sums[w]+=t.amount;counts[w]++;any=true;
  });
  if(!any)return null;
  var best=0;
  for(var i=1;i<7;i++){if(sums[i]>sums[best])best=i;}
  if(!sums[best])return null;
  var names;
  try{
    names=[];
    for(var k=0;k<7;k++){
      var dd=new Date(2024,0,7+k); /* 7 gen 2024 = domenica */
      names.push(new Intl.DateTimeFormat(currentLocale(),{weekday:'long'}).format(dd));
    }
  }catch(e){names=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];}
  return {name:names[best],total:sums[best],count:counts[best]};
}
function advStatsBodyHTML(){
  var mk=currentMonthKey(),pk=monthKeyBack(1);
  var cur=monthTotals(mk),prev=monthTotals(pk);
  /* Proiezione: media giornaliera finora × giorni del mese */
  var now=new Date(),dayNow=now.getDate();
  var daysInMonth=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  var avgDay=dayNow>0?cur.exp/dayNow:0;
  var projection=avgDay*daysInMonth;
  var h='';
  /* 1. Confronto con il mese scorso */
  h+='<section class="card" style="display:flex;flex-direction:column;gap:10px;">'+
    '<h3 style="margin:0;font-size:14.5px;">'+tr('Confronto con il mese scorso')+'</h3>'+
    '<div class="stat-grid">'+
      '<div class="stat-box"><span class="stat-label">'+tr('Spese')+'</span><span class="stat-value">'+fmt(cur.exp)+'</span>'+deltaHTML(cur.exp,prev.exp,true)+'</div>'+
      '<div class="stat-box"><span class="stat-label">'+tr('Entrate')+'</span><span class="stat-value">'+fmt(cur.inc)+'</span>'+deltaHTML(cur.inc,prev.inc,false)+'</div>'+
      '<div class="stat-box"><span class="stat-label">'+tr('Risparmio')+'</span><span class="stat-value '+(cur.saved>=0?'saldo-pos':'saldo-neg')+'">'+fmt(cur.saved)+'</span>'+deltaHTML(cur.saved,prev.saved,false)+'</div>'+
    '</div>'+
    '<p class="hint">'+tr('Confronto con')+' '+esc(monthLabelShort(pk))+' ('+fmt(prev.exp)+' '+tr('di spese')+').</p>'+
  '</section>';
  /* 2. Proiezione di fine mese */
  h+='<section class="card" style="display:flex;flex-direction:column;gap:8px;">'+
    '<h3 style="margin:0;font-size:14.5px;">'+tr('Proiezione di fine mese')+'</h3>'+
    '<div class="stat-value" style="font-size:22px;">'+fmt(projection)+'</div>'+
    '<p class="hint">'+tr('Di questo passo (media di')+' '+fmt(avgDay)+' '+tr('al giorno) chiuderai il mese così.')+
    (prev.exp>0?' '+tr('Il mese scorso avevi speso')+' '+fmt(prev.exp)+'.':'')+'</p>'+
  '</section>';
  /* 3. Top categorie con variazione */
  var curCats=expByCategory(mk),prevCats=expByCategory(pk);
  var rows=Object.keys(curCats).map(function(id){
    return {cat:catById(id),amount:curCats[id],prev:prevCats[id]||0};
  }).sort(function(a,b){return b.amount-a.amount;}).slice(0,5);
  h+='<section class="card" style="display:flex;flex-direction:column;gap:10px;">'+
    '<h3 style="margin:0;font-size:14.5px;">'+tr('Dove vanno i tuoi soldi')+'</h3>';
  if(!rows.length){h+='<p class="hint">'+tr('Nessuna spesa registrata questo mese.')+'</p>';}
  else{
    var top=rows[0].amount||1;
    rows.forEach(function(r){
      var pct=Math.max(4,Math.round(r.amount/top*100));
      h+='<div class="stat-row">'+
        '<div class="stat-row-top"><span>'+esc((r.cat&&r.cat.emoji)||'🏷️')+' '+esc((r.cat&&r.cat.name)||'—')+'</span>'+
        '<span><strong>'+fmt(r.amount)+'</strong> '+deltaHTML(r.amount,r.prev,true)+'</span></div>'+
        '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;background:'+colorHex(r.cat?r.cat.color:0)+';"></div></div>'+
      '</div>';
    });
  }
  h+='</section>';
  /* 4. Andamento 12 mesi */
  var series=[];
  for(var i=11;i>=0;i--){var k=monthKeyBack(i);series.push({k:k,label:monthLabelShort(k),v:monthTotals(k).exp});}
  var maxV=series.reduce(function(m,s){return Math.max(m,s.v);},0)||1;
  var bw=100/series.length;
  var bars='';
  series.forEach(function(s,i){
    var hh=Math.max(1,(s.v/maxV)*74);
    var isCur=(i===series.length-1);
    bars+='<rect x="'+(i*bw+bw*0.18).toFixed(2)+'" y="'+(80-hh).toFixed(2)+'" width="'+(bw*0.64).toFixed(2)+'" height="'+hh.toFixed(2)+'" rx="1.2" fill="var(--accent)" opacity="'+(isCur?'1':'0.55')+'"/>';
  });
  h+='<section class="card" style="display:flex;flex-direction:column;gap:8px;">'+
    '<h3 style="margin:0;font-size:14.5px;">'+tr('Andamento degli ultimi 12 mesi')+'</h3>'+
    '<svg viewBox="0 0 100 92" preserveAspectRatio="none" style="width:100%;height:120px;" aria-hidden="true">'+bars+'</svg>'+
    '<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-faint);">'+
      '<span>'+esc(series[0].label)+'</span><span>'+esc(series[Math.floor(series.length/2)].label)+'</span><span>'+esc(series[series.length-1].label)+'</span>'+
    '</div>'+
    '<p class="hint">'+tr('Spese totali per mese. Il mese in corso è ancora parziale.')+'</p>'+
  '</section>';
  /* 5. Giorno più costoso */
  var wd=heaviestWeekday();
  if(wd){
    h+='<section class="card" style="display:flex;flex-direction:column;gap:6px;">'+
      '<h3 style="margin:0;font-size:14.5px;">'+tr('Il tuo giorno più costoso')+'</h3>'+
      '<div class="stat-value" style="font-size:19px;text-transform:capitalize;">'+esc(wd.name)+'</div>'+
      '<p class="hint">'+tr('Negli ultimi 6 mesi ci hai speso')+' '+fmt(wd.total)+' '+tr('in')+' '+wd.count+' '+tr('movimenti.')+'</p>'+
    '</section>';
  }
  var _invL=state.investments||[];
  if(_invL.length){
    var _it=invTotalsEur(_invL),_gc=_it.gain>=0?'inv-up':'inv-down',_gs=_it.gain>=0?'+':'';
    var _ph=state.portfolioHistory||[],_sp=_ph.length>=2?invSparkSVG(_ph):'';
    h+='<section class="card" style="display:flex;flex-direction:column;gap:8px;"><h3 style="margin:0;font-size:14.5px;">📈 '+tr('Investimenti')+'</h3>'+
      '<div class="invp-kv"><span>'+tr('Valore del portafoglio')+'</span><b>'+fmt(_it.value)+'</b></div>'+
      '<div class="invp-kv"><span>'+tr('Investito')+'</span><b>'+fmt(_it.cost)+'</b></div>'+
      '<div class="invp-kv"><span>'+tr('Guadagno/Perdita')+'</span><b class="'+_gc+'">'+_gs+fmt(_it.gain)+' ('+_gs+_it.gainPct.toFixed(1).replace('.',',')+'%)</b></div>'+
      (_sp?'<div style="margin-top:4px;">'+_sp+'</div>':'')+
    '</section>';
  }
  return h;
}

function lastNMonthKeys(n){var out=[],k=currentMonthKey();for(var i=n-1;i>=0;i--)out.push(shiftMonth(k,-i));return out;}
function monthShortLabel(key){return monthAbbrev(parseInt(key.slice(5,7),10)-1);}
function sixMonthChartSVG(keys,incs,exps){
  var W=360,H=170,TOP=12,BTM=24,chartH=H-TOP-BTM;
  var maxVal=Math.max.apply(null,[1].concat(incs).concat(exps));
  var gW=W/keys.length,bW=14,gap=3,out='';
  var baseY=TOP+chartH;
  for(var i=0;i<keys.length;i++){
    var x=i*gW,gx=x+(gW-bW*2-gap)/2;
    var ih=incs[i]/maxVal*chartH,eh=exps[i]/maxVal*chartH;
    if(ih>0.5)out+='<rect x="'+gx.toFixed(1)+'" y="'+(baseY-ih).toFixed(1)+'" width="'+bW+'" height="'+ih.toFixed(1)+'" rx="3" fill="var(--accent)"/>';
    if(eh>0.5)out+='<rect x="'+(gx+bW+gap).toFixed(1)+'" y="'+(baseY-eh).toFixed(1)+'" width="'+bW+'" height="'+eh.toFixed(1)+'" rx="3" fill="var(--red)"/>';
    out+='<text x="'+(x+gW/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="var(--ink-faint)">'+monthShortLabel(keys[i])+'</text>';
    out+='<rect x="'+x.toFixed(1)+'" y="0" width="'+gW.toFixed(1)+'" height="'+H+'" fill="transparent" data-chart-idx="'+i+'"/>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%"><line x1="0" y1="'+baseY+'" x2="'+W+'" y2="'+baseY+'" stroke="var(--border)" stroke-width="1"/>'+out+'</svg>';
}
function dashboardData(){
  var mk=currentMonthKey();
  var keys=lastNMonthKeys(6);
  return{
    mk:mk,
    totalBal:totalBalance(),
    totals:periodTotals(mk,'all'),
    prevExp:periodTotals(shiftMonth(mk,-1),'all').expense,
    keys:keys,
    incs:keys.map(function(k){return periodTotals(k,'all').income;}),
    exps:keys.map(function(k){return periodTotals(k,'all').expense;})
  };
}

function openBalancesSheet(){
  var today=todayISO();
  var m={mode:'always',day:today,from:firstOfMonthISO(),to:today};
  function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function firstOfMonthISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';}
  function balCell(v){return balHidden()?'••••':((v>=0?'':'−')+fmt(Math.abs(v)));}
  function rowsHTML(){
    var rows='',tot=0,tot2=0;
    state.accounts.forEach(function(a){
      var main,sub='';
      if(m.mode==='always'){main=accBalance(a.id);}
      else if(m.mode==='day'){main=accBalanceAt(a.id,m.day);}
      else{
        var flow=accFlowBetween(a.id,m.from,m.to),endBal=accBalanceAt(a.id,m.to);
        main=endBal;if(accInTotal(a))tot2+=flow;
        sub='<span class="bal-flow '+(flow>=0?'saldo-pos':'saldo-neg')+'">'+(flow>=0?'+':'−')+(balHidden()?'••••':fmt(Math.abs(flow)))+' '+tr('nel periodo')+'</span>';
      }
      if(accInTotal(a))tot+=main;
      var fuori=accInTotal(a)?'':' <span class="bal-out">'+tr('fuori bilancio')+'</span>';
      rows+='<div class="bal-row"><span class="dot" style="background:'+colorHex(a.color)+'"></span><span class="bal-name">'+esc(a.name)+fuori+sub+'</span><strong class="'+(main>=0?'saldo-pos':'saldo-neg')+'">'+balCell(main)+'</strong></div>';
    });
    var totLbl=m.mode==='range'?tr('Totale a fine periodo'):tr('Totale');
    rows+='<div class="bal-row bal-total"><span class="bal-name">'+totLbl+'</span><strong class="'+(tot>=0?'saldo-pos':'saldo-neg')+'">'+balCell(tot)+'</strong></div>';
    if(m.mode==='range')rows+='<div class="bal-row bal-total"><span class="bal-name">'+tr('Variazione nel periodo')+'</span><strong class="'+(tot2>=0?'saldo-pos':'saldo-neg')+'">'+(tot2>=0?'+':'−')+(balHidden()?'••••':fmt(Math.abs(tot2)))+'</strong></div>';
    return rows;
  }
  function subHint(){
    if(m.mode==='always')return tr('Saldo attuale di ogni conto, dall\'inizio.');
    if(m.mode==='day')return tr('Com\'erano i saldi alla fine del giorno scelto.');
    return tr('Saldo a fine periodo e quanto è cambiato tra le due date.');
  }
  function sheetHTML(){
    return '<div class="sheet">'+
      '<div class="sheet-handle"></div>'+
      '<div class="sheet-title-row"><h3 style="margin:0;">'+tr('Saldi dei conti')+'</h3><button class="icon-btn" id="balEye" aria-label="'+tr('Mostra o nascondi i saldi')+'">'+(balHidden()?eyeOffSVG():eyeOnSVG())+'</button></div>'+
      '<div class="segmented small"><button class="'+(m.mode==='always'?'active':'')+'" data-bal-mode="always">'+tr('Sempre')+'</button><button class="'+(m.mode==='day'?'active':'')+'" data-bal-mode="day">'+tr('Giorno')+'</button><button class="'+(m.mode==='range'?'active':'')+'" data-bal-mode="range">'+tr('Intervallo')+'</button></div>'+
      '<div id="balBody">'+bodyHTML()+'</div>'+
    '</div>';
  }
  /* Solo questa parte cambia quando si passa da Sempre a Giorno a Intervallo:
     ridisegnare tutto il foglio faceva "saltare" il pulsante appena premuto. */
  function bodyHTML(){
    return '<p class="hint" style="margin:2px 0 0;">'+subHint()+'</p>'+
      (m.mode==='day'?'<div class="field-group"><label class="field-label">'+tr('Giorno')+'</label><input type="date" class="text-input" id="balDay" value="'+m.day+'" max="'+today+'"></div>':'')+
      (m.mode==='range'?'<div class="bal-range-row"><div class="field-group"><label class="field-label">'+tr('Dal')+'</label><input type="date" class="text-input" id="balFrom" value="'+m.from+'" max="'+today+'"></div><div class="field-group"><label class="field-label">'+tr('Al')+'</label><input type="date" class="text-input" id="balTo" value="'+m.to+'" max="'+today+'"></div></div>':'')+
      '<div class="card" style="padding:6px 14px;">'+rowsHTML()+'</div>';
  }
  function renderBody(){
    var b=document.getElementById('balBody');
    if(!b){render();return;}
    b.innerHTML=bodyHTML();
    wireBody();
  }
  function wireBody(){
    var de=document.getElementById('balDay');if(de)de.onchange=function(){if(de.value)m.day=de.value;renderBody();};
    var fe=document.getElementById('balFrom');if(fe)fe.onchange=function(){if(fe.value)m.from=fe.value;if(m.from>m.to)m.to=m.from;renderBody();};
    var te=document.getElementById('balTo');if(te)te.onchange=function(){if(te.value)m.to=te.value;if(m.to<m.from)m.from=m.to;renderBody();};
  }
  function render(){
    var w=rerenderSheetWrap(sheetHTML());
    if(!w)return;
    var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;
    document.querySelectorAll('[data-bal-mode]').forEach(function(b){b.onclick=function(){
      m.mode=b.dataset.balMode;
      document.querySelectorAll('[data-bal-mode]').forEach(function(x){x.classList.toggle('active',x===b);});
      renderBody();
    };});
    wireBody();
    var eye=document.getElementById('balEye');if(eye)eye.onclick=function(){
      state.hideBalances=!state.hideBalances;saveState();
      eye.innerHTML=balHidden()?eyeOffSVG():eyeOnSVG();
      renderBody();
    };
  }
  openModal('<div class="sheet"></div>');
  render();
}

/* iPhone con l'app installata dalla schermata Home: dentro questa modalita'
   Safari blocca sia i pop-up sia il rientro dal redirect di Google, quindi
   l'accesso Google li' spesso non va. La via che funziona sempre e' collegare
   una password allo stesso account Google e usare email+password sul telefono. */
function isIOSStandalone(){
  try{
    var ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
    var standalone=window.navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
    return ios&&standalone;
  }catch(e){return false;}
}
function isIOS(){
  try{
    if(/iPad|iPhone|iPod/.test(navigator.userAgent))return true;
    // iPad con iPadOS si presenta come Mac ma ha il touch
    return navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1;
  }catch(e){return false;}
}
function openLinkPasswordModal(){
  var m={busy:false,err:'',ok:false};
  function html(){
    if(m.ok){
      return '<div class="sheet"><div class="sheet-handle"></div><h3 style="margin:4px 0 0;">'+tr('Password aggiunta ✅')+'</h3>'+
        '<p class="hint">Ora sull\'iPhone puoi accedere con <strong>'+esc(sync.email||'')+'</strong> e questa password: entri nello <strong>stesso account</strong> e vedi gli stessi dati dell\'accesso Google.</p>'+
        '<button class="btn-primary full-width" id="lpClose">Ho capito</button></div>';
    }
    return '<div class="sheet"><div class="sheet-handle"></div><h3 style="margin:4px 0 0;">'+tr('Aggiungi una password')+'</h3>'+
      '<p class="hint">Serve per accedere <strong>allo stesso account</strong> dall\'iPhone, dove l\'accesso con Google non funziona dentro l\'app installata. L\'account resta uno solo: '+esc(sync.email||'')+'.</p>'+
      '<div class="field-group"><label class="field-label">'+tr('Nuova password (almeno 6 caratteri)')+'</label><input type="password" class="text-input" id="lpPwd" autocomplete="new-password"></div>'+
      (m.err?'<p class="hint" style="color:var(--red);">⚠️ '+esc(m.err)+'</p>':'')+
      '<button class="btn-primary full-width" id="lpGo" '+(m.busy?'disabled':'')+'>'+(m.busy?tr('Collegamento…'):tr('Collega la password'))+'</button>'+
      '<button class="btn-secondary full-width" id="lpCancel">'+tr('Annulla')+'</button></div>';
  }
  function render(){
    var w=rerenderSheetWrap(html());
    if(!w)return;
    var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;
    var c=document.getElementById('lpCancel');if(c)c.onclick=closeModal;
    var cl=document.getElementById('lpClose');if(cl)cl.onclick=closeModal;
    var go=document.getElementById('lpGo');
    if(go)go.onclick=async function(){
      var pwd=document.getElementById('lpPwd').value;
      if(!pwd||pwd.length<6){m.err=tr('La password deve avere almeno 6 caratteri.');render();return;}
      m.busy=true;m.err='';render();
      try{
        var cred=firebase.auth.EmailAuthProvider.credential(sync.email,pwd);
        await sync.auth.currentUser.linkWithCredential(cred);
        sync.providers.push('password');
        m.ok=true;
      }catch(e){
        if(e&&e.code==='auth/provider-already-linked')m.ok=true;
        else if(e&&e.code==='auth/requires-recent-login')m.err='Per sicurezza Firebase chiede un accesso recente: esci e rientra con Google, poi riprova subito.';
        else if(e&&e.code==='auth/email-already-in-use')m.err='Esiste già un account con questa email e password: usalo direttamente sull\'iPhone.';
        else m.err=(e&&e.message)?e.message:'Non è riuscito.';
      }
      m.busy=false;render();
      if(m.ok)renderActiveTab();
    };
  }
  openModal('<div class="sheet"></div>');render();
}

================================================================ */
/* Salvadanai in Home: riquadri con anello di progresso, due per riga. */
function goalRingSVG(pct,color,done){
  var r=26,c=2*Math.PI*r,off=c*(1-Math.min(pct,100)/100);
  return '<svg class="goal-ring" viewBox="0 0 64 64" aria-hidden="true">'+
    '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="7"/>'+
    '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 32 32)"/>'+
    '<text x="32" y="'+(done?36:37)+'" text-anchor="middle" class="goal-ring-txt">'+(done?'✓':pct.toFixed(0)+'%')+'</text>'+
  '</svg>';
}
function goalsSummaryHTML(){
  var goals=state.goals||[];
  if(!goals.length)return '';
  var cards=goals.slice().sort(function(a,b){
    var pa=a.target>0?goalSaved(a)/a.target:0,pb=b.target>0?goalSaved(b)/b.target:0;
    return pb-pa;
  }).map(function(g){
    var saved=goalSaved(g),pct=g.target>0?Math.min(saved/g.target*100,100):0,done=g.target>0&&saved>=g.target;
    return '<button class="goal-tile" data-goal-open="'+g.id+'">'+
      '<div class="goal-tile-ring">'+goalRingSVG(pct,colorHex(g.color),done)+'<span class="goal-tile-emoji">'+esc(g.emoji||'🎯')+'</span></div>'+
      '<div class="goal-tile-name">'+esc(g.name)+'</div>'+
      '<div class="goal-tile-amt">'+(balHidden()?'••••':fmt(saved))+' <span>/ '+fmt(g.target)+'</span></div>'+
    '</button>';
  }).join('');
  return '<section><div class="section-title-row"><h3>'+tr('Salvadanai')+'</h3><button class="link-btn" data-goto="accounts">'+tr('Vedi tutti')+'</button></div>'+
    '<div class="goal-grid">'+cards+'</div></section>';
}
function goalsSectionHTML(){
  var goals=state.goals||[];
  var cards=goals.map(function(g){
    var saved=goalSaved(g),pct=g.target>0?Math.min(saved/g.target*100,100):0,done=g.target>0&&saved>=g.target;
    var left=Math.max(g.target-saved,0);
    return '<button class="card goal-card" data-goal-open="'+g.id+'">'+
      '<span class="goal-emoji">'+esc(g.emoji||'🎯')+'</span>'+
      '<span class="goal-body"><span class="goal-name">'+esc(g.name)+(done?' <span class="goal-done">✓ Raggiunto!</span>':'')+'</span>'+
      '<span class="goal-bar"><span class="goal-fill" style="width:'+pct.toFixed(1)+'%;background:'+colorHex(g.color)+';"></span></span>'+
      '<span class="goal-sub">'+(balHidden()?'••••':fmt(saved))+' di '+fmt(g.target)+(done?'':' · mancano '+(balHidden()?'••••':fmt(left)))+'</span></span>'+
      '<span class="goal-pct">'+pct.toFixed(0)+'%</span>'+
    '</button>';
  }).join('');
  return '<section style="display:flex;flex-direction:column;gap:10px;">'+
    '<div class="section-title-row" style="margin-top:6px;"><h3>'+tr('Salvadanai')+'</h3></div>'+
    (goals.length?cards:'<p class="empty-note" style="text-align:left;">'+tr('Metti da parte per un obiettivo: un viaggio, un acquisto, un fondo di emergenza.')+'</p>')+
    '<button class="btn-secondary full-width" id="addGoalBtn">🐷 + '+tr('Nuovo salvadanaio')+'</button>'+
    '<p class="hint" style="margin-top:-4px;">'+tr('I salvadanai sono "buste" virtuali: versare o prelevare qui non modifica i saldi dei conti.')+'</p>'+
  '</section>';
}
function openGoalSheet(goalId){
  var g=goalId?goalById(goalId):null;
  var m={
    isNew:!g,
    name:g?g.name:'',emoji:g?(g.emoji||'🎯'):'🎯',color:g?g.color:(state.goals.length%8),
    targetStr:g&&g.target?String(g.target).replace('.',','):'',
    moveStr:'',moveMode:'in',err:''
  };
  function parseAmt(s){var v=parseFloat(String(s||'').replace(/\./g,'').replace(',','.'));return isFinite(v)?Math.round(v*100)/100:NaN;}
  function colorChips(){var out='';for(var i=0;i<8;i++)out+='<button class="color-dot'+(m.color===i?' active':'')+'" data-goal-color="'+i+'" style="background:'+colorHex(i)+'" aria-label="Colore '+(i+1)+'"></button>';return out;}
  function formHTML(){
    return '<div class="field-group"><label class="field-label">'+tr('Nome dell\'obiettivo')+'</label><input class="text-input" id="goalName" maxlength="40" placeholder="Es. Viaggio in Giappone" value="'+esc(m.name)+'"></div>'+
      '<div class="goal-form-row"><div class="field-group" style="flex:0 0 84px;"><label class="field-label">Emoji</label><input class="text-input" id="goalEmoji" maxlength="4" style="text-align:center;font-size:20px;" value="'+esc(m.emoji)+'"></div>'+
      '<div class="field-group" style="flex:1;"><label class="field-label">Traguardo (€)</label><input class="text-input" id="goalTarget" inputmode="decimal" placeholder="Es. 1500" value="'+esc(m.targetStr)+'"></div></div>'+
      '<div class="field-group"><label class="field-label">Colore</label><div class="color-dots-row">'+colorChips()+'</div></div>';
  }
  function sheetHTML(){
    if(m.isNew){
      return '<div class="sheet"><div class="sheet-handle"></div><h3 style="margin:4px 0 0;">'+tr('Nuovo salvadanaio')+'</h3>'+formHTML()+
        (m.err?'<p class="hint" style="color:var(--red);">⚠️ '+esc(m.err)+'</p>':'')+
        '<button class="btn-primary full-width" id="goalCreate">'+tr('Crea salvadanaio')+'</button>'+
        '<button class="btn-secondary full-width" id="goalCancel">'+tr('Annulla')+'</button></div>';
    }
    var saved=goalSaved(g),pct=g.target>0?Math.min(saved/g.target*100,100):0,done=g.target>0&&saved>=g.target;
    var hist=(g.history||[]).slice().sort(function(a,b){return b.date<a.date?-1:(b.date>a.date?1:0);}).slice(0,20);
    var histHTML=hist.length?hist.map(function(h){
      return '<div class="goal-hist-row"><span>'+formatShortDate(h.date)+(h.note?' · '+esc(h.note):'')+'</span><strong class="'+(h.amount>=0?'saldo-pos':'saldo-neg')+'">'+(h.amount>=0?'+':'−')+fmt(Math.abs(h.amount))+'</strong></div>';
    }).join(''):'<p class="empty-note">'+tr('Ancora nessun versamento.')+'</p>';
    return '<div class="sheet"><div class="sheet-handle"></div>'+
      '<div class="goal-head"><span class="goal-emoji lg">'+esc(g.emoji||'🎯')+'</span><div><h3 style="margin:0;">'+esc(g.name)+'</h3><span class="goal-sub">'+(balHidden()?'••••':fmt(saved))+' di '+fmt(g.target)+' · '+pct.toFixed(0)+'%'+(done?' · ✓ Raggiunto!':'')+'</span></div></div>'+
      '<span class="goal-bar big"><span class="goal-fill" style="width:'+pct.toFixed(1)+'%;background:'+colorHex(g.color)+';"></span></span>'+
      '<div class="field-group"><label class="field-label">'+tr('Versa o preleva')+'</label>'+
        '<div class="segmented small" style="margin-bottom:8px;"><button class="'+(m.moveMode==='in'?'active mode-income':'')+'" data-goal-move="in">'+tr('Versa')+'</button><button class="'+(m.moveMode==='out'?'active':'')+'" data-goal-move="out">'+tr('Preleva')+'</button></div>'+
        '<div style="display:flex;gap:8px;"><input class="text-input" id="goalMoveAmt" inputmode="decimal" placeholder="'+tr('Importo €')+'" value="'+esc(m.moveStr)+'" style="flex:1;"><button class="btn-primary-sm" id="goalMoveGo">'+(m.moveMode==='in'?tr('Versa'):tr('Preleva'))+'</button></div></div>'+
      '<div id="goalErr">'+(m.err?'<p class="hint" style="color:var(--red);">⚠️ '+esc(m.err)+'</p>':'')+'</div>'+
      '<div class="section-title-row"><h3>'+tr('Ultimi movimenti')+'</h3></div><div class="card" style="padding:4px 14px;">'+histHTML+'</div>'+
      '<details class="goal-edit"><summary>'+tr('Modifica salvadanaio')+'</summary>'+formHTML()+
        '<button class="btn-primary full-width" id="goalSaveEdit">'+tr('Salva modifiche')+'</button>'+
        '<button class="btn-danger full-width" id="goalDelete">'+tr('Elimina salvadanaio')+'</button></details>'+
    '</div>';
  }
  function readForm(){
    var ne=document.getElementById('goalName'),ee=document.getElementById('goalEmoji'),te=document.getElementById('goalTarget');
    if(ne)m.name=ne.value;if(ee)m.emoji=ee.value;if(te)m.targetStr=te.value;
  }
  function render(){
    var w=rerenderSheetWrap(sheetHTML());
    if(!w)return;
    var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;
    var cc=document.getElementById('goalCancel');if(cc)cc.onclick=closeModal;
    /* Passare da Versa a Preleva (o cambiare colore) cambia solo un pulsante:
       si aggiorna quel pulsante, non tutto il foglio. Cosi' l'importo gia'
       digitato resta al suo posto e la pagina non lampeggia. */
    document.querySelectorAll('[data-goal-color]').forEach(function(b){
      b.onclick=function(){
        m.color=+b.dataset.goalColor;
        document.querySelectorAll('[data-goal-color]').forEach(function(x){x.classList.toggle('active',+x.dataset.goalColor===m.color);});
      };
    });
    document.querySelectorAll('[data-goal-move]').forEach(function(b){
      b.onclick=function(){
        m.moveMode=b.dataset.goalMove;m.err='';
        document.querySelectorAll('[data-goal-move]').forEach(function(x){
          var on=(x.dataset.goalMove===m.moveMode);
          x.classList.toggle('active',on);
          x.classList.toggle('mode-income',on&&m.moveMode==='in');
        });
        var go=document.getElementById('goalMoveGo');
        if(go)go.textContent=(m.moveMode==='in'?tr('Versa'):tr('Preleva'));
        var er=document.getElementById('goalErr');
        if(er)er.innerHTML='';
      };
    });
    var cr=document.getElementById('goalCreate');
    if(cr)cr.onclick=function(){
      readForm();
      var name=m.name.trim(),target=parseAmt(m.targetStr);
      if(!name){m.err=tr('Dai un nome all\'obiettivo.');render();return;}
      if(!(target>0)){m.err=tr('Indica un traguardo maggiore di zero.');render();return;}
      state.goals=state.goals||[];
      if(!canAdd('goals')){premiumBlock('goals');return;}
      state.goals.push({id:uid('goal'),name:name,emoji:(m.emoji.trim()||'🎯'),color:m.color,target:target,createdAt:Date.now(),history:[]});
      saveState();closeModal();showToast(tr('Salvadanaio creato'));renderActiveTab();
    };
    var mg=document.getElementById('goalMoveGo');
    if(mg)mg.onclick=function(){
      if(isLocked('goals',g.id)){lockedBlock('goals');return;}
      var ae=document.getElementById('goalMoveAmt');
      var amt=parseAmt(ae?ae.value:'');
      if(!(amt>0)){m.err=tr('Inserisci un importo maggiore di zero.');render();return;}
      var saved=goalSaved(g);
      if(m.moveMode==='out'&&amt>saved){m.err=tr('Nel salvadanaio ci sono solo ')+fmt(saved)+'.';render();return;}
      g.history.push({id:uid('gh'),date:(function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})(),amount:m.moveMode==='in'?amt:-amt});
      m.moveStr='';m.err='';
      saveState();showToast(m.moveMode==='in'?tr('Versato nel salvadanaio'):tr('Prelevato dal salvadanaio'));render();renderActiveTab();
    };
    var se=document.getElementById('goalSaveEdit');
    if(se)se.onclick=function(){
      readForm();
      var name=m.name.trim(),target=parseAmt(m.targetStr);
      if(!name){m.err=tr('Il nome non può essere vuoto.');render();return;}
      if(!(target>0)){m.err=tr('Indica un traguardo maggiore di zero.');render();return;}
      g.name=name;g.emoji=m.emoji.trim()||'🎯';g.color=m.color;g.target=target;
      saveState();showToast(tr('Salvadanaio aggiornato'));render();renderActiveTab();
    };
    var de=document.getElementById('goalDelete');
    if(de)de.onclick=function(){
      confirmDialog(tr('Eliminare il salvadanaio')+' "'+g.name+'"? '+tr('I soldi messi da parte qui sono solo un promemoria: i saldi dei conti non cambiano.'),function(){
        state.goals=state.goals.filter(function(x){return x.id!==g.id;});
        saveState();closeModal();showToast(tr('Salvadanaio eliminato'));renderActiveTab();
      },'Elimina');
    };
  }
  openModal('<div class="sheet"></div>');
  render();
}

/* La scheda Conti si aggiorna a pezzi, non tutta intera: toccare un
   pulsante non deve far lampeggiare la pagina ne' far perdere il punto in
   cui si stava scrivendo. Ogni funzione qui sotto ridisegna solo la sua
   porzione e ricollega i suoi eventi. */
function refreshAccountsList(){
  var box=document.getElementById('accList');
  if(!box){renderActiveTab();return;}
  box.innerHTML=state.accounts.map(accountCardHTML).join('');
  wireAccountRows();
}
function refreshAccountBalances(){
  state.accounts.forEach(function(a){
    var el=document.querySelector('[data-acc-bal="'+a.id+'"]');
    if(!el)return;
    var bal=accBalance(a.id);
    el.className='account-balance '+(bal>=0?'saldo-pos':'saldo-neg');
    el.textContent=balHidden()?'••••':((bal>=0?'':'−')+fmt(Math.abs(bal)));
  });
  var lbl=document.getElementById('hideBalLabel');
  if(lbl)lbl.innerHTML=(balHidden()?eyeOffSVG():eyeOnSVG())+' '+tr('Nascondi i saldi');

function refreshAccountsAddRow(focus){
  var box=document.getElementById('accAddRow');
  if(!box){renderActiveTab();return;}
  box.innerHTML=accountsAddRowHTML();
  wireAccountsAddRow();
  if(focus){var i=document.getElementById('newAccName');if(i)i.focus();}
}
function wireAccountRows(){
  document.querySelectorAll('[data-account-id]').forEach(function(inp){inp.onchange=function(){var a=accById(inp.dataset.accountId);a.name=inp.value.trim()||a.name;inp.value=a.name;saveState();};});
  document.querySelectorAll('[data-acc-excl]').forEach(function(cb){
    cb.onchange=function(){
      var a=accById(cb.dataset.accExcl);
      a.excludeFromTotal=cb.checked;
      saveState();
      showToast(cb.checked?tr('Conto escluso dal bilancio totale'):tr('Conto incluso nel bilancio totale'));
    };
  });
  document.querySelectorAll('[data-del-account]').forEach(function(btn){
    btn.onclick=function(){
      var id=btn.dataset.delAccount,a=accById(id),n=state.transactions.filter(function(t){return t.accountId===id;}).length+state.transfers.filter(function(t){return t.fromAccountId===id||t.toAccountId===id;}).length;
      var warn=n===0?'':(n===1?tr('Verrà eliminato anche il movimento collegato a questo conto.'):tr('Verranno eliminati anche i N movimenti collegati a questo conto.').replace('N',n));
      confirmDialog(tr('Eliminare')+' "'+a.name+'"? '+warn,function(){
        state.transactions=state.transactions.filter(function(t){return t.accountId!==id;});
        state.transfers=state.transfers.filter(function(t){return t.fromAccountId!==id&&t.toAccountId!==id;});
        state.accounts=state.accounts.filter(function(a){return a.id!==id;});
        if(state.paypalAccountId===id)state.paypalAccountId=null;
        if(ui.accountFilter===id)ui.accountFilter='all';
        saveState();showToast(tr('Conto eliminato'));
        refreshAccountsList();   // solo l'elenco, non tutta la pagina
      },tr('Elimina'));
    };
  });
}
function wireAccountsAddRow(){
  var addB=document.getElementById('addAccBtn');
  if(addB)addB.onclick=function(){ui.addingAccount=true;refreshAccountsAddRow(true);};
  var confB=document.getElementById('confirmNewAcc');
  if(confB)confB.onclick=function(){
    var n=document.getElementById('newAccName').value.trim();

/* Cablaggio delle card dati (sincronizzazione, import, export, automazione,
   reset). Usato dal foglio "Export e sincronizzazione" nel Profilo.
   `rerender` ridisegna il contenitore in cui vivono le card. */
function wireDataCards(rerender){
  rerender=rerender||function(){renderActiveTab();};
  var syncBtn=document.getElementById('openSyncBtn');if(syncBtn)syncBtn.onclick=openSyncModal;
  var syncNowBtn=document.getElementById('syncNowBtn');if(syncNowBtn)syncNowBtn.onclick=syncNow;
  var lpBtn=document.getElementById('linkPwdBtn');if(lpBtn)lpBtn.onclick=openLinkPasswordModal;
  var gBtn=document.getElementById('googleSyncBtn');
  if(gBtn)gBtn.onclick=async function(){
    var cfg=loadSyncConfig();
    if(!cfg||!cfg.firebaseConfig){openSyncModal();return;}
    gBtn.disabled=true;gBtn.textContent=tr('Accesso in corso…');
    var res=await connectSyncWithGoogle(cfg.firebaseConfig);
    if(res.ok&&!res.redirect)showToast(tr('Sincronizzazione connessa'));
    else if(!res.ok)showToast(res.error||tr('Accesso non riuscito'));
    rerender();
  };
  var aBtn=document.getElementById('appleSyncBtn');
  if(aBtn)aBtn.onclick=async function(){
    var cfg=loadSyncConfig();
    if(!cfg||!cfg.firebaseConfig){openSyncModal();return;}
    aBtn.disabled=true;aBtn.textContent=tr('Accesso in corso…');
    var res=await connectSyncWithApple(cfg.firebaseConfig);
    if(res.ok&&!res.redirect)showToast(tr('Sincronizzazione connessa'));
    else if(!res.ok)showToast(res.error||tr('Accesso non riuscito'));
    rerender();
  };
  document.querySelectorAll('[data-copy-target]').forEach(function(btn){
    btn.onclick=function(){
      var field=document.getElementById(btn.dataset.copyTarget);
      if(!field)return;
      field.select();field.setSelectionRange(0,99999);
      var done=false;
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(field.value).then(function(){showToast(tr('Copiato'));}).catch(function(){try{document.execCommand('copy');showToast(tr('Copiato'));}catch(e){showToast(tr('Copia manualmente il testo selezionato'));}});
        done=true;
      }
      if(!done){try{document.execCommand('copy');showToast(tr('Copiato'));}catch(e){showToast(tr('Copia manualmente il testo selezionato'));}}
    };
  });
  var autoTog=document.getElementById('autoRegisterToggle');
  if(autoTog)autoTog.onchange=function(){state.autoRegister=autoTog.checked;saveState();rerender();};
  var notifTog=document.getElementById('notifAutomToggle');
  if(notifTog)notifTog.onchange=function(){state.notifAutomation=notifTog.checked;saveState();rerender();};
  var discBtn=document.getElementById('disconnectSyncBtn');if(discBtn)discBtn.onclick=function(){
    var warn=sync.pendingPush&&!isOnline()?' ⚠️ Ci sono modifiche non ancora sincronizzate: collegati a internet e premi «Sincronizza» prima di uscire, altrimenti le perdi.':'';
    confirmDialog('Uscire dall\'account '+(sync.email||'')+'? I dati restano al sicuro nel cloud, ma vengono rimossi da questo dispositivo: non saranno più visibili finché non rientri. Potrai poi accedere con un altro account.'+warn,function(){
      signOutFromCloud().then(function(){showToast(tr('Uscito dall\'account'));});
    },'Esci');
  };
  var impBtn=document.getElementById('openImportBtn');if(impBtn)impBtn.onclick=openImportModal;
  var expBtn=document.getElementById('openExportBtn');if(expBtn)expBtn.onclick=openExportModal;
  var rstBtn=document.getElementById('resetBtn');
  if(rstBtn)rstBtn.onclick=function(){
    confirmDialog(tr('Eliminare definitivamente tutti i dati? Questa azione non si può annullare.'),function(){
      state=ensureV3Fields(defaultState());ui={activeTab:'accounts',viewMonth:currentMonthKey(),viewYear:new Date().getFullYear(),homeView:'monthly',accountFilter:'all',categoryFilter:'all',typeFilter:'all',tagFilter:null,breakdownType:'expense',addingAccount:false,newCatType:'expense'};
      saveState();showToast(tr('Dati reimpostati'));closeModal();renderActiveTab();
    },'Elimina tutto');
  };
}

/* ================================================================
   ENTRY SHEET
================================================================ */
var lastUsedAccId=null,lastUsedMode='expense';

function openEntrySheet(opts){
  opts=opts||{};
  var editTx=opts.txId?state.transactions.find(function(t){return t.id===opts.txId;}):null;
  var editTr=opts.transferId?state.transfers.find(function(t){return t.id===opts.transferId;}):null;
  if(!editTx&&!editTr&&opts.mode==='transfer'&&state.accounts.length<2){showToast(tr('Servono almeno 2 conti per un trasferimento'));return;}
  var entry={
    mode:editTx?editTx.type:(editTr?'transfer':(opts.mode||lastUsedMode)),
    amountStr:editTx?editTx.amount.toFixed(2).replace('.',','):(editTr?editTr.amount.toFixed(2).replace('.',','):''),
    accountId:editTx?editTx.accountId:(lastUsedAccId&&state.accounts.some(function(a){return a.id===lastUsedAccId;})?lastUsedAccId:state.accounts[0].id),
    categoryId:editTx?editTx.categoryId:null,
    fromAccountId:editTr?editTr.fromAccountId:state.accounts[0].id,
    toAccountId:editTr?editTr.toAccountId:(state.accounts[1]?state.accounts[1].id:state.accounts[0].id),
    merchant:editTx?(editTx.merchant||''):'',
    note:editTx?(editTx.note||''):(editTr?(editTr.note||''):''),
    date:editTx?editTx.date:(editTr?editTr.date:todayISO()),
    tags:editTx?(editTx.tags||[]).slice():(editTr?(editTr.tags||[]).slice():[]),
    showTagForm:false,newTagName:'',newTagColor:0,
    showCatForm:false,newCatName:'',newCatEmoji:'',newCatColor:0,
    isEditTx:!!editTx,isEditTr:!!editTr
  };
  if(!entry.isEditTx&&!entry.isEditTr&&opts.categoryId){
    var pre=catById(opts.categoryId);
    if(pre&&pre.type!=='income')entry.categoryId=pre.id;
  }
  /* Precompilazione: serve alle spese che arrivano dalla notifica della banca.
     Il foglio e' quello normale, quindi si puo' correggere qualsiasi campo
     prima di salvare. */
  if(opts.prefill){
    var pf=opts.prefill;
    if(pf.mode)entry.mode=pf.mode;
    if(pf.amount>0)entry.amountStr=Number(pf.amount).toFixed(2).replace('.',',');
    if(pf.accountId&&state.accounts.some(function(a){return a.id===pf.accountId;}))entry.accountId=pf.accountId;
    if(pf.categoryId&&state.categories.some(function(c){return c.id===pf.categoryId;}))entry.categoryId=pf.categoryId;
    if(pf.merchant)entry.merchant=pf.merchant;
    if(pf.note)entry.note=pf.note;
    if(pf.date)entry.date=pf.date;
  }
  if(!entry.categoryId){var fc=catsByType(entry.mode==='income'?'income':'expense')[0];entry.categoryId=fc?fc.id:null;}
  if(entry.fromAccountId===entry.toAccountId&&state.accounts.length>1){var alt=state.accounts.find(function(a){return a.id!==entry.fromAccountId;});if(alt)entry.toAccountId=alt.id;}

  function accChips(selId,attr){return state.accounts.map(function(a){
    var lk=isLocked('accounts',a.id);
    return'<button class="chip'+(a.id===selId?' selected':'')+(lk?' chip-locked':'')+'" data-'+attr+'="'+a.id+'"'+(lk?' data-locked="accounts"':'')+'><span class="dot" style="background:'+colorHex(a.color)+'"></span>'+esc(a.name)+(lk?' 🔒':'')+'</button>';
  }).join('');}
  function catChips(){return catsByType(entry.mode==='income'?'income':'expense').map(function(c){
    var lk=isLocked('customCats',c.id);
    return'<button class="chip'+(c.id===entry.categoryId?' selected':'')+(lk?' chip-locked':'')+'" data-sel-cat="'+c.id+'"'+(lk?' data-locked="customCats"':'')+'><span class="dot" style="background:'+colorHex(c.color)+'"></span>'+esc(c.emoji)+' '+esc(c.name)+(lk?' 🔒':'')+'</button>';
  }).join('');}
  function catSectionHTML(){
    var chips=catChips()+'<button class="chip" id="newCatChip">'+tr('+ Nuova')+'</button>';
    var form='';
    if(entry.showCatForm){
      form='<div class="new-tag-card" style="margin-top:8px;"><div style="display:flex;gap:8px;"><input id="entryNewCatEmoji" class="emoji-input" maxlength="2" placeholder="🙂" value="'+esc(entry.newCatEmoji)+'"><input id="entryNewCatName" class="text-input" placeholder="'+tr('Nome categoria')+'" value="'+esc(entry.newCatName)+'"></div><div class="color-dots-row">'+(isDarkTheme()?COLORS_DARK:COLORS_LIGHT).map(function(c,i){return'<button class="color-dot'+(entry.newCatColor===i?' active':'')+'" data-ecat-color="'+i+'" aria-label="Colore '+(i+1)+'" style="background:'+c+';"></button>';}).join('')+'</div><div style="display:flex;gap:8px;"><button class="btn-primary-sm" id="createCatBtn">'+tr('Aggiungi categoria')+'</button><button class="btn-secondary" style="padding:10px 14px;font-size:13px;" id="cancelCatBtn">'+tr('Annulla')+'</button></div></div>';
    }
    return '<div id="catSection" class="field-group"><label class="field-label">'+tr('Categoria')+'</label><div class="chip-row wrap" id="catChips">'+chips+'</div>'+form+'</div>';
  }
  function ticketClass(){return'ticket'+(entry.mode==='income'?' ticket-income':entry.mode==='transfer'?' ticket-transfer':'');}
  function ticketLabel(){if(entry.mode==='transfer')return entry.isEditTr?tr('Modifica trasferimento'):tr('Nuovo trasferimento');if(entry.mode==='income')return entry.isEditTx?tr('Modifica entrata'):tr('Nuova entrata');return entry.isEditTx?tr('Modifica spesa'):tr('Nuova spesa');}
  function amountPrefix(){return entry.mode==='income'?'+ € ':'€ ';}
  function saveLabel(){if(entry.mode==='transfer')return tr('Salva trasferimento');if(entry.mode==='income')return tr('Salva entrata');return tr('Salva spesa');}

  function tagSectionHTML(){
    var h='<div id="tagSection" class="field-group"><label class="field-label">'+tr('Tag')+'</label><div class="tag-picker-row">';
    state.tags.forEach(function(t){var sel=entry.tags.indexOf(t.id)>-1;h+='<button class="chip sm'+(sel?' selected':'')+'" data-tag-tog="'+t.id+'"><span class="dot" style="background:'+colorHex(t.color)+'"></span>'+esc(t.name)+'</button>';});
    h+='<button class="chip sm" id="newTagBtn">'+tr('+ Nuovo')+'</button></div>';
    if(entry.showTagForm){
      h+='<div class="new-tag-card"><input id="newTagNameInp" class="text-input" placeholder="'+tr('Nome tag')+'" value="'+esc(entry.newTagName)+'"><div class="color-dots-row">'+(isDarkTheme()?COLORS_DARK:COLORS_LIGHT).map(function(c,i){return'<button class="color-dot'+(entry.newTagColor===i?' active':'')+'" data-tag-color="'+i+'" aria-label="Colore '+(i+1)+'" style="background:'+c+';"></button>';}).join('')+'</div><div style="display:flex;gap:8px;"><button class="btn-primary-sm" id="createTagBtn">'+tr('Aggiungi tag')+'</button><button class="btn-secondary" style="padding:10px 14px;font-size:13px;" id="cancelTagBtn">'+tr('Annulla')+'</button></div></div>';
    }
    h+='</div>';
    return h;
  }

  function dateRowHTML(){
    return '<div class="field-group"><label class="field-label">'+tr('Data')+'</label><div class="date-quick-row"><button class="chip sm'+(isToday(entry.date)?' selected':'')+'" data-qdate="today">'+tr('📅 Oggi')+'</button><button class="chip sm'+(isYesterday(entry.date)?' selected':'')+'" data-qdate="yesterday">'+tr('📅 Ieri')+'</button><input type="date" id="entryDate" class="text-input" value="'+entry.date+'"></div></div>';
  }

  function bodyHTML(){
    var delBtn='';
    if(entry.isEditTx)delBtn='<button class="btn-danger full-width" id="delEntryBtn">'+tr('Elimina movimento')+'</button>';
    if(entry.isEditTr)delBtn='<button class="btn-danger full-width" id="delEntryBtn">'+tr('Elimina trasferimento')+'</button>';
    if(entry.mode==='transfer'){
      return '<div class="field-group"><label class="field-label">'+tr('Da')+'</label><div class="chip-row" id="fromChips">'+accChips(entry.fromAccountId,'sel-from')+'</div></div>'+
        '<div class="swap-hint">'+tr('⇅ sposta il saldo tra conti senza influire sul bilancio')+'</div>'+
        '<div class="field-group"><label class="field-label">'+tr('A')+'</label><div class="chip-row" id="toChips">'+accChips(entry.toAccountId,'sel-to')+'</div></div>'+
        dateRowHTML()+tagSectionHTML()+
        '<div class="field-group"><label class="field-label">'+tr('Nota (opzionale)')+'</label><input type="text" id="entryNote" class="text-input" value="'+esc(entry.note)+'" placeholder="'+tr('Es. nota del movimento')+'"></div>'+
        delBtn+'<button class="btn-primary full-width sticky-save" id="saveEntryBtn" disabled>'+saveLabel()+'</button>';
    }
    return '<div class="field-group"><label class="field-label">'+tr('Conto')+'</label><div class="chip-row" id="accountChips">'+accChips(entry.accountId,'sel-account')+'</div></div>'+
      catSectionHTML()+
      dateRowHTML()+tagSectionHTML()+
      '<div class="field-group"><label class="field-label">'+tr('Esercente (opzionale)')+'</label><input type="text" id="entryMerchant" class="text-input" value="'+esc(entry.merchant)+'" placeholder="'+tr('Es. negozio o persona')+'"></div>'+
      '<div class="field-group"><label class="field-label">'+tr('Nota (opzionale)')+'</label><input type="text" id="entryNote" class="text-input" value="'+esc(entry.note)+'" placeholder="'+tr('Es. dettaglio del movimento')+'"></div>'+
      delBtn+'<button class="btn-primary full-width sticky-save" id="saveEntryBtn" disabled>'+saveLabel()+'</button>';
  }

  function modeToggleHTML(){
    if(entry.isEditTr)return '';
    if(entry.isEditTx)return '<div class="segmented"><button class="'+(entry.mode==='expense'?'active':'')+'" data-mode="expense">'+tr('Spesa')+'</button><button class="'+(entry.mode==='income'?'active mode-income':'')+'" data-mode="income">'+tr('Entrata')+'</button></div>';
    return '<div class="segmented"><button class="'+(entry.mode==='expense'?'active':'')+'" data-mode="expense">'+tr('Spesa')+'</button><button class="'+(entry.mode==='income'?'active mode-income':'')+'" data-mode="income">'+tr('Entrata')+'</button><button class="'+(entry.mode==='transfer'?'active mode-transfer':'')+'" data-mode="transfer" '+(state.accounts.length<2?'disabled':'')+'>'+tr('Trasferimento')+'</button></div>';
  }

  function fullHTML(){
    return '<div class="sheet entry-sheet">'+
      '<div class="sheet-handle"></div>'+modeToggleHTML()+
      '<div class="'+ticketClass()+'"><button class="icon-btn ticket-close" id="closeEntryModal">✕</button><div class="ticket-label">'+esc(ticketLabel())+'</div><div class="ticket-amount" id="amtDisplay">'+amountPrefix()+(entry.amountStr||'0,00')+'</div></div>'+
      '<div class="keypad">'+['1','2','3','4','5','6','7','8','9',',','0','⌫'].map(function(k){return'<button type="button" class="key" data-key="'+k+'">'+k+'</button>';}).join('')+'</div>'+
      '<div id="entryBody" style="display:flex;flex-direction:column;gap:16px;">'+bodyHTML()+'</div>'+
    '</div>';
  }

  /* Aggiorna le sole parti che dipendono dal tipo di movimento. */
  function switchMode(){
    document.querySelectorAll('[data-mode]').forEach(function(x){
      var on=(x.dataset.mode===entry.mode);
      x.className=on?('active'+(x.dataset.mode==='income'?' mode-income':(x.dataset.mode==='transfer'?' mode-transfer':''))):'';
    });
    var wrap=document.querySelector('#modal-root .entry-sheet');
    if(wrap){
      var t=wrap.querySelector('.ticket-amount');
      var card=t?t.parentNode:null;
      if(card)card.className=ticketClass();
      var lbl=wrap.querySelector('.ticket-label');
      if(lbl)lbl.textContent=ticketLabel();
    }
    var bd=document.getElementById('entryBody');
    if(bd){bd.innerHTML=bodyHTML();wireBody();}
    refreshSaveBtn();
  }
  function refreshSaveBtn(){
    var n=parseAmount(entry.amountStr.replace(',','.'));
    var ok=n>0;
    if(entry.mode==='transfer'&&entry.fromAccountId===entry.toAccountId)ok=false;
    var btn=document.getElementById('saveEntryBtn');if(btn)btn.disabled=!ok;
    var disp=document.getElementById('amtDisplay');if(disp)disp.textContent=amountPrefix()+(entry.amountStr||'0,00');
  }

  function wireTagSection(){
    document.querySelectorAll('[data-tag-tog]').forEach(function(b){b.onclick=function(){var id=b.dataset.tagTog;var idx=entry.tags.indexOf(id);if(idx>-1)entry.tags.splice(idx,1);else entry.tags.push(id);var el=document.getElementById('tagSection');if(el)el.outerHTML=tagSectionHTML();wireTagSection();};});
    var ntb=document.getElementById('newTagBtn');if(ntb)ntb.onclick=function(){entry.showTagForm=true;var el=document.getElementById('tagSection');if(el)el.outerHTML=tagSectionHTML();wireTagSection();setTimeout(function(){var ni=document.getElementById('newTagNameInp');if(ni)ni.focus();},50);};
    var ni=document.getElementById('newTagNameInp');if(ni)ni.oninput=function(){entry.newTagName=ni.value;};
    document.querySelectorAll('[data-tag-color]').forEach(function(dot){dot.onclick=function(){entry.newTagColor=parseInt(dot.dataset.tagColor,10);document.querySelectorAll('.color-dot').forEach(function(d){d.classList.toggle('active',d===dot);});};});
    var ctb=document.getElementById('createTagBtn');
    if(ctb)ctb.onclick=function(){var n=(document.getElementById('newTagNameInp').value||'').trim();if(!n){showToast(tr('Dai un nome al tag'));return;}var t={id:uid('tag'),name:n,color:entry.newTagColor};state.tags.push(t);entry.tags.push(t.id);entry.showTagForm=false;entry.newTagName='';entry.newTagColor=0;saveState();var el=document.getElementById('tagSection');if(el)el.outerHTML=tagSectionHTML();wireTagSection();};
    var canb=document.getElementById('cancelTagBtn');if(canb)canb.onclick=function(){entry.showTagForm=false;entry.newTagName='';var el=document.getElementById('tagSection');if(el)el.outerHTML=tagSectionHTML();wireTagSection();};
  }

  function wireCatSection(){
    document.querySelectorAll('[data-sel-cat]').forEach(function(b){b.onclick=function(){if(b.dataset.locked){lockedBlock('customCats');return;}entry.categoryId=b.dataset.selCat;document.querySelectorAll('[data-sel-cat]').forEach(function(q){q.classList.toggle('selected',q===b);});};});
    var nc=document.getElementById('newCatChip');if(nc)nc.onclick=function(){entry.showCatForm=true;var el=document.getElementById('catSection');if(el)el.outerHTML=catSectionHTML();wireCatSection();setTimeout(function(){var e=document.getElementById('entryNewCatName');if(e)e.focus();},40);};
    var ne=document.getElementById('entryNewCatEmoji');if(ne)ne.oninput=function(){entry.newCatEmoji=ne.value;};
    var nn=document.getElementById('entryNewCatName');if(nn)nn.oninput=function(){entry.newCatName=nn.value;};
    document.querySelectorAll('[data-ecat-color]').forEach(function(d){d.onclick=function(){entry.newCatColor=parseInt(d.dataset.ecatColor,10);document.querySelectorAll('[data-ecat-color]').forEach(function(q){q.classList.toggle('active',q===d);});};});
    var cc=document.getElementById('createCatBtn');if(cc)cc.onclick=function(){var n=(entry.newCatName||'').trim();if(!n){showToast(tr('Dai un nome alla categoria'));return;}if(!canAdd('customCats')){premiumBlock('customCats');return;}var cat={id:uid('cat'),name:n,emoji:(entry.newCatEmoji||'').trim()||(entry.mode==='income'?'💰':'🏷️'),color:entry.newCatColor,type:entry.mode==='income'?'income':'expense',custom:true};state.categories.push(cat);entry.categoryId=cat.id;entry.showCatForm=false;entry.newCatName='';entry.newCatEmoji='';entry.newCatColor=0;saveState();showToast(tr('Categoria aggiunta'));var el=document.getElementById('catSection');if(el)el.outerHTML=catSectionHTML();wireCatSection();};
    var xc=document.getElementById('cancelCatBtn');if(xc)xc.onclick=function(){entry.showCatForm=false;entry.newCatName='';entry.newCatEmoji='';var el=document.getElementById('catSection');if(el)el.outerHTML=catSectionHTML();wireCatSection();};
  }

  function wireBody(){
    var merchInp=document.getElementById('entryMerchant');if(merchInp)merchInp.oninput=function(){entry.merchant=merchInp.value;};
    var noteInp=document.getElementById('entryNote');if(noteInp)noteInp.oninput=function(){entry.note=noteInp.value;};
    var dateInp=document.getElementById('entryDate');
    if(dateInp){
      dateInp.onchange=function(){entry.date=dateInp.value||todayISO();document.querySelectorAll('[data-qdate]').forEach(function(b){b.classList.toggle('selected',(b.dataset.qdate==='today'&&isToday(entry.date))||(b.dataset.qdate==='yesterday'&&isYesterday(entry.date)));});};
    }
    document.querySelectorAll('[data-qdate]').forEach(function(b){b.onclick=function(){entry.date=b.dataset.qdate==='today'?todayISO():yesterdayISO();if(dateInp)dateInp.value=entry.date;document.querySelectorAll('[data-qdate]').forEach(function(q){q.classList.toggle('selected',(q.dataset.qdate==='today'&&isToday(entry.date))||(q.dataset.qdate==='yesterday'&&isYesterday(entry.date)));});};});
    if(entry.mode==='transfer'){
      document.querySelectorAll('[data-sel-from]').forEach(function(b){b.onclick=function(){if(b.dataset.locked){lockedBlock('accounts');return;}entry.fromAccountId=b.dataset.selFrom;if(entry.fromAccountId===entry.toAccountId){var alt=state.accounts.find(function(a){return a.id!==entry.fromAccountId;});if(alt)entry.toAccountId=alt.id;}var bd=document.getElementById('entryBody');if(bd){bd.innerHTML=bodyHTML();wireBody();}refreshSaveBtn();};});
      document.querySelectorAll('[data-sel-to]').forEach(function(b){b.onclick=function(){if(b.dataset.locked){lockedBlock('accounts');return;}entry.toAccountId=b.dataset.selTo;document.querySelectorAll('[data-sel-to]').forEach(function(q){q.classList.toggle('selected',q===b);});refreshSaveBtn();};});
    }else{
      document.querySelectorAll('[data-sel-account]').forEach(function(b){b.onclick=function(){
        if(b.dataset.locked){lockedBlock('accounts');return;}
        entry.accountId=b.dataset.selAccount;document.querySelectorAll('[data-sel-account]').forEach(function(q){q.classList.toggle('selected',q===b);});
      };});
      wireCatSection();
    }
    wireTagSection();
    var delBtn=document.getElementById('delEntryBtn');
    if(delBtn)delBtn.onclick=function(){
      if(entry.isEditTx)confirmDialog(tr('Eliminare questo movimento?'),function(){state.transactions=state.transactions.filter(function(t){return t.id!==editTx.id;});saveState();closeModal();showToast(tr('Eliminato'));renderActiveTab();},'Elimina');
      else if(entry.isEditTr)confirmDialog(tr('Eliminare questo trasferimento?'),function(){state.transfers=state.transfers.filter(function(t){return t.id!==editTr.id;});saveState();closeModal();showToast(tr('Eliminato'));renderActiveTab();},'Elimina');
    };
    var saveBtn=document.getElementById('saveEntryBtn');
    if(saveBtn)saveBtn.onclick=function(){
      var amount=parseAmount(entry.amountStr.replace(',','.'));if(!(amount>0))return;
      var date=entry.date||todayISO();
      /* Ultima rete di sicurezza: se un conto o una categoria sono oltre il
         piano gratuito, il movimento non parte. Modificare un movimento gia'
         registrato su un conto bloccato resta possibile solo se non lo si
         sposta li' adesso. */
      if(entry.mode==='transfer'){
        if(isLocked('accounts',entry.fromAccountId)||isLocked('accounts',entry.toAccountId)){lockedBlock('accounts');return;}
        if(entry.fromAccountId===entry.toAccountId){showToast(tr('Scegli due conti diversi'));return;}
        if(entry.isEditTr){editTr.amount=amount;editTr.fromAccountId=entry.fromAccountId;editTr.toAccountId=entry.toAccountId;editTr.note=entry.note;editTr.date=date;editTr.tags=entry.tags.slice();}
        else state.transfers.push({id:uid('trf'),amount:amount,fromAccountId:entry.fromAccountId,toAccountId:entry.toAccountId,note:entry.note,date:date,tags:entry.tags.slice(),createdAt:Date.now()});
        lastUsedMode='transfer';
      }else{
        if(isLocked('accounts',entry.accountId)){lockedBlock('accounts');return;}
        if(isLocked('customCats',entry.categoryId)){lockedBlock('customCats');return;}
        lastUsedAccId=entry.accountId;lastUsedMode=entry.mode;
        if(entry.isEditTx){editTx.amount=amount;editTx.accountId=entry.accountId;editTx.categoryId=entry.categoryId;editTx.merchant=(entry.merchant||'').trim();editTx.note=entry.note;editTx.date=date;editTx.type=entry.mode;editTx.tags=entry.tags.slice();}
        else state.transactions.push({id:uid('tx'),type:entry.mode,amount:amount,accountId:entry.accountId,categoryId:entry.categoryId,merchant:(entry.merchant||'').trim(),note:entry.note,date:date,tags:entry.tags.slice(),createdAt:Date.now()});
      }
      if(typeof opts.onSave==='function'){try{opts.onSave();}catch(e){}}
      saveState();closeModal();showToast(entry.isEditTx||entry.isEditTr?tr('Aggiornato'):tr('Salvato'));renderActiveTab();
      try{checkBudgetAlerts();}catch(e){}
    };
  }

  function wireAll(){
    document.getElementById('closeEntryModal').onclick=closeModal;
    document.getElementById('modalBackdrop').onclick=closeModal;
    document.querySelectorAll('.key').forEach(function(btn){btn.onclick=function(){
      var k=btn.dataset.key;
      if(k==='⌫')entry.amountStr=entry.amountStr.slice(0,-1);
      else if(k===','){if(entry.amountStr.indexOf(',')===-1)entry.amountStr+=',';}
      else{
        if(entry.amountStr.indexOf(',')>-1&&entry.amountStr.split(',')[1].length>=2)return;
        if(entry.amountStr.replace(',','').length>=7)return;
        if(entry.amountStr==='0')entry.amountStr=k;else entry.amountStr+=k;
      }
      refreshSaveBtn();
    };});
    document.querySelectorAll('[data-mode]').forEach(function(b){if(b.disabled)return;b.onclick=function(){
      if(b.dataset.mode===entry.mode)return;
      entry.mode=b.dataset.mode;
      entry.showCatForm=false;
      if(entry.mode!=='transfer'){var fc=catsByType(entry.mode==='income'?'income':'expense');if(!fc.some(function(c){return c.id===entry.categoryId;}))entry.categoryId=fc[0]?fc[0].id:null;}
      /* Cambiare tipo cambia il colore della testata e i campi sotto, non
         tutto il foglio: l'importo gia' digitato e la tastiera restano dove
         sono, senza il lampeggio di un ridisegno completo. */
      switchMode();
    };});
    wireBody();refreshSaveBtn();
  }

  function render(){openModal(fullHTML());wireAll();}
  render();
}

function openSearchOverlay(){
  var query='';
  function resultsHTML(q){
    var entries=searchEntries(q);
    if(!entries.length)return'<p class="search-meta">'+tr('Nessun risultato')+(q?' '+tr('per')+' "'+esc(q)+'"':'')+'.</p>';
    var label=q?entries.length+' '+(entries.length===1?'risultato':'risultati'):'Movimenti recenti';
    var groups=[],lastDate=null;
    entries.forEach(function(e){if(e.date!==lastDate){groups.push({date:e.date,items:[]});lastDate=e.date;}groups[groups.length-1].items.push(e);});
    return'<p class="search-meta">'+esc(label)+'</p>'+groups.map(function(g){return'<div class="day-header">'+formatDayHeader(g.date)+'</div><div class="card" style="padding:4px 14px;">'+g.items.map(entryRowHTML).join('')+'</div>';}).join('');
  }
  function html(){
    return'<div class="search-overlay">'+
      '<div class="search-bar"><button class="search-close-btn" id="searchClose">←</button><input id="searchInput" class="search-input-el" placeholder="'+tr('Cerca movimenti, categorie, tag…')+'" type="search" autocomplete="off" value="'+esc(query)+'"><button class="search-close-btn" id="searchClear" style="'+(query?'':'display:none;')+'">✕</button></div>'+
      '<div class="search-content" id="searchResults">'+resultsHTML(query)+'</div>'+
    '</div>';
  }
  var root=document.getElementById('modal-root');
  root.innerHTML='<div class="modal-backdrop" id="modalBackdrop" style="opacity:0;pointer-events:none;"></div>'+html();
  root.classList.add('open');
  var inp=document.getElementById('searchInput');
  if(inp){inp.focus();inp.setSelectionRange(query.length,query.length);}
  var debounce=null;
  function updateResults(){
    var res=document.getElementById('searchResults');
    if(res){res.innerHTML=resultsHTML(query);wireEntryRows(res);var cl=document.getElementById('searchClear');if(cl)cl.style.display=query?'':'none';}
  }
  function wireSearch(){
    var inp=document.getElementById('searchInput');
    if(inp)inp.oninput=function(){query=inp.value;clearTimeout(debounce);debounce=setTimeout(updateResults,150);};
    var cl=document.getElementById('searchClose');if(cl)cl.onclick=closeModal;
    var clx=document.getElementById('searchClear');if(clx)clx.onclick=function(){query='';inp.value='';updateResults();inp.focus();};
    wireEntryRows(document.getElementById('searchResults'));
  }
  wireSearch();
}

    return '<div class="sheet">'+stepDots()+
      '<h3 style="margin:4px 0 0;">'+tr('Accedi alla sincronizzazione')+'</h3>'+
      '<button class="btn-primary full-width" id="syncGoogle" '+(m.busy?'disabled':'')+'>'+tr('Accedi con Google')+'</button>'+
      '<p class="hint" style="text-align:center;margin:2px 0;">'+tr('oppure con email e password')+'</p>'+
      '<div class="segmented"><button class="'+(m.mode==='login'?'active':'')+'" data-sync-mode="login">'+tr('Accedi')+'</button><button class="'+(m.mode==='signup'?'active mode-income':'')+'" data-sync-mode="signup">'+tr('Crea account')+'</button></div>'+
      '<p class="hint">'+(m.mode==='signup'?'Crea le credenziali la prima volta, da questo dispositivo. Userai le stesse email e password per accedere dagli altri dispositivi.':'Usa le stesse email e password create sul primo dispositivo.')+'</p>'+
      '<div class="field-group"><label class="field-label">Email</label><input type="email" class="text-input" id="syncEmail" value="'+esc(m.email)+'" autocomplete="email"></div>'+
      '<div class="field-group"><label class="field-label">'+tr('Password')+'</label><input type="password" class="text-input" id="syncPassword" autocomplete="'+(m.mode==='signup'?'new-password':'current-password')+'" placeholder="'+(m.mode==='signup'?'Almeno 6 caratteri':'')+'"></div>'+
      (m.mode==='login'?'<button type="button" class="link-btn" id="syncForgot" '+(m.busy?'disabled':'')+'>'+tr('Ho dimenticato la password')+'</button>':'')+
      (m.errorMsg?'<p class="hint" style="color:var(--red);">⚠️ '+esc(m.errorMsg)+'</p>':'')+
      (m.notice?'<p class="hint" style="color:var(--accent);">✅ '+esc(m.notice)+'</p>':'')+
      '<button class="btn-primary full-width" id="syncSubmit" '+(m.busy?'disabled':'')+'>'+(m.busy?'Connessione…':(m.mode==='signup'?'Crea account e connetti':'Accedi'))+'</button>'+
      '<button class="btn-secondary full-width" id="syncBack2">'+tr('Indietro')+'</button>'+
    '</div>';
  }
  function stepHTML(){return m.step===1?step1HTML():step2HTML();}

  function wireStep(){
    var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;
    if(m.step===1){
      document.getElementById('syncCancel1').onclick=closeModal;
      document.getElementById('syncNext1').onclick=function(){
        var raw=document.getElementById('syncConfigInput').value;
        var parsed=parseFirebaseConfigInput(raw);
        if(!parsed){m.errorMsg='Configurazione non valida: assicurati di aver incollato l\'intero oggetto con apiKey e projectId.';renderStep();return;}
        m.parsedConfig=parsed;m.configText=raw;m.errorMsg=null;m.step=2;renderStep();
      };
    }else{
      document.querySelectorAll('[data-sync-mode]').forEach(function(b){b.onclick=function(){m.mode=b.dataset.syncMode;m.errorMsg=null;m.notice=null;renderStep();};});
      document.getElementById('syncBack2').onclick=function(){m.step=1;renderStep();};
      var fp=document.getElementById('syncForgot');
      if(fp)fp.onclick=async function(){
        var email=document.getElementById('syncEmail').value.trim();
        if(!email){m.errorMsg='Scrivi prima la tua email qui sopra, poi tocca «Ho dimenticato la password».';m.notice=null;renderStep();return;}
        m.email=email;m.busy=true;m.errorMsg=null;m.notice=null;renderStep();
        var res=await sendPasswordReset(m.parsedConfig,email);
        m.busy=false;
        if(res.ok){m.notice='Ti abbiamo inviato un\'email per reimpostare la password ('+email+'). Controlla anche lo spam.';}
        else{m.errorMsg=res.error;}
        renderStep();
      };
      document.getElementById('syncGoogle').onclick=async function(){
        m.busy=true;m.errorMsg=null;renderStep();
        var res=await connectSyncWithGoogle(m.parsedConfig);
        m.busy=false;
        if(res.ok&&!res.redirect){closeModal();showToast(tr('Sincronizzazione connessa'));renderActiveTab();}
        else if(res.ok&&res.redirect){/* la pagina sta per cambiare */}
        else{m.errorMsg=res.error;renderStep();}
      };
      document.getElementById('syncSubmit').onclick=async function(){
        var email=document.getElementById('syncEmail').value.trim();
        var password=document.getElementById('syncPassword').value;
        if(!email||!password){m.errorMsg=tr('Inserisci email e password.');renderStep();return;}
        m.email=email;m.password=password;m.busy=true;m.errorMsg=null;renderStep();
        var res=await connectSyncWithCredentials(m.parsedConfig,email,password,m.mode);
        m.busy=false;
        if(res.ok){closeModal();showToast(tr('Sincronizzazione connessa'));renderActiveTab();}
        else{m.errorMsg=res.error;renderStep();}
      };
    }
  }

  openModal('<div class="sheet"></div>');
  renderStep();
}

/* ================================================================
   FILE IN ENTRATA E IN USCITA (CSV · XLSX · PDF)
   Tutto scritto a mano, senza librerie esterne: l'app resta un file
   solo e continua a funzionare anche offline.
   - .xlsx = archivio ZIP con dentro XML: qui c'è un lettore ZIP
     (usa DecompressionStream del browser) e uno scrittore ZIP senza
     compressione (valido per Excel, Numbers e Fogli Google).
   - .pdf  = il testo viene estratto dagli "stream" del documento.
     Funziona con i PDF digitali (estratti conto scaricati dalla banca),
     NON con le scansioni/foto, che non contengono testo.
================================================================ */
var CRC_TABLE=(function(){
  var t=new Uint32Array(256);
  for(var n=0;n<256;n++){
    var c=n;
    for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
    t[n]=c>>>0;
  }
  return t;
})();
function crc32(u8){
  var c=0xFFFFFFFF;
  for(var i=0;i<u8.length;i++)c=CRC_TABLE[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function strBytes(s){return new TextEncoder().encode(s);}
function latinBytes(s){var u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&0xFF;return u;}

/* ---- ZIP: scrittura (metodo "stored", nessuna compressione) ---- */
function zipStore(files,mime){
  var chunks=[],central=[],offset=0;
  files.forEach(function(f){
    var name=strBytes(f.name),data=f.data,crc=crc32(data);
    var lh=new Uint8Array(30+name.length),dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0,true);
    dv.setUint16(8,0,true);dv.setUint16(10,0,true);dv.setUint16(12,0,true);
    dv.setUint32(14,crc,true);dv.setUint32(18,data.length,true);dv.setUint32(22,data.length,true);
    dv.setUint16(26,name.length,true);dv.setUint16(28,0,true);
    lh.set(name,30);
    chunks.push(lh,data);
    var ch=new Uint8Array(46+name.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(8,0,true);cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,0,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);
    cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,offset,true);
    ch.set(name,46);
    central.push(ch);
    offset+=lh.length+data.length;
  });
  var cdSize=central.reduce(function(s,c){return s+c.length;},0);
  var eocd=new Uint8Array(22),ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);
  ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,offset,true);ev.setUint16(20,0,true);
  return new Blob(chunks.concat(central).concat([eocd]),{type:mime||'application/zip'});
}

/* ---- ZIP: lettura ---- */
async function inflateBytes(bytes,format){
  if(typeof DecompressionStream==='undefined')throw new Error('Questo browser non sa aprire i file .xlsx: prova a esportare in CSV dalla banca.');
  var ds=new DecompressionStream(format);
  var stream=new Blob([bytes]).stream().pipeThrough(ds);
  var ab=await new Response(stream).arrayBuffer();
  return new Uint8Array(ab);
}
async function zipRead(arrayBuffer){
  var u8=new Uint8Array(arrayBuffer),dv=new DataView(arrayBuffer);
  var eo=-1,min=Math.max(0,u8.length-65558);
  for(var i=u8.length-22;i>=min;i--){if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}}
  if(eo<0)throw new Error('Il file non sembra un .xlsx valido.');
  var count=dv.getUint16(eo+10,true),cdOff=dv.getUint32(eo+16,true);
  var out={},p=cdOff,dec=new TextDecoder();
  for(var k=0;k<count;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    var method=dv.getUint16(p+10,true);
    var csize=dv.getUint32(p+20,true);
    var nlen=dv.getUint16(p+28,true),elen=dv.getUint16(p+30,true),clen=dv.getUint16(p+32,true);
    var lo=dv.getUint32(p+42,true);
    var name=dec.decode(u8.subarray(p+46,p+46+nlen));
    var lnlen=dv.getUint16(lo+26,true),lelen=dv.getUint16(lo+28,true);
    var start=lo+30+lnlen+lelen;
    var raw=u8.subarray(start,start+csize);
    out[name]=method===0?raw:await inflateBytes(raw,'deflate-raw');
    p+=46+nlen+elen+clen;
  }
  return out;
}

/* ---- XLSX: lettura ---- */
function xmlUnesc(s){
  return String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")
    .replace(/&#x([0-9a-fA-F]+);/g,function(_,h){return String.fromCharCode(parseInt(h,16));})
    .replace(/&#(\d+);/g,function(_,d){return String.fromCharCode(parseInt(d,10));})
    .replace(/&amp;/g,'&');
}
function xlsxColIndex(ref){
  var m=/^([A-Z]+)/.exec(ref||'');
  if(!m)return 0;
  var n=0;
  for(var i=0;i<m[1].length;i++)n=n*26+(m[1].charCodeAt(i)-64);
  return n-1;
}
function excelSerialToISO(n){
  var d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000);
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
}
function xlsxSharedStrings(xml){
  var out=[];
  if(!xml)return out;
  var re=/<si\b[^>]*>([\s\S]*?)<\/si>/g,m;
  while((m=re.exec(xml))){
    var ts=m[1].match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[];
    out.push(ts.map(function(x){return xmlUnesc(x.replace(/<[^>]+>/g,''));}).join(''));
  }
  return out;
}
function xlsxDateStyles(xml){
  var out=[];
  if(!xml)return out;
  var codes={},m,re=/<numFmt[^>]*numFmtId="(\d+)"[^>]*formatCode="([^"]*)"/g;
  while((m=re.exec(xml)))codes[m[1]]=xmlUnesc(m[2]);
  var block=/<cellXfs[^>]*>([\s\S]*?)<\/cellXfs>/.exec(xml);
  if(!block)return out;
  var xre=/<xf\b[^>]*?numFmtId="(\d+)"[^>]*>/g,x;
  while((x=xre.exec(block[1]))){
    var id=parseInt(x[1],10),code=codes[x[1]]||'';
    var isDate=(id>=14&&id<=22)||(id>=45&&id<=47)||(code&&/[dmy]/i.test(code.replace(/\[[^\]]*\]/g,'').replace(/"[^"]*"/g,'')));
    out.push(!!isDate);
  }
  return out;
}
function xlsxSheetRows(xml,shared,dateStyles){
  var rows=[],rowRe=/<row\b[^>]*>([\s\S]*?)<\/row>/g,rm;
  while((rm=rowRe.exec(xml))){
    var cells=[],cre=/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g,cm;
    while((cm=cre.exec(rm[1]))){
      var attrs=cm[1]||'',inner=cm[2]||'';
      var refm=/r="([A-Z]+\d+)"/.exec(attrs);
      var t=(/t="([^"]+)"/.exec(attrs)||[])[1]||'n';
      var sm=/s="(\d+)"/.exec(attrs);
      var idx=refm?xlsxColIndex(refm[1]):cells.length;
      var val='';
      if(t==='inlineStr'){
        var ts=inner.match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[];
        val=ts.map(function(x){return xmlUnesc(x.replace(/<[^>]+>/g,''));}).join('');
      }else{
        var v=/<v[^>]*>([\s\S]*?)<\/v>/.exec(inner);
        var raw=v?xmlUnesc(v[1]):'';
        if(t==='s')val=shared[parseInt(raw,10)]||'';
        else if(t==='b')val=raw==='1'?'VERO':'FALSO';
        else if(t==='str'||t==='e')val=raw;
        else if(raw!==''&&sm&&dateStyles[parseInt(sm[1],10)]&&!isNaN(parseFloat(raw)))val=excelSerialToISO(parseFloat(raw));
        else val=raw;
      }
      while(cells.length<idx)cells.push('');
      cells[idx]=String(val).trim();
    }
    if(cells.some(function(c){return c!=='';}))rows.push(cells);
  }
  return rows;
}
/* Nomi dei fogli, nell'ordine in cui compaiono nella cartella di lavoro */
function xlsxSheetNames(wbXml){
  var out=[],re=/<sheet\b[^>]*name="([^"]*)"/g,m;
  while((m=re.exec(wbXml||'')))out.push(xmlUnesc(m[1]));
  return out;
}
/* Legge TUTTI i fogli: [{name, rows}] */
async function xlsxToSheets(arrayBuffer){
  var files=await zipRead(arrayBuffer),dec=new TextDecoder();
  var names=Object.keys(files).filter(function(n){return /^xl\/worksheets\/sheet\d+\.xml$/i.test(n);})
    .sort(function(a,b){
      var na=parseInt((/sheet(\d+)\.xml/i.exec(a)||[])[1]||'0',10);
      var nb=parseInt((/sheet(\d+)\.xml/i.exec(b)||[])[1]||'0',10);
      return na-nb;
    });
  if(!names.length)throw new Error('Nel file .xlsx non ho trovato nessun foglio di calcolo.');
  var shared=xlsxSharedStrings(files['xl/sharedStrings.xml']?dec.decode(files['xl/sharedStrings.xml']):'');
  var styles=xlsxDateStyles(files['xl/styles.xml']?dec.decode(files['xl/styles.xml']):'');
  var titles=xlsxSheetNames(files['xl/workbook.xml']?dec.decode(files['xl/workbook.xml']):'');
  var out=[];
  names.forEach(function(n,i){
    var rows=xlsxSheetRows(dec.decode(files[n]),shared,styles);
    if(rows.length)out.push({name:titles[i]||('Foglio '+(i+1)),rows:rows});
  });
  if(!out.length)throw new Error('Il foglio di calcolo risulta vuoto.');
  return out;
}
async function xlsxToRows(arrayBuffer){
  var sheets=await xlsxToSheets(arrayBuffer);
  var best=sheets[0];
  sheets.forEach(function(sh){if(sh.rows.length>best.rows.length)best=sh;});
  return best.rows;
}
/* Un foglio che si chiama "Spese"/"Uscite" contiene solo spese, e viceversa. */
function sheetForcedType(name){
  var n=String(name||'').toLowerCase();
  if(/spes|uscit|addebit|pagament|costi|debit/.test(n))return 'expense';
  if(/entrat|ricav|accredit|incass|guadagn|credit|income/.test(n))return 'income';
  return null;
}

/* ---- XLSX: scrittura ---- */
function xlsxColName(i){var s='';i++;while(i>0){var r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=Math.floor((i-1)/26);}return s;}
function xmlEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function xlsxBlob(sheetName,header,rows){

      return '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(c)+'</t></is></c>';
    }).join('');
    return '<row r="'+(ri+1)+'">'+cells+'</row>';
  }).join('');

  var wbRels=X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>';

  var ct=X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>';
  return zipStore([
    {name:'[Content_Types].xml',data:strBytes(ct)},

    {name:'xl/_rels/workbook.xml.rels',data:strBytes(wbRels)},
