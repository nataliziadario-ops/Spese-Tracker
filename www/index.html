.confirm-box{box-shadow:var(--shadow-lg),var(--box-edge);}
/* riquadri premium: filo di luce in alto + bordo interno + ombra tintata */
.card,.ph-card,.trend-stat,.dash-tile,.pick-row,.acc-slide,.new-tag-card,.chart-wrap,.menu-list,.info-card{
  background-image:var(--box-sheen);
  box-shadow:var(--shadow),var(--box-edge);
}
/* i riquadri metrica (Spese/Entrate/Risparmio) non piu' piatti */
.stat-box{
  background:linear-gradient(180deg,var(--surface),var(--surface-2));
  border:1px solid var(--hairline);

.tap-ripple{position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(0);background:var(--ripple);pointer-events:none;opacity:0.5;animation:tapRipple .5s var(--ease-out) forwards;z-index:0;}

/* Anteprima dell'avvio. Gira QUI, subito dopo il div dello splash e molto
   prima del resto dell'app: a questo punto il browser ha letto poche righe,
   quindi il primo fotogramma utile arriva quasi subito. Legge una fotografia
   minuscola dell'ultima schermata (patrimonio GIA' formattato, mese, stato
   dell'occhio) e la ridisegna con le classi vere della Home. Non calcola
   niente e non tocca i dati: se la fotografia manca o e' rotta, resta lo
   spinner di prima. */
(function(){
  var SNAP_KEY='spendy-snap-v1';
  try{
    var raw=window.localStorage.getItem(SNAP_KEY);
    if(!raw)return;
    var s=JSON.parse(raw);
    if(!s||!s.val)return;
    var box=document.getElementById('splash');
    if(!box)return;
    var esc=function(t){
      return String(t==null?'':t).replace(/[&<>"]/g,function(c){
        return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;';
      });

        '<span class="sk-acts"><i></i><i></i><i></i></span></div>'+
        '<section class="hero-card"><div class="hero-label">'+esc(s.lab)+'</div>'+
        '<div class="hero-value">'+esc(s.val)+'</div>'+
        '<div class="hero-sub"><span>'+esc(s.sub)+'</span></div></section>'+
        '<div class="sk-row"></div><div class="sk-row"></div><div class="sk-row short"></div>'+
      '</div>');
    box.classList.add('preview');
  }catch(e){}
})();

/* Traduzioni guida: descrizioni lunghe (recurring/accounts/invest/premium)
   aggiornate in v56/v57 e non ancora tradotte. Chiavi = testo IT esatto. */
Object.assign(TR.en,{
'Abbonamenti, bollette, affitto: l\'app tiene d\'occhio le scadenze e ti avvisa. Con «Segna pagato» il movimento reale viene creato sul conto e la scadenza avanza da sola. Puoi <strong>pagare anche in anticipo</strong>: se a luglio saldi l\'affitto del 3 agosto, il movimento porta la data del 3 agosto (è il mese a cui appartiene) e sulla ricorrente compare «già pagata». In Home trovi il riquadro <strong>«già registrato in avanti»</strong>, che spiega perché il saldo è già sceso, e con la freccia dei mesi puoi arrivare fino a quel mese.<br><br>Ogni ricorrente può avere una <strong>durata</strong>: indefinita, come è sempre stato, oppure a termine, in anni e mesi. Mentre la scrivi l\'app ti dice quante scadenze vengono fuori e quando cade l\'ultima; quando finiscono, il ricorrente diventa <strong>concluso</strong>: smette di chiedere di essere pagato e non pesa più sulla spesa mensile stimata, ma resta nell\'elenco col suo storico.<br><br>Con Premium c\'è anche il <strong>finanziamento</strong>: dichiari quanto c\'è da restituire e come sono fatte le rate, anche a importi diversi nel tempo (290 € per 3 anni, poi 400 € per altri 3). Ogni rata registrata scala dal conto che hai scelto e abbassa il residuo, e nelle statistiche avanzate trovi quanto manca, quante rate mancano e quando cambia l\'importo.':'Subscriptions, bills, rent: the app keeps an eye on due dates and reminds you. With «Mark as paid» the real transaction is added to the account and the due date moves forward on its own. You can <strong>pay ahead of time</strong> too: if in July you settle the rent due 3 August, the transaction is dated 3 August (the month it belongs to) and the recurring item shows «already paid». On Home you\'ll find the <strong>«already recorded ahead»</strong> box, which explains why the balance has already dropped, and with the month arrow you can go all the way to that month.<br><br>Every recurring item can have a <strong>duration</strong>: open-ended, as it always was, or fixed, in years and months. As you set it, the app tells you how many payments come out and when the last one falls; when they end, the recurring item becomes <strong>finished</strong>: it stops asking to be paid and no longer weighs on the estimated monthly spending, but it stays in the list with its history.<br><br>With Premium there\'s also the <strong>loan</strong>: you state how much is left to repay and how the instalments are shaped, even at different amounts over time (€290 for 3 years, then €400 for another 3). Each instalment you record is deducted from the account you chose and lowers the balance due, and in the advanced statistics you\'ll find how much is left, how many instalments remain and when the amount changes.',
'Si aprono dal pulsante in alto a destra. I tuoi conti con il saldo totale di sempre, rinominabili e colorati, e la spunta per tenerne uno fuori dal bilancio complessivo. Ogni conto ha il suo <strong>occhio</strong>: puoi coprire il saldo di uno solo, senza nascondere tutto il resto. Con Premium compare anche il conto <strong>Investimenti</strong>, il cui saldo non è la somma dei movimenti ma quanto vale oggi il tuo portafoglio. Sotto, i <strong>salvadanai tematici</strong>: buste virtuali per obiettivi (un viaggio, un acquisto) con anello di avanzamento, che trovi anche in Home — versare qui non tocca i saldi dei conti.':'They open from the button at the top right. Your accounts with their all-time balance, which you can rename and colour, plus a checkbox to keep one out of the overall total. Each account has its own <strong>eye</strong>: you can hide the balance of just one, without hiding everything else. With Premium the <strong>Investments</strong> account also appears, whose balance is not the sum of transactions but how much your portfolio is worth today. Below, the <strong>themed money boxes</strong>: virtual envelopes for goals (a trip, a purchase) with a progress ring, which you also find on Home — putting money in here does not touch the account balances.',
'Una sezione dedicata (Premium) per <strong>monitorare</strong> azioni, ETF e cripto. I <strong>prezzi si aggiornano da soli</strong> ogni giorno e tutto è convertito in euro. Vedi il <strong>valore del portafoglio</strong> con grafico e periodi (1S/1M/1A/Max), cerchi un asset scrivendo anche solo una parola (es. «world»), e apri la sua scheda con grafico, descrizione e dati chiave. Con <strong>Compra</strong> fai un acquisto una tantum: inserisci gli euro e le quote si calcolano da sole; con <strong>Accumula</strong> crei un <strong>piano di accumulo</strong> che investe in automatico a intervalli regolari. Ogni operazione viene registrata come movimento sui tuoi conti: è monitoraggio, non un broker reale. Al primo acquisto nasce da solo il conto <strong>Investimenti</strong>: il suo saldo è il valore di mercato del portafoglio e si muove ogni giorno insieme ai prezzi, così il patrimonio complessivo tiene conto anche di quello.':'A dedicated section (Premium) to <strong>track</strong> stocks, ETFs and crypto. The <strong>prices update on their own</strong> every day and everything is converted to euros. You see the <strong>portfolio value</strong> with a chart and periods (1W/1M/1Y/Max), you search for an asset by typing even a single word (e.g. «world»), and you open its page with chart, description and key data. With <strong>Buy</strong> you make a one-off purchase: you enter the euros and the shares are worked out on their own; with <strong>Accumulate</strong> you create a <strong>recurring investment plan</strong> that invests automatically at regular intervals. Every operation is recorded as a transaction on your accounts: it\'s tracking, not a real broker. On the first purchase the <strong>Investments</strong> account is created on its own: its balance is the market value of the portfolio and it moves every day along with the prices, so the overall net worth takes it into account too.',

view</strong>: what\'s free, what you unlock and an example for each feature.',

'Registra in pochi secondi una spesa, un\'entrata o un trasferimento tra conti. Puoi creare una <strong>nuova categoria al volo</strong> senza uscire dal modulo, aggiungere etichette e note.':'Enregistrez en quelques secondes une dépense, un revenu ou un transfert entre comptes. Vous pouvez créer une <strong>nouvelle catégorie à la volée</strong> sans quitter le formulaire, et ajouter des tags et des notes.',
'Abbonamenti, bollette, affitto: l\'app tiene d\'occhio le scadenze e ti avvisa. Con «Segna pagato» il movimento reale viene creato sul conto e la scadenza avanza da sola.':'Abonnements, factures, loyer : l\'app surveille les échéances et vous prévient. Avec « Marquer comme payé », le mouvement réel est créé sur le compte et l\'échéance avance toute seule.',
'Si aprono dal pulsante in alto a destra. I tuoi conti con il saldo totale di sempre, rinominabili e colorati, e la spunta per tenerne uno fuori dal bilancio complessivo. Sotto, i <strong>salvadanai tematici</strong>: buste virtuali per obiettivi (un viaggio, un acquisto) con anello di avanzamento, che trovi anche in Home — versare qui non tocca i saldi dei conti.':'Vos comptes avec leur solde total de toujours, renommables et colorés. En dessous, les <strong>cagnottes thématiques</strong> : des enveloppes virtuelles pour vos objectifs (un voyage, un achat) avec anneau de progression, visibles aussi sur l\'Accueil — mettre de l\'argent de côté ici ne touche pas aux soldes des comptes.',
'Nel Profilo (l\'avatar in alto a destra) imposti un limite di spesa per categoria: la Home ti avvisa quando ti avvicini o lo superi.':'Dans le Profil (l\'avatar en haut à droite) vous définissez une limite de dépense par catégorie : l\'Accueil vous prévient quand vous vous en approchez ou la dépassez.',
'Sempre nel Profilo, la scheda dedicata dove crei, rinomini ed elimini categorie e tag. Tocca una categoria o un tag per vederne il <strong>grafico dell\'andamento nel tempo</strong>: come è variato mese per mese e, per le categorie di spesa con un budget, una <strong>linea di riferimento</strong> che mostra a colpo d\'occhio quando l\'hai superato.':'Toujours dans le Profil, la section dédiée où vous créez, renommez et supprimez catégories et tags. Touchez une catégorie ou un tag pour voir son <strong>graphique d\'évolution dans le temps</strong> : comment il a varié mois par mois et, pour les catégories de dépense avec un budget, une <strong>ligne de référence</strong> qui montre d\'un coup d\'œil quand vous l\'avez dépassé.',
'Sempre nel Profilo: accedi con Google o email per avere i dati <strong>sincronizzati tra telefono e PC</strong> (funziona anche offline, si allinea da solo). Importa l\'estratto conto (CSV o Excel) con anteprima riga per riga, ed esporta tutto in PDF, CSV o Excel.':'Toujours dans le Profil : connectez-vous avec Google ou e-mail pour garder vos données <strong>synchronisées entre téléphone et PC</strong> (fonctionne aussi hors ligne et se synchronise tout seul). Importez votre relevé de compte (CSV, Excel, PDF) avec un aperçu ligne par ligne, et exportez tout en PDF, CSV ou Excel.',

function defaultState(){
  return {
    accounts:[{id:uid('acc'),name:'Conto principale',color:0}],
    categories:DEFAULT_EXPENSE_CATS.map(function(c){return Object.assign({},c);}).concat(DEFAULT_INCOME_CATS.map(function(c){return Object.assign({},c);})),
    transactions:[],transfers:[],budgets:{},tags:[],recurring:[],goals:[],investments:[],portfolioHistory:[],merchantRules:{},subsIgnored:[],futureDismissed:[],
    profile:{name:'',avatar:''}
  };
}

function ensureV3Fields(s){
  s.tags=s.tags||[];
  /* Regole esercente -> categoria imparate durante gli import. */
  s.merchantRules=s.merchantRules||{};
  /* Esercenti che l'utente ha detto NON essere abbonamenti (radar). */
  s.subsIgnored=s.subsIgnored||[];
  /* Movimenti futuri per cui l'avviso in Home e' stato congedato: si
     nasconde solo l'avviso, il movimento resta dov'e'. */
  s.futureDismissed=s.futureDismissed||[];
  (s.accounts||[]).forEach(function(a){a.excludeFromTotal=!!a.excludeFromTotal;});
  s.transactions=s.transactions||[];
  s.transfers=s.transfers||[];
  s.recurring=s.recurring||[];s.portfolioHistory=s.portfolioHistory||[];
  s.goals=s.goals||[];
  s.investments=s.investments||[];
  s.investments.forEach(function(h){h.currency=h.currency||'EUR';h.kind=h.kind||'etf';if(h.price==='')h.price=null;});
  s.goals.forEach(function(g){g.history=g.history||[];if(g.emoji===undefined)g.emoji='🎯';if(g.color===undefined)g.color=0;});
  s.transactions.forEach(function(t){t.tags=t.tags||[];t.type=t.type||'expense';if(t.merchant===undefined)t.merchant='';});
  s.transfers.forEach(function(t){t.tags=t.tags||[];});
  /* Profilo (nome + immagine): vive nello stato, cosi' viene salvato coi dati,
     entra nell'export e si sincronizza sul cloud. Alla prima apertura si
     recupera il nome dalla vecchia chiave localStorage. */
  if(!s.profile||typeof s.profile!=='object')s.profile={name:'',avatar:''};
  if(typeof s.profile.name!=='string')s.profile.name='';
  if(typeof s.profile.avatar!=='string')s.profile.avatar='';
  if(!s.profile.name||!s.profile.avatar){
    var lp=legacyProfile();
    if(lp){
      if(!s.profile.name&&lp.name)s.profile.name=String(lp.name);
      if(!s.profile.avatar&&lp.avatar)s.profile.avatar=String(lp.avatar);
    }
  }
  if(s.notifAutomation===undefined)s.notifAutomation=false;
  if(s.hideBalances===undefined)s.hideBalances=false;
  if(s.categories)s.categories.forEach(function(c){if(c.archived===undefined)c.archived=false;});
  ensurePayPalSetup(s);
  return s;
}

/* Crea (una volta sola) il conto "PayPal", così i pagamenti PayPal si
   possono registrare a mano scegliendolo come conto. */
function ensurePayPalSetup(s){
  if(!s.accounts)s.accounts=[];
  /* NON creiamo piu' automaticamente il conto "PayPal": il primo avvio
     (e ogni schermata prima della sincronizzazione) deve restare pulito,
     con i soli conti realmente presenti. Se un conto PayPal esiste gia'
     (utenti storici, o creato a mano dall'utente) lo colleghiamo; altrimenti
     paypalAccountId resta nullo e nessun conto viene aggiunto. */
  var pp=s.accounts.filter(function(a){return /paypal/i.test(a.name);})[0];
  s.paypalAccountId=pp?pp.id:null;
  s.paypalSetupDone=true;
  return s;
}

function migrateFromRaw(raw){
  var cats=(raw.categories&&raw.categories.length)?raw.categories.slice().map(function(c){return c.type?c:Object.assign({},c,{type:'expense'});}):DEFAULT_EXPENSE_CATS.map(function(c){return Object.assign({},c);});
  if(!cats.some(function(c){return c.type==='income';})) DEFAULT_INCOME_CATS.forEach(function(c){cats.push(Object.assign({},c));});
  var txns=raw.transactions||(raw.expenses?raw.expenses.map(function(e){return Object.assign({},e,{type:e.type||'expense',tags:e.tags||[]}); }):[]);
  return ensureV3Fields({accounts:(raw.accounts&&raw.accounts.length)?raw.accounts:defaultState().accounts,categories:cats,transactions:txns,transfers:raw.transfers||[],budgets:raw.budgets||{},tags:raw.tags||[],recurring:raw.recurring||[],goals:raw.goals||[],investments:raw.investments||[],portfolioHistory:raw.portfolioHistory||[],merchantRules:raw.merchantRules||{},subsIgnored:raw.subsIgnored||[],futureDismissed:raw.futureDismissed||[],inboxToken:raw.inboxToken||null,autoRegister:!!raw.autoRegister,notifAutomation:!!raw.notifAutomation,hideBalances:!!raw.hideBalances,paypalAccountId:raw.paypalAccountId||null,paypalSetupDone:!!raw.paypalSetupDone,profile:raw.profile||null,updatedAt:raw.updatedAt||0});
}

   Pages) quell'oggetto non esiste, quindi si passa automaticamente a
   localStorage, che è persistente sul dispositivo tra una sessione e
   l'altra ed è supportato da tutti i browser desktop e mobile.
================================================================ */
var usingClaudeStorage = !!window.storage;

async function storageGet(key){
  if(usingClaudeStorage){
    try{var r=await window.storage.get(key,false);return r&&r.value?r.value:null;}
    catch(e){return null;}
  }
  try{return window.localStorage.getItem(key);}
  catch(e){return null;}
}
async function storageSet(key,value){
  if(usingClaudeStorage){
    try{var ok=await window.storage.set(key,value,false);return !!ok;}
    catch(e){return false;}
  }
  try{window.localStorage.setItem(key,value);return true;}
  catch(e){return false;}
}
async function storageRemove(key){
  if(usingClaudeStorage){
    try{await window.storage.delete(key,false);}catch(e){}
    return;
  }
  try{window.localStorage.removeItem(key);}catch(e){}
}

/* ----------------------------------------------------------------
   DATI SEPARATI PER ACCOUNT
   Ogni account cloud ha la sua "cassetta" locale: expense-tracker-state-v3::UID.
   Chi non ha mai collegato il cloud usa la cassetta senza UID.
   Cosi' due account sullo stesso telefono non vedono mai i dati dell'altro,
   e uscendo dall'account i dati spariscono dal dispositivo (restano nel cloud).
---------------------------------------------------------------- */
var SESSION_KEY='expense-tracker-session-v1';
var activeUid=null;
function stateKeyFor(uid){return uid?STORAGE_KEY+'::'+uid:STORAGE_KEY;}
function currentStateKey(){return stateKeyFor(activeUid);}
function loadSession(){
  try{var raw=window.localStorage.getItem(SESSION_KEY);return raw?JSON.parse(raw):null;}
  catch(e){return null;}
}
function saveSession(sess){
  try{window.localStorage.setItem(SESSION_KEY,JSON.stringify(sess));}catch(e){}
}
function clearSession(){
  try{window.localStorage.removeItem(SESSION_KEY);}catch(e){}
}

async function loadState(){
  async function tryLoad(key){
    var raw=await storageGet(key);
    try{return raw?JSON.parse(raw):null;}catch(e){return null;}
  }
  var sess=loadSession();
  activeUid=sess?sess.uid:null;
  var data=await tryLoad(currentStateKey());
  if(!data&&!activeUid)data=await tryLoad(STORAGE_KEY_V2);
  if(data){state=migrateFromRaw(data);}
  else{state=ensureV3Fields(defaultState());state.updatedAt=activeUid?0:Date.now();}
  await persistLocal();
}

/* Passa alla cassetta dell'account che ha appena fatto l'accesso.
   Se su questo dispositivo non c'e' ancora niente per quell'account,
   si parte VUOTI: i dati veri arrivano dal cloud. Mai, in nessun caso,
   i dati di un altro account. */
async function switchUserState(uid){
  activeUid=uid;
  var raw=await storageGet(stateKeyFor(uid));
  if(raw){
    try{state=migrateFromRaw(JSON.parse(raw));sync.freshUser=false;return;}catch(e){}
  }

}

function widgetTopBudget(){
  var list=[];
  try{list=budgetStatusList();}catch(e){return null;}
  if(!list.length)return null;
  list.sort(function(a,b){return b.pct-a.pct;});
  var t=list[0];
  return {label:t.cat.name+' · '+fmt(t.spent)+' / '+fmt(t.limit),pct:Math.max(0,Math.min(100,Math.round(t.pct)))};
}
function topExpenseCats(n){
  /* Le categorie di spesa piu' usate negli ultimi 3 mesi (per numero di
     movimenti), con ripiego sulle prime categorie di spesa disponibili. */
  var since=monthKeyBack(2),count={};
  (state.transactions||[]).forEach(function(t){
    if(!t.date||t.type==='income')return;
    if(t.date.slice(0,7)<since)return;
    count[t.categoryId]=(count[t.categoryId]||0)+1;
  });
  var ranked=Object.keys(count).sort(function(a,b){return count[b]-count[a];})
    .map(function(id){return catById(id);})
    .filter(function(c){return c&&c.type!=='income';});
  (state.categories||[]).forEach(function(c){
    if(c.type==='income')return;
    if(ranked.some(function(r){return r.id===c.id;}))return;
    ranked.push(c);
  });
  return ranked.slice(0,n||2);
}
function buildWidgetPayload(){
  var p={premium:false,balance:'',spent:'',monthLabel:'',budgetLabel:'',budgetPct:0,
         r1:'',r1a:'',r2:'',r2a:'',r3:'',r3a:'',
         q1n:'',q1i:'',q2n:'',q2i:''};
  if(!isPremium())return p;
  p.premium=true;
  try{
    var tot=(state.accounts||[]).reduce(function(s,a){return s+accBalance(a.id);},0);
    p.balance=fmt(tot);
    p.spent=fmt(totalOf(filteredTx(currentMonthKey(),'all','all','expense')));
    p.monthLabel=monthLabelShort(currentMonthKey());
    var tb=widgetTopBudget();
    if(tb){p.budgetLabel=tb.label;p.budgetPct=tb.pct;}
    var last=(state.transactions||[]).slice().sort(function(a,b){
      if(a.date===b.date)return (b.createdAt||0)-(a.createdAt||0);
      return a.date<b.date?1:-1;
    }).slice(0,3);
    last.forEach(function(t,i){
      var c=catById(t.categoryId);
      var name=(t.merchant||'').trim()||(c&&c.name)||'—';
      var amt=(t.type==='income'?'+':'−')+fmt(Math.abs(t.amount));
      p['r'+(i+1)]=name;
      p['r'+(i+1)+'a']=amt;
    });
    var qc=topExpenseCats(2);
    if(qc[0]){p.q1n=qc[0].emoji?(qc[0].emoji+' '+qc[0].name):qc[0].name;p.q1i=qc[0].id;}
    if(qc[1]){p.q2n=qc[1].emoji?(qc[1].emoji+' '+qc[1].name):qc[1].name;p.q2i=qc[1].id;}
  }catch(e){}
  return p;
}

function extractObjectAround(txt, anchor){
  var idx=txt.indexOf(anchor);
  if(idx===-1)return null;
  var start=txt.lastIndexOf('{', idx);
  if(start===-1)return null;
  var depth=0, inStr=false, strCh='';
  for(var i=start;i<txt.length;i++){
    var c=txt[i];
    if(inStr){
      if(c==='\\'){i++;continue;}
      if(c===strCh)inStr=false;
      continue;
    }
    if(c==='"'||c==="'"||c==='`'){inStr=true;strCh=c;continue;}
    if(c==='{')depth++;
    else if(c==='}'){depth--;if(depth===0)return txt.slice(start,i+1);}
  }
  return null;
}
function parseFirebaseConfigInput(raw){
  if(!raw||!raw.trim())return null;
  var txt=raw.trim();
  txt=txt.replace(/[\u2018\u2019\u201A\u201B]/g,"'").replace(/[\u201C\u201D\u201E\u201F]/g,'"');
  txt=txt.replace(/[\u200B\u200C\u200D\uFEFF]/g,'');
  txt=txt.replace(/\u00A0/g,' ');
  var candidate=extractObjectAround(txt,'apiKey');
  if(!candidate){
    var m=txt.match(/\{[\s\S]*\}/);
    candidate=m?m[0]:txt;
  }
  try{
    var obj=(new Function('return (' + candidate + ')'))();
    if(obj&&typeof obj==='object'&&obj.apiKey&&obj.projectId)return obj;
    return null;
  }catch(e){
    try{
      var obj2=JSON.parse(candidate);
      if(obj2&&obj2.apiKey&&obj2.projectId)return obj2;
    }catch(e2){}
    return null;
  }
}

function loadFirebaseSDK(){
  if(sync.sdkLoadPromise)return sync.sdkLoadPromise;
  sync.sdkLoadPromise=new Promise(function(resolve,reject){
    if(window.firebase&&window.firebase.apps){resolve();return;}
    var urls=[
      'https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js',
      'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js',
      'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js'
    ];
    function loadNext(i){
      if(i>=urls.length){resolve();return;}
      var s=document.createElement('script');
      s.src=urls[i];
      s.onload=function(){loadNext(i+1);};
      s.onerror=function(){sync.sdkLoadPromise=null;reject(new Error('Impossibile caricare Firebase SDK'));};
      document.head.appendChild(s);
    }
    loadNext(0);
  });
  return sync.sdkLoadPromise;
}

      renderActiveTab();
      showToast(tr('Dati aggiornati da un altro dispositivo'));
    }catch(e){console.error('Errore applicando dati remoti',e);}
  },function(err){
    console.error('Errore listener sync',err);
    sync.status='error';sync.errorMsg='Connessione al cloud interrotta';
  });
}

/* Allineamento automatico locale <-> cloud (nessuna domanda all'utente).
   Regola: vince la versione modificata piu' di recente (state.updatedAt).
   A parita' di data vince il CLOUD, che e' la fonte di verita' di default;
   se pero' su questo dispositivo ci sono modifiche fatte offline e non
   ancora caricate, quelle vengono spinte nel cloud. */
async function reconcileWithCloud(){
  if(!sync.db||!sync.uid)return 'no-db';
  var snap;
  try{snap=await syncDocRef(sync.uid).get();}
  catch(e){markPendingPush(true);return 'offline';}
  if(!snap.exists){
    if(sync.freshUser)return 'no-remote';
    await rawPushStateToCloud();return 'pushed';
  }
  var remote=snap.data();
  if(!remote||!remote.data){
    if(sync.freshUser)return 'no-remote';
    await rawPushStateToCloud();return 'pushed';
  }
  var localJSON=JSON.stringify(state);
  if(remote.data===localJSON){
    sync.lastPushedJSON=remote.data;
    markPendingPush(false);
    return 'identical';
  }
  var remoteState=null;
  try{remoteState=JSON.parse(remote.data);}catch(e){}
  if(!remoteState){await rawPushStateToCloud();return 'pushed';}
  var remoteAt=remoteState.updatedAt||0;
  var localAt=(state&&state.updatedAt)||0;
  var cloudWins=remoteAt>localAt||(!sync.pendingPush&&remoteAt>=localAt);
  if(cloudWins){
    state=migrateFromRaw(remoteState);
    sync.lastPushedJSON=remote.data;
    await persistLocal();
    markPendingPush(false);
    renderActiveTab();
    return 'used-remote';
  }
  await rawPushStateToCloud();
  return 'used-local';
}

/* Pulsante "Sincronizza": scarica le novita' dal cloud e carica quelle
   locali rimaste in sospeso. Se non c'e' rete lo dice e basta: i dati
   restano salvati sul telefono e ripartiranno alla prossima occasione. */
async function syncNow(){
  if(sync.busy)return;
  if(sync.status==='unconfigured'){openSyncModal();return;}
  if(sync.status==='configured'||sync.status==='error'){
    if(!isOnline()){showToast(tr('Nessuna connessione: i dati restano in locale'));return;}
    showToast(tr('Riconnessione…'));
    await initSyncFromSavedConfig();
    return;
  }
  if(sync.status!=='connected'){showToast(tr('Connessione in corso…'));return;}
  if(!isOnline()){markPendingPush(true);renderActiveTab();showToast(tr('Offline: sincronizzo appena torna la rete'));return;}
  sync.busy=true;renderActiveTab();
  var res;
  try{res=await reconcileWithCloud();}
  catch(e){res='offline';markPendingPush(true);}
  sync.busy=false;
  renderActiveTab();
  if(res==='offline')showToast(tr('Nessuna connessione: i dati restano in locale'));
  else if(res==='used-remote')showToast(tr('Aggiornato dal cloud'));
  else if(res==='used-local')showToast(tr('Modifiche caricate nel cloud'));
  else showToast(tr('Già sincronizzato'));
}

async function startSync(uid,email){
  sync.uid=uid;sync.email=email;sync.status='connecting';
  sync.offlineSession=false;
  saveSession({uid:uid,email:email});
  if(activeUid!==uid){
    markPendingPush(false);
    sync.lastPushedJSON=null;
    await switchUserState(uid);
    renderActiveTab();
  }
  var res=await reconcileWithCloud();
  if(sync.freshUser){
    sync.freshUser=false;
    if(res==='pushed'||res==='no-remote')await maybeClaimLocalData(uid);
  }
  if(!state.inboxToken){state.inboxToken=randToken();await saveState();}
  attachSnapshotListener();
  try{attachInboxListener();}catch(e){console.error('Inbox notifiche non disponibile',e);}
  try{
    var u=sync.auth&&sync.auth.currentUser;
    sync.providers=u?u.providerData.map(function(pd){return pd.providerId;}):[];
  }catch(e){sync.providers=[];}
  sync.status='connected';
  if(sync.pendingPush&&isOnline())await rawPushStateToCloud();
  /* Se dal cloud non e' arrivato niente di nuovo, ridisegnare tutto
     serve solo a far lampeggiare lo schermo: basta la spia. */
  if(res==='used-remote'||res==='pushed')renderActiveTab();
  else updateSyncBadge();
  saveScreenSnapshot();
}

/* Uscita dall'account: i dati restano nel cloud ma spariscono dal telefono,
   cosi' chi apre l'app senza accedere non vede piu' niente. */
async function signOutFromCloud(){
  if(sync.status==='connected'&&isOnline()&&sync.pendingPush){
    try{await rawPushStateToCloud();}catch(e){}
  }
  var uid=activeUid;
  if(sync.unsubscribeSnapshot){sync.unsubscribeSnapshot();sync.unsubscribeSnapshot=null;}
  if(sync.unsubscribeInbox){sync.unsubscribeInbox();sync.unsubscribeInbox=null;}
  sync.pendingInbox=[];
  if(sync.auth){try{await sync.auth.signOut();}catch(e){}}
  /* Nell'app nativa pulisce anche la sessione del plugin, così al prossimo
     accesso Google/Apple ripropone la scelta dell'account (sul web non fa nulla). */
  if(window.NativeBridge&&NativeBridge.signOutNative){try{await NativeBridge.signOutNative();}catch(e){}}
  if(uid)await storageRemove(stateKeyFor(uid));
  clearScreenSnapshot();
  clearSession();
  activeUid=null;
  sync.uid=null;sync.email=null;sync.offlineSession=false;sync.lastPushedJSON=null;
  sync.status='configured';
  markPendingPush(false);
  state=ensureV3Fields(defaultState());
  state.updatedAt=Date.now();
  await persistLocal();
  ui.accountFilter='all';ui.categoryFilter='all';ui.typeFilter='all';ui.tagFilter=null;
  renderActiveTab();
}

/* Quando la rete torna: riconnetti o risincronizza in silenzio. */
function initConnectivityWatch(){
  window.addEventListener('online',function(){
    if(sync.status==='connected'){reconcileWithCloud().then(function(){renderActiveTab();});}
    else if(loadSyncConfig()){initSyncFromSavedConfig();}
  });
  window.addEventListener('offline',function(){updateSyncBadge();});
}

function stopSync(keepConfig){
  if(sync.unsubscribeSnapshot){sync.unsubscribeSnapshot();sync.unsubscribeSnapshot=null;}
  if(sync.unsubscribeInbox){sync.unsubscribeInbox();sync.unsubscribeInbox=null;}
  sync.pendingInbox=[];
  if(sync.auth){try{sync.auth.signOut();}catch(e){}}
  sync.status=keepConfig?'configured':'unconfigured';
  sync.uid=null;sync.email=null;sync.db=null;sync.auth=null;sync.firebaseApp=null;
  if(!keepConfig)clearSyncConfig();
  renderActiveTab();
}

/* ================================================================
   REGISTRAZIONE AUTOMATICA DA NOTIFICHE
   Un'app di automazione sul telefono (su Android)
   inoltra il testo delle notifiche bancarie a Firestore, in una
   "casella" identificata da un token segreto. L'app la ascolta in
   tempo reale, estrae importo/descrizione/categoria e propone il
   movimento da confermare (o lo registra da sola se l'utente ha
   attivato la modalità automatica).
================================================================ */
function randToken(){
  var chars='abcdefghijklmnopqrstuvwxyz0123456789';
  var out='';
  try{
    var arr=new Uint8Array(24);crypto.getRandomValues(arr);
    for(var i=0;i<arr.length;i++)out+=chars[arr[i]%36];
  }catch(e){for(var j=0;j<24;j++)out+=chars[Math.floor(Math.random()*36)];}
  return out;
}

function parseBankNotification(item){
  var text=((item.title?item.title+' ':'')+(item.text||'')).trim();
  var m=text.match(/(?:€|eur)\s*:?\s*([0-9][0-9.,]*)/i)||text.match(/([0-9][0-9.,]*)\s*(?:€|eur)/i);
  var amount=m?Math.abs(parseAmount(m[1])):NaN;
  var lower=text.toLowerCase();
  var isIncome=/accredit|bonifico ricevuto|hai ricevuto|incasso|stipendio|rimborso/.test(lower);
  var desc='';
  var pm=text.match(/presso\s+([^.,\n]{2,40})/i);
  if(pm)desc=pm[1].trim();
  else{
    var dm=text.match(/(?:a favore di|da)\s+([^.,\n]{2,40})/i);
    if(dm)desc=dm[1].trim();
    else desc=(item.title||text).slice(0,60);
  }
  var type=isIncome?'income':'expense';
  return{amount:amount,type:type,merchant:desc,note:'',categoryId:guessCat(desc+' '+text,type),valid:amount>0,raw:text};
}

/* ================================================================
   NOTIFICHE
   L'app registra i movimenti dalle notifiche che le vengono recapitate
   nella "casella" (inbox). Su iPhone nessuna app può leggere le notifiche
   o le email di altre app: i pagamenti PayPal si inseriscono a mano
   usando il conto "PayPal", il campo Esercente e la Nota.
================================================================ */
function parseNotification(item){
  return parseBankNotification(item);
}

function defaultAccountId(){
  if(lastUsedAccId&&pickableAccounts().some(function(a){return a.id===lastUsedAccId;})&&!isLocked('accounts',lastUsedAccId))return lastUsedAccId;
  return firstUsableAccountId();
}

function registerParsedNotification(p){
  if(p.source==='paypal'&&p.txCode){
    if(state.transactions.some(function(t){return t.ppTxCode===p.txCode;}))return false;
  }
  state.transactions.push({
    id:uid('tx'),type:p.type,amount:p.amount,
    accountId:p.accountId||defaultAccountId(),
    categoryId:p.categoryId,
    merchant:p.merchant||'',
    note:p.note||'',
    date:todayISO(),tags:[],createdAt:Date.now(),
    source:p.source||'notif',
    ppTxCode:p.txCode||null
  });
  return true;
}

function attachInboxListener(){
  if(sync.unsubscribeInbox){sync.unsubscribeInbox();sync.unsubscribeInbox=null;}
  if(!state.inboxToken||!sync.db)return;
  sync.unsubscribeInbox=sync.db.collection('inbox').doc(state.inboxToken).collection('items').onSnapshot(function(qs){
    var items=[];
    qs.docs.forEach(function(d){var data=d.data()||{};items.push({id:d.id,title:data.title||'',text:data.text||''});});
    handleInboxItems(items);
  },function(err){console.error('Errore inbox notifiche',err);});
}
function deleteInboxItem(id){
  if(!sync.db||!state.inboxToken)return;
  try{sync.db.collection('inbox').doc(state.inboxToken).collection('items').doc(id).delete();}catch(e){}
}
function handleInboxItems(items){
  var natives=sync.pendingInbox.filter(function(x){return x.native;});
  var added=0;
  var leftovers=[];
  items.forEach(function(it){
    var p=parseNotification(it);
    if(state.autoRegister&&p.valid){
      registerParsedNotification(p);
      deleteInboxItem(it.id);
      added++;
    }else{
      leftovers.push(it);
    }
  });
  sync.pendingInbox=natives.concat(leftovers);
  if(added){saveState();showToast(added===1?tr('Registrato 1 movimento dalla notifica'):tr('Registrati {N} movimenti dalle notifiche').replace('{N}',added));}
  renderActiveTab();
}
function registerInboxItem(itemId){
  var it=sync.pendingInbox.find(function(x){return x.id===itemId;});
  if(!it)return;
  var p=parseNotification(it);
  if(!p.valid){showToast(tr('Importo non riconosciuto in questa notifica'));return;}
  var ok=registerParsedNotification(p);
  saveState();
  if(!it.native)deleteInboxItem(itemId);
  sync.pendingInbox=sync.pendingInbox.filter(function(x){return x.id!==itemId;});
  showToast(ok?tr('Movimento registrato'):tr('Movimento già registrato'));
  renderActiveTab();
}
/* "Modifica": apre il normale foglio di inserimento gia' compilato con quello
   che si e' capito dalla notifica. Cosi' si possono correggere importo,
   categoria, conto, data, esercente e nota prima di salvare. La notifica
   sparisce dalla lista solo quando il movimento viene davvero salvato. */
function editInboxItem(itemId){
  var it=sync.pendingInbox.find(function(x){return x.id===itemId;});
  if(!it)return;
  var p=parseNotification(it);
  if(!p.valid){showToast(tr('Importo non riconosciuto in questa notifica'));return;}
  openEntrySheet({
    prefill:{
      mode:p.type,amount:p.amount,accountId:p.accountId||defaultAccountId(),
      categoryId:p.categoryId,merchant:p.merchant||'',note:p.note||'',date:todayISO()
    },
    onSave:function(){
      if(!it.native)deleteInboxItem(itemId);
      sync.pendingInbox=sync.pendingInbox.filter(function(x){return x.id!==itemId;});
    }
  });
}
function ignoreInboxItem(itemId){
  var it=sync.pendingInbox.find(function(x){return x.id===itemId;});
  if(it&&!it.native)deleteInboxItem(itemId);
  sync.pendingInbox=sync.pendingInbox.filter(function(x){return x.id!==itemId;});
  renderActiveTab();
}

/* ---- Ponte nativo (app Android via Capacitor) ----
   Quando l'app gira dentro il contenitore nativo Android, il plugin
   SpeseNotifiche legge le notifiche direttamente sul dispositivo e le
   consegna qui direttamente. Le notifiche
   senza un importo riconoscibile vengono scartate in silenzio (il
   listener nativo riceve le notifiche di tutte le app, non solo la
   banca, quindi mostrare quelle non valide creerebbe solo rumore). */
function handleNativeNotification(data){
  var item={id:uid('nat'),title:(data&&data.title)||'',text:(data&&data.text)||'',native:true};
  var p=parseNotification(item);
  if(!p.valid)return;
  if(state.autoRegister){
    if(registerParsedNotification(p)){
      saveState();
      showToast(tr('Registrato dalla notifica:')+' '+fmt(p.amount));
    }
  }else{
    sync.pendingInbox.push(item);
  }
  renderActiveTab();
}
function initNativeNotificationBridge(){
  try{
    if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SpeseNotifiche){
      window.Capacitor.Plugins.SpeseNotifiche.addListener('bancaNotifica',function(data){
        try{handleNativeNotification(data);}catch(e){console.error('Errore notifica nativa',e);}
      });
      return true;
    }
  }catch(e){}
  return false;
}
function inboxEndpointURL(){
  var cfg=loadSyncConfig();
  if(!cfg||!cfg.firebaseConfig||!state.inboxToken)return '';
  return 'https://firestore.googleapis.com/v1/projects/'+cfg.firebaseConfig.projectId+'/databases/(default)/documents/inbox/'+state.inboxToken+'/items';
}

async function initSyncFromSavedConfig(){
  var cfg=loadSyncConfig();
  if(!cfg||!cfg.firebaseConfig){sync.status='unconfigured';return;}
  sync.status='configured';
  try{
    await loadFirebaseSDK();
    sync.firebaseApp=firebase.apps.length?firebase.apps[0]:firebase.initializeApp(cfg.firebaseConfig);
    sync.auth=firebase.auth();
    sync.db=firebase.firestore();
    /* Se si è appena tornati dalla pagina di accesso Google (redirect),
       qui si raccoglie il risultato; poi ci pensa onAuthStateChanged. */
    try{
      var rr=await sync.auth.getRedirectResult();
      if(rr&&rr.user){saveSyncConfig({firebaseConfig:cfg.firebaseConfig,email:rr.user.email});}
    }catch(e){
      if(e&&e.code)console.error('Redirect Google',e.code);
    }
    try{await sync.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(e){}
    if(!sync.authWired){
      sync.authWired=true;
      sync.auth.onAuthStateChanged(function(user){
        if(user){startSync(user.uid,user.email);return;}
        /* Nessun utente da Firebase. Se pero' la nostra sessione e' ancora
           valida (tipico quando si va in aereo e Firebase non riesce a
           rinnovare il token), NON si esce dall'account: si resta connessi
           "offline" e si continua a lavorare sui dati locali. */
        var sess=loadSession();
        if(sess&&sess.uid){
          sync.uid=sess.uid;sync.email=sess.email;
          if(activeUid!==sess.uid)switchUserState(sess.uid).then(renderActiveTab);
          sync.offlineSession=true;
          sync.status='connected';
          renderActiveTab();
          return;
        }
        sync.status='configured';sync.offlineSession=false;renderActiveTab();
      });
    }
  }catch(e){
    /* Se siamo semplicemente offline (o gstatic non raggiungibile) non è un
       errore di configurazione: si resta "configurata ma non connessa" e al
       prossimo tentativo l'SDK viene ricaricato. Se però c'era una sessione
       valida, si continua a lavorare offline dentro l'account. */
    var sessOff=loadSession();
    if(sessOff&&sessOff.uid){
      sync.uid=sessOff.uid;sync.email=sessOff.email;
      if(activeUid!==sessOff.uid)await switchUserState(sessOff.uid);
      sync.offlineSession=true;sync.status='connected';
    }else if(!isOnline()){
      sync.status='configured';
    }else{
      sync.status='error';sync.errorMsg='Impossibile inizializzare Firebase. Riprova tra poco.';
    }
    renderActiveTab();
  }
}

/* Accesso con l'account Google (deve essere attivo il provider Google
   in Firebase → Authentication → Sign-in method, e il dominio dell'app
   deve essere fra i "domini autorizzati"). Prova prima la finestra pop-up;
   se il browser la blocca (tipico dentro una PWA su iPhone) passa al
   redirect: si esce dall'app, si sceglie l'account, si rientra. */
async function connectSyncWithGoogle(firebaseConfig){
  sync.status='connecting';renderActiveTab();
  try{
    await loadFirebaseSDK();
    sync.firebaseApp=firebase.apps.length?firebase.apps[0]:firebase.initializeApp(firebaseConfig);
    sync.auth=firebase.auth();
    sync.db=firebase.firestore();
    saveSyncConfig({firebaseConfig:firebaseConfig,email:(loadSyncConfig()||{}).email||null});
    try{await sync.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(ep){}
    /* App Android/iOS: dentro l'app il metodo web di Google viene bloccato.
       Usiamo il login NATIVO del plugin, che ci ridà solo la credenziale
       (idToken); poi Firebase JS entra con signInWithCredential, così la
       sessione e la sincronizzazione restano identiche. Sul web questo blocco
       viene saltato (NativeBridge.isNative()===false) e si usa il pop-up. */
    if(window.NativeBridge&&NativeBridge.isNative()){
      try{
        var gnat=await NativeBridge.signInWithGoogle();
        if(gnat&&gnat.idToken){
          var gcred=firebase.auth.GoogleAuthProvider.credential(gnat.idToken,gnat.accessToken||null);
          var gout=await sync.auth.signInWithCredential(gcred);
          saveSyncConfig({firebaseConfig:firebaseConfig,email:gout.user.email});
          await startSync(gout.user.uid,gout.user.email);
          return {ok:true};
        }
        /* gnat null = plugin non presente in questa build: si prosegue col web */
      }catch(enat){
        sync.status='configured';renderActiveTab();
        var cn=enat&&enat.code;
        if(cn==='auth/cancelled'||(enat&&/cancel|annull/i.test(enat.message||'')))return {ok:false,error:'Accesso annullato.'};
        return {ok:false,error:(enat&&enat.message)?tr('Accesso con Google non riuscito: ')+enat.message:'Accesso con Google non riuscito.'};
      }
    }
    var provider=new firebase.auth.GoogleAuthProvider();
    /* Chiede sempre quale account Google usare: senza questo, dopo una
       disconnessione si rientrerebbe in automatico sempre con lo stesso. */
    provider.setCustomParameters({prompt:'select_account'});
    try{await sync.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(e0){}
    try{
      var cred=await sync.auth.signInWithPopup(provider);
      saveSyncConfig({firebaseConfig:firebaseConfig,email:cred.user.email});
      await startSync(cred.user.uid,cred.user.email);
      return {ok:true};
    }catch(e1){
      var c=e1&&e1.code;
      if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request'){
        sync.status='configured';renderActiveTab();
        return {ok:false,error:'Accesso annullato.'};
      }
      if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'||c==='auth/web-storage-unsupported'){
        await sync.auth.signInWithRedirect(provider);
        return {ok:true,redirect:true};
      }
      throw e1;
    }
  }catch(e){
    sync.status='configured';renderActiveTab();
    var msg='Accesso con Google non riuscito.';
    if(e&&e.code==='auth/unauthorized-domain')msg='Dominio non autorizzato: aggiungi l\'indirizzo dell\'app in Firebase → Authentication → Impostazioni → Domini autorizzati.';
    else if(e&&e.code==='auth/operation-not-allowed')msg='Il provider Google non è attivo: abilitalo in Firebase → Authentication → Sign-in method.';
    else if(e&&e.code==='auth/network-request-failed')msg=tr('Connessione di rete non disponibile.');
    else if(e&&e.message)msg=tr('Accesso con Google non riuscito: ')+e.message;
    return {ok:false,error:msg};
  }
}

/* Accesso con Apple (nativo). Come per Google: il plugin fa accedere e ci
   ridà la credenziale, poi Firebase JS entra con signInWithCredential.
   NB: funziona solo su iPhone con app FIRMATA e provider "apple.com" attivo
   in Firebase (serve un account Apple Developer a pagamento). Finché il flag
   APPLE_LOGIN_ENABLED è false, questo percorso non viene nemmeno mostrato. */
async function connectSyncWithApple(firebaseConfig){
  sync.status='connecting';renderActiveTab();
  try{
    await loadFirebaseSDK();
    sync.firebaseApp=firebase.apps.length?firebase.apps[0]:firebase.initializeApp(firebaseConfig);
    sync.auth=firebase.auth();
    sync.db=firebase.firestore();
    saveSyncConfig({firebaseConfig:firebaseConfig,email:(loadSyncConfig()||{}).email||null});
    try{await sync.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(ep){}
    if(window.NativeBridge&&NativeBridge.isNative()){
      var anat=await NativeBridge.signInWithApple();
      if(anat&&anat.idToken){
        var aprov=new firebase.auth.OAuthProvider('apple.com');
        var acred=aprov.credential({idToken:anat.idToken,rawNonce:anat.nonce||undefined});
        var aout=await sync.auth.signInWithCredential(acred);
        saveSyncConfig({firebaseConfig:firebaseConfig,email:aout.user.email||null});
        await startSync(aout.user.uid,aout.user.email||null);
        return {ok:true};
      }
    }
    sync.status='configured';renderActiveTab();
    return {ok:false,error:'Login con Apple non ancora disponibile su questo dispositivo.'};
  }catch(e){
    sync.status='configured';renderActiveTab();
    var cc=e&&e.code;
    if(cc==='auth/cancelled'||(e&&/cancel|annull/i.test(e.message||'')))return {ok:false,error:'Accesso annullato.'};
    if(cc==='auth/operation-not-allowed')return {ok:false,error:'Il provider Apple non è attivo: abilitalo in Firebase → Authentication → Sign-in method.'};
    return {ok:false,error:(e&&e.message)?'Accesso con Apple non riuscito: '+e.message:'Accesso con Apple non riuscito.'};
  }
}

async function connectSyncWithCredentials(firebaseConfig,email,password,mode){
  sync.status='connecting';renderActiveTab();
  try{
    await loadFirebaseSDK();
    sync.firebaseApp=firebase.apps.length?firebase.apps[0]:firebase.initializeApp(firebaseConfig);
    sync.auth=firebase.auth();
    sync.db=firebase.firestore();
    try{await sync.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(e0){}
    var cred;
    if(mode==='signup')cred=await sync.auth.createUserWithEmailAndPassword(email,password);
    else cred=await sync.auth.signInWithEmailAndPassword(email,password);
    saveSyncConfig({firebaseConfig:firebaseConfig,email:email});
    await startSync(cred.user.uid,cred.user.email);
    return {ok:true};
  }catch(e){
    sync.status='configured';renderActiveTab();

/* Invia l'email per reimpostare la password a chi ha dimenticato le credenziali.
   Non serve essere già connessi: inizializza Firebase con la config e chiede
   a Firebase Auth di spedire il link di reset all'indirizzo indicato. */
async function sendPasswordReset(firebaseConfig,email){
  try{
    await loadFirebaseSDK();
    sync.firebaseApp=firebase.apps.length?firebase.apps[0]:firebase.initializeApp(firebaseConfig);
    sync.auth=firebase.auth();
    await sync.auth.sendPasswordResetEmail(email);
    return {ok:true};
  }catch(e){
    var msg=tr('Non è stato possibile inviare l\'email. Riprova.');
    if(e&&e.code){
      if(e.code==='auth/invalid-email')msg=tr('Email non valida.');
      else if(e.code==='auth/user-not-found')msg=tr('Nessun account registrato con questa email.');
      else if(e.code==='auth/network-request-failed')msg=tr('Connessione di rete non disponibile.');

    }
    return {ok:false,error:msg};
  }
}

/* ================================================================
   LETTURA DELLE DATE DAGLI ESTRATTI CONTO
   Ogni banca scrive le date a modo suo: 28/06/2026, 2026-06-28,
   28.06.26, "28 giu 2026", "Jun 28, 2026", 20260628, e i fogli Excel
   a volte le lasciano come numero (46200). Qui si prova tutto, e la
   scelta fra giorno/mese e mese/giorno NON si fa riga per riga ma
   guardando l'intera colonna: e' l'unico modo per non sbagliare su

var MONTH_W4={juin:6,juil:7,genn:1,febb:2,marz:3,marc:3,mars:3,apri:4,magg:5,giug:6,lugl:7,agos:8,aout:8,sett:9,sept:9,otto:10,octo:10,nove:11,dice:12,dece:12,janv:1,janu:1,juli:7,june:6,july:7,ener:1,abri:4,mayo:5,juni:6,agost:8,dici:12};
var MONTH_W3={gen:1,jan:1,ene:1,feb:2,fev:2,mar:3,apr:4,abr:4,avr:4,mag:5,may:5,mai:5,giu:6,jun:6,lug:7,jul:7,ago:8,aug:8,aou:8,set:9,sep:9,ott:10,oct:10,nov:11,dic:12,dec:12};
function deAccent(s){
  return String(s||'').toLowerCase()
    .replace(/[àáâä]/g,'a').replace(/[èéêë]/g,'e').replace(/[ìíîï]/g,'i')
    .replace(/[òóôö]/g,'o').replace(/[ùúûü]/g,'u').replace(/ç/g,'c');
}
function monthFromWord(w){
  w=deAccent(w).replace(/\./g,'');
  if(w.length>=4&&MONTH_W4[w.slice(0,4)])return MONTH_W4[w.slice(0,4)];
  if(w.length>=3&&MONTH_W3[w.slice(0,3)])return MONTH_W3[w.slice(0,3)];
  return 0;
}
function daysInMonth(y,m){return new Date(y,m,0).getDate();}
function fixYear(y){y=+y;if(y<100)return y<70?2000+y:1900+y;return y;}
/* Costruisce la data solo se esiste davvero: cosi' il 31 febbraio viene
   scartato invece di diventare 3 marzo. */
function buildISO(y,m,d){
  y=+y;m=+m;d=+d;
  if(!(y>=1970&&y<=2100))return null;
  if(!(m>=1&&m<=12))return null;
  if(!(d>=1&&d<=daysInMonth(y,m)))return null;
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
/* order: 'dmy' (europeo, predefinito) oppure 'mdy' (americano). Vale solo
   quando i numeri da soli non bastano a capirlo. */
function parseDateFlexible(str,order){
  if(str==null)return null;
  var s=String(str).trim();
  if(!s)return null;
  var m;
  /* 2026-06-28 / 2026.06.28 / 2026/06/28 */
  m=s.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m){var r=buildISO(m[1],m[2],m[3]);if(r)return r;}
  /* 28/06/2026, 6-28-26, 28.06.26 */
  m=s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  if(m){
    var a=+m[1],b=+m[2],y=fixYear(m[3]),d,mo;
    if(a>12&&b<=12){d=a;mo=b;}
    else if(b>12&&a<=12){d=b;mo=a;}
    else if(order==='mdy'){mo=a;d=b;}
    else{d=a;mo=b;}
    var r2=buildISO(y,mo,d);
    if(r2)return r2;
    r2=buildISO(y,d,mo);   // ultimo tentativo con i ruoli scambiati
    if(r2)return r2;
  }
  /* 28 giu 2026 · 28-GIU-26 · 28 giugno */
  m=s.match(/(\d{1,2})[\s.\-\/]+([A-Za-zÀ-ÿ]{3,12})\.?(?:[\s.\-\/,]+(\d{2,4}))?/);
  if(m){
    var mw=monthFromWord(m[2]);
    if(mw){
      var yy=m[3]?fixYear(m[3]):new Date().getFullYear();
      var r3=buildISO(yy,mw,m[1]);
      if(r3)return r3;
    }
  }
  /* Jun 28, 2026 · giugno 28 2026 */
  m=s.match(/([A-Za-zÀ-ÿ]{3,12})\.?[\s.\-\/]+(\d{1,2})(?:[\s.\-\/,]+(\d{2,4}))?/);
  if(m){
    var mw2=monthFromWord(m[1]);
    if(mw2){
      var yy2=m[3]?fixYear(m[3]):new Date().getFullYear();
      var r4=buildISO(yy2,mw2,m[2]);
      if(r4)return r4;
    }
  }
  /* 20260628 oppure 28062026 */
  m=s.match(/(?:^|\D)(\d{8})(?:\D|$)/);
  if(m){
    var c=m[1];
    var r5=buildISO(c.slice(0,4),c.slice(4,6),c.slice(6,8));
    if(r5)return r5;
    r5=buildISO(c.slice(4,8),c.slice(2,4),c.slice(0,2));
    if(r5)return r5;
  }
  return null;
}
/* Numero puro tipico di Excel (46200 = 28/06/2026). Si accetta solo in una
   colonna dove quasi tutti i valori sono numeri in quell'intervallo, per non
   scambiare un importo per una data. */
function serialLooksLikeDate(v){
  var s=String(v==null?'':v).trim();
  if(!/^\d{5}(?:[.,]\d+)?$/.test(s))return false;
  var n=parseFloat(s.replace(',','.'));
  return n>=25569&&n<=54789;   // dal 1970 al 2050

/* Guarda TUTTA la colonna prima di decidere l'ordine giorno/mese. */
function detectDateOrder(values){
  var dmy=0,mdy=0;
  values.forEach(function(v){
    var m=String(v==null?'':v).match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
    if(!m)return;
    var a=+m[1],b=+m[2];
    if(a>12&&b<=12)dmy++;
    else if(b>12&&a<=12)mdy++;
  });
  return mdy>dmy?'mdy':'dmy';
}
/* Legge un'intera colonna di date e dice quante ne ha capite.
   Restituisce {dates:[...], ok:n, total:n, order:'dmy'|'mdy', serial:bool} */
function readDateColumn(rows,start,col){
  var vals=[];
  for(var i=start;i<rows.length;i++)vals.push((rows[i]||[])[col]);
  var filled=vals.filter(function(v){return String(v==null?'':v).trim()!=='';}).length;
  var order=detectDateOrder(vals);
  var dates=vals.map(function(v){return parseDateFlexible(v,order);});
  var ok=dates.filter(Boolean).length;
  /* Se il testo non ha funzionato, forse sono numeri seriali di Excel. */
  var serialCount=vals.filter(serialLooksLikeDate).length;
  var serial=false;
  if(serialCount>ok&&serialCount>=Math.max(1,filled*0.6)){
    dates=vals.map(function(v){return serialLooksLikeDate(v)?excelSerialToISO(parseFloat(String(v).replace(',','.'))):null;});
    ok=dates.filter(Boolean).length;
    serial=true;
  }
  return{dates:dates,ok:ok,total:filled,order:order,serial:serial};
}

/* Riconoscimento automatico della categoria da una descrizione.

function normDesc(s){return String(s||'').toLowerCase().replace(/[0-9]+/g,' ').replace(/[^a-zàèéìòù ]+/g,' ').replace(/\s+/g,' ').trim();}

/* ---------- RICONOSCIMENTO DELL'ESERCENTE ----------
   Gli estratti conto scrivono la stessa insegna in mille modi diversi:
   "PAGAMENTO CARTA ESSELUNGA MILANO 12/06", "Esselunga Spa ore 18:22",
   "POS ESSELUNGA 4412". merchantKey() toglie numeri e parole di servizio e
   tiene le prime parole significative: le righe dello stesso negozio
   finiscono cosi' sotto la stessa chiave e si possono categorizzare insieme. */
var MERCHANT_NOISE=['pagamento','pagamenti','pagam','pago','pagata','pagato','carta','carte','credito','debito','con','del','della','dello','dei','delle','per','presso','acquisto','acquisti','addebito','accredito','bonifico','bancomat','pos','operazione','operazioni','data','ora','ore','importo','euro','eur','transazione','contactless','disposizione','ordine','ordinante','beneficiario','causale','sepa','ricevuta','estero','italia','italy','www','http','https','com','srl','spa','snc','sas','ltd','inc','the','and','saldo','commissione','commissioni','servizio','divisa','valuta','cambio','riferimento','numero','conto','banca','instant','mandato','avere','dare','rimborso','storno','stornato','reso','rettifica','annullo','prelievo','versamento','ricarica','online','store','shop','mobile','app','paypal','sumup','satispay','klarna','scalapay','stripe','adyen','izettle','postepay','sofort','sdd'];
function merchantKey(desc){
  var toks=normDesc(desc).split(' ').filter(function(w){
    return w.length>=3&&MERCHANT_NOISE.indexOf(w)===-1;
  });
  if(!toks.length)return '';

     NETFLIX, TRENITALIA): cosi' "ESSELUNGA MILANO" e "ESSELUNGA 4412" restano

  var any=state.categories.filter(function(c){return c.type===type;});
  return any.length?any[any.length-1].id:altId;
}
function learnedCat(desc,type){
  var toks=descTokens(desc);
  if(!toks.length)return null;
  var score={};
  state.transactions.forEach(function(t){
    if(t.type!==type||!t.categoryId)return;
    var text=normDesc((t.merchant||'')+' '+(t.note||''));
    if(!text)return;
    var hit=0;
    for(var i=0;i<toks.length;i++)if(text.indexOf(toks[i])>-1)hit++;
    if(hit)score[t.categoryId]=(score[t.categoryId]||0)+hit;
  });
  var best=null,bestV=0;
  for(var id in score)if(score[id]>bestV){bestV=score[id];best=id;}
  if(best&&state.categories.some(function(c){return c.id===best&&c.type===type;}))return best;
  return null;
}
function guessCat(desc,type){
  var ruled=ruleCat(desc,type);
  if(ruled)return ruled;
  var learned=learnedCat(desc,type);
  if(learned)return learned;
  var d=(desc||'').toLowerCase();
  var map=type==='income'?INCOME_KW:EXPENSE_KW;
  for(var cat in map){
    if(!state.categories.some(function(c){return c.id===cat&&c.type===type;}))continue;
    var ws=map[cat];
    for(var i=0;i<ws.length;i++)if(d.indexOf(ws[i])>-1)return cat;
  }
  return fallbackCatId(type);
}

================================================================ */
function filteredTx(monthKey,accFilter,catFilter,typeFilter){
  return state.transactions.filter(function(t){
    if(t.date.slice(0,7)!==monthKey)return false;
    if(accFilter&&accFilter!=='all'&&t.accountId!==accFilter)return false;
    if(catFilter&&catFilter!=='all'&&t.categoryId!==catFilter)return false;
    if(typeFilter&&typeFilter!=='all'&&t.type!==typeFilter)return false;
    return true;
  });
}
function totalOf(list){return list.reduce(function(s,e){return s+e.amount;},0);}
function breakdown(list){
  var map={};list.forEach(function(e){map[e.categoryId]=(map[e.categoryId]||0)+e.amount;});
  var tot=totalOf(list);
  return Object.keys(map).map(function(id){return{catId:id,total:map[id],pct:tot>0?map[id]/tot*100:0};}).sort(function(a,b){return b.total-a.total;});
}
function periodTotals(monthKey,accFilter){
  var inc=totalOf(filteredTx(monthKey,accFilter,'all','income'));
  var exp=totalOf(filteredTx(monthKey,accFilter,'all','expense'));
  return{income:inc,expense:exp,net:inc-exp};
}
/* ================================================================
   CONTO "INVESTIMENTI" (virtuale, Premium)
   Non e' un conto come gli altri: non ci si registrano movimenti e il suo
   saldo NON e' la somma di entrate e uscite, ma il valore di mercato del
   portafoglio (la stessa cifra della sezione Investimenti). Cosi' il
   patrimonio complessivo tiene conto anche di quanto valgono oggi azioni,
   ETF e cripto, e si muove da solo quando i prezzi si aggiornano.
   Viene creato da solo al primo acquisto e solo con Premium attivo.
================================================================ */
function isInvestAccount(a){return !!(a&&a.kind==='invest');}
function investAccount(){return (state.accounts||[]).filter(isInvestAccount)[0]||null;}
function isInvestAccountId(id){var a=investAccount();return !!(a&&id&&a.id===id);}
/* I conti su cui si puo' davvero registrare qualcosa: tutti tranne quello
   virtuale degli investimenti. Da usare in ogni elenco a scelta. */
function pickableAccounts(){return (state.accounts||[]).filter(function(a){return !isInvestAccount(a);});}
function ensureInvestAccount(){
  var a=investAccount();
  if(a)return a;
  if(!isPremium())return null;
  a={id:uid('acc'),name:'Investimenti',color:2,kind:'invest',virtual:true};
  state.accounts=state.accounts||[];
  state.accounts.push(a);
  return a;
}
/* Valore del portafoglio a una certa data: si legge dallo storico gia'
   registrato giorno per giorno. Se lo storico non arriva cosi' indietro si
   ripiega su quanto era stato investito fino a quel giorno (meglio una
   stima prudente che una riga piatta al valore di oggi). */
function investValueAtEur(dateISO){
  var h=state.portfolioHistory||[],v=null;
  for(var i=0;i<h.length;i++){if(h[i]&&h[i][0]<=dateISO)v=h[i][1];else break;}
  if(v!=null)return v;
  var c=0;
  (state.investments||[]).forEach(function(x){if(!x.date||x.date<=dateISO)c+=invCostEur(x);});
  return c;
}
/* Data in cui i soldi hanno davvero lasciato (o raggiunto) il conto.
   Un ricorrente pagato IN ANTICIPO ha il movimento datato alla scadenza
   futura (per far quadrare il mese giusto nel riepilogo), ma la cassa e'
   uscita nel giorno in cui l'hai registrato (paidAt): e' quella la data che
   conta per il saldo a una certa data. Per tutti gli altri movimenti
   coincide con la data normale. */
function txCashDate(t){return (t&&t.earlyPaid&&t.paidAt&&t.paidAt<t.date)?t.paidAt:t.date;}
function accBalance(accId){
  if(isInvestAccountId(accId))return portfolioValueEur();
  var b=0;
  state.transactions.forEach(function(t){if(t.accountId!==accId)return;b+=t.type==='income'?t.amount:-t.amount;});
  state.transfers.forEach(function(tr){if(tr.fromAccountId===accId)b-=tr.amount;if(tr.toAccountId===accId)b+=tr.amount;});
  return b;
}
function accMonthExp(accId){
  if(isInvestAccountId(accId))return 0;
  return totalOf(filteredTx(currentMonthKey(),accId,'all','expense'));
}
/* Un conto puo' essere tenuto fuori dal patrimonio complessivo (utile per un
   conto cointestato, uno aziendale o uno che si vuole solo monitorare).
   Resta a tutti gli effetti un conto: si registrano movimenti, si vede il suo
   saldo, semplicemente non entra nella somma. */
function accInTotal(a){return !a.excludeFromTotal;}
function accountsInTotal(){return (state.accounts||[]).filter(accInTotal);}
function totalBalance(){return accountsInTotal().reduce(function(sm,a){return sm+accBalance(a.id);},0);}
/* Solo i soldi liquidi: il conto Investimenti resta fuori. Serve dove
   contano i soldi davvero spendibili (per esempio i mesi di autonomia). */
function liquidBalance(){return accountsInTotal().filter(function(a){return !isInvestAccount(a);}).reduce(function(sm,a){return sm+accBalance(a.id);},0);}
/* Saldo di un conto fino a una certa data inclusa (ISO 'YYYY-MM-DD'). */
function accBalanceAt(accId,dateISO){
  if(isInvestAccountId(accId))return investValueAtEur(dateISO);
  var b=0;
  state.transactions.forEach(function(t){if(t.accountId!==accId||txCashDate(t)>dateISO)return;b+=t.type==='income'?t.amount:-t.amount;});
  state.transfers.forEach(function(tr){if(tr.date>dateISO)return;if(tr.fromAccountId===accId)b-=tr.amount;if(tr.toAccountId===accId)b+=tr.amount;});
  return b;
}
/* Variazione netta di un conto in un intervallo di date (estremi inclusi). */
function accFlowBetween(accId,fromISO,toISO){
  if(isInvestAccountId(accId)){
    var d=new Date(fromISO+'T00:00:00');d.setDate(d.getDate()-1);
    var prima=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    return investValueAtEur(toISO)-investValueAtEur(prima);
  }
  var b=0;
  state.transactions.forEach(function(t){var cd=txCashDate(t);if(t.accountId!==accId||cd<fromISO||cd>toISO)return;b+=t.type==='income'?t.amount:-t.amount;});
  state.transfers.forEach(function(tr){if(tr.date<fromISO||tr.date>toISO)return;if(tr.fromAccountId===accId)b-=tr.amount;if(tr.toAccountId===accId)b+=tr.amount;});
  return b;
}
/* Salvadanai: quanto è stato messo da parte (somma dei versamenti/prelievi). */
function goalById(id){return (state.goals||[]).find(function(g){return g.id===id;});}
function goalSaved(g){return (g.history||[]).reduce(function(s,h){return s+h.amount;},0);}
function annualData(year,accFilter){
  var incM=new Array(12).fill(0),expM=new Array(12).fill(0),catExp={},catInc={};
  state.transactions.forEach(function(t){
    if(t.date.slice(0,4)!==String(year))return;
    if(accFilter!=='all'&&t.accountId!==accFilter)return;
    var m=parseInt(t.date.slice(5,7),10)-1;
    if(t.type==='income'){incM[m]+=t.amount;catInc[t.categoryId]=(catInc[t.categoryId]||0)+t.amount;}
    else{expM[m]+=t.amount;catExp[t.categoryId]=(catExp[t.categoryId]||0)+t.amount;}
  });
  var totInc=incM.reduce(function(a,b){return a+b;},0);
  var totExp=expM.reduce(function(a,b){return a+b;},0);
  return{incomeByMonth:incM,expenseByMonth:expM,totalIncome:totInc,totalExpense:totExp,net:totInc-totExp,catExp:catExp,catInc:catInc};
}
function combinedEntries(monthKey,accFilter,catFilter,typeFilter,tagFilter){
  var out=[];
  if(typeFilter!=='transfer'){
    filteredTx(monthKey,accFilter,catFilter,typeFilter==='all'?'all':typeFilter).filter(function(t){
      if(!tagFilter)return true;return t.tags&&t.tags.indexOf(tagFilter)>-1;
    }).forEach(function(t){out.push({kind:'tx',date:t.date,createdAt:t.createdAt,data:t});});
  }
  if((typeFilter==='all'||typeFilter==='transfer')&&(!catFilter||catFilter==='all')){
    state.transfers.filter(function(tr){
      if(tr.date.slice(0,7)!==monthKey)return false;
      if(accFilter!=='all'&&tr.fromAccountId!==accFilter&&tr.toAccountId!==accFilter)return false;
      if(tagFilter)return tr.tags&&tr.tags.indexOf(tagFilter)>-1;
      return true;
    }).forEach(function(tr){out.push({kind:'transfer',date:tr.date,createdAt:tr.createdAt,data:tr});});
  }
  out.sort(function(a,b){return(b.date+(b.createdAt||0))>(a.date+(a.createdAt||0))?1:-1;});
  return out;
}
function allEntries(){
  var out=state.transactions.map(function(t){return{kind:'tx',date:t.date,createdAt:t.createdAt,data:t};})
    .concat(state.transfers.map(function(tr){return{kind:'transfer',date:tr.date,createdAt:tr.createdAt,data:tr};}));
  out.sort(function(a,b){return(b.date+(b.createdAt||0))>(a.date+(a.createdAt||0))?1:-1;});
  return out;
}
function recentEntries(n){return allEntries().slice(0,n);}
function searchEntries(query){
  if(!query||!query.trim())return recentEntries(20);
  var q=query.toLowerCase().trim();
  return allEntries().filter(function(entry){
    if(entry.kind==='tx'){
      var t=entry.data,cat=catById(t.categoryId),acc=accById(t.accountId);
      if((t.note||'').toLowerCase().indexOf(q)>-1)return true;
      if((t.merchant||'').toLowerCase().indexOf(q)>-1)return true;
      if(cat.name.toLowerCase().indexOf(q)>-1)return true;
      if(acc.name.toLowerCase().indexOf(q)>-1)return true;
      if(t.amount.toFixed(2).replace('.',',').indexOf(q)>-1)return true;
      if(t.tags){for(var i=0;i<t.tags.length;i++){var tg=tagById(t.tags[i]);if(tg&&tg.name.toLowerCase().indexOf(q)>-1)return true;}}
      return false;
    }else{
      var tr=entry.data,fa=accById(tr.fromAccountId),ta=accById(tr.toAccountId);
      if((tr.note||'').toLowerCase().indexOf(q)>-1)return true;
      if(fa.name.toLowerCase().indexOf(q)>-1)return true;
      if(ta.name.toLowerCase().indexOf(q)>-1)return true;
      if(tr.amount.toFixed(2).replace('.',',').indexOf(q)>-1)return true;
      if(tr.tags){for(var i=0;i<tr.tags.length;i++){var tg=tagById(tr.tags[i]);if(tg&&tg.name.toLowerCase().indexOf(q)>-1)return true;}}
      return false;
    }
  });
}

/* Chiedere conferma non deve distruggere quello che c'e' sotto: se un foglio
   e' gia' aperto (per esempio i Conti), il dialogo si appoggia SOPRA come
   strato separato e alla chiusura si toglie solo lui. */
function confirmDialog(msg,onOk,okLabel){
  var root=document.getElementById('modal-root');
  var box='<div class="confirm-box"><p>'+esc(msg)+'</p><div class="confirm-actions"><button class="btn-secondary" id="confCancel">'+tr('Annulla')+'</button><button class="btn-danger" id="confOk">'+esc(okLabel||tr('Conferma'))+'</button></div></div>';
  var stacked=root&&root.classList.contains('open');
  var chiudi;
  if(stacked){
    root.insertAdjacentHTML('beforeend','<div class="confirm-layer" id="confirmLayer"><div class="modal-backdrop"></div><div class="confirm-wrap">'+box+'</div></div>');
    chiudi=closeConfirmLayer;
  }else{
    openCenteredModal(box);
    chiudi=closeModal;
  }
  document.getElementById('confCancel').onclick=chiudi;
  document.getElementById('confOk').onclick=function(){chiudi();onOk();};
  var bd=stacked?document.querySelector('#confirmLayer .modal-backdrop'):document.getElementById('modalBackdrop');
  if(bd)bd.onclick=chiudi;
  syncBackHistory();
}
/* Ridisegna il contenuto di un foglio MANTENENDO il punto in cui si stava
   guardando. Senza questo, ogni tocco su un pulsante interno riportava la
   pagina in cima: e' il "refresh di tutta la pagina" che si notava nei menu'. */
function rerenderSheetWrap(html){
  var w=document.querySelector('#modal-root .sheet-wrap');
  if(!w)return null;
  var old=w.querySelector('.sheet');
  var y=old?old.scrollTop:0;
  w.innerHTML=html;
  var nu=w.querySelector('.sheet');
  if(nu&&y)nu.scrollTop=y;
  return w;
}
function closeConfirmLayer(){
  var l=document.getElementById('confirmLayer');
  if(l&&l.parentNode)l.parentNode.removeChild(l);
  syncBackHistory();
}

var TAB_ORDER=['home','history','recurring','profile'];
function renderActiveTab(dir){
  var c=document.getElementById('content');
  // Se stiamo solo ridisegnando la stessa scheda (es. cambio mese, modifica di
  // un movimento) manteniamo la posizione di scorrimento invece di tornare in
  // cima. Azzeriamo lo scroll solo quando si cambia scheda o si scorre lateralmente.
  var prevScroll=c?c.scrollTop:0;
  var isSwipe=(dir==='left'||dir==='right');
  var sameTab=(ui._renderedTab===ui.activeTab);
  if(ui.activeTab==='home'){c.innerHTML=homeHTML();wireHome();}
  else if(ui.activeTab==='history'){c.innerHTML=historyHTML();wireHistory();}
  else if(ui.activeTab==='recurring'){c.innerHTML=recurringHTML();wireRecurring();}
  else if(ui.activeTab==='profile'){c.innerHTML=profileTabHTML();wireProfileTab();}
  else{ui.activeTab='home';c.innerHTML=homeHTML();wireHome();}
  if(dir==='left'||dir==='right'){
    var v=c.querySelector('.view');
    if(v)v.classList.add(dir==='left'?'enter-left':'enter-right');
  }
  if(sameTab&&!isSwipe)c.scrollTop=prevScroll; else c.scrollTop=0;
  ui._renderedTab=ui.activeTab;
  syncBackHistory();
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.toggle('active',b.dataset.tab===ui.activeTab);});
  var appEl=document.getElementById('app');
  if(appEl&&appEl.getAttribute('data-amb')!==ui.activeTab)appEl.setAttribute('data-amb',ui.activeTab);
}

/* ================================================================
   GRAFICO IN GRANDE — "Dove vanno i tuoi soldi"
   Si apre toccando il grafico. Ogni fetta e ogni riga si possono toccare:
   quella scelta si illumina, le altre si spengono, e al centro compaiono
   categoria, importo e percentuale.
================================================================ */
function bdDonutSVG(bd,selId){
  /* La fetta scelta si ingrossa di GROW: il raggio va calcolato sullo spessore
     MASSIMO, altrimenti la fetta evidenziata esce dal riquadro e si vede
     tagliata (era il bordo destro/alto del grafico grande). */
  var sz=200,sw=32,GROW=6,PAD=1,r=(sz-(sw+GROW))/2-PAD,ci=2*Math.PI*r,cx=sz/2,cy=sz/2;
  if(!bd.length)return '<svg viewBox="0 0 '+sz+' '+sz+'" class="bd-donut"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+sw+'"/></svg>';
  var off=0,circles='',gapPx=bd.length>1?3:0;
  bd.forEach(function(b){
    var cat=catById(b.catId),full=(b.pct/100)*ci,len=Math.max(full-gapPx,1);
    var dim=(selId&&b.catId!==selId)?' class="dim"':'';
    var w=(selId&&b.catId===selId)?(sw+GROW):sw;
    circles+='<circle'+dim+' data-slice="'+esc(b.catId)+'" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colorHex(cat.color)+'" stroke-width="'+w+'" stroke-dasharray="'+len.toFixed(2)+' '+(ci-len).toFixed(2)+'" stroke-dashoffset="'+(-(off+gapPx/2)).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')" stroke-linecap="butt"/>';
    off+=full;
  });
  return '<svg viewBox="0 0 '+sz+' '+sz+'" class="bd-donut">'+circles+'</svg>';
}

function donutSVG(bd){
  var sz=110,sw=18,r=(sz-sw)/2,ci=2*Math.PI*r,cx=sz/2,cy=sz/2;
  if(!bd.length)return '<svg viewBox="0 0 '+sz+' '+sz+'" class="donut"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+sw+'"/></svg>';
  var off=0,circles='',gapPx=bd.length>1?2.4:0;
  bd.forEach(function(b){var cat=catById(b.catId),full=(b.pct/100)*ci,len=Math.max(full-gapPx,0.8);circles+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colorHex(cat.color)+'" stroke-width="'+sw+'" stroke-dasharray="'+len.toFixed(2)+' '+(ci-len).toFixed(2)+'" stroke-dashoffset="'+(-(off+gapPx/2)).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')" stroke-linecap="butt"/>';off+=full;});
  return '<svg viewBox="0 0 '+sz+' '+sz+'" class="donut">'+circles+'</svg>';
}

function barChartSVG(incM,expM){
  var W=360,H=160,BTM=20,TOP=8,chartH=H-BTM-TOP;
  var maxVal=Math.max.apply(null,[1].concat(incM).concat(expM));
  var gW=W/12,bW=11,gap=2,circles='';
  for(var i=0;i<12;i++){
    var x=i*gW,gx=x+(gW-bW*2-gap)/2;
    var ih=(incM[i]/maxVal)*chartH,eh=(expM[i]/maxVal)*chartH;
    var baseY=TOP+chartH;
    if(ih>0)circles+='<rect x="'+gx.toFixed(1)+'" y="'+(baseY-ih).toFixed(1)+'" width="'+bW+'" height="'+ih.toFixed(1)+'" rx="3" fill="var(--accent)"/>';
    if(eh>0)circles+='<rect x="'+(gx+bW+gap).toFixed(1)+'" y="'+(baseY-eh).toFixed(1)+'" width="'+bW+'" height="'+eh.toFixed(1)+'" rx="3" fill="var(--red)"/>';
    circles+='<text x="'+(x+gW/2).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" font-size="9" fill="var(--ink-faint)">'+monthAbbrev(i)+'</text>';
  }
  var baseY2=TOP+chartH;
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%"><line x1="0" y1="'+baseY2+'" x2="'+W+'" y2="'+baseY2+'" stroke="var(--border)" stroke-width="1"/>'+circles+'</svg>';
}

function tagBadgesHTML(tags){

    return '<span class="tag-badge" style="background:'+tagBg(t.color)+';color:'+tagFg(t.color)+'">'+esc(t.name)+'</span>';
  }).join('');
  var more=tags.length>3?'<span class="tag-badge" style="background:var(--border);color:var(--ink-soft)">+' +(tags.length-3)+'</span>':'';
  return '<div class="tags-row">'+shown+more+'</div>';
}

/* Movimenti con una data che deve ancora arrivare: tolgono soldi dal saldo
   oggi ma compaiono nel riepilogo di un mese futuro. Senza questo riquadro
   il patrimonio scende e a prima vista non si capisce perche'. */
function futureEntries(soloDaMostrare){
  var oggi=todayISO(),out=[];
  var zitti=(state.futureDismissed||[]);
  function ok(id){return !soloDaMostrare||zitti.indexOf(id)<0;}
  (state.transactions||[]).forEach(function(t){if(t.date>oggi&&ok(t.id))out.push({kind:'tx',date:t.date,createdAt:t.createdAt,data:t});});
  (state.transfers||[]).forEach(function(t){if(t.date>oggi&&ok(t.id))out.push({kind:'transfer',date:t.date,createdAt:t.createdAt,data:t});});
  out.sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
  return out;
}
/* Congeda l'avviso: si segnano gli id, cosi' se domani registri un altro
   movimento in avanti l'avviso torna solo per quello. */
function dismissFutureBanner(){
  state.futureDismissed=(state.futureDismissed||[]).concat(futureEntries(true).map(function(e){return e.data.id;}));
  /* si tiene pulita la lista: via gli id di movimenti non piu' futuri */
  var vivi={};futureEntries(false).forEach(function(e){vivi[e.data.id]=1;});
  state.futureDismissed=state.futureDismissed.filter(function(id){return vivi[id];});
  saveState();
  renderActiveTab();
}

  /* ogni riga apre il movimento vero: da li' si modifica o si elimina */

    var d=e.data;
    var nome=e.kind==='tx'?(d.merchant||d.note||catById(d.categoryId).name):(d.note||tr('Trasferimento'));

/* Il riquadro del grafico si aggiorna da solo: cambiare Spese/Entrate non
   deve ridisegnare tutta la schermata. */
function wireBreakdown(){
  var limit=LAST_BREAKDOWN.limit,annual=LAST_BREAKDOWN.annual;
  document.querySelectorAll('[data-breakdown]').forEach(function(b){b.onclick=function(){
    if(ui.breakdownType===b.dataset.breakdown)return;
    ui.breakdownType=b.dataset.breakdown;
    var card=document.getElementById('breakdownCard');
    /* Nella vista annuale i totali si calcolano su tutto l'anno: li' conviene
       lasciar ricostruire la schermata. Nella vista mensile basta il riquadro. */
    if(!card||annual){renderActiveTab();return;}
    var data=breakdown(filteredTx(ui.viewMonth,ui.accountFilter,'all',ui.breakdownType));
    var box=document.createElement('div');
    box.innerHTML=breakdownSectionHTML(data,limit,annual);
    card.parentNode.replaceChild(box.firstChild,card);
    wireBreakdown();
  };});
  var op=document.getElementById('breakdownOpen');
  if(op)op.onclick=function(){openBreakdownSheet(LAST_BREAKDOWN.data);};
}
