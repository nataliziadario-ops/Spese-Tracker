/* Allineamento automatico locale <-> cloud (nessuna domanda all'utente).
   Regola: vince la versione modificata piu' di recente (state.updatedAt).
   A parita' di data vince il CLOUD, che e' la fonte di verita' di default;
   se pero' su questo dispositivo ci sono modifiche fatte offline e non
   ancora caricate, quelle vengono spinte nel cloud. */
async function reconcileWithCloud(){
  if(!sync.db||!sync.uid)return 'no-db';
  var snap;
  try{snap=await syncDocRef(sync.uid).get();}
  catch(e){markPendingPush(true);return 'offline';}
  if(!snap.exists){
    if(sync.freshUser)return 'no-remote';
    await rawPushStateToCloud();return 'pushed';
  }
  var remote=snap.data();
  if(!remote||!remote.data){
    if(sync.freshUser)return 'no-remote';
    await rawPushStateToCloud();return 'pushed';
  }
  var localJSON=JSON.stringify(state);
  if(remote.data===localJSON){
    sync.lastPushedJSON=remote.data;
    markPendingPush(false);
    return 'identical';
  }
  var remoteState=null;
  try{remoteState=JSON.parse(remote.data);}catch(e){}
  if(!remoteState){await rawPushStateToCloud();return 'pushed';}
  var remoteAt=remoteState.updatedAt||0;
  var localAt=(state&&state.updatedAt)||0;
  var cloudWins=remoteAt>localAt||(!sync.pendingPush&&remoteAt>=localAt);
  if(cloudWins){
    state=migrateFromRaw(remoteState);
    sync.lastPushedJSON=remote.data;
    await persistLocal();
    markPendingPush(false);
    renderActiveTab();
    return 'used-remote';
  }
  await rawPushStateToCloud();
  return 'used-local';
}

/* Pulsante "Sincronizza": scarica le novita' dal cloud e carica quelle
   locali rimaste in sospeso. Se non c'e' rete lo dice e basta: i dati
   restano salvati sul telefono e ripartiranno alla prossima occasione. */
async function syncNow(){
  if(sync.busy)return;
  if(sync.status==='unconfigured'){openSyncModal();return;}
  if(sync.status==='configured'||sync.status==='error'){
    if(!isOnline()){showToast(tr('Nessuna connessione: i dati restano in locale'));return;}
    showToast(tr('Riconnessione…'));
    await initSyncFromSavedConfig();
    return;
  }
  if(sync.status!=='connected'){showToast(tr('Connessione in corso…'));return;}
  if(!isOnline()){markPendingPush(true);renderActiveTab();showToast(tr('Offline: sincronizzo appena torna la rete'));return;}
  sync.busy=true;renderActiveTab();
  var res;
  try{res=await reconcileWithCloud();}
  catch(e){res='offline';markPendingPush(true);}
  sync.busy=false;
  renderActiveTab();
  if(res==='offline')showToast(tr('Nessuna connessione: i dati restano in locale'));
  else if(res==='used-remote')showToast(tr('Aggiornato dal cloud'));
  else if(res==='used-local')showToast(tr('Modifiche caricate nel cloud'));
  else showToast(tr('Già sincronizzato'));
}

async function startSync(uid,email){
  sync.uid=uid;sync.email=email;sync.status='connecting';
  sync.offlineSession=false;
  saveSession({uid:uid,email:email});
  if(activeUid!==uid){
    markPendingPush(false);
    sync.lastPushedJSON=null;
    await switchUserState(uid);
  }
  renderActiveTab();
  var res=await reconcileWithCloud();
  if(sync.freshUser){
    sync.freshUser=false;
    if(res==='pushed'||res==='no-remote')await maybeClaimLocalData(uid);
  }
  if(!state.inboxToken){state.inboxToken=randToken();await saveState();}
  attachSnapshotListener();
  try{attachInboxListener();}catch(e){console.error('Inbox notifiche non disponibile',e);}
  try{
    var u=sync.auth&&sync.auth.currentUser;
    sync.providers=u?u.providerData.map(function(pd){return pd.providerId;}):[];
  }catch(e){sync.providers=[];}
  sync.status='connected';
  if(sync.pendingPush&&isOnline())await rawPushStateToCloud();
  renderActiveTab();
}

/* Uscita dall'account: i dati restano nel cloud ma spariscono dal telefono,
   cosi' chi apre l'app senza accedere non vede piu' niente. */
async function signOutFromCloud(){
  if(sync.status==='connected'&&isOnline()&&sync.pendingPush){
    try{await rawPushStateToCloud();}catch(e){}
  }
  var uid=activeUid;
  if(sync.unsubscribeSnapshot){sync.unsubscribeSnapshot();sync.unsubscribeSnapshot=null;}
  if(sync.unsubscribeInbox){sync.unsubscribeInbox();sync.unsubscribeInbox=null;}
  sync.pendingInbox=[];
  if(sync.auth){try{await sync.auth.signOut();}catch(e){}}
  /* Nell'app nativa pulisce anche la sessione del plugin, così al prossimo
     accesso Google/Apple ripropone la scelta dell'account (sul web non fa nulla). */
  if(window.NativeBridge&&NativeBridge.signOutNative){try{await NativeBridge.signOutNative();}catch(e){}}
  if(uid)await storageRemove(stateKeyFor(uid));
  clearSession();
  activeUid=null;
  sync.uid=null;sync.email=null;sync.offlineSession=false;sync.lastPushedJSON=null;
  sync.status='configured';
  markPendingPush(false);
  state=ensureV3Fields(defaultState());
  state.updatedAt=Date.now();
  await persistLocal();
  ui.accountFilter='all';ui.categoryFilter='all';ui.typeFilter='all';ui.tagFilter=null;
  renderActiveTab();
}

/* Quando la rete torna: riconnetti o risincronizza in silenzio. */
function initConnectivityWatch(){
  window.addEventListener('online',function(){
    if(sync.status==='connected'){reconcileWithCloud().then(function(){renderActiveTab();});}
    else if(loadSyncConfig()){initSyncFromSavedConfig();}
  });
  window.addEventListener('offline',function(){updateSyncBadge();});
}

function stopSync(keepConfig){
  if(sync.unsubscribeSnapshot){sync.unsubscribeSnapshot();sync.unsubscribeSnapshot=null;}
  if(sync.unsubscribeInbox){sync.unsubscribeInbox();sync.unsubscribeInbox=null;}
  sync.pendingInbox=[];
  if(sync.auth){try{sync.auth.signOut();}catch(e){}}
  sync.status=keepConfig?'configured':'unconfigured';
  sync.uid=null;sync.email=null;sync.db=null;sync.auth=null;sync.firebaseApp=null;
  if(!keepConfig)clearSyncConfig();
  renderActiveTab();
}

/* ================================================================
   REGISTRAZIONE AUTOMATICA DA NOTIFICHE
   Un'app di automazione sul telefono (su Android)
   inoltra il testo delle notifiche bancarie a Firestore, in una
   "casella" identificata da un token segreto. L'app la ascolta in
   tempo reale, estrae importo/descrizione/categoria e propone il
   movimento da confermare (o lo registra da sola se l'utente ha
   attivato la modalità automatica).
================================================================ */
function randToken(){
  var chars='abcdefghijklmnopqrstuvwxyz0123456789';
  var out='';
  try{
    var arr=new Uint8Array(24);crypto.getRandomValues(arr);
    for(var i=0;i<arr.length;i++)out+=chars[arr[i]%36];
  }catch(e){for(var j=0;j<24;j++)out+=chars[Math.floor(Math.random()*36)];}
  return out;
}

function parseBankNotification(item){
  var text=((item.title?item.title+' ':'')+(item.text||'')).trim();
  var m=text.match(/(?:€|eur)\s*:?\s*([0-9][0-9.,]*)/i)||text.match(/([0-9][0-9.,]*)\s*(?:€|eur)/i);
  var amount=m?Math.abs(parseAmount(m[1])):NaN;
  var lower=text.toLowerCase();
  var isIncome=/accredit|bonifico ricevuto|hai ricevuto|incasso|stipendio|rimborso/.test(lower);
  var desc='';
  var pm=text.match(/presso\s+([^.,\n]{2,40})/i);
  if(pm)desc=pm[1].trim();
  else{
    var dm=text.match(/(?:a favore di|da)\s+([^.,\n]{2,40})/i);
    if(dm)desc=dm[1].trim();
    else desc=(item.title||text).slice(0,60);
  }
  var type=isIncome?'income':'expense';
  return{amount:amount,type:type,merchant:desc,note:'',categoryId:guessCat(desc+' '+text,type),valid:amount>0,raw:text};
}

/* ================================================================
   NOTIFICHE
   L'app registra i movimenti dalle notifiche che le vengono recapitate
   nella "casella" (inbox). Su iPhone nessuna app può leggere le notifiche
   o le email di altre app: i pagamenti PayPal si inseriscono a mano
   usando il conto "PayPal", il campo Esercente e la Nota.
================================================================ */
function parseNotification(item){
  return parseBankNotification(item);
}

function defaultAccountId(){
  if(lastUsedAccId&&state.accounts.some(function(a){return a.id===lastUsedAccId;})&&!isLocked('accounts',lastUsedAccId))return lastUsedAccId;
  return firstUsableAccountId();
}

function registerParsedNotification(p){
  if(p.source==='paypal'&&p.txCode){
    if(state.transactions.some(function(t){return t.ppTxCode===p.txCode;}))return false;
  }
  state.transactions.push({
    id:uid('tx'),type:p.type,amount:p.amount,
    accountId:p.accountId||defaultAccountId(),
    categoryId:p.categoryId,
    merchant:p.merchant||'',
    note:p.note||'',
    date:todayISO(),tags:[],createdAt:Date.now(),
    source:p.source||'notif',
    ppTxCode:p.txCode||null
  });
  return true;
}

function attachInboxListener(){
  if(sync.unsubscribeInbox){sync.unsubscribeInbox();sync.unsubscribeInbox=null;}
  if(!state.inboxToken||!sync.db)return;
  sync.unsubscribeInbox=sync.db.collection('inbox').doc(state.inboxToken).collection('items').onSnapshot(function(qs){
    var items=[];
    qs.docs.forEach(function(d){var data=d.data()||{};items.push({id:d.id,title:data.title||'',text:data.text||''});});
    handleInboxItems(items);
  },function(err){console.error('Errore inbox notifiche',err);});
}
function deleteInboxItem(id){
  if(!sync.db||!state.inboxToken)return;
  try{sync.db.collection('inbox').doc(state.inboxToken).collection('items').doc(id).delete();}catch(e){}
}
function handleInboxItems(items){
  var natives=sync.pendingInbox.filter(function(x){return x.native;});
  var added=0;
  var leftovers=[];
  items.forEach(function(it){
    var p=parseNotification(it);
    if(state.autoRegister&&p.valid){
      registerParsedNotification(p);
      deleteInboxItem(it.id);
      added++;
    }else{
      leftovers.push(it);
    }
  });
  sync.pendingInbox=natives.concat(leftovers);
  if(added){saveState();showToast(added===1?tr('Registrato 1 movimento dalla notifica'):tr('Registrati N movimenti dalle notifiche').replace('N',added));}
  renderActiveTab();
}
function registerInboxItem(itemId){
  var it=sync.pendingInbox.find(function(x){return x.id===itemId;});
  if(!it)return;
  var p=parseNotification(it);
  if(!p.valid){showToast(tr('Importo non riconosciuto in questa notifica'));return;}
  var ok=registerParsedNotification(p);
  saveState();
  if(!it.native)deleteInboxItem(itemId);
  sync.pendingInbox=sync.pendingInbox.filter(function(x){return x.id!==itemId;});
  showToast(ok?tr('Movimento registrato'):tr('Movimento già registrato'));
  renderActiveTab();
}
/* "Modifica": apre il normale foglio di inserimento gia' compilato con quello
   che si e' capito dalla notifica. Cosi' si possono correggere importo,
   categoria, conto, data, esercente e nota prima di salvare. La notifica
   sparisce dalla lista solo quando il movimento viene davvero salvato. */
function editInboxItem(itemId){
  var it=sync.pendingInbox.find(function(x){return x.id===itemId;});
  if(!it)return;
  var p=parseNotification(it);
  if(!p.valid){showToast(tr('Importo non riconosciuto in questa notifica'));return;}
  openEntrySheet({
    prefill:{
      mode:p.type,amount:p.amount,accountId:p.accountId||defaultAccountId(),
      categoryId:p.categoryId,merchant:p.merchant||'',note:p.note||'',date:todayISO()
    },
    onSave:function(){
      if(!it.native)deleteInboxItem(itemId);
      sync.pendingInbox=sync.pendingInbox.filter(function(x){return x.id!==itemId;});
    }
  });
}
function ignoreInboxItem(itemId){
  var it=sync.pendingInbox.find(function(x){return x.id===itemId;});
  if(it&&!it.native)deleteInboxItem(itemId);
  sync.pendingInbox=sync.pendingInbox.filter(function(x){return x.id!==itemId;});
  renderActiveTab();
}

/* ---- Ponte nativo (app Android via Capacitor) ----
   Quando l'app gira dentro il contenitore nativo Android, il plugin
   SpeseNotifiche legge le notifiche direttamente sul dispositivo e le
   consegna qui direttamente. Le notifiche
   senza un importo riconoscibile vengono scartate in silenzio (il
   listener nativo riceve le notifiche di tutte le app, non solo la
   banca, quindi mostrare quelle non valide creerebbe solo rumore). */
function handleNativeNotification(data){
  var item={id:uid('nat'),title:(data&&data.title)||'',text:(data&&data.text)||'',native:true};
  var p=parseNotification(item);
  if(!p.valid)return;
  if(state.autoRegister){
    if(registerParsedNotification(p)){
      saveState();
      showToast(tr('Registrato dalla notifica:')+' '+fmt(p.amount));
    }
  }else{
    sync.pendingInbox.push(item);
  }
  renderActiveTab();
}
function initNativeNotificationBridge(){
  try{
    if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SpeseNotifiche){
      window.Capacitor.Plugins.SpeseNotifiche.addListener('bancaNotifica',function(data){
        try{handleNativeNotification(data);}catch(e){console.error('Errore notifica nativa',e);}
      });
      return true;
    }
  }catch(e){}
  return false;
}
function inboxEndpointURL(){
  var cfg=loadSyncConfig();
  if(!cfg||!cfg.firebaseConfig||!state.inboxToken)return '';
  return 'https://firestore.googleapis.com/v1/projects/'+cfg.firebaseConfig.projectId+'/databases/(default)/documents/inbox/'+state.inboxToken+'/items';
}

async function initSyncFromSavedConfig(){
  var cfg=loadSyncConfig();
  if(!cfg||!cfg.firebaseConfig){sync.status='unconfigured';return;}
  sync.status='configured';
  try{
    await loadFirebaseSDK();
    sync.firebaseApp=firebase.apps.length?firebase.apps[0]:firebase.initializeApp(cfg.firebaseConfig);
    sync.auth=firebase.auth();
    sync.db=firebase.firestore();
    /* Se si è appena tornati dalla pagina di accesso Google (redirect),
       qui si raccoglie il risultato; poi ci pensa onAuthStateChanged. */
    try{
      var rr=await sync.auth.getRedirectResult();
      if(rr&&rr.user){saveSyncConfig({firebaseConfig:cfg.firebaseConfig,email:rr.user.email});}
    }catch(e){
      if(e&&e.code)console.error('Redirect Google',e.code);
    }
    try{await sync.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(e){}
    if(!sync.authWired){
      sync.authWired=true;
      sync.auth.onAuthStateChanged(function(user){
        if(user){startSync(user.uid,user.email);return;}
        /* Nessun utente da Firebase. Se pero' la nostra sessione e' ancora
           valida (tipico quando si va in aereo e Firebase non riesce a
           rinnovare il token), NON si esce dall'account: si resta connessi
           "offline" e si continua a lavorare sui dati locali. */
        var sess=loadSession();
        if(sess&&sess.uid){
          sync.uid=sess.uid;sync.email=sess.email;
          if(activeUid!==sess.uid)switchUserState(sess.uid).then(renderActiveTab);
          sync.offlineSession=true;
          sync.status='connected';
          renderActiveTab();
          return;
        }
        sync.status='configured';sync.offlineSession=false;renderActiveTab();
      });
    }
  }catch(e){
    /* Se siamo semplicemente offline (o gstatic non raggiungibile) non è un
       errore di configurazione: si resta "configurata ma non connessa" e al
       prossimo tentativo l'SDK viene ricaricato. Se però c'era una sessione
       valida, si continua a lavorare offline dentro l'account. */
    var sessOff=loadSession();
    if(sessOff&&sessOff.uid){
      sync.uid=sessOff.uid;sync.email=sessOff.email;
      if(activeUid!==sessOff.uid)await switchUserState(sessOff.uid);
      sync.offlineSession=true;sync.status='connected';
    }else if(!isOnline()){
      sync.status='configured';
    }else{
      sync.status='error';sync.errorMsg='Impossibile inizializzare Firebase. Riprova tra poco.';
    }
    renderActiveTab();
  }
}

/* Accesso con l'account Google (deve essere attivo il provider Google
   in Firebase → Authentication → Sign-in method, e il dominio dell'app
   deve essere fra i "domini autorizzati"). Prova prima la finestra pop-up;
   se il browser la blocca (tipico dentro una PWA su iPhone) passa al
   redirect: si esce dall'app, si sceglie l'account, si rientra. */
async function connectSyncWithGoogle(firebaseConfig){
  sync.status='connecting';renderActiveTab();
  try{
    await loadFirebaseSDK();
    sync.firebaseApp=firebase.apps.length?firebase.apps[0]:firebase.initializeApp(firebaseConfig);
    sync.auth=firebase.auth();
    sync.db=firebase.firestore();
    saveSyncConfig({firebaseConfig:firebaseConfig,email:(loadSyncConfig()||{}).email||null});
    try{await sync.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(ep){}
    /* App Android/iOS: dentro l'app il metodo web di Google viene bloccato.
       Usiamo il login NATIVO del plugin, che ci ridà solo la credenziale
       (idToken); poi Firebase JS entra con signInWithCredential, così la
       sessione e la sincronizzazione restano identiche. Sul web questo blocco
       viene saltato (NativeBridge.isNative()===false) e si usa il pop-up. */
    if(window.NativeBridge&&NativeBridge.isNative()){
      try{
        var gnat=await NativeBridge.signInWithGoogle();
        if(gnat&&gnat.idToken){
          var gcred=firebase.auth.GoogleAuthProvider.credential(gnat.idToken,gnat.accessToken||null);
          var gout=await sync.auth.signInWithCredential(gcred);
          saveSyncConfig({firebaseConfig:firebaseConfig,email:gout.user.email});
          await startSync(gout.user.uid,gout.user.email);
          return {ok:true};
        }
        /* gnat null = plugin non presente in questa build: si prosegue col web */
      }catch(enat){
        sync.status='configured';renderActiveTab();
        var cn=enat&&enat.code;
        if(cn==='auth/cancelled'||(enat&&/cancel|annull/i.test(enat.message||'')))return {ok:false,error:'Accesso annullato.'};
        return {ok:false,error:(enat&&enat.message)?tr('Accesso con Google non riuscito: ')+enat.message:'Accesso con Google non riuscito.'};
      }
    }
    var provider=new firebase.auth.GoogleAuthProvider();
    /* Chiede sempre quale account Google usare: senza questo, dopo una
       disconnessione si rientrerebbe in automatico sempre con lo stesso. */
    provider.setCustomParameters({prompt:'select_account'});
    try{await sync.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(e0){}
    try{
      var cred=await sync.auth.signInWithPopup(provider);
      saveSyncConfig({firebaseConfig:firebaseConfig,email:cred.user.email});
      await startSync(cred.user.uid,cred.user.email);
      return {ok:true};
    }catch(e1){
      var c=e1&&e1.code;
      if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request'){
        sync.status='configured';renderActiveTab();
        return {ok:false,error:'Accesso annullato.'};
      }
      if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'||c==='auth/web-storage-unsupported'){
        await sync.auth.signInWithRedirect(provider);
        return {ok:true,redirect:true};
      }
      throw e1;
    }
  }catch(e){
    sync.status='configured';renderActiveTab();
    var msg='Accesso con Google non riuscito.';
    if(e&&e.code==='auth/unauthorized-domain')msg='Dominio non autorizzato: aggiungi l\'indirizzo dell\'app in Firebase → Authentication → Impostazioni → Domini autorizzati.';
    else if(e&&e.code==='auth/operation-not-allowed')msg='Il provider Google non è attivo: abilitalo in Firebase → Authentication → Sign-in method.';
    else if(e&&e.code==='auth/network-request-failed')msg=tr('Connessione di rete non disponibile.');
    else if(e&&e.message)msg=tr('Accesso con Google non riuscito: ')+e.message;
    return {ok:false,error:msg};
  }
}

/* Accesso con Apple (nativo). Come per Google: il plugin fa accedere e ci
   ridà la credenziale, poi Firebase JS entra con signInWithCredential.
   NB: funziona solo su iPhone con app FIRMATA e provider "apple.com" attivo
   in Firebase (serve un account Apple Developer a pagamento). Finché il flag
   APPLE_LOGIN_ENABLED è false, questo percorso non viene nemmeno mostrato. */
async function connectSyncWithApple(firebaseConfig){
  sync.status='connecting';renderActiveTab();
  try{
    await loadFirebaseSDK();
    sync.firebaseApp=firebase.apps.length?firebase.apps[0]:firebase.initializeApp(firebaseConfig);
    sync.auth=firebase.auth();
    sync.db=firebase.firestore();
    saveSyncConfig({firebaseConfig:firebaseConfig,email:(loadSyncConfig()||{}).email||null});
    try{await sync.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(ep){}
    if(window.NativeBridge&&NativeBridge.isNative()){
      var anat=await NativeBridge.signInWithApple();
      if(anat&&anat.idToken){
        var aprov=new firebase.auth.OAuthProvider('apple.com');
        var acred=aprov.credential({idToken:anat.idToken,rawNonce:anat.nonce||undefined});
        var aout=await sync.auth.signInWithCredential(acred);
        saveSyncConfig({firebaseConfig:firebaseConfig,email:aout.user.email||null});
        await startSync(aout.user.uid,aout.user.email||null);
        return {ok:true};
      }
    }
    sync.status='configured';renderActiveTab();
    return {ok:false,error:'Login con Apple non ancora disponibile su questo dispositivo.'};
  }catch(e){
    sync.status='configured';renderActiveTab();
    var cc=e&&e.code;
    if(cc==='auth/cancelled'||(e&&/cancel|annull/i.test(e.message||'')))return {ok:false,error:'Accesso annullato.'};
    if(cc==='auth/operation-not-allowed')return {ok:false,error:'Il provider Apple non è attivo: abilitalo in Firebase → Authentication → Sign-in method.'};
    return {ok:false,error:(e&&e.message)?'Accesso con Apple non riuscito: '+e.message:'Accesso con Apple non riuscito.'};
  }
}

async function connectSyncWithCredentials(firebaseConfig,email,password,mode){
  sync.status='connecting';renderActiveTab();
  try{
    await loadFirebaseSDK();
    sync.firebaseApp=firebase.apps.length?firebase.apps[0]:firebase.initializeApp(firebaseConfig);
    sync.auth=firebase.auth();
    sync.db=firebase.firestore();
    try{await sync.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(e0){}
    var cred;
    if(mode==='signup')cred=await sync.auth.createUserWithEmailAndPassword(email,password);
    else cred=await sync.auth.signInWithEmailAndPassword(email,password);
    saveSyncConfig({firebaseConfig:firebaseConfig,email:email});
    await startSync(cred.user.uid,cred.user.email);
    return {ok:true};
  }catch(e){
    sync.status='configured';renderActiveTab();
    var msg='Errore di connessione.';
    if(e&&e.code){
      if(e.code==='auth/email-already-in-use')msg=tr('Questa email è già registrata: prova ad accedere invece di creare un account.');
      else if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')msg=tr('Password errata.');
      else if(e.code==='auth/user-not-found')msg=tr('Nessun account con questa email: crealo prima dal primo dispositivo.');
      else if(e.code==='auth/weak-password')msg=tr('Password troppo corta (minimo 6 caratteri).');
      else if(e.code==='auth/invalid-email')msg=tr('Email non valida.');
      else if(e.code==='auth/network-request-failed')msg=tr('Connessione di rete non disponibile.');
    }
    return {ok:false,error:msg};
  }
}

/* Invia l'email per reimpostare la password a chi ha dimenticato le credenziali.
   Non serve essere già connessi: inizializza Firebase con la config e chiede
   a Firebase Auth di spedire il link di reset all'indirizzo indicato. */
async function sendPasswordReset(firebaseConfig,email){
  try{
    await loadFirebaseSDK();
    sync.firebaseApp=firebase.apps.length?firebase.apps[0]:firebase.initializeApp(firebaseConfig);
    sync.auth=firebase.auth();
    await sync.auth.sendPasswordResetEmail(email);
    return {ok:true};
  }catch(e){
    var msg=tr('Non è stato possibile inviare l\'email. Riprova.');
    if(e&&e.code){
      if(e.code==='auth/invalid-email')msg=tr('Email non valida.');
      else if(e.code==='auth/user-not-found')msg=tr('Nessun account registrato con questa email.');
      else if(e.code==='auth/network-request-failed')msg=tr('Connessione di rete non disponibile.');
      else if(e.code==='auth/too-many-requests')msg=tr('Troppi tentativi: attendi qualche minuto e riprova.');
    }
    return {ok:false,error:msg};
  }
}

/* ================================================================
   HELPERS
================================================================ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function catById(id){return state.categories.find(function(c){return c.id===id;})||state.categories[state.categories.length-1];}
function accById(id){return state.accounts.find(function(a){return a.id===id;})||state.accounts[0];}
function tagById(id){return state.tags.find(function(t){return t.id===id;});}
function colorHex(i){return (isDarkTheme()?COLORS_DARK:COLORS_LIGHT)[((i%8)+8)%8];}
function tagBg(i){return (isDarkTheme()?TAG_BG_DARK:TAG_BG_LIGHT)[((i%8)+8)%8];}
function tagFg(i){return (isDarkTheme()?TAG_FG_DARK:TAG_FG_LIGHT)[((i%8)+8)%8];}
function catsByType(type){return state.categories.filter(function(c){return c.type===type;});}

function fmt(n){return new Intl.NumberFormat(currentLocale(),{style:'currency',currency:'EUR'}).format(n||0);}
/* Come fmt(), ma se l'utente ha attivato l'occhio "nascondi saldi" mostra
   dei pallini al posto della cifra. Usato SOLO per i saldi dei conti e per

function parseAmount(raw){

  var s=String(raw).trim();if(!s)return NaN;

  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  s=s.replace(/[€$\s]/g,'');
  if(s[0]==='-'){neg=true;s=s.slice(1);}else if(s[0]==='+')s=s.slice(1);
  var lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>-1&&ld>-1){if(lc>ld)s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');}
  else if(lc>-1){if(s.length-lc-1===3&&s.indexOf(',')===lc)s=s.replace(',','');else s=s.replace(',','.');}
  else if(ld>-1){if(s.length-ld-1===3&&s.indexOf('.')===ld)s=s.replace('.','')}

}

   Ogni banca scrive le date a modo suo: 28/06/2026, 2026-06-28,
   28.06.26, "28 giu 2026", "Jun 28, 2026", 20260628, e i fogli Excel
   a volte le lasciano come numero (46200). Qui si prova tutto, e la
   scelta fra giorno/mese e mese/giorno NON si fa riga per riga ma

var MONTH_W4={juin:6,juil:7,genn:1,febb:2,marz:3,marc:3,mars:3,apri:4,magg:5,giug:6,lugl:7,agos:8,aout:8,sett:9,sept:9,otto:10,octo:10,nove:11,dice:12,dece:12,janv:1,janu:1,juli:7,june:6,july:7,ener:1,abri:4,mayo:5,juni:6,agost:8,dici:12};
var MONTH_W3={gen:1,jan:1,ene:1,feb:2,fev:2,mar:3,apr:4,abr:4,avr:4,mag:5,may:5,mai:5,giu:6,jun:6,lug:7,jul:7,ago:8,aug:8,aou:8,set:9,sep:9,ott:10,oct:10,nov:11,dic:12,dec:12};
function deAccent(s){
  return String(s||'').toLowerCase()
    .replace(/[àáâä]/g,'a').replace(/[èéêë]/g,'e').replace(/[ìíîï]/g,'i')
    .replace(/[òóôö]/g,'o').replace(/[ùúûü]/g,'u').replace(/ç/g,'c');
}
function monthFromWord(w){
  w=deAccent(w).replace(/\./g,'');
  if(w.length>=4&&MONTH_W4[w.slice(0,4)])return MONTH_W4[w.slice(0,4)];
  if(w.length>=3&&MONTH_W3[w.slice(0,3)])return MONTH_W3[w.slice(0,3)];
  return 0;
}
function daysInMonth(y,m){return new Date(y,m,0).getDate();}
function fixYear(y){y=+y;if(y<100)return y<70?2000+y:1900+y;return y;}
/* Costruisce la data solo se esiste davvero: cosi' il 31 febbraio viene
   scartato invece di diventare 3 marzo. */
function buildISO(y,m,d){
  y=+y;m=+m;d=+d;
  if(!(y>=1970&&y<=2100))return null;
  if(!(m>=1&&m<=12))return null;
  if(!(d>=1&&d<=daysInMonth(y,m)))return null;
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
/* order: 'dmy' (europeo, predefinito) oppure 'mdy' (americano). Vale solo
   quando i numeri da soli non bastano a capirlo. */
function parseDateFlexible(str,order){
  if(str==null)return null;
  var s=String(str).trim();
  if(!s)return null;
  var m;
  /* 2026-06-28 / 2026.06.28 / 2026/06/28 */
  m=s.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m){var r=buildISO(m[1],m[2],m[3]);if(r)return r;}
  /* 28/06/2026, 6-28-26, 28.06.26 */
  m=s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  if(m){
    var a=+m[1],b=+m[2],y=fixYear(m[3]),d,mo;
    if(a>12&&b<=12){d=a;mo=b;}
    else if(b>12&&a<=12){d=b;mo=a;}
    else if(order==='mdy'){mo=a;d=b;}
    else{d=a;mo=b;}
    var r2=buildISO(y,mo,d);
    if(r2)return r2;
    r2=buildISO(y,d,mo);   // ultimo tentativo con i ruoli scambiati
    if(r2)return r2;
  }
  /* 28 giu 2026 · 28-GIU-26 · 28 giugno */
  m=s.match(/(\d{1,2})[\s.\-\/]+([A-Za-zÀ-ÿ]{3,12})\.?(?:[\s.\-\/,]+(\d{2,4}))?/);
  if(m){
    var mw=monthFromWord(m[2]);
    if(mw){
      var yy=m[3]?fixYear(m[3]):new Date().getFullYear();
      var r3=buildISO(yy,mw,m[1]);
      if(r3)return r3;
    }
  }
  /* Jun 28, 2026 · giugno 28 2026 */
  m=s.match(/([A-Za-zÀ-ÿ]{3,12})\.?[\s.\-\/]+(\d{1,2})(?:[\s.\-\/,]+(\d{2,4}))?/);
  if(m){
    var mw2=monthFromWord(m[1]);
    if(mw2){
      var yy2=m[3]?fixYear(m[3]):new Date().getFullYear();
      var r4=buildISO(yy2,mw2,m[2]);
      if(r4)return r4;
    }
  }
  /* 20260628 oppure 28062026 */
  m=s.match(/(?:^|\D)(\d{8})(?:\D|$)/);
  if(m){
    var c=m[1];
    var r5=buildISO(c.slice(0,4),c.slice(4,6),c.slice(6,8));
    if(r5)return r5;
    r5=buildISO(c.slice(4,8),c.slice(2,4),c.slice(0,2));
    if(r5)return r5;
  }
  return null;
}
/* Numero puro tipico di Excel (46200 = 28/06/2026). Si accetta solo in una
   colonna dove quasi tutti i valori sono numeri in quell'intervallo, per non
   scambiare un importo per una data. */
function serialLooksLikeDate(v){
  var s=String(v==null?'':v).trim();
  if(!/^\d{5}(?:[.,]\d+)?$/.test(s))return false;
  var n=parseFloat(s.replace(',','.'));
  return n>=25569&&n<=54789;   // dal 1970 al 2050
}
/* Guarda TUTTA la colonna prima di decidere l'ordine giorno/mese. */
function detectDateOrder(values){
  var dmy=0,mdy=0;
  values.forEach(function(v){
    var m=String(v==null?'':v).match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
    if(!m)return;
    var a=+m[1],b=+m[2];
    if(a>12&&b<=12)dmy++;
    else if(b>12&&a<=12)mdy++;
  });
  return mdy>dmy?'mdy':'dmy';
}
/* Legge un'intera colonna di date e dice quante ne ha capite.
   Restituisce {dates:[...], ok:n, total:n, order:'dmy'|'mdy', serial:bool} */
function readDateColumn(rows,start,col){
  var vals=[];
  for(var i=start;i<rows.length;i++)vals.push((rows[i]||[])[col]);
  var filled=vals.filter(function(v){return String(v==null?'':v).trim()!=='';}).length;
  var order=detectDateOrder(vals);
  var dates=vals.map(function(v){return parseDateFlexible(v,order);});
  var ok=dates.filter(Boolean).length;
  /* Se il testo non ha funzionato, forse sono numeri seriali di Excel. */
  var serialCount=vals.filter(serialLooksLikeDate).length;
  var serial=false;
  if(serialCount>ok&&serialCount>=Math.max(1,filled*0.6)){
    dates=vals.map(function(v){return serialLooksLikeDate(v)?excelSerialToISO(parseFloat(String(v).replace(',','.'))):null;});
    ok=dates.filter(Boolean).length;
    serial=true;
  }
  return{dates:dates,ok:ok,total:filled,order:order,serial:serial};
}
function splitCSV(line,d){var out=[],cur='',inQ=false;for(var i=0;i<line.length;i++){var c=line[i];if(inQ){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++;}else inQ=false;}else cur+=c;}else{if(c==='"')inQ=true;else if(c===d){out.push(cur);cur='';}else cur+=c;}}out.push(cur);return out.map(function(s){return s.trim();});}

function guessColMap(headers){var lo=headers.map(function(h){return h.toLowerCase();});function fi(kw){for(var i=0;i<lo.length;i++)if(kw.some(function(k){return lo[i].indexOf(k)>-1}))return i;return -1;}return{date:fi(['data','date']),description:fi(['descrizione','causale','description','memo','dettag']),amount:fi(['importo','amount','valore'])};}
/* Riconoscimento automatico della categoria da una descrizione.
   Ordine: 1) IMPARA dai movimenti che l'utente ha già categorizzato
   (se una descrizione simile esiste, usa la stessa categoria); 2) dizionario
   di parole chiave; 3) categoria "Altro". Restituisce sempre un ID che
   esiste davvero fra le categorie del tipo giusto. */
function normDesc(s){return String(s||'').toLowerCase().replace(/[0-9]+/g,' ').replace(/[^a-zàèéìòù ]+/g,' ').replace(/\s+/g,' ').trim();}
function descTokens(s){return normDesc(s).split(' ').filter(function(w){return w.length>=4;});}
/* ---------- RICONOSCIMENTO DELL'ESERCENTE ----------
   Gli estratti conto scrivono la stessa insegna in mille modi diversi:
   "PAGAMENTO CARTA ESSELUNGA MILANO 12/06", "Esselunga Spa ore 18:22",
   "POS ESSELUNGA 4412". merchantKey() toglie numeri e parole di servizio e
   tiene le prime parole significative: le righe dello stesso negozio
   finiscono cosi' sotto la stessa chiave e si possono categorizzare insieme. */
var MERCHANT_NOISE=['pagamento','pagamenti','pagam','pago','pagata','pagato','carta','carte','credito','debito','con','del','della','dello','dei','delle','per','presso','acquisto','acquisti','addebito','accredito','bonifico','bancomat','pos','operazione','operazioni','data','ora','ore','importo','euro','eur','transazione','contactless','disposizione','ordine','ordinante','beneficiario','causale','sepa','ricevuta','estero','italia','italy','www','http','https','com','srl','spa','snc','sas','ltd','inc','the','and','saldo','commissione','commissioni','servizio','divisa','valuta','cambio','riferimento','numero','conto','banca','instant','mandato','avere','dare','rimborso','storno','stornato','reso','rettifica','annullo','prelievo','versamento','ricarica','online','store','shop','mobile','app'];
function merchantKey(desc){
  var toks=normDesc(desc).split(' ').filter(function(w){
    return w.length>=3&&MERCHANT_NOISE.indexOf(w)===-1;
  });
  if(!toks.length)return '';
  /* Una parola lunga basta e avanza a identificare l'insegna (ESSELUNGA,
     NETFLIX, TRENITALIA): cosi' "ESSELUNGA MILANO" e "ESSELUNGA 4412" restano
     lo stesso negozio. Servono invece DUE parole quando la prima e' cortissima
     (BAR, ENI: da sola accorperebbe negozi diversi) e nei bonifici, dove la
     controparte e' una persona e il solo nome di battesimo non basta. */
  var two=toks[0].length<4||/bonific|giroconto|beneficiar|ordinant/.test(normDesc(desc));
  return two?toks.slice(0,2).join(' '):toks[0];
}
function merchantLabel(desc){
  var k=merchantKey(desc);
  if(!k)return '';
  return k.replace(/(^|\s)([a-zàèéìòù])/g,function(m,a,b){return a+b.toUpperCase();});
}
/* Regola imparata a mano: "questo esercente va in questa categoria".
   Vale piu' di qualsiasi indovinello automatico. */
function ruleKey(desc,type){
  var k=merchantKey(desc);
  return k?(type+'|'+k):'';
}
function ruleCat(desc,type){
  if(!state.merchantRules)return null;
  var rk=ruleKey(desc,type);
  if(!rk)return null;
  var id=state.merchantRules[rk];
  if(id&&state.categories.some(function(c){return c.id===id&&c.type===type;}))return id;
  return null;
}
function setMerchantRule(desc,type,catId){
  var rk=ruleKey(desc,type);
  if(!rk||!catId)return;
  if(!state.merchantRules)state.merchantRules={};
  state.merchantRules[rk]=catId;
}
function fallbackCatId(type){
  var altId=type==='income'?'altro_entrata':'altro';
  if(state.categories.some(function(c){return c.id===altId;}))return altId;
  var any=state.categories.filter(function(c){return c.type===type;});
  return any.length?any[any.length-1].id:altId;
}
function learnedCat(desc,type){
  var toks=descTokens(desc);
  if(!toks.length)return null;
  var score={};
  state.transactions.forEach(function(t){
    if(t.type!==type||!t.categoryId)return;
    var text=normDesc((t.merchant||'')+' '+(t.note||''));
    if(!text)return;
    var hit=0;
    for(var i=0;i<toks.length;i++)if(text.indexOf(toks[i])>-1)hit++;
    if(hit)score[t.categoryId]=(score[t.categoryId]||0)+hit;
  });
  var best=null,bestV=0;
  for(var id in score)if(score[id]>bestV){bestV=score[id];best=id;}
  if(best&&state.categories.some(function(c){return c.id===best&&c.type===type;}))return best;
  return null;
}
function guessCat(desc,type){
  var ruled=ruleCat(desc,type);
  if(ruled)return ruled;
  var learned=learnedCat(desc,type);
  if(learned)return learned;
  var d=(desc||'').toLowerCase();
  var map=type==='income'?INCOME_KW:EXPENSE_KW;
  for(var cat in map){
    if(!state.categories.some(function(c){return c.id===cat&&c.type===type;}))continue;
    var ws=map[cat];
    for(var i=0;i<ws.length;i++)if(d.indexOf(ws[i])>-1)return cat;
  }
  return fallbackCatId(type);
}

function combinedEntries(monthKey,accFilter,catFilter,typeFilter,tagFilter){

      if((t.merchant||'').toLowerCase().indexOf(q)>-1)return true;
      if(cat.name.toLowerCase().indexOf(q)>-1)return true;
      if(acc.name.toLowerCase().indexOf(q)>-1)return true;
      if(t.amount.toFixed(2).replace('.',',').indexOf(q)>-1)return true;
      if(t.tags){for(var i=0;i<t.tags.length;i++){var tg=tagById(t.tags[i]);if(tg&&tg.name.toLowerCase().indexOf(q)>-1)return true;}}
      return false;
    }else{
      var tr=entry.data,fa=accById(tr.fromAccountId),ta=accById(tr.toAccountId);
      if((tr.note||'').toLowerCase().indexOf(q)>-1)return true;
      if(fa.name.toLowerCase().indexOf(q)>-1)return true;
      if(ta.name.toLowerCase().indexOf(q)>-1)return true;
      if(tr.amount.toFixed(2).replace('.',',').indexOf(q)>-1)return true;
      if(tr.tags){for(var i=0;i<tr.tags.length;i++){var tg=tagById(tr.tags[i]);if(tg&&tg.name.toLowerCase().indexOf(q)>-1)return true;}}
      return false;
    }
  });
}

var toastTimer=null;
function showToast(msg){var r=document.getElementById('toast-root');r.textContent=msg;r.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){r.classList.remove('show');},2200);}
function openModal(html){var r=document.getElementById('modal-root');r.innerHTML='<div class="modal-backdrop" id="modalBackdrop"></div><div class="sheet-wrap">'+html+'</div>';r.classList.add('open');syncBackHistory();}
function openCenteredModal(html){var r=document.getElementById('modal-root');r.innerHTML='<div class="modal-backdrop" id="modalBackdrop"></div><div class="confirm-wrap">'+html+'</div>';r.classList.add('open');syncBackHistory();}
function closeModal(){var r=document.getElementById('modal-root');r.classList.remove('open');r.innerHTML='';syncBackHistory();}
/* Chiedere conferma non deve distruggere quello che c'e' sotto: se un foglio
   e' gia' aperto (per esempio i Conti), il dialogo si appoggia SOPRA come
   strato separato e alla chiusura si toglie solo lui. */
function confirmDialog(msg,onOk,okLabel){
  var root=document.getElementById('modal-root');
  var box='<div class="confirm-box"><p>'+esc(msg)+'</p><div class="confirm-actions"><button class="btn-secondary" id="confCancel">'+tr('Annulla')+'</button><button class="btn-danger" id="confOk">'+esc(okLabel||tr('Conferma'))+'</button></div></div>';
  var stacked=root&&root.classList.contains('open');
  var chiudi;
  if(stacked){
    root.insertAdjacentHTML('beforeend','<div class="confirm-layer" id="confirmLayer"><div class="modal-backdrop"></div><div class="confirm-wrap">'+box+'</div></div>');
    chiudi=closeConfirmLayer;
  }else{
    openCenteredModal(box);
    chiudi=closeModal;
  }
  document.getElementById('confCancel').onclick=chiudi;
  document.getElementById('confOk').onclick=function(){chiudi();onOk();};
  var bd=stacked?document.querySelector('#confirmLayer .modal-backdrop'):document.getElementById('modalBackdrop');
  if(bd)bd.onclick=chiudi;
  syncBackHistory();
}
/* Ridisegna il contenuto di un foglio MANTENENDO il punto in cui si stava
   guardando. Senza questo, ogni tocco su un pulsante interno riportava la
   pagina in cima: e' il "refresh di tutta la pagina" che si notava nei menu'. */
function rerenderSheetWrap(html){
  var w=document.querySelector('#modal-root .sheet-wrap');
  if(!w)return null;
  var old=w.querySelector('.sheet');
  var y=old?old.scrollTop:0;
  w.innerHTML=html;
  var nu=w.querySelector('.sheet');
  if(nu&&y)nu.scrollTop=y;
  return w;
}
function closeConfirmLayer(){
  var l=document.getElementById('confirmLayer');
  if(l&&l.parentNode)l.parentNode.removeChild(l);
  syncBackHistory();
}

var TAB_ORDER=['home','history','recurring','profile'];
function renderActiveTab(dir){
  var c=document.getElementById('content');
  // Se stiamo solo ridisegnando la stessa scheda (es. cambio mese, modifica di
  // un movimento) manteniamo la posizione di scorrimento invece di tornare in
  // cima. Azzeriamo lo scroll solo quando si cambia scheda o si scorre lateralmente.
  var prevScroll=c?c.scrollTop:0;
  var isSwipe=(dir==='left'||dir==='right');
  var sameTab=(ui._renderedTab===ui.activeTab);
  if(ui.activeTab==='home'){c.innerHTML=homeHTML();wireHome();}
  else if(ui.activeTab==='history'){c.innerHTML=historyHTML();wireHistory();}
  else if(ui.activeTab==='recurring'){c.innerHTML=recurringHTML();wireRecurring();}
  else if(ui.activeTab==='profile'){c.innerHTML=profileTabHTML();wireProfileTab();}
  else{ui.activeTab='home';c.innerHTML=homeHTML();wireHome();}
  if(dir==='left'||dir==='right'){
    var v=c.querySelector('.view');
    if(v)v.classList.add(dir==='left'?'enter-left':'enter-right');
  }
  if(sameTab&&!isSwipe)c.scrollTop=prevScroll; else c.scrollTop=0;
  ui._renderedTab=ui.activeTab;
  syncBackHistory();
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.toggle('active',b.dataset.tab===ui.activeTab);});
  var appEl=document.getElementById('app');
  if(appEl&&appEl.getAttribute('data-amb')!==ui.activeTab)appEl.setAttribute('data-amb',ui.activeTab);
}

   Si apre toccando il grafico. Ogni fetta e ogni riga si possono toccare:
   quella scelta si illumina, le altre si spengono, e al centro compaiono

function bdDonutSVG(bd,selId){
  var sz=200,sw=34,r=(sz-sw)/2,ci=2*Math.PI*r,cx=sz/2,cy=sz/2;
  if(!bd.length)return '<svg viewBox="0 0 '+sz+' '+sz+'" class="bd-donut"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+sw+'"/></svg>';
  var off=0,circles='',gapPx=bd.length>1?3:0;
  bd.forEach(function(b){
    var cat=catById(b.catId),full=(b.pct/100)*ci,len=Math.max(full-gapPx,1);
    var dim=(selId&&b.catId!==selId)?' class="dim"':'';
    var w=(selId&&b.catId===selId)?(sw+6):sw;
    circles+='<circle'+dim+' data-slice="'+esc(b.catId)+'" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colorHex(cat.color)+'" stroke-width="'+w+'" stroke-dasharray="'+len.toFixed(2)+' '+(ci-len).toFixed(2)+'" stroke-dashoffset="'+(-(off+gapPx/2)).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')" stroke-linecap="butt"/>';
    off+=full;
  });
  return '<svg viewBox="0 0 '+sz+' '+sz+'" class="bd-donut">'+circles+'</svg>';
}
function openBreakdownSheet(bd,titolo){
  var sel=null;
  bd=(bd||[]).slice();
  var tot=bd.reduce(function(a,b){return a+b.total;},0);
  function centerHTML(){
    if(!sel){
      return '<div class="bd-center"><div class="bd-center-name">'+(ui.breakdownType==='income'?tr('Totale entrate'):tr('Totale spese'))+'</div>'+
        '<div class="bd-center-val">'+fmt(tot)+'</div>'+
        '<div class="bd-center-pct">'+bd.length+' '+tr('categorie')+'</div></div>';
    }
    var b=bd.find(function(x){return x.catId===sel;});
    if(!b)return '';
    var c=catById(b.catId);
    return '<div class="bd-center"><div class="bd-center-emoji">'+esc(c.emoji)+'</div>'+
      '<div class="bd-center-name">'+esc(c.name)+'</div>'+
      '<div class="bd-center-val">'+fmt(b.total)+'</div>'+
      '<div class="bd-center-pct">'+b.pct.toFixed(1).replace('.',',')+'%</div></div>';
  }
  function listHTML(){
    if(!bd.length)return '<p class="empty-note">'+tr('Nessun movimento.')+'</p>';
    return '<ul class="bd-list">'+bd.map(function(b){
      var c=catById(b.catId);
      return '<li><button class="bd-row'+(sel===b.catId?' on':'')+'" data-slice="'+esc(b.catId)+'">'+
        '<span class="dot" style="background:'+colorHex(c.color)+'"></span>'+
        '<span class="bd-name">'+esc(c.emoji)+' '+esc(c.name)+'</span>'+
        '<span class="bd-amt">'+fmt(b.total)+'</span>'+
        '<span class="bd-pct">'+b.pct.toFixed(1).replace('.',',')+'%</span></button></li>';
    }).join('')+'</ul>';
  }
  function sheetHTML(){
    return '<div class="sheet">'+
      '<div class="sheet-handle"></div>'+
      '<h3 style="margin:4px 0 0;">'+esc(titolo||tr('Dove vanno i tuoi soldi'))+'</h3>'+
      '<p class="hint" style="margin:0;">'+tr('Tocca una fetta o una voce per vederne i dettagli.')+'</p>'+
      '<div class="bd-donut-wrap" id="bdWrap">'+bdDonutSVG(bd,sel)+centerHTML()+'</div>'+
      '<div class="card" style="padding:4px 12px;" id="bdList">'+listHTML()+'</div>'+
      '<button class="btn-secondary full-width" id="bdClose">'+tr('Chiudi')+'</button>'+
    '</div>';
  }
  /* Selezionare una fetta ridisegna solo grafico ed elenco, non il foglio. */
  function scegli(id){
    sel=(sel===id)?null:id;
    var w=document.getElementById('bdWrap');
    if(w)w.innerHTML=bdDonutSVG(bd,sel)+centerHTML();
    var l=document.getElementById('bdList');
    if(l)l.innerHTML=listHTML();
    wire();
  }
  function wire(){
    document.querySelectorAll('#modal-root [data-slice]').forEach(function(el){
      el.onclick=function(){scegli(el.dataset.slice);};
    });
    var cl=document.getElementById('bdClose');if(cl)cl.onclick=closeModal;
    var bdrop=document.getElementById('modalBackdrop');if(bdrop)bdrop.onclick=closeModal;
  }
  openModal(sheetHTML());
  wire();
}

function donutSVG(bd){
  var sz=110,sw=18,r=(sz-sw)/2,ci=2*Math.PI*r,cx=sz/2,cy=sz/2;
  if(!bd.length)return '<svg viewBox="0 0 '+sz+' '+sz+'" class="donut"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+sw+'"/></svg>';
  var off=0,circles='',gapPx=bd.length>1?2.4:0;
  bd.forEach(function(b){var cat=catById(b.catId),full=(b.pct/100)*ci,len=Math.max(full-gapPx,0.8);circles+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colorHex(cat.color)+'" stroke-width="'+sw+'" stroke-dasharray="'+len.toFixed(2)+' '+(ci-len).toFixed(2)+'" stroke-dashoffset="'+(-(off+gapPx/2)).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')" stroke-linecap="butt"/>';off+=full;});
  return '<svg viewBox="0 0 '+sz+' '+sz+'" class="donut">'+circles+'</svg>';
}

function barChartSVG(incM,expM){
  var W=360,H=160,BTM=20,TOP=8,chartH=H-BTM-TOP;
  var maxVal=Math.max.apply(null,[1].concat(incM).concat(expM));
  var gW=W/12,bW=11,gap=2,circles='';
  for(var i=0;i<12;i++){
    var x=i*gW,gx=x+(gW-bW*2-gap)/2;
    var ih=(incM[i]/maxVal)*chartH,eh=(expM[i]/maxVal)*chartH;
    var baseY=TOP+chartH;
    if(ih>0)circles+='<rect x="'+gx.toFixed(1)+'" y="'+(baseY-ih).toFixed(1)+'" width="'+bW+'" height="'+ih.toFixed(1)+'" rx="3" fill="var(--accent)"/>';
    if(eh>0)circles+='<rect x="'+(gx+bW+gap).toFixed(1)+'" y="'+(baseY-eh).toFixed(1)+'" width="'+bW+'" height="'+eh.toFixed(1)+'" rx="3" fill="var(--red)"/>';
    circles+='<text x="'+(x+gW/2).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" font-size="9" fill="var(--ink-faint)">'+monthAbbrev(i)+'</text>';
  }
  var baseY2=TOP+chartH;
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%"><line x1="0" y1="'+baseY2+'" x2="'+W+'" y2="'+baseY2+'" stroke="var(--border)" stroke-width="1"/>'+circles+'</svg>';
}

  return '<div class="tags-row">'+shown+more+'</div>';

/* ================================================================
   INVESTIMENTI (v32 - prezzi automatici, valuta in EUR, andamento)
   L'utente sceglie l'asset da un elenco; il prezzo arriva da solo dal
   file condiviso prezzi.json (aggiornato una volta al giorno da un
   "robot" gratuito su GitHub). L'app converte tutto in euro con i cambi
   BCE e mostra valore, guadagno/perdita e andamento nel tempo.
   Il prezzo a mano resta solo come riserva se un simbolo non e' coperto.
   Solo monitoraggio: nessun consiglio finanziario.
================================================================ */
/* 'HEAD' = ramo impostato come DEFAULT su GitHub (nessun ramo fisso). Riserva: file locale accanto all'app. */
var PRICES_URLS=['https://raw.githubusercontent.com/nataliziadario-ops/Spese-Tracker/HEAD/prezzi.json','prezzi.json'];
var PRICES_CACHE_KEY='spendy-prezzi-cache-v1';
var PRICES={updatedAt:null,fxToEur:{EUR:1},catalog:[],prices:{}};
var invRerender=null;

function applyPrices(o){
  if(!o||typeof o!=='object')return;
  PRICES={
    updatedAt:o.updatedAt||null,
    fxToEur:(o.fxToEur&&typeof o.fxToEur==='object')?o.fxToEur:{EUR:1},
    catalog:Array.isArray(o.catalog)?o.catalog:[],
    prices:(o.prices&&typeof o.prices==='object')?o.prices:{}
  };
  if(!PRICES.fxToEur.EUR)PRICES.fxToEur.EUR=1;
}
async function loadPrices(){
  try{var c=window.localStorage.getItem(PRICES_CACHE_KEY);if(c)applyPrices(JSON.parse(c));}catch(e){}
  for(var _i=0;_i<PRICES_URLS.length;_i++){
    try{
      var r=await fetch(PRICES_URLS[_i]+((PRICES_URLS[_i].indexOf('?')<0?'?t=':'&t=')+Date.now()),{cache:'no-store'});
      if(r&&r.ok){var j=await r.json();if(j&&(j.catalog||j.prices)){applyPrices(j);try{window.localStorage.setItem(PRICES_CACHE_KEY,JSON.stringify(j));}catch(e){}break;}}
    }catch(e){}
  }
  try{
    var root=document.getElementById('modal-root');
    if(root&&root.classList.contains('open')&&(root.querySelector('.inv-summary')||root.querySelector('.inv-form'))&&typeof invRerender==='function')invRerender();
  }catch(e){}
  try{if(typeof autoRunDuePacs==='function')autoRunDuePacs();}catch(e){}
  try{if(typeof updatePortfolioHistory==='function')updatePortfolioHistory();}catch(e){}
  try{if(typeof invPageRerender==='function')invPageRerender();}catch(e){}
}

function invNum(v){v=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(v)?0:v;}
function invKindLabel(k){return k==='stock'?tr('Azione'):k==='etf'?'ETF':k==='crypto'?tr('Cripto'):tr('Altro');}
function invFmt(n,c){if(!c||c==='EUR')return fmt(n);try{return new Intl.NumberFormat(currentLocale(),{style:'currency',currency:c}).format(n||0);}catch(e){return (Number(n)||0).toFixed(2)+' '+c;}}
function fxToEur(cur){if(!cur||cur==='EUR')return 1;var f=PRICES.fxToEur&&PRICES.fxToEur[cur];return (typeof f==='number'&&f>0)?f:1;}
function priceEntry(sym){if(!sym)return null;return (PRICES.prices||{})[String(sym).toUpperCase()]||null;}
function catalogEntry(sym){if(!sym)return null;sym=String(sym).toUpperCase();var c=PRICES.catalog||[];for(var i=0;i<c.length;i++){if(c[i]&&String(c[i].symbol).toUpperCase()===sym)return c[i];}return null;}
function invHasLive(h){var e=priceEntry(h.ticker);return !!(e&&typeof e.price==='number');}
function invAssetCur(h){var e=priceEntry(h.ticker)||catalogEntry(h.ticker);return (e&&e.currency)||h.currency||'EUR';}
function invLiveUnit(h){var e=priceEntry(h.ticker);if(e&&typeof e.price==='number')return e.price;if(h.price!=null&&h.price!=='')return invNum(h.price);return invNum(h.buyPrice);}
function invUnitEur(h){return invLiveUnit(h)*fxToEur(invAssetCur(h));}
function invBuyEur(h){return invNum(h.buyPrice)*fxToEur(h.currency||invAssetCur(h));}
function invCostEur(h){return invNum(h.qty)*invBuyEur(h);}
function invValueEur(h){return invNum(h.qty)*invUnitEur(h);}
function invGainEur(h){return invValueEur(h)-invCostEur(h);}
function invGainPctH(h){var c=invCostEur(h);return c>0?(invGainEur(h)/c*100):0;}
function invTotalsEur(list){list=list||[];var cost=0,val=0;list.forEach(function(h){cost+=invCostEur(h);val+=invValueEur(h);});return {cost:cost,value:val,gain:val-cost,gainPct:cost>0?((val-cost)/cost*100):0};}
function invHistory(h){var e=priceEntry(h.ticker);return (e&&Array.isArray(e.history))?e.history:[];}

/* --- vecchi helper Fase 1 (mono-valuta, senza prezzi auto): mantenuti per compatibilita' --- */
function invCost(h){return invNum(h.qty)*invNum(h.buyPrice);}
function invUnitPrice(h){return (h.price==null||h.price==='')?invNum(h.buyPrice):invNum(h.price);}
function invValue(h){return invNum(h.qty)*invUnitPrice(h);}
function invGain(h){return invValue(h)-invCost(h);}
function invGainPct(h){var c=invCost(h);return c>0?(invGain(h)/c*100):0;}
function invTotals(list){list=list||[];var cost=0,val=0;list.forEach(function(h){cost+=invCost(h);val+=invValue(h);});return {cost:cost,value:val,gain:val-cost,gainPct:cost>0?((val-cost)/cost*100):0};}
function invMixedCur(list){return (list||[]).some(function(h){return h.currency&&h.currency!=='EUR';});}
function invCurList(){return ['EUR','USD','GBP','CHF','JPY'];}

function invSparkSVG(hist){
  hist=(hist||[]).filter(function(p){return p&&typeof p[1]==='number';});
  if(hist.length<2)return '';
  var W=320,H=88,PAD=6,n=hist.length;
  var vals=hist.map(function(p){return p[1];});
  var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals),rng=(max-min)||1;
  var pts=hist.map(function(p,i){var x=PAD+(i/(n-1))*(W-2*PAD);var y=PAD+(1-((p[1]-min)/rng))*(H-2*PAD);return x.toFixed(1)+','+y.toFixed(1);});
  var up=vals[n-1]>=vals[0],col=up?'var(--accent)':'var(--red)';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;">'+
    '<path d="M'+PAD+','+(H-PAD)+' L'+pts.join(' L')+' L'+(W-PAD)+','+(H-PAD)+' Z" fill="'+col+'" opacity="0.10"/>'+
    '<path d="M'+pts.join(' L')+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

/* ================================================================
   ANDAMENTO DEL VALORE DEL PORTAFOGLIO NEL TEMPO
   Registra ogni giorno (all'apertura) il valore totale in euro degli
   investimenti, per mostrarlo su un grafico. La prima volta ricostruisce
   una curva stimata dal passato usando lo storico prezzi e le posizioni
   attuali; da li' in poi il valore viene registrato giorno per giorno.
================================================================ */
var PORTF_MAX=400;
function portfolioValueEur(){return invTotalsEur(state.investments||[]).value;}
function recordPortfolioSnapshot(){
  if(!state)return;
  var list=state.investments||[];if(!list.length)return;
  if(!list.some(function(h){return invHasLive(h);}))return;
  var v=portfolioValueEur();if(!(v>0))return;
  v=Math.round(v*100)/100;
  var today=todayISO();
  state.portfolioHistory=state.portfolioHistory||[];
  var h=state.portfolioHistory;
  if(h.length&&h[h.length-1][0]===today)h[h.length-1]=[today,v];
  else h.push([today,v]);
  if(h.length>PORTF_MAX)state.portfolioHistory=h.slice(-PORTF_MAX);
}
function backfillPortfolioHistory(){
  var list=(state.investments||[]).filter(function(h){return invHasLive(h);});
  if(!list.length)return;
  var dates={};list.forEach(function(h){invHistory(h).forEach(function(p){if(p&&p[0])dates[p[0]]=1;});});
  var ds=Object.keys(dates).sort();
  if(ds.length<2)return;
  function priceOn(h,d){var hist=invHistory(h),val=null;for(var i=0;i<hist.length;i++){if(hist[i][0]<=d)val=hist[i][1];else break;}return val;}
  state.portfolioHistory=ds.map(function(d){
    var v=0;list.forEach(function(h){var p=priceOn(h,d);if(p!=null)v+=invNum(h.qty)*p*fxToEur(invAssetCur(h));});
    return [d,Math.round(v*100)/100];
  });
}
function updatePortfolioHistory(){
  if(!state||!(state.investments||[]).length)return;
  if(!((state.portfolioHistory||[]).length))backfillPortfolioHistory();
  recordPortfolioSnapshot();
  saveState();
}

/* ================================================================
   PAGINA INVESTIMENTI (stile broker)
   Pagina intera aperta dal menu profilo: riepilogo del portafoglio con
   grafico e periodi (1S/1M/1A/Max), elenco dei propri titoli, mercato
   con ricerca intelligente, scheda per ogni asset con grafico grande,
   descrizione e dati chiave, e i tasti Accumula (crea un PAC) e Compra
   (acquisto una tantum: inserisci gli euro, le quote si calcolano da
   sole). Solo monitoraggio: non e' consulenza finanziaria.
================================================================ */
var IPAGE=null;
var IP_RANGES=[{id:'1S',days:7},{id:'1M',days:31},{id:'1A',days:366},{id:'Max',days:null}];
function ipRangeDays(id){for(var i=0;i<IP_RANGES.length;i++)if(IP_RANGES[i].id===id)return IP_RANGES[i].days;return 31;}
function normTxt(s){try{return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}catch(e){return String(s||'').toLowerCase();}}
function searchCatalog(q){
  var qn=normTxt(q);
  if(/^[a-z]{2}[a-z0-9\s]{9,20}$/.test(qn)&&/\d/.test(qn)){var j=qn.replace(/\s+/g,'');if(j.length>=10)qn=j;}
  var toks=qn.split(/\s+/).filter(Boolean);
  if(!toks.length)return [];
  var out=[];
  (PRICES.catalog||[]).forEach(function(a){
    var sym=normTxt(a.symbol),nam=normTxt(a.name||''),kin=normTxt(a.kind||''),des=normTxt(a.desc||''),isin=normTxt(a.isin||'');
    var hay=sym+' '+nam+' '+kin+' '+des+' '+isin;
    if(!toks.every(function(t){return hay.indexOf(t)>=0;}))return;
    var sc=0;
    toks.forEach(function(t){
      if(isin&&isin===t)sc+=300;else if(isin&&isin.indexOf(t)===0&&t.length>=4)sc+=150;
      if(sym===t)sc+=100;else if(sym.indexOf(t)===0)sc+=60;else if(sym.indexOf(t)>=0)sc+=30;
      if(nam.indexOf(t)===0)sc+=40;else if(nam.indexOf(t)>=0)sc+=25;
      if(kin.indexOf(t)>=0)sc+=10;
      if(des.indexOf(t)>=0)sc+=5;
    });
    out.push({a:a,s:sc});
  });
  out.sort(function(x,y){return y.s-x.s;});
  return out.map(function(o){return o.a;});
}
function histRange(hist,days){
  hist=hist||[];
  if(!days)return hist;
  var cut=new Date();cut.setDate(cut.getDate()-days);
  var iso=cut.toISOString().slice(0,10);
  return hist.filter(function(p){return p&&p[0]>=iso;});
}
function assetHist(sym){var e=priceEntry(sym);return (e&&Array.isArray(e.history))?e.history:[];}
function assetDayChangePct(sym){
  var h=assetHist(sym);if(h.length<2)return null;
  var a=h[h.length-2][1],b=h[h.length-1][1];
  return (typeof a==='number'&&a>0&&typeof b==='number')?((b-a)/a*100):null;
}
function rangeChangePct(hist){
  hist=(hist||[]).filter(function(p){return p&&typeof p[1]==='number';});
  if(hist.length<2)return null;
  var a=hist[0][1],b=hist[hist.length-1][1];
  return a>0?((b-a)/a*100):null;
}
function ipPct(x){if(x==null)return '<span class="invp-chg" style="color:var(--ink-soft);">—</span>';var c=x>=0?'inv-up':'inv-down',s=x>=0?'▲ ':'▼ ';return '<span class="invp-chg '+c+'">'+s+Math.abs(x).toFixed(2).replace('.',',')+' %</span>';}
function ipQty(u){u=Number(u)||0;return (u>=1?u.toFixed(4):u.toFixed(6)).replace('.',',');}
function ipNumS(v){v=Number(v)||0;return v>=1000?String(Math.round(v)):(v>=100?v.toFixed(1):(v>=1?v.toFixed(2):v.toFixed(4)));}
function ipKindName(k){return k==='stock'?tr('Azioni'):(k==='etf'?'ETF':(k==='crypto'?tr('Cripto'):tr('Altro')));}
function invBigChartSVG(hist){
  hist=(hist||[]).filter(function(p){return p&&typeof p[1]==='number';});
  if(hist.length<2)return '<div class="ip-nochart">'+tr('Storico non ancora disponibile')+'</div>';
  var W=360,H=170,PL=6,PR=52,PT=14,PB=12,n=hist.length;
  var vals=hist.map(function(p){return p[1];});
  var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals),rng=(max-min)||1;
  function X(i){return PL+(i/(n-1))*(W-PL-PR);}
  function Y(v){return PT+(1-((v-min)/rng))*(H-PT-PB);}
  var pts=hist.map(function(p,i){return X(i).toFixed(1)+','+Y(p[1]).toFixed(1);});
  var up=vals[n-1]>=vals[0],col=up?'var(--accent)':'var(--red)';
  var y0=Y(vals[0]).toFixed(1);
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;">'+
    '<line x1="'+PL+'" y1="'+y0+'" x2="'+(W-PR)+'" y2="'+y0+'" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="1 5" opacity="0.6"/>'+
    '<path d="M'+PL+','+(H-PB)+' L'+pts.join(' L')+' L'+(W-PR)+','+(H-PB)+' Z" fill="'+col+'" opacity="0.10"/>'+
    '<path d="M'+pts.join(' L')+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<text x="'+(W-PR+6)+'" y="'+(Y(max)+4).toFixed(1)+'" font-size="11" fill="var(--ink-soft)">'+ipNumS(max)+'</text>'+
    '<text x="'+(W-PR+6)+'" y="'+(Y(min)+4).toFixed(1)+'" font-size="11" fill="var(--ink-soft)">'+ipNumS(min)+'</text>'+
  '</svg>';
}
function ipRangeChips(){
  return '<div class="segmented small" style="margin-bottom:8px;">'+IP_RANGES.map(function(r){
    return '<button class="'+(IPAGE.range===r.id?'active':'')+'" data-ip-range="'+r.id+'">'+r.id+'</button>';
  }).join('')+'</div>';
}
/* --- Acquisto una tantum --- */
function buyOnce(symbol,amount,accountId,dateISO){
  symbol=String(symbol||'').toUpperCase();
  var u=pacUnits(amount,symbol);if(!u)return null;
  var isNew=!pacHolding(symbol);
  if(isNew&&!canAdd('investments'))return 'limit';
  var ce=catalogEntry(symbol)||{};
  state.transactions.push({id:uid('tx'),type:'expense',amount:amount,accountId:accountId,categoryId:ensureInvestCategory(),merchant:'Acquisto '+symbol,note:ce.name||'',date:dateISO||todayISO(),tags:[],createdAt:Date.now(),source:'buy'});
  var h=pacHolding(symbol);
  if(h){
    var oq=invNum(h.qty),ob=invNum(h.buyPrice),nq=oq+u.units;
    h.qty=nq;h.buyPrice=nq>0?((oq*ob)+(u.units*u.price))/nq:u.price;
    h.currency=u.currency;h.updatedAt=Date.now();
    if(!h.name&&ce.name)h.name=ce.name;
  }else{
    state.investments=state.investments||[];
    state.investments.push({id:uid('inv'),ticker:symbol,name:ce.name||symbol,kind:ce.kind||'etf',qty:u.units,buyPrice:u.price,price:null,currency:u.currency,date:dateISO||todayISO(),createdAt:Date.now(),updatedAt:Date.now()});
  }
  saveState();
  return {symbol:symbol,units:u.units,amount:amount,price:u.price,currency:u.currency};
}

function openBudgetSheet(){

    if(!wrap)return;
    wire();
  }
  /* Aggiorna SOLO la card interessata (barra, colore, cifre) senza
     ricostruire l'intero foglio: niente flash né scroll che salta. */
  function refreshCard(id){
    var card=document.querySelector('.budget-card[data-budget-id="'+id+'"]');
    if(!card)return;
    var sp=totalOf(filteredTx(currentMonthKey(),'all',id,'expense')),lm=state.budgets[id]||0;
    var pct=lm>0?Math.min(sp/lm*100,100):0;
    var bar=lm>0?(sp/lm>=1?'var(--red)':sp/lm>=0.8?'var(--amber)':'var(--accent)'):'var(--track)';
    var fill=card.querySelector('.progress-fill');if(fill){fill.style.width=pct+'%';fill.style.background=bar;}
    var fig=card.querySelector('.budget-figures');if(fig)fig.textContent=lm>0?fmt(sp)+' / '+fmt(lm):fmt(sp);
  }
  function wire(){
    var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;
    document.querySelectorAll('[data-budget-slider]').forEach(function(sl){
      var id=sl.dataset.budgetSlider,card=sl.closest('.budget-card');
      sl.oninput=function(){
        var v=parseFloat(sl.value)||0,mx=parseFloat(sl.max)||1;
        sl.style.setProperty('--slider-pct',(v/mx*100).toFixed(1)+'%');
        var num=card.querySelector('[data-budget-cat]');if(num)num.value=v>0?v:'';
        var fig=card.querySelector('.budget-figures');
        var sp=totalOf(filteredTx(currentMonthKey(),'all',id,'expense'));
        if(fig)fig.textContent=v>0?fmt(sp)+' / '+fmt(v):fmt(sp);
      };
      sl.onchange=function(){setBudgetLimit(id,parseFloat(sl.value)||0);refreshCard(id);};
    });
    document.querySelectorAll('[data-budget-cat]').forEach(function(inp){
      inp.onchange=function(){

        refreshCard(id);
      };
    });
    /* La gestione di categorie e tag ora vive nella scheda «Categorie & Tag». */
  }
  openModal('<div class="sheet"></div>');
  render();
}

/* Numero compatto per le etichette del grafico: 1.234 -> "1,2k". */
function fmtShort(n){
  n=Math.round(n||0);var a=Math.abs(n),s;
  if(a>=1000){var k=a/1000;s=(k>=10?Math.round(k):Math.round(k*10)/10).toString().replace('.',',')+'k';}
  else s=String(a);
  return (n<0?'−':'')+s;
}

/* Totale mensile di un tag (per tipo di movimento). filteredTx non filtra
   per tag, quindi qui scorriamo direttamente le transazioni. */
function tagMonthTotal(tagId,monthKey,type){
  return state.transactions.filter(function(t){
    return t.date.slice(0,7)===monthKey && t.tags && t.tags.indexOf(tagId)>-1 && (type==='all'||t.type===type);
  }).reduce(function(s,e){return s+e.amount;},0);
}

/* Grafico a barre dell'andamento su N mesi, con eventuale linea del budget
   (tratteggiata, ambra). Le barre che superano il budget diventano rosse. */
function trendChartSVG(keys,values,budget,barHex){
  var W=360,H=190,TOP=20,BTM=26,chartH=H-TOP-BTM;
  var maxData=Math.max.apply(null,[1].concat(values));
  var maxVal=(budget>0?Math.max(maxData,budget):maxData)*1.15;
  var gW=W/keys.length,bW=Math.min(30,gW*0.52),baseY=TOP+chartH,out='';
  var budgetLine='',budgetLabel='';
  if(budget>0){
    var by=baseY-(budget/maxVal*chartH);
    /* La linea di riferimento resta sotto le barre. L'etichetta, invece, viene
       disegnata SOPRA le barre (in coda all'SVG) con una "pillola" di sfondo,
       così resta sempre leggibile anche quando una barra alta le passa davanti.
       Se la linea è troppo in alto, l'etichetta scende sotto la linea. */
    budgetLine='<line x1="0" y1="'+by.toFixed(1)+'" x2="'+W+'" y2="'+by.toFixed(1)+'" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="5 4"/>';
    var blbl=tr('Budget')+' '+fmtShort(budget);
    var bLblW=blbl.length*5.7+12;
    var above=(by-15)>=(TOP-2);
    var pillY=above?(by-15):(by+2);
    var txtY=above?(by-5):(by+12);
    budgetLabel='<g><rect x="2" y="'+pillY.toFixed(1)+'" width="'+bLblW.toFixed(1)+'" height="13.5" rx="6.75" fill="var(--surface)" opacity="0.9"/>'+
      '<text x="7" y="'+txtY.toFixed(1)+'" font-size="10" fill="var(--amber)" font-weight="700">'+blbl+'</text></g>';
  }
  for(var i=0;i<keys.length;i++){
    var x=i*gW,cx=x+gW/2,v=values[i],bh=v/maxVal*chartH;
    var over=budget>0&&v>budget,col=over?'var(--red)':(barHex||'var(--accent)');
    if(bh>0.6)out+='<rect x="'+(cx-bW/2).toFixed(1)+'" y="'+(baseY-bh).toFixed(1)+'" width="'+bW.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="4" fill="'+col+'"/>';
    if(v>0)out+='<text x="'+cx.toFixed(1)+'" y="'+Math.max(TOP-6,baseY-bh-5).toFixed(1)+'" text-anchor="middle" font-size="8.5" fill="var(--ink-soft)">'+fmtShort(v)+'</text>';
    out+='<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--ink-faint)">'+monthShortLabel(keys[i])+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%"><line x1="0" y1="'+baseY+'" x2="'+W+'" y2="'+baseY+'" stroke="var(--border)" stroke-width="1"/>'+budgetLine+out+budgetLabel+'</svg>';
}

/* Scheda dedicata: elenco di categorie e tag (gestione + apertura grafico).
   Ha due viste interne: 'list' (elenco) e 'trend' (grafico di un elemento). */
function openCatsTagsSheet(){
  var view={mode:'list'};
  var N=6; // mesi mostrati nel grafico

  function listBodyHTML(){
    var incomeCats=catsByType('income'),expCats=catsByType('expense');
    return '<p class="hint">'+tr('Tocca una categoria o un tag per vederne l\'andamento nel tempo. Usa ✏️ per rinominare e 🗑 per eliminare.')+'</p>'+
      '<section class="card" style="display:flex;flex-direction:column;gap:8px;"><h3 style="margin:0;font-size:14.5px;">'+tr('Categorie di spesa')+'</h3>'+(expCats.length?expCats.map(catManageRowHTML).join(''):'<p class="empty-note">'+tr('Nessuna categoria.')+'</p>')+'</section>'+
      '<section class="card" style="display:flex;flex-direction:column;gap:8px;"><h3 style="margin:0;font-size:14.5px;">'+tr('Categorie di entrata')+'</h3>'+(incomeCats.length?incomeCats.map(catManageRowHTML).join(''):'<p class="empty-note">'+tr('Nessuna categoria.')+'</p>')+'</section>'+
      '<section class="card" style="display:flex;flex-direction:column;gap:10px;"><h3 style="margin:0;font-size:14.5px;">'+tr('Nuova categoria')+'</h3><div class="segmented small"><button class="'+(ui.newCatType==='expense'?'active':'')+'" data-newcat-type="expense">'+tr('Di spesa')+'</button><button class="'+(ui.newCatType==='income'?'active mode-income':'')+'" data-newcat-type="income">'+tr('Di entrata')+'</button></div><div class="new-cat-row"><input id="newCatEmoji" class="emoji-input" maxlength="2" placeholder="🙂"><input id="newCatName" class="text-input" placeholder="'+tr('Nome categoria')+'"><button class="btn-primary-sm" id="addCatBtn">'+tr('Aggiungi')+'</button></div></section>'+
      '<section class="card" style="display:flex;flex-direction:column;gap:8px;"><h3 style="margin:0;font-size:14.5px;">'+tr('Tag')+'</h3>'+(state.tags.length?state.tags.map(tagManageRowHTML).join(''):'<p class="empty-note">'+tr('Nessun tag: li crei quando aggiungi un movimento.')+'</p>')+'</section>';
  }

  function trendBodyHTML(){
    var keys=lastNMonthKeys(N),title,values,budget=0,barHex,noteHTML='';
    if(view.kind==='cat'){
      var c=catById(view.id);
      title='<span class="cat-bubble" style="background:'+colorHex(c.color)+'22;width:30px;height:30px;border-radius:9px;font-size:15px;">'+esc(c.emoji)+'</span> '+esc(c.name);
      values=keys.map(function(k){return totalOf(filteredTx(k,'all',c.id,c.type));});
      barHex=colorHex(c.color);
      if(c.type==='expense'){
        budget=state.budgets[c.id]||0;
        if(budget<=0)noteHTML='<p class="hint">'+tr('Questa categoria non ha un budget mensile. Impostane uno nella scheda «Budget mensili» per vedere la linea di riferimento.')+'</p>';
      }else{
        noteHTML='<p class="hint">Andamento delle entrate di questa categoria negli ultimi '+keys.length+' mesi. Le entrate non hanno un budget.</p>';
      }
    }else{
      var t=tagById(view.id);
      title='<span class="dot" style="background:'+colorHex(t.color)+';width:16px;height:16px;border-radius:50%;display:inline-block;"></span> '+esc(t.name);
      values=keys.map(function(k){return tagMonthTotal(t.id,k,'expense');});
      barHex=colorHex(t.color);
      noteHTML='<p class="hint">'+tr('Uscite associate a questo tag, mese per mese. I tag non hanno un budget.')+'</p>';
    }
    var tot=values.reduce(function(s,v){return s+v;},0),avg=tot/keys.length,maxV=Math.max.apply(null,values);
    var overCount=budget>0?values.filter(function(v){return v>budget;}).length:0;
    var statsHTML='<div class="trend-stats">'+
      '<div class="trend-stat"><div class="trend-stat-val">'+fmt(avg)+'</div><div class="trend-stat-lbl">'+tr('Media / mese')+'</div></div>'+
      '<div class="trend-stat"><div class="trend-stat-val">'+fmt(maxV)+'</div><div class="trend-stat-lbl">'+tr('Mese più alto')+'</div></div>'+
      (budget>0?'<div class="trend-stat"><div class="trend-stat-val">'+overCount+'/'+keys.length+'</div><div class="trend-stat-lbl">'+tr('Mesi oltre budget')+'</div></div>':'<div class="trend-stat"><div class="trend-stat-val">'+fmt(tot)+'</div><div class="trend-stat-lbl">'+tr('Totale')+' '+keys.length+' '+tr('mesi')+'</div></div>')+
    '</div>';
    return '<button class="trend-back" id="trendBack" data-back="1">'+tr('‹ Categorie & Tag')+'</button>'+
      '<h3 style="margin:2px 0 0;font-family:var(--font-display);font-size:18px;letter-spacing:-0.01em;display:flex;align-items:center;gap:8px;">'+title+'</h3>'+
      '<div class="chart-wrap">'+trendChartSVG(keys,values,budget,barHex)+'</div>'+
      statsHTML+noteHTML;
  }

  function sheetHTML(){
    if(view.mode==='trend')return '<div class="sheet"><div class="sheet-handle"></div>'+trendBodyHTML()+'</div>';
    return '<div class="sheet"><div class="sheet-handle"></div><h3 style="margin:4px 0 0;font-family:var(--font-display);font-size:18px;letter-spacing:-0.01em;">'+tr('Categorie &amp; Tag')+'</h3>'+listBodyHTML()+'</div>';
  }

  function render(){
    var wrap=document.querySelector('#modal-root .sheet-wrap');
    if(!wrap){openModal('<div class="sheet"></div>');}
    wrap=rerenderSheetWrap(sheetHTML());
    if(!wrap)return;
    wire();
  }

  function wire(){
    var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;
    if(view.mode==='trend'){
      var back=document.getElementById('trendBack');
      if(back)back.onclick=function(){view={mode:'list'};render();};
      return;
    }
    document.querySelectorAll('[data-cat-trend]').forEach(function(b){b.onclick=function(){ui.editingCatId=null;ui.editingTagId=null;view={mode:'trend',kind:'cat',id:b.dataset.catTrend};render();};});
    document.querySelectorAll('[data-tag-trend]').forEach(function(b){b.onclick=function(){ui.editingCatId=null;ui.editingTagId=null;view={mode:'trend',kind:'tag',id:b.dataset.tagTrend};render();};});
    document.querySelectorAll('[data-newcat-type]').forEach(function(b){b.onclick=function(){
      ui.newCatType=b.dataset.newcatType;
      document.querySelectorAll('[data-newcat-type]').forEach(function(q){q.classList.remove('active','mode-income');});
      b.classList.add('active');if(ui.newCatType==='income')b.classList.add('mode-income');
    };});
    var ab=document.getElementById('addCatBtn');
    if(ab)ab.onclick=function(){
      var name=document.getElementById('newCatName').value.trim(),emoji=document.getElementById('newCatEmoji').value.trim()||(ui.newCatType==='income'?'💰':'🏷️');
      if(!name){showToast(tr('Dai un nome alla categoria'));return;}
      if(!canAdd('customCats')){premiumBlock('customCats');return;}
      state.categories.push({id:uid('cat'),name:name,emoji:emoji,color:state.categories.length%8,type:ui.newCatType,custom:true});
      saveState();showToast(tr('Categoria aggiunta'));render();
    };
    document.querySelectorAll('[data-cat-edit]').forEach(function(b){b.onclick=function(){ui.editingCatId=b.dataset.catEdit;ui.editingTagId=null;render();};});
    document.querySelectorAll('[data-cat-canceledit]').forEach(function(b){b.onclick=function(){ui.editingCatId=null;render();};});
    document.querySelectorAll('[data-cat-save]').forEach(function(b){b.onclick=function(){
      var c=catById(b.dataset.catSave);
      var nm=(document.getElementById('editCatName').value||'').trim(),em=(document.getElementById('editCatEmoji').value||'').trim();
      if(!nm){showToast(tr('Il nome non può essere vuoto'));return;}
      c.name=nm;if(em)c.emoji=em;
      ui.editingCatId=null;saveState();showToast(tr('Categoria aggiornata'));render();
    };});
    document.querySelectorAll('[data-cat-del]').forEach(function(b){b.onclick=function(){
      var id=b.dataset.catDel,c=catById(id),n=catUsageCount(id);
      if(state.categories.filter(function(x){return x.type===c.type;}).length<=1){showToast(tr('Deve restare almeno una categoria di questo tipo'));return;}
      var others=state.categories.filter(function(x){return x.type===c.type&&x.id!==id;}),target=others[0];
      var warn=n===0?tr('Nessun movimento usa questa categoria.'):(n+' '+tr('movimenti/ricorrenti passeranno a')+' "'+target.emoji+' '+target.name+'".');
      confirmDialog(tr('Eliminare la categoria')+' "'+c.emoji+' '+c.name+'"? '+warn,function(){
        state.transactions.forEach(function(t){if(t.categoryId===id)t.categoryId=target.id;});
        state.recurring.forEach(function(r){if(r.categoryId===id)r.categoryId=target.id;});
        delete state.budgets[id];
        state.categories=state.categories.filter(function(x){return x.id!==id;});
        ui.editingCatId=null;saveState();showToast(tr('Categoria eliminata'));render();
      },'Elimina');
    };});
    document.querySelectorAll('[data-tag-edit]').forEach(function(b){b.onclick=function(){ui.editingTagId=b.dataset.tagEdit;ui.editingCatId=null;render();};});
    document.querySelectorAll('[data-tag-canceledit]').forEach(function(b){b.onclick=function(){ui.editingTagId=null;render();};});
    document.querySelectorAll('[data-tag-save]').forEach(function(b){b.onclick=function(){
      var t=tagById(b.dataset.tagSave);
      var nm=(document.getElementById('editTagName').value||'').trim();
      if(!nm){showToast(tr('Il nome non può essere vuoto'));return;}
      t.name=nm;ui.editingTagId=null;saveState();showToast(tr('Tag aggiornato'));render();
    };});
    document.querySelectorAll('[data-tag-del]').forEach(function(b){b.onclick=function(){
      var id=b.dataset.tagDel,t=tagById(id),n=tagUsageCount(id);
      var warn=n===0?tr('Nessun movimento usa questo tag.'):(tr('Verrà tolto da')+' '+n+' '+tr('movimenti (i movimenti restano).'));
      confirmDialog(tr('Eliminare il tag')+' "'+t.name+'"? '+warn,function(){
        state.transactions.forEach(function(x){if(x.tags)x.tags=x.tags.filter(function(g){return g!==id;});});
        state.transfers.forEach(function(x){if(x.tags)x.tags=x.tags.filter(function(g){return g!==id;});});
        state.tags=state.tags.filter(function(x){return x.id!==id;});
        if(ui.tagFilter===id)ui.tagFilter=null;
        ui.editingTagId=null;saveState();showToast(tr('Tag eliminato'));render();
      },'Elimina');
    };});
  }

  ui.editingCatId=null;ui.editingTagId=null;
  openModal('<div class="sheet"></div>');
  render();
}
