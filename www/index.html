/* ================================================================
   INVESTIMENTI (v32 - prezzi automatici, valuta in EUR, andamento)
   L'utente sceglie l'asset da un elenco; il prezzo arriva da solo dal
   file condiviso prezzi.json (aggiornato una volta al giorno da un
   "robot" gratuito su GitHub). L'app converte tutto in euro con i cambi
   BCE e mostra valore, guadagno/perdita e andamento nel tempo.
   Il prezzo a mano resta solo come riserva se un simbolo non e' coperto.
   Solo monitoraggio: nessun consiglio finanziario.
================================================================ */
/* 'HEAD' = ramo impostato come DEFAULT su GitHub (nessun ramo fisso). Riserva: file locale accanto all'app. */
var PRICES_URLS=['https://raw.githubusercontent.com/nataliziadario-ops/Spese-Tracker/HEAD/prezzi.json','prezzi.json'];
var PRICES_CACHE_KEY='spendy-prezzi-cache-v1';
var PRICES={updatedAt:null,fxToEur:{EUR:1},catalog:[],prices:{}};
var invRerender=null;

function applyPrices(o){
  if(!o||typeof o!=='object')return;
  PRICES={
    updatedAt:o.updatedAt||null,
    fxToEur:(o.fxToEur&&typeof o.fxToEur==='object')?o.fxToEur:{EUR:1},
    catalog:Array.isArray(o.catalog)?o.catalog:[],
    prices:(o.prices&&typeof o.prices==='object')?o.prices:{}
  };
  if(!PRICES.fxToEur.EUR)PRICES.fxToEur.EUR=1;
}
async function loadPrices(){
  try{var c=window.localStorage.getItem(PRICES_CACHE_KEY);if(c)applyPrices(JSON.parse(c));}catch(e){}
  for(var _i=0;_i<PRICES_URLS.length;_i++){
    try{
      var r=await fetch(PRICES_URLS[_i]+((PRICES_URLS[_i].indexOf('?')<0?'?t=':'&t=')+Date.now()),{cache:'no-store'});
      if(r&&r.ok){var j=await r.json();if(j&&(j.catalog||j.prices)){applyPrices(j);try{window.localStorage.setItem(PRICES_CACHE_KEY,JSON.stringify(j));}catch(e){}break;}}
    }catch(e){}
  }
  try{
    var root=document.getElementById('modal-root');
    if(root&&root.classList.contains('open')&&(root.querySelector('.inv-summary')||root.querySelector('.inv-form'))&&typeof invRerender==='function')invRerender();
  }catch(e){}
  try{if(typeof autoRunDuePacs==='function')autoRunDuePacs();}catch(e){}
  try{if(typeof updatePortfolioHistory==='function')updatePortfolioHistory();}catch(e){}
  try{if(typeof invPageRerender==='function')invPageRerender();}catch(e){}
}

function invNum(v){v=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(v)?0:v;}
function invKindLabel(k){return k==='stock'?tr('Azione'):k==='etf'?'ETF':k==='crypto'?tr('Cripto'):tr('Altro');}
function invFmt(n,c){if(!c||c==='EUR')return fmt(n);try{return new Intl.NumberFormat(currentLocale(),{style:'currency',currency:c}).format(n||0);}catch(e){return (Number(n)||0).toFixed(2)+' '+c;}}
function fxToEur(cur){if(!cur||cur==='EUR')return 1;var f=PRICES.fxToEur&&PRICES.fxToEur[cur];return (typeof f==='number'&&f>0)?f:1;}
function priceEntry(sym){if(!sym)return null;return (PRICES.prices||{})[String(sym).toUpperCase()]||null;}
function catalogEntry(sym){if(!sym)return null;sym=String(sym).toUpperCase();var c=PRICES.catalog||[];for(var i=0;i<c.length;i++){if(c[i]&&String(c[i].symbol).toUpperCase()===sym)return c[i];}return null;}
function invHasLive(h){var e=priceEntry(h.ticker);return !!(e&&typeof e.price==='number');}
function invAssetCur(h){var e=priceEntry(h.ticker)||catalogEntry(h.ticker);return (e&&e.currency)||h.currency||'EUR';}
function invLiveUnit(h){var e=priceEntry(h.ticker);if(e&&typeof e.price==='number')return e.price;if(h.price!=null&&h.price!=='')return invNum(h.price);return invNum(h.buyPrice);}
function invUnitEur(h){return invLiveUnit(h)*fxToEur(invAssetCur(h));}
function invBuyEur(h){return invNum(h.buyPrice)*fxToEur(h.currency||invAssetCur(h));}
function invCostEur(h){return invNum(h.qty)*invBuyEur(h);}
function invValueEur(h){return invNum(h.qty)*invUnitEur(h);}
function invGainEur(h){return invValueEur(h)-invCostEur(h);}
function invGainPctH(h){var c=invCostEur(h);return c>0?(invGainEur(h)/c*100):0;}
function invTotalsEur(list){list=list||[];var cost=0,val=0;list.forEach(function(h){cost+=invCostEur(h);val+=invValueEur(h);});return {cost:cost,value:val,gain:val-cost,gainPct:cost>0?((val-cost)/cost*100):0};}
function invHistory(h){var e=priceEntry(h.ticker);return (e&&Array.isArray(e.history))?e.history:[];}

/* --- vecchi helper Fase 1 (mono-valuta, senza prezzi auto): mantenuti per compatibilita' --- */
function invCost(h){return invNum(h.qty)*invNum(h.buyPrice);}
function invUnitPrice(h){return (h.price==null||h.price==='')?invNum(h.buyPrice):invNum(h.price);}
function invValue(h){return invNum(h.qty)*invUnitPrice(h);}
function invGain(h){return invValue(h)-invCost(h);}
function invGainPct(h){var c=invCost(h);return c>0?(invGain(h)/c*100):0;}
function invTotals(list){list=list||[];var cost=0,val=0;list.forEach(function(h){cost+=invCost(h);val+=invValue(h);});return {cost:cost,value:val,gain:val-cost,gainPct:cost>0?((val-cost)/cost*100):0};}
function invMixedCur(list){return (list||[]).some(function(h){return h.currency&&h.currency!=='EUR';});}
function invCurList(){return ['EUR','USD','GBP','CHF','JPY'];}

function invSparkSVG(hist){
  hist=(hist||[]).filter(function(p){return p&&typeof p[1]==='number';});
  if(hist.length<2)return '';
  var W=320,H=88,PAD=6,n=hist.length;
  var vals=hist.map(function(p){return p[1];});
  var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals),rng=(max-min)||1;
  var pts=hist.map(function(p,i){var x=PAD+(i/(n-1))*(W-2*PAD);var y=PAD+(1-((p[1]-min)/rng))*(H-2*PAD);return x.toFixed(1)+','+y.toFixed(1);});
  var up=vals[n-1]>=vals[0],col=up?'var(--accent)':'var(--red)';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;">'+
    '<path d="M'+PAD+','+(H-PAD)+' L'+pts.join(' L')+' L'+(W-PAD)+','+(H-PAD)+' Z" fill="'+col+'" opacity="0.10"/>'+
    '<path d="M'+pts.join(' L')+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

/* ================================================================
   ANDAMENTO DEL VALORE DEL PORTAFOGLIO NEL TEMPO
   Registra ogni giorno (all'apertura) il valore totale in euro degli
   investimenti, per mostrarlo su un grafico. La prima volta ricostruisce
   una curva stimata dal passato usando lo storico prezzi e le posizioni
   attuali; da li' in poi il valore viene registrato giorno per giorno.
================================================================ */
var PORTF_MAX=400;
function portfolioValueEur(){return invTotalsEur(state.investments||[]).value;}
function recordPortfolioSnapshot(){
  if(!state)return;
  var list=state.investments||[];if(!list.length)return;
  if(!list.some(function(h){return invHasLive(h);}))return;
  var v=portfolioValueEur();if(!(v>0))return;
  v=Math.round(v*100)/100;
  var today=todayISO();
  state.portfolioHistory=state.portfolioHistory||[];
  var h=state.portfolioHistory;
  if(h.length&&h[h.length-1][0]===today)h[h.length-1]=[today,v];
  else h.push([today,v]);
  if(h.length>PORTF_MAX)state.portfolioHistory=h.slice(-PORTF_MAX);
}
function backfillPortfolioHistory(){
  var list=(state.investments||[]).filter(function(h){return invHasLive(h);});
  if(!list.length)return;
  var dates={};list.forEach(function(h){invHistory(h).forEach(function(p){if(p&&p[0])dates[p[0]]=1;});});
  var ds=Object.keys(dates).sort();
  if(ds.length<2)return;
  function priceOn(h,d){var hist=invHistory(h),val=null;for(var i=0;i<hist.length;i++){if(hist[i][0]<=d)val=hist[i][1];else break;}return val;}
  state.portfolioHistory=ds.map(function(d){
    var v=0;list.forEach(function(h){var p=priceOn(h,d);if(p!=null)v+=invNum(h.qty)*p*fxToEur(invAssetCur(h));});
    return [d,Math.round(v*100)/100];
  });
}
function updatePortfolioHistory(){
  if(!state||!(state.investments||[]).length)return;
  if(!((state.portfolioHistory||[]).length))backfillPortfolioHistory();
  recordPortfolioSnapshot();
  saveState();
}

/* ================================================================
   PAGINA INVESTIMENTI (stile broker)
   Pagina intera aperta dal menu profilo: riepilogo del portafoglio con
   grafico e periodi (1S/1M/1A/Max), elenco dei propri titoli, mercato
   con ricerca intelligente, scheda per ogni asset con grafico grande,
   descrizione e dati chiave, e i tasti Accumula (crea un PAC) e Compra
   (acquisto una tantum: inserisci gli euro, le quote si calcolano da
   sole). Solo monitoraggio: non e' consulenza finanziaria.
================================================================ */
var IPAGE=null;
var IP_RANGES=[{id:'1S',days:7},{id:'1M',days:31},{id:'1A',days:366},{id:'Max',days:null}];
function ipRangeDays(id){for(var i=0;i<IP_RANGES.length;i++)if(IP_RANGES[i].id===id)return IP_RANGES[i].days;return 31;}
function normTxt(s){try{return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}catch(e){return String(s||'').toLowerCase();}}
function searchCatalog(q){
  var qn=normTxt(q);
  if(/^[a-z]{2}[a-z0-9\s]{9,20}$/.test(qn)&&/\d/.test(qn)){var j=qn.replace(/\s+/g,'');if(j.length>=10)qn=j;}
  var toks=qn.split(/\s+/).filter(Boolean);
  if(!toks.length)return [];
  var out=[];
  (PRICES.catalog||[]).forEach(function(a){
    var sym=normTxt(a.symbol),nam=normTxt(a.name||''),kin=normTxt(a.kind||''),des=normTxt(a.desc||''),isin=normTxt(a.isin||'');
    var hay=sym+' '+nam+' '+kin+' '+des+' '+isin;
    if(!toks.every(function(t){return hay.indexOf(t)>=0;}))return;
    var sc=0;
    toks.forEach(function(t){
      if(isin&&isin===t)sc+=300;else if(isin&&isin.indexOf(t)===0&&t.length>=4)sc+=150;
      if(sym===t)sc+=100;else if(sym.indexOf(t)===0)sc+=60;else if(sym.indexOf(t)>=0)sc+=30;
      if(nam.indexOf(t)===0)sc+=40;else if(nam.indexOf(t)>=0)sc+=25;
      if(kin.indexOf(t)>=0)sc+=10;
      if(des.indexOf(t)>=0)sc+=5;
    });
    out.push({a:a,s:sc});
  });
  out.sort(function(x,y){return y.s-x.s;});
  return out.map(function(o){return o.a;});
}
function histRange(hist,days){

/* Sparkline compatta per la lista asset. Contenitore a larghezza fissa
   (.invp-spark 52x26) cosi' non spinge ne' si sovrappone al testo: se manca
   lo storico resta uno spazio vuoto, senza dati finti. */
function ipSparkSVG(sym){
  var pts=(assetHist(sym)||[]).filter(function(p){return p&&typeof p[1]==='number';}).slice(-30);
  if(pts.length<2)return '';
  var W=52,H=26,PT=4,PB=4,n=pts.length;
  var vals=pts.map(function(p){return p[1];});
  var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals),rng=(max-min)||1;
  function X(i){return (i/(n-1))*W;}
  function Y(v){return PT+(1-((v-min)/rng))*(H-PT-PB);}
  var d=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+','+Y(p[1]).toFixed(1);}).join(' ');
  var up=vals[n-1]>=vals[0],col=up?'var(--accent)':'var(--red)';
  return '<svg class="invp-spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
}
function invBigChartSVG(hist,cost){
  var pairs=[];
  (hist||[]).forEach(function(p,i){if(p&&typeof p[1]==='number')pairs.push({v:p[1],c:(cost&&typeof cost[i]==='number')?cost[i]:null});});
  if(pairs.length<2)return '<div class="ip-nochart">'+tr('Storico non ancora disponibile')+'</div>';
  var hasCost=!!cost&&pairs.some(function(x){return x.c!=null;});
  var W=360,H=170,PL=6,PR=52,PT=14,PB=hasCost?24:12,n=pairs.length;
  var vals=pairs.map(function(x){return x.v;});
  var allv=vals.slice();if(hasCost)pairs.forEach(function(x){if(x.c!=null)allv.push(x.c);});
  var min=Math.min.apply(null,allv),max=Math.max.apply(null,allv),rng=(max-min)||1;
  function X(i){return PL+(i/(n-1))*(W-PL-PR);}
  function Y(v){return PT+(1-((v-min)/rng))*(H-PT-PB);}
  var pts=pairs.map(function(x,i){return X(i).toFixed(1)+','+Y(x.v).toFixed(1);});
  var up=vals[n-1]>=vals[0],col=up?'var(--accent)':'var(--red)';
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;">';
  if(!hasCost){var y0=Y(vals[0]).toFixed(1);svg+='<line x1="'+PL+'" y1="'+y0+'" x2="'+(W-PR)+'" y2="'+y0+'" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="1 5" opacity="0.6"/>';}
  svg+='<path d="M'+PL+','+(H-PB)+' L'+pts.join(' L')+' L'+(W-PR)+','+(H-PB)+' Z" fill="'+col+'" opacity="0.10"/>';
  svg+='<path d="M'+pts.join(' L')+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  if(hasCost){
    var last=null,cpts=[];pairs.forEach(function(x,i){var c=(x.c!=null)?x.c:last;last=c;if(c!=null)cpts.push(X(i).toFixed(1)+','+Y(c).toFixed(1));});
    if(cpts.length>=2)svg+='<path d="M'+cpts.join(' L')+'" fill="none" stroke="var(--ink-soft)" stroke-width="1.6" stroke-dasharray="4 3" stroke-linejoin="round" opacity="0.85"/>';
    svg+='<g font-size="10" fill="var(--ink-soft)">'+
      '<rect x="'+PL+'" y="'+(H-9)+'" width="10" height="3" rx="1.5" fill="'+col+'"/><text x="'+(PL+14)+'" y="'+(H-6)+'">'+tr('Valore')+'</text>'+
      '<rect x="'+(PL+70)+'" y="'+(H-9)+'" width="10" height="3" rx="1.5" fill="var(--ink-soft)"/><text x="'+(PL+84)+'" y="'+(H-6)+'">'+tr('Investito')+'</text></g>';
  }
  svg+='<text x="'+(W-PR+6)+'" y="'+(Y(max)+4).toFixed(1)+'" font-size="11" fill="var(--ink-soft)">'+ipNumS(max)+'</text>';
  svg+='<text x="'+(W-PR+6)+'" y="'+(Y(min)+4).toFixed(1)+'" font-size="11" fill="var(--ink-soft)">'+ipNumS(min)+'</text>';
  svg+='</svg>';return svg;
}
/* Importo cumulato investito (Compra + PAC) a ciascuna delle date indicate. */
function investedSeriesForDates(dates){
  var buys=[];
  (state.transactions||[]).forEach(function(t){if(t.source==='buy'||t.source==='pac')buys.push([t.date,invNum(t.amount)]);});
  buys.sort(function(a,b){return a[0]<b[0]?-1:1;});
  return (dates||[]).map(function(d){var s=0;for(var i=0;i<buys.length;i++){if(buys[i][0]<=d)s+=buys[i][1];else break;}return s;});
}

function buyOnce(symbol,amount,accountId,dateISO){
  symbol=String(symbol||'').toUpperCase();
  var u=pacUnits(amount,symbol);if(!u)return null;
  var isNew=!pacHolding(symbol);
  if(isNew&&!canAdd('investments'))return 'limit';
  var ce=catalogEntry(symbol)||{};
  state.transactions.push({id:uid('tx'),type:'expense',amount:amount,accountId:accountId,categoryId:ensureInvestCategory(),merchant:'Acquisto '+symbol,note:ce.name||'',date:dateISO||todayISO(),tags:[],createdAt:Date.now(),source:'buy',units:u.units,symbol:symbol,unitPrice:u.price,unitCur:u.currency});
  var h=pacHolding(symbol);
  if(h){
    var oq=invNum(h.qty),ob=invNum(h.buyPrice),nq=oq+u.units;
    h.qty=nq;h.buyPrice=nq>0?((oq*ob)+(u.units*u.price))/nq:u.price;
    h.currency=u.currency;h.updatedAt=Date.now();
    if(!h.name&&ce.name)h.name=ce.name;
  }else{
    state.investments=state.investments||[];
    state.investments.push({id:uid('inv'),ticker:symbol,name:ce.name||symbol,kind:ce.kind||'etf',qty:u.units,buyPrice:u.price,price:null,currency:u.currency,date:dateISO||todayISO(),createdAt:Date.now(),updatedAt:Date.now()});
  }
  ensureInvestAccount();
  saveState();
  return {symbol:symbol,units:u.units,amount:amount,price:u.price,currency:u.currency};
}

/* Simbolo dell'asset legato a un movimento di acquisto. I movimenti nuovi lo
   portano scritto; per quelli vecchi lo ricavo da com'e' fatto il movimento. */
function txAssetSymbol(t){
  if(!t)return null;
  if(t.symbol)return String(t.symbol).toUpperCase();
  if(t.source==='buy'){var m=String(t.merchant||'').match(/^Acquisto\s+(.+)$/i);if(m)return m[1].trim().toUpperCase();}
  if(t.source==='pac'&&t.recurringId){var r=(state.recurring||[]).filter(function(x){return x.id===t.recurringId;})[0];if(r&&r.assetSymbol)return String(r.assetSymbol).toUpperCase();}
  return null;
}
/* Tutti gli acquisti di un titolo (Compra + PAC), dal piu' recente. */
function assetPurchases(sym){
  sym=String(sym||'').toUpperCase();var out=[];
  (state.transactions||[]).forEach(function(t){
    if(t.source!=='buy'&&t.source!=='pac')return;
    if(txAssetSymbol(t)!==sym)return;
    out.push({id:t.id,date:t.date,amount:invNum(t.amount),units:(t.units!=null?invNum(t.units):null),source:t.source});
  });
  out.sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:0);});
  return out;
}
/* ================================================================
   REGISTRO MOVIMENTI (v66) — acquisto/vendita come sull'estratto.
   La posizione (quote, prezzo medio, realizzato) si DERIVA dai
   movimenti registrati in state.transactions (recomputeHolding).
   Le posizioni "legacy" inserite a mano (senza movimenti) restano
   intatte: recomputeHolding le tocca solo se ci sono movimenti.
================================================================ */
function assetMovements(sym){
  sym=String(sym||'').toUpperCase();var out=[];
  (state.transactions||[]).forEach(function(t){
    if(t.source!=='buy'&&t.source!=='pac'&&t.source!=='sell')return;
    if(txAssetSymbol(t)!==sym)return;
    out.push({id:t.id,date:t.date||'',type:(t.source==='sell'?'sell':'buy'),
      units:(t.units!=null?invNum(t.units):null),
      unitPrice:(t.unitPrice!=null?invNum(t.unitPrice):null),
      unitCur:t.unitCur||null,amount:invNum(t.amount),fees:invNum(t.fees),accountId:t.accountId||null,source:t.source});
  });
  out.sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);}); /* cronologico per il replay */
  return out;
}
/* Ricalcola la posizione di un asset dai suoi movimenti (media ponderata
   sugli acquisti; le vendite riducono le quote e generano il realizzato in
   euro). Marca la posizione come derivata: se poi si cancella l'ultimo
   movimento, la posizione derivata viene rimossa (una legacy no). */
function recomputeHolding(sym){
  sym=String(sym||'').toUpperCase();
  var movs=assetMovements(sym);
  var h=pacHolding(sym);
  if(!movs.length){
    if(h&&h.derived)state.investments=(state.investments||[]).filter(function(x){return x!==h;});
    return h&&h.derived?null:h;
  }
  var ce=catalogEntry(sym)||{};
  var qty=0,avg=0,realizedEur=0,cur=(h&&h.currency)||ce.currency||'EUR';
  movs.forEach(function(m){
    var units=(m.units!=null&&m.units>0)?m.units:null;if(units==null)return;
    if(m.unitCur)cur=m.unitCur;
    var price=(m.unitPrice!=null&&m.unitPrice>0)?m.unitPrice:null;
    if(m.type==='sell'){
      var sold=Math.min(units,qty);
      if(price!=null)realizedEur+=sold*(price-avg)*fxToEur(cur);
      qty=Math.max(0,qty-units);
    }else{
      var p=(price!=null)?price:avg;
      var nq=qty+units;avg=nq>0?((qty*avg)+(units*p))/nq:p;qty=nq;
    }
  });
  qty=Math.round(qty*1e8)/1e8;if(qty<0)qty=0;
  if(!h){
    h={id:uid('inv'),ticker:sym,name:ce.name||sym,kind:ce.kind||'etf',qty:qty,buyPrice:avg,price:null,currency:cur,date:movs[0].date||todayISO(),createdAt:Date.now(),updatedAt:Date.now()};
    state.investments=state.investments||[];state.investments.push(h);
  }else{
    h.qty=qty;h.buyPrice=avg;h.currency=cur;h.updatedAt=Date.now();
    if(!h.name&&ce.name)h.name=ce.name;if(!h.kind&&ce.kind)h.kind=ce.kind;
  }
  h.realized=Math.round(realizedEur*100)/100;
  h.derived=true;
  return h;
}
/* Registra un movimento (acquisto/vendita) con quote e prezzo ESEGUITI,
   come si leggono sull'estratto della banca. Aggancio al conto: l'acquisto
   e' un'uscita (expense), la vendita un'entrata (income). */
function recordMovement(opts){
  opts=opts||{};
  var sym=String(opts.symbol||'').toUpperCase();if(!sym)return 'symbol';
  var isSell=opts.type==='sell';
  var units=invNum(opts.units);if(!(units>0))return 'units';
  var price=invNum(opts.unitPrice);if(!(price>0))return 'price';
  var ce=catalogEntry(sym)||{};
  var cur=opts.unitCur||ce.currency||(pacHolding(sym)||{}).currency||'EUR';
  var fees=invNum(opts.fees);if(fees<0)fees=0;
  var isNew=!pacHolding(sym);
  if(!isSell&&isNew&&!canAdd('investments'))return 'limit';
  if(isSell){
    var have=invNum((pacHolding(sym)||{}).qty);
    if(!(have>0))return 'noqty';
  }
  var amountEur=units*price*fxToEur(cur);
  var cash=isSell?Math.max(0,amountEur-fees):(amountEur+fees);
  cash=Math.round(cash*100)/100;
  state.transactions=state.transactions||[];
  state.transactions.push({
    id:uid('tx'),type:(isSell?'income':'expense'),amount:cash,
    accountId:opts.accountId,categoryId:ensureInvestCategory(),
    merchant:(isSell?'Vendita ':'Acquisto ')+sym,note:ce.name||opts.name||'',
    date:opts.date||todayISO(),tags:[],createdAt:Date.now(),
    source:(isSell?'sell':'buy'),units:units,symbol:sym,unitPrice:price,unitCur:cur,fees:fees
  });
  ensureInvestAccount();
  recomputeHolding(sym);
  saveState();
  try{updatePortfolioHistory();}catch(e){}
  return {symbol:sym,units:units,price:price,currency:cur,amountEur:amountEur,sell:isSell};
}

/* ================================================================
   FOGLIO "AGGIUNGI MOVIMENTO" (v66) — acquisto/vendita come sull'estratto.
   Scegli l'asset (catalogo o simbolo a mano), tipo, data, quote e prezzo
   eseguiti; l'importo si calcola da solo. Registra tramite recordMovement.
================================================================ */
function openMovementSheet(opts){
  opts=opts||{};
  var ce0=opts.symbol?catalogEntry(opts.symbol):null;
  /* Ripropone l'ultimo conto usato per un movimento (comodo per chi investe
     sempre dallo stesso conto). Preferenza locale sul dispositivo: non passa
     dal cloud, quindi niente da aggiungere a migrateFromRaw. */
  var _accs0=pickableAccounts(),_lastAcc=null;
  try{_lastAcc=window.localStorage.getItem('spendy-last-inv-acc');}catch(e){}
  var _initAcc=(_lastAcc&&_accs0.some(function(a){return a.id===_lastAcc;}))?_lastAcc:(_accs0[0]||{}).id;
  var m={type:'buy',symbol:String(opts.symbol||'').toUpperCase(),
    name:(ce0&&ce0.name)||'',kind:(ce0&&ce0.kind)||'etf',
    cur:(ce0&&ce0.currency)||((pacHolding(opts.symbol||'')||{}).currency)||'EUR',
    date:todayISO(),qtyStr:'',priceStr:'',feesStr:'',hintAmount:invNum(opts.hintAmount),
    accountId:_initAcc,picking:!opts.symbol,q:'',err:''};
  function readInputs(){
    var g=function(id){var e=document.getElementById(id);return e?e.value:undefined;},v;
    v=g('mvQty');if(v!==undefined)m.qtyStr=v;
    v=g('mvPrice');if(v!==undefined)m.priceStr=v;
    v=g('mvFees');if(v!==undefined)m.feesStr=v;
    v=g('mvDate');if(v!==undefined)m.date=v||todayISO();
  }
  function calcEur(){var q=invNum(m.qtyStr),p=invNum(m.priceStr);if(!(q>0)||!(p>0))return null;return q*p*fxToEur(m.cur);}
  /* Riga sotto l'Importo: mostra quanto esce/entra davvero dal conto una volta
     aggiunte (acquisto) o tolte (vendita) le commissioni. Vuota se non ci sono
     commissioni o se l'importo non e' ancora calcolabile. */
  function feeHintTxt(){
    var eur=calcEur(),fee=invNum(m.feesStr);
    if(eur==null||!(fee>0))return '';
    var isSell=m.type==='sell',total=isSell?Math.max(0,eur-fee):(eur+fee);
    return (isSell?'− ':'+ ')+fmt(fee)+' '+tr('di commissioni')+' · '+(isSell?tr('entra'):tr('esce'))+' '+(m.cur!=='EUR'?'≈ ':'')+fmt(total);

      var id=sl.dataset.budgetSlider,card=sl.closest('.budget-card');

        var v=parseFloat(sl.value)||0,mx=parseFloat(sl.max)||1;
        sl.style.setProperty('--slider-pct',(v/mx*100).toFixed(1)+'%');
        var num=card.querySelector('[data-budget-cat]');if(num)num.value=v>0?v:'';
        var fig=card.querySelector('.budget-figures');
        var sp=totalOf(filteredTx(currentMonthKey(),'all',id,'expense'));
        if(fig)fig.textContent=v>0?fmt(sp)+' / '+fmt(v):fmt(sp);
      };
      sl.onchange=function(){setBudgetLimit(id,parseFloat(sl.value)||0);refreshCard(id);};
    });
    document.querySelectorAll('[data-budget-cat]').forEach(function(inp){
      inp.onchange=function(){
        var id=inp.dataset.budgetCat;
        setBudgetLimit(id,parseFloat(String(inp.value).replace(',','.')));
        var v=state.budgets[id]||0,card=inp.closest('.budget-card'),sl=card.querySelector('[data-budget-slider]');
        if(sl){var mx=parseFloat(sl.max)||1;if(v>mx){sl.max=Math.max(mx,Math.ceil(v*1.6/50)*50);mx=parseFloat(sl.max);}sl.value=Math.min(v,mx);sl.style.setProperty('--slider-pct',(sl.value/mx*100).toFixed(1)+'%');}
        refreshCard(id);
      };
    });
    /* La gestione di categorie e tag ora vive nella scheda «Categorie & Tag». */
  }
  openModal('<div class="sheet"></div>');
  render();
}

/* Numero compatto per le etichette del grafico: 1.234 -> "1,2k". */
function fmtShort(n){
  n=Math.round(n||0);var a=Math.abs(n),s;
  if(a>=1000){var k=a/1000;s=(k>=10?Math.round(k):Math.round(k*10)/10).toString().replace('.',',')+'k';}
  else s=String(a);
  return (n<0?'−':'')+s;
}

/* Totale mensile di un tag (per tipo di movimento). filteredTx non filtra
   per tag, quindi qui scorriamo direttamente le transazioni. */
function tagMonthTotal(tagId,monthKey,type){
  return state.transactions.filter(function(t){
    return t.date.slice(0,7)===monthKey && t.tags && t.tags.indexOf(tagId)>-1 && (type==='all'||t.type===type);
  }).reduce(function(s,e){return s+e.amount;},0);
}

/* Grafico a barre dell'andamento su N mesi, con eventuale linea del budget
   (tratteggiata, ambra). Le barre che superano il budget diventano rosse. */
function trendChartSVG(keys,values,budget,barHex){
  var W=360,H=190,TOP=20,BTM=26,chartH=H-TOP-BTM;
  var maxData=Math.max.apply(null,[1].concat(values));
  var maxVal=(budget>0?Math.max(maxData,budget):maxData)*1.15;
  var gW=W/keys.length,bW=Math.min(30,gW*0.52),baseY=TOP+chartH,out='';
  var budgetLine='',budgetLabel='';
  if(budget>0){
    var by=baseY-(budget/maxVal*chartH);
    /* La linea di riferimento resta sotto le barre. L'etichetta, invece, viene
       disegnata SOPRA le barre (in coda all'SVG) con una "pillola" di sfondo,
       così resta sempre leggibile anche quando una barra alta le passa davanti.
       Se la linea è troppo in alto, l'etichetta scende sotto la linea. */
    budgetLine='<line x1="0" y1="'+by.toFixed(1)+'" x2="'+W+'" y2="'+by.toFixed(1)+'" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="5 4"/>';
    var blbl=tr('Budget')+' '+fmtShort(budget);
    var bLblW=blbl.length*5.7+12;
    var above=(by-15)>=(TOP-2);
    var pillY=above?(by-15):(by+2);
    var txtY=above?(by-5):(by+12);
    budgetLabel='<g><rect x="2" y="'+pillY.toFixed(1)+'" width="'+bLblW.toFixed(1)+'" height="13.5" rx="6.75" fill="var(--surface)" opacity="0.9"/>'+
      '<text x="7" y="'+txtY.toFixed(1)+'" font-size="10" fill="var(--amber)" font-weight="700">'+blbl+'</text></g>';
  }
  for(var i=0;i<keys.length;i++){
    var x=i*gW,cx=x+gW/2,v=values[i],bh=v/maxVal*chartH;
    var over=budget>0&&v>budget,col=over?'var(--red)':(barHex||'var(--accent)');
    if(bh>0.6)out+='<rect x="'+(cx-bW/2).toFixed(1)+'" y="'+(baseY-bh).toFixed(1)+'" width="'+bW.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="4" fill="'+col+'"/>';
    if(v>0)out+='<text x="'+cx.toFixed(1)+'" y="'+Math.max(TOP-6,baseY-bh-5).toFixed(1)+'" text-anchor="middle" font-size="8.5" fill="var(--ink-soft)">'+fmtShort(v)+'</text>';
    out+='<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--ink-faint)">'+monthShortLabel(keys[i])+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%"><line x1="0" y1="'+baseY+'" x2="'+W+'" y2="'+baseY+'" stroke="var(--border)" stroke-width="1"/>'+budgetLine+out+budgetLabel+'</svg>';
}

/* Scheda dedicata: elenco di categorie e tag (gestione + apertura grafico).
   Ha due viste interne: 'list' (elenco) e 'trend' (grafico di un elemento). */
function openCatsTagsSheet(){
  var view={mode:'list'};
  var N=6; // mesi mostrati nel grafico

  function listBodyHTML(){
    var incomeCats=catsByType('income'),expCats=catsByType('expense');
    return '<p class="hint">'+tr('Tocca una categoria o un tag per vederne l\'andamento nel tempo. Usa ✏️ per rinominare e 🗑 per eliminare.')+'</p>'+
      '<section class="card" style="display:flex;flex-direction:column;gap:8px;"><h3 style="margin:0;font-size:14.5px;">'+tr('Categorie di spesa')+'</h3>'+(expCats.length?expCats.map(catManageRowHTML).join(''):'<p class="empty-note">'+tr('Nessuna categoria.')+'</p>')+'</section>'+
      '<section class="card" style="display:flex;flex-direction:column;gap:8px;"><h3 style="margin:0;font-size:14.5px;">'+tr('Categorie di entrata')+'</h3>'+(incomeCats.length?incomeCats.map(catManageRowHTML).join(''):'<p class="empty-note">'+tr('Nessuna categoria.')+'</p>')+'</section>'+
      '<section class="card" style="display:flex;flex-direction:column;gap:10px;"><h3 style="margin:0;font-size:14.5px;">'+tr('Nuova categoria')+'</h3><div class="segmented small"><button class="'+(ui.newCatType==='expense'?'active':'')+'" data-newcat-type="expense">'+tr('Di spesa')+'</button><button class="'+(ui.newCatType==='income'?'active mode-income':'')+'" data-newcat-type="income">'+tr('Di entrata')+'</button></div><div class="new-cat-row"><input id="newCatEmoji" class="emoji-input" maxlength="2" placeholder="🙂"><input id="newCatName" class="text-input" placeholder="'+tr('Nome categoria')+'"><button class="btn-primary-sm" id="addCatBtn">'+tr('Aggiungi')+'</button></div></section>'+
      '<section class="card" style="display:flex;flex-direction:column;gap:8px;"><h3 style="margin:0;font-size:14.5px;">'+tr('Tag')+'</h3>'+(state.tags.length?state.tags.map(tagManageRowHTML).join(''):'<p class="empty-note">'+tr('Nessun tag: li crei quando aggiungi un movimento.')+'</p>')+'</section>';
  }

  function trendBodyHTML(){
    var keys=lastNMonthKeys(N),title,values,budget=0,barHex,noteHTML='';
    if(view.kind==='cat'){
      var c=catById(view.id);
      title='<span class="cat-bubble" style="background:'+colorHex(c.color)+'22;width:30px;height:30px;border-radius:9px;font-size:15px;">'+emo3d(c.emoji)+'</span> '+esc(c.name);
      values=keys.map(function(k){return totalOf(filteredTx(k,'all',c.id,c.type));});
      barHex=colorHex(c.color);
      if(c.type==='expense'){
        budget=state.budgets[c.id]||0;
        if(budget<=0)noteHTML='<p class="hint">'+tr('Questa categoria non ha un budget mensile. Impostane uno nella scheda «Budget mensili» per vedere la linea di riferimento.')+'</p>';
      }else{
        noteHTML='<p class="hint">Andamento delle entrate di questa categoria negli ultimi '+keys.length+' mesi. Le entrate non hanno un budget.</p>';
      }
    }else{
      var t=tagById(view.id);
      title='<span class="dot" style="background:'+colorHex(t.color)+';width:16px;height:16px;border-radius:50%;display:inline-block;"></span> '+esc(t.name);
      values=keys.map(function(k){return tagMonthTotal(t.id,k,'expense');});
      barHex=colorHex(t.color);
      noteHTML='<p class="hint">'+tr('Uscite associate a questo tag, mese per mese. I tag non hanno un budget.')+'</p>';
    }
    var tot=values.reduce(function(s,v){return s+v;},0),avg=tot/keys.length,maxV=Math.max.apply(null,values);
    var overCount=budget>0?values.filter(function(v){return v>budget;}).length:0;
    var statsHTML='<div class="trend-stats">'+
      '<div class="trend-stat"><div class="trend-stat-val">'+fmt(avg)+'</div><div class="trend-stat-lbl">'+tr('Media / mese')+'</div></div>'+
      '<div class="trend-stat"><div class="trend-stat-val">'+fmt(maxV)+'</div><div class="trend-stat-lbl">'+tr('Mese più alto')+'</div></div>'+
      (budget>0?'<div class="trend-stat"><div class="trend-stat-val">'+overCount+'/'+keys.length+'</div><div class="trend-stat-lbl">'+tr('Mesi oltre budget')+'</div></div>':'<div class="trend-stat"><div class="trend-stat-val">'+fmt(tot)+'</div><div class="trend-stat-lbl">'+tr('Totale')+' '+keys.length+' '+tr('mesi')+'</div></div>')+
    '</div>';
    return '<button class="trend-back" id="trendBack" data-back="1">'+tr('‹ Categorie & Tag')+'</button>'+
      '<h3 style="margin:2px 0 0;font-family:var(--font-display);font-size:18px;letter-spacing:-0.01em;display:flex;align-items:center;gap:8px;">'+title+'</h3>'+
      '<div class="chart-wrap">'+trendChartSVG(keys,values,budget,barHex)+'</div>'+
      statsHTML+noteHTML;
  }

  function sheetHTML(){
    if(view.mode==='trend')return '<div class="sheet"><div class="sheet-handle"></div>'+trendBodyHTML()+'</div>';
    return '<div class="sheet"><div class="sheet-handle"></div><h3 style="margin:4px 0 0;font-family:var(--font-display);font-size:18px;letter-spacing:-0.01em;">'+tr('Categorie &amp; Tag')+'</h3>'+listBodyHTML()+'</div>';
  }

  function render(){
    var wrap=document.querySelector('#modal-root .sheet-wrap');
    if(!wrap){openModal('<div class="sheet"></div>');}
    wrap=rerenderSheetWrap(sheetHTML());
    if(!wrap)return;
    wire();
  }

  function wire(){
    var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;
    if(view.mode==='trend'){
      var back=document.getElementById('trendBack');
      if(back)back.onclick=function(){view={mode:'list'};render();};
      return;
    }
    document.querySelectorAll('[data-cat-trend]').forEach(function(b){b.onclick=function(){ui.editingCatId=null;ui.editingTagId=null;view={mode:'trend',kind:'cat',id:b.dataset.catTrend};render();};});
    document.querySelectorAll('[data-tag-trend]').forEach(function(b){b.onclick=function(){ui.editingCatId=null;ui.editingTagId=null;view={mode:'trend',kind:'tag',id:b.dataset.tagTrend};render();};});
    document.querySelectorAll('[data-newcat-type]').forEach(function(b){b.onclick=function(){
      ui.newCatType=b.dataset.newcatType;
      document.querySelectorAll('[data-newcat-type]').forEach(function(q){q.classList.remove('active','mode-income');});
      b.classList.add('active');if(ui.newCatType==='income')b.classList.add('mode-income');
    };});
    var ab=document.getElementById('addCatBtn');
    if(ab)ab.onclick=function(){
      var name=document.getElementById('newCatName').value.trim(),emoji=document.getElementById('newCatEmoji').value.trim()||(ui.newCatType==='income'?'💰':'🏷️');
      if(!name){showToast(tr('Dai un nome alla categoria'));return;}
      if(!canAdd('customCats')){premiumBlock('customCats');return;}
      state.categories.push({id:uid('cat'),name:name,emoji:emoji,color:state.categories.length%8,type:ui.newCatType,custom:true});
      saveState();showToast(tr('Categoria aggiunta'));render();
    };
    document.querySelectorAll('[data-cat-edit]').forEach(function(b){b.onclick=function(){ui.editingCatId=b.dataset.catEdit;ui.editingTagId=null;render();};});
    document.querySelectorAll('[data-cat-canceledit]').forEach(function(b){b.onclick=function(){ui.editingCatId=null;render();};});
    document.querySelectorAll('[data-cat-save]').forEach(function(b){b.onclick=function(){
      var c=catById(b.dataset.catSave);
      var nm=(document.getElementById('editCatName').value||'').trim(),em=(document.getElementById('editCatEmoji').value||'').trim();
      if(!nm){showToast(tr('Il nome non può essere vuoto'));return;}
      c.name=nm;if(em)c.emoji=em;
      ui.editingCatId=null;saveState();showToast(tr('Categoria aggiornata'));render();
    };});
    document.querySelectorAll('[data-cat-del]').forEach(function(b){b.onclick=function(){
      var id=b.dataset.catDel,c=catById(id),n=catUsageCount(id);
      if(state.categories.filter(function(x){return x.type===c.type;}).length<=1){showToast(tr('Deve restare almeno una categoria di questo tipo'));return;}
      var others=state.categories.filter(function(x){return x.type===c.type&&x.id!==id;}),target=others[0];
      var warn=n===0?tr('Nessun movimento usa questa categoria.'):(n+' '+tr('movimenti/ricorrenti passeranno a')+' "'+target.emoji+' '+target.name+'".');
      confirmDialog(tr('Eliminare la categoria')+' "'+c.emoji+' '+c.name+'"? '+warn,function(){
        state.transactions.forEach(function(t){if(t.categoryId===id)t.categoryId=target.id;});
        state.recurring.forEach(function(r){if(r.categoryId===id)r.categoryId=target.id;});
        delete state.budgets[id];
        state.categories=state.categories.filter(function(x){return x.id!==id;});
        ui.editingCatId=null;saveState();showToast(tr('Categoria eliminata'));render();
      },'Elimina');
    };});
    document.querySelectorAll('[data-tag-edit]').forEach(function(b){b.onclick=function(){ui.editingTagId=b.dataset.tagEdit;ui.editingCatId=null;render();};});
    document.querySelectorAll('[data-tag-canceledit]').forEach(function(b){b.onclick=function(){ui.editingTagId=null;render();};});
    document.querySelectorAll('[data-tag-save]').forEach(function(b){b.onclick=function(){
      var t=tagById(b.dataset.tagSave);
      var nm=(document.getElementById('editTagName').value||'').trim();
      if(!nm){showToast(tr('Il nome non può essere vuoto'));return;}
      t.name=nm;ui.editingTagId=null;saveState();showToast(tr('Tag aggiornato'));render();
    };});
    document.querySelectorAll('[data-tag-del]').forEach(function(b){b.onclick=function(){
      var id=b.dataset.tagDel,t=tagById(id),n=tagUsageCount(id);
      var warn=n===0?tr('Nessun movimento usa questo tag.'):(tr('Verrà tolto da')+' '+n+' '+tr('movimenti (i movimenti restano).'));
      confirmDialog(tr('Eliminare il tag')+' "'+t.name+'"? '+warn,function(){
        state.transactions.forEach(function(x){if(x.tags)x.tags=x.tags.filter(function(g){return g!==id;});});
        state.transfers.forEach(function(x){if(x.tags)x.tags=x.tags.filter(function(g){return g!==id;});});
        state.tags=state.tags.filter(function(x){return x.id!==id;});
        if(ui.tagFilter===id)ui.tagFilter=null;
        ui.editingTagId=null;saveState();showToast(tr('Tag eliminato'));render();
      },'Elimina');
    };});
  }

  ui.editingCatId=null;ui.editingTagId=null;
  openModal('<div class="sheet"></div>');
  render();
}

/* Le emoji possono arrivare con o senza il selettore di variante
   U+FE0F (e 21A9 anche senza), quindi normalizzo prima di cercare. */
function emo3dSrc(em){
  if(!em)return null;
  var k=String(em).replace(/[\uFE0F\u200D]/g,'');
  return EMO3D[k]||EMO3D[String(em)]||null;
}
function emo3d(em,cls){
  var src=emo3dSrc(em);
  if(!src)return esc(em==null?'':em);
  return '<img class="emo3d'+(cls?' '+cls:'')+'" src="'+src+'" alt="'+esc(em)+'" draggable="false">';
}
var PROFILE_KEY='expense-tracker-profile-v1';
/* Vecchia cassetta (solo localStorage): serve unicamente a recuperare il nome
   di chi aggiorna da una versione precedente. Da qui in avanti il profilo sta
   dentro state.profile, quindi sopravvive alla reinstallazione dell'app e
   viaggia col cloud. */
function legacyProfile(){
  try{var raw=window.localStorage.getItem(PROFILE_KEY);return raw?JSON.parse(raw):null;}catch(e){return null;}
}
function profileObj(){
  if(state){
    if(!state.profile||typeof state.profile!=='object')state.profile={name:'',avatar:''};
    return state.profile;
  }
  return legacyProfile()||{name:'',avatar:''};
}
function profileName(){var p=profileObj();return p&&p.name?String(p.name):'';}
function profileAvatar(){var p=profileObj();return p&&p.avatar?String(p.avatar):'';}
var profileSaveTimer=null;
function persistProfile(){
  /* Copia di sicurezza immediata sul dispositivo + salvataggio dello stato
     raggruppato, cosi' scrivere il nome lettera per lettera non genera una
     scrittura sul cloud a ogni tasto. */
  try{window.localStorage.setItem(PROFILE_KEY,JSON.stringify({name:profileName(),avatar:profileAvatar()}));}catch(e){}
  clearTimeout(profileSaveTimer);
  profileSaveTimer=setTimeout(function(){if(state)saveState();},600);
}
function saveProfileName(name){
  profileObj().name=String(name||'').trim().slice(0,24);
  persistProfile();
}
function saveProfileAvatar(val){
  profileObj().avatar=val?String(val):'';
  persistProfile();
}
function avatarInitial(){var n=profileName().trim();return n?n.charAt(0).toUpperCase():'';}

/* Cosa mostrare nel cerchio: foto, avatar, iniziale del nome o sagoma. */
function avatarInnerHTML(){
  var a=profileAvatar();
  if(a.indexOf('data:')===0)return '<img src="'+esc(a)+'" alt="">';
  if(a)return '<span class="pa-emoji">'+esc(a)+'</span>';
  var ini=avatarInitial();
  return ini?esc(ini):AVATAR_SVG;
}
/* Ritaglia al centro, ridimensiona a 192px e comprime: la foto pesa pochi KB,
   entra senza problemi nel salvataggio e nella sincronizzazione. */
function avatarFromFile(file,cb){
  if(!file){cb(null);return;}
  var fr=new FileReader();
  fr.onerror=function(){cb(null);};
  fr.onload=function(){
    var img=new Image();
    img.onerror=function(){cb(null);};
    img.onload=function(){
      try{
        var S=192,cv=document.createElement('canvas');
        cv.width=S;cv.height=S;
        var ctx=cv.getContext('2d');
        var side=Math.min(img.width,img.height);
        ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S);
        cb(cv.toDataURL('image/jpeg',0.82));
      }catch(e){cb(null);}
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function openAvatarSheet(){
  var cur=profileAvatar();
  openCenteredModal('<div class="confirm-box" style="text-align:left;">'+
    '<h3 style="margin:0 0 4px;font-size:16px;">'+tr('Immagine del profilo')+'</h3>'+
    '<p class="hint" style="margin:0 0 10px;">'+tr('Scegli una foto dal dispositivo oppure un avatar.')+'</p>'+
    '<button class="btn-primary full-width" id="avPick">'+tr('Scegli una foto')+'</button>'+
    '<div class="avatar-grid">'+AVATAR_EMOJIS.map(function(e){
      return '<button class="avatar-opt'+(cur===e?' selected':'')+'" data-av="'+esc(e)+'">'+e+'</button>';
    }).join('')+'</div>'+
    (cur?'<button class="btn-secondary full-width" id="avClear" style="margin-top:10px;">'+tr('Rimuovi immagine')+'</button>':'')+
    '<button class="btn-secondary full-width" id="avCancel" style="margin-top:8px;">'+tr('Annulla')+'</button>'+
    '<input type="file" accept="image/*" id="avFile" style="display:none;">'+
  '</div>');
  var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;
  document.getElementById('avCancel').onclick=closeModal;
  var clr=document.getElementById('avClear');
  if(clr)clr.onclick=function(){saveProfileAvatar('');closeModal();renderActiveTab();};
  document.querySelectorAll('.avatar-opt').forEach(function(b){
    b.onclick=function(){saveProfileAvatar(b.dataset.av);closeModal();renderActiveTab();};
  });
  var f=document.getElementById('avFile');
  document.getElementById('avPick').onclick=function(){f.click();};
  f.onchange=function(){
    var file=f.files&&f.files[0];
    if(!file)return;
    avatarFromFile(file,function(data){
      if(!data){showToast(tr('Immagine non leggibile'));return;}
      saveProfileAvatar(data);closeModal();renderActiveTab();
    });
  };
}

function updateAvatarFab(){
  var a=document.getElementById('profileAvatar');
  if(!a)return;
  a.innerHTML=avatarInnerHTML();
}

/* ================================================================
   CAROTA PREMIUM 2 — STATISTICHE AVANZATE
   Costruite sui dati gia' presenti: nessun dato nuovo da raccogliere.
   Contiene: confronto con il mese scorso, proiezione di fine mese,
   top categorie con variazione, andamento 12 mesi, giorno piu' costoso.
================================================================ */
function monthKeyBack(n){
  var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(n||0));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthLabelShort(mk){
  try{
    var p=mk.split('-'),d=new Date(+p[0],+p[1]-1,1);
    return new Intl.DateTimeFormat(currentLocale(),{month:'short'}).format(d);
  }catch(e){return mk;}
}
function monthTotals(mk){
  var ex=0,inc=0;
  (state.transactions||[]).forEach(function(t){
    if(!t.date||t.date.slice(0,7)!==mk)return;
    if(t.type==='income')inc+=t.amount;else ex+=t.amount;
  });
  return {exp:ex,inc:inc,saved:inc-ex};
}
function deltaHTML(cur,prev,lowerIsBetter){
  if(!prev){return '<span class="stat-delta neutral">—</span>';}
  var d=(cur-prev)/Math.abs(prev)*100;
  var up=d>0,good=lowerIsBetter?!up:up;
  var sign=up?'+':'−';
  return '<span class="stat-delta '+(Math.abs(d)<0.5?'neutral':(good?'good':'bad'))+'">'+sign+Math.abs(d).toFixed(0)+'%</span>';
}
function expByCategory(mk){
  var map={};
  (state.transactions||[]).forEach(function(t){
    if(!t.date||t.date.slice(0,7)!==mk||t.type==='income')return;
    map[t.categoryId]=(map[t.categoryId]||0)+t.amount;
  });
  return map;
}
function heaviestWeekday(){
  var sums=[0,0,0,0,0,0,0],counts=[0,0,0,0,0,0,0],any=false;
  var limit=monthKeyBack(5);
  (state.transactions||[]).forEach(function(t){
    if(!t.date||t.type==='income')return;
    if(t.date.slice(0,7)<limit)return;
    var p=t.date.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
    var w=d.getDay();
    if(isNaN(w))return;
    sums[w]+=t.amount;counts[w]++;any=true;
  });
  if(!any)return null;
  var best=0;
  for(var i=1;i<7;i++){if(sums[i]>sums[best])best=i;}
  if(!sums[best])return null;
  var names;
  try{
    names=[];
    for(var k=0;k<7;k++){
      var dd=new Date(2024,0,7+k); /* 7 gen 2024 = domenica */
      names.push(new Intl.DateTimeFormat(currentLocale(),{weekday:'long'}).format(dd));
    }
  }catch(e){names=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];}
  return {name:names[best],total:sums[best],count:counts[best]};
}

   STATISTICHE AVANZATE — CALCOLI NUOVI (v46)
================================================================ */
function statsMonthKeys(n){var a=[];for(var i=n-1;i>=0;i--)a.push(monthKeyBack(i));return a;}
function monthEndISO(mk){var p=mk.split('-'),d=new Date(+p[0],+p[1],0);return mk+'-'+String(d.getDate()).padStart(2,'0');}
/* Tasso di risparmio: quanta parte di quello che entra resta in tasca. */
function savingsRateSeries(n){
  return statsMonthKeys(n).map(function(k){
    var t=monthTotals(k);
    return {k:k,label:monthLabelShort(k),inc:t.inc,exp:t.exp,rate:(t.inc>0?((t.inc-t.exp)/t.inc*100):null)};
  });
}
/* Patrimonio a fine di ogni mese. Si parte dal saldo di OGGI e si torna
   indietro togliendo i movimenti successivi: cosi' la curva finisce sempre
   esattamente sul saldo reale. I giroconti fra conti propri non contano
   (spostare soldi non cambia il patrimonio), tranne quando un conto e'
   tenuto fuori dal totale: in quel caso il passaggio si vede. */
function netWorthSeries(n){
  var oggi=totalBalance(),dentro={};
  accountsInTotal().forEach(function(a){dentro[a.id]=true;});
  /* Il conto Investimenti non ha movimenti da riavvolgere: il suo valore
     passato si legge dallo storico del portafoglio. Lo si toglie da oggi e
     lo si rimette con il valore che aveva a fine di quel mese. */
  var accInv=investAccount();
  var invDentro=!!(accInv&&dentro[accInv.id]);
  var invOggi=invDentro?portfolioValueEur():0;
  return statsMonthKeys(n).map(function(k){
    var fine=monthEndISO(k),dopo=0;
    (state.transactions||[]).forEach(function(t){
      if(!t.date||txCashDate(t)<=fine||!dentro[t.accountId])return;
      dopo+=(t.type==='income'?t.amount:-t.amount);
    });
    (state.transfers||[]).forEach(function(tr){
      if(!tr.date||tr.date<=fine)return;
      if(dentro[tr.fromAccountId]&&!dentro[tr.toAccountId])dopo-=tr.amount;
      if(dentro[tr.toAccountId]&&!dentro[tr.fromAccountId])dopo+=tr.amount;
    });
    var v=oggi-dopo;
    if(invDentro)v=v-invOggi+investValueAtEur(fine);
    return {k:k,label:monthLabelShort(k),v:v};
  });
}
/* Mesi di autonomia: quanto durerebbero i soldi che hai, alle tue spese
   medie degli ultimi 6 mesi CHIUSI (quello in corso e' ancora parziale). */
function monthsOfRunway(){
  var chiusi=statsMonthKeys(7).slice(0,6),tot=0,quanti=0;
  chiusi.forEach(function(k){var t=monthTotals(k);if(t.exp>0){tot+=t.exp;quanti++;}});
  if(!quanti)return null;
  var media=tot/quanti;
  if(media<=0)return null;
  /* Autonomia = soldi LIQUIDI diviso spesa media: gli investimenti non
     sono soldi da cui si vive il mese prossimo. */
  var soldi=liquidBalance();
  return {mesi:soldi/media,media:media,soldi:soldi};
}
/* Quanto della spesa e' "obbligata" (ricorrenti attive) e quanto e' scelta. */
function fixedVsVariable(mk){
  var fisse=(state.recurring||[]).reduce(function(s,r){
    if(r.status==='paused'||r.type==='income'||recFinished(r))return s;
    return s+recMonthlyEquiv(r);
  },0);
  var tot=monthTotals(mk).exp;
  return {fisse:fisse,variabili:Math.max(0,tot-fisse),tot:tot,
          pct:(tot>0?Math.min(100,fisse/tot*100):0)};
}
/* Giorni del mese in cui non hai speso niente. */
function noSpendDays(mk){
  var spesi={};
  (state.transactions||[]).forEach(function(t){
    if(!t.date||t.date.slice(0,7)!==mk||t.type==='income')return;
    spesi[t.date]=true;
  });
  var p=mk.split('-'),giorni=new Date(+p[0],+p[1],0).getDate();
  var fino=(mk===currentMonthKey())?Math.min(giorni,+todayISO().slice(8,10)):giorni;
  var senza=0;
  for(var d=1;d<=fino;d++){if(!spesi[mk+'-'+String(d).padStart(2,'0')])senza++;}
  return {senza:senza,su:fino};
}
/* Dove spendi di piu': classifica per esercente, non per categoria. */
function topMerchants(mesi,quanti){
  var limite=monthKeyBack((mesi||3)-1),map={};
  (state.transactions||[]).forEach(function(t){
    if(!t.date||t.type==='income'||t.date.slice(0,7)<limite)return;
    var testo=t.merchant||t.note||'',k=merchantKey(testo);
    if(!k)return;
    if(!map[k])map[k]={key:k,label:merchantLabel(testo)||k,total:0,count:0};
    map[k].total+=t.amount;map[k].count++;
  });
  return Object.keys(map).map(function(k){return map[k];})
    .sort(function(a,b){return b.total-a.total;}).slice(0,quanti||5);
}
/* "Inflazione personale": ultimi 12 mesi contro i 12 precedenti. */
function yoyChange(){
  var ora=0,prima=0,i;
  for(i=0;i<12;i++)ora+=monthTotals(monthKeyBack(i)).exp;
  for(i=12;i<24;i++)prima+=monthTotals(monthKeyBack(i)).exp;
  if(prima<=0||ora<=0)return null;
  return {ora:ora,prima:prima,pct:(ora-prima)/prima*100};
}
/* Grafici piccoli, senza librerie esterne. */
function statLineSVG(vals){
  var W=100,H=42,n=vals.length;
  if(n<2)return '';
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),d=(mx-mn)||1;
  var pts=vals.map(function(v,i){
    return (i*(W/(n-1))).toFixed(2)+','+(H-2-((v-mn)/d)*(H-6)).toFixed(2);
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:66px;display:block;" aria-hidden="true">'+
    '<path d="M0,'+H+' L'+pts.join(' L')+' L'+W+','+H+' Z" fill="var(--accent)" opacity="0.12"/>'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
}
function statRateBarsSVG(serie){
  var W=100,H=44,n=serie.length,bw=W/Math.max(1,n),zero=H/2,out='';
  var mx=20;
  serie.forEach(function(s){if(s.rate!=null)mx=Math.max(mx,Math.abs(s.rate));});
  serie.forEach(function(s,i){
    if(s.rate==null)return;
    var h=Math.max(1,Math.abs(s.rate)/mx*(zero-2));
    out+='<rect x="'+(i*bw+bw*0.22).toFixed(2)+'" y="'+((s.rate>=0?zero-h:zero)).toFixed(2)+
      '" width="'+(bw*0.56).toFixed(2)+'" height="'+h.toFixed(2)+'" rx="0.9" fill="'+
      (s.rate>=0?'var(--accent)':'var(--red)')+'" opacity="'+(i===n-1?'1':'0.6')+'"/>';
  });
  out+='<line x1="0" y1="'+zero+'" x2="'+W+'" y2="'+zero+'" stroke="var(--ink-faint)" stroke-width="0.4" opacity="0.5"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:72px;display:block;" aria-hidden="true">'+out+'</svg>';
}

/* ================================================================
   RADAR ABBONAMENTI (Premium, v46)
   Legge i movimenti degli ultimi 12 mesi e cerca i pagamenti che tornano
   sempre uguali dallo stesso esercente: quelli sono abbonamenti. Mostra
   quanto costano all'anno, quali NON sono ancora fra le ricorrenti e
   quali sono aumentati di prezzo senza che te ne accorgessi.
   Non inventa niente: usa solo i movimenti gia' registrati.
================================================================ */
function subsIgnoredList(){return state.subsIgnored||[];}
function subsAlreadyRecurring(k){
  return (state.recurring||[]).some(function(r){return merchantKey(r.name||'')===k;});
}
function subsCadence(mediaGiorni,scarto){
  if(mediaGiorni>=25&&mediaGiorni<=38&&scarto<=7)return 'monthly';
  if(mediaGiorni>=5&&mediaGiorni<=10&&scarto<=3)return 'weekly';
  if(mediaGiorni>=80&&mediaGiorni<=100&&scarto<=12)return 'quarterly';
  if(mediaGiorni>=330&&mediaGiorni<=400&&scarto<=25)return 'yearly';
  return null;
}
function subsPerMonth(cad,importo){
  if(cad==='weekly')return importo*52/12;
  if(cad==='quarterly')return importo/3;
  if(cad==='yearly')return importo/12;
  return importo;
}
function subsScan(){
  var limite=monthKeyBack(11),gruppi={};
  (state.transactions||[]).forEach(function(t){
    if(!t.date||t.type==='income'||t.type==='transfer')return;
    if(t.date.slice(0,7)<limite)return;
    var k=merchantKey(t.merchant||t.note||'');
    if(!k)return;
    (gruppi[k]=gruppi[k]||[]).push(t);
  });
  var out=[];
  Object.keys(gruppi).forEach(function(k){
    var lista=gruppi[k].slice().sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
    if(lista.length<3)return;
    /* Regolarita': distanza media fra un pagamento e il successivo. */
    var gap=[],prec=null;
    lista.forEach(function(t){
      var d=Date.parse(t.date);
      if(prec!=null&&!isNaN(d))gap.push((d-prec)/86400000);
      if(!isNaN(d))prec=d;
    });
    if(gap.length<2)return;
    var media=gap.reduce(function(a,b){return a+b;},0)/gap.length;
    var scarto=Math.sqrt(gap.reduce(function(a,g){return a+(g-media)*(g-media);},0)/gap.length);
    var cad=subsCadence(media,scarto);
    if(!cad)return;
    /* Importi simili fra loro: una spesa al supermercato cambia ogni volta,
       un abbonamento no. Tollero un 25% per gli aumenti di listino. */
    var imp=lista.map(function(t){return t.amount;});
    var mImp=imp.reduce(function(a,b){return a+b;},0)/imp.length;
    if(mImp<=0)return;
    var fuori=Math.max.apply(null,imp.map(function(v){return Math.abs(v-mImp)/mImp;}));
    if(fuori>0.25)return;
    var ultimo=lista[lista.length-1],primo=lista[0];
    var aumento=(primo.amount>0)?((ultimo.amount-primo.amount)/primo.amount*100):0;
    var perMese=subsPerMonth(cad,ultimo.amount);
    out.push({key:k,label:merchantLabel(ultimo.merchant||ultimo.note||'')||k,
      cadenza:cad,importo:ultimo.amount,perMese:perMese,anno:perMese*12,
      volte:lista.length,ultimo:ultimo.date,aumento:aumento,
      categoryId:ultimo.categoryId,accountId:ultimo.accountId,
      registrato:subsAlreadyRecurring(k),
      ignorato:subsIgnoredList().indexOf(k)>=0});
  });
  return out.sort(function(a,b){return b.anno-a.anno;});
}
function subsNextDate(s){
  function iso(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
  function avanti(x){
    if(s.cadenza==='weekly')x.setDate(x.getDate()+7);
    else if(s.cadenza==='quarterly')x.setMonth(x.getMonth()+3);
    else if(s.cadenza==='yearly')x.setFullYear(x.getFullYear()+1);
    else x.setMonth(x.getMonth()+1);
  }
  var p=String(s.ultimo).split('-'),d=new Date(+p[0],+p[1]-1,+p[2]),oggi=todayISO(),giri=0;
  do{avanti(d);giri++;}while(iso(d)<oggi&&giri<200);
  return iso(d);
}
function subsAddRecurring(key){
  var s=subsScan().filter(function(x){return x.key===key;})[0];
  if(!s)return;
  if(!canAdd('recurring')){premiumBlock('recurring');return;}
  state.recurring.push({id:uid('rec'),name:s.label,type:'expense',amount:s.importo,
    categoryId:s.categoryId||(state.categories[0]||{}).id,
    accountId:s.accountId||firstUsableAccountId(),
    cadence:s.cadenza,nextDate:subsNextDate(s),
    note:tr('Trovato dal radar abbonamenti'),status:'active',
    lastPaidDate:null,createdAt:Date.now()});
  saveState();
  showToast(tr('Aggiunto ai pagamenti ricorrenti'));
}
function subsIgnore(key){
  state.subsIgnored=(state.subsIgnored||[]).concat([key]);
  saveState();
}
function subsRestore(key){
  state.subsIgnored=(state.subsIgnored||[]).filter(function(k){return k!==key;});
  saveState();
}
function subsCadLabel(cad){
  var m={monthly:tr('ogni mese'),weekly:tr('ogni settimana'),quarterly:tr('ogni 3 mesi'),yearly:tr('ogni anno')};

}

/* Il quadro dei finanziamenti: quanto manca, quante rate, quando si
   finisce e quando cambia la rata. Compare solo se ce n'e' almeno uno. */
function loanStatsHTML(){
  var tutti=allLoans();
  if(!tutti.length)return '';
  var aperti=tutti.filter(function(r){return !recFinished(r);});
  var debito=aperti.reduce(function(t,r){return t+loanRemaining(r);},0);
  var mese=aperti.reduce(function(t,r){return t+recMonthlyEquiv(r);},0);
  var h='<section class="card" style="display:flex;flex-direction:column;gap:12px;">'+
    '<h3 style="margin:0;font-size:14.5px;">🚗 '+tr('Finanziamenti')+'</h3>';
  if(aperti.length){
    h+='<div class="stat-grid">'+
      '<div class="stat-box"><span class="stat-label">'+tr('Ancora da restituire')+'</span><span class="stat-value">'+fmt(debito)+'</span></div>'+
      '<div class="stat-box"><span class="stat-label">'+tr('Rate al mese')+'</span><span class="stat-value">'+fmt(mese)+'</span></div>'+
      '<div class="stat-box"><span class="stat-label">'+tr('Aperti')+'</span><span class="stat-value">'+aperti.length+'</span></div>'+
    '</div>';
  }
  tutti.forEach(function(r){
    var L=loanSummary(r);
    var quanto=L.finito?tr('Finito'):durataTesto(loanMonthsLeft(r));
    /* quando scatta lo scaglione dopo, e a quanto */
    var cambio='';
    var f=loanPhases(r),cnt=loanPhaseCounts(r),acc=0,fatte=L.ratePagate;
    for(var i=0;i<f.length;i++){
      acc+=cnt[i];
      if(fatte<acc&&i+1<f.length){
        cambio=tr('Dalla rata {N} passa a {I}').replace('{N}',String(acc+1)).replace('{I}',fmt(f[i+1].amount));
        break;
      }
    }
    h+='<div style="display:flex;flex-direction:column;gap:6px;">'+
      '<div class="stat-row-top"><span><strong>'+esc(r.name)+'</strong></span><span>'+fmt(L.residuo)+' / '+fmt(L.totale)+'</span></div>'+
      '<div class="loan-bar"><span style="width:'+Math.round(L.pct)+'%"></span></div>'+
      '<div class="loan-mini"><span>'+tr('{P} rate su {T}').replace('{P}','<b>'+L.ratePagate+'</b>').replace('{T}',String(L.rate))+'</span>'+
        '<span>'+(L.finito?tr('Concluso'):tr('mancano {Q}').replace('{Q}','<b>'+esc(quanto)+'</b>'))+'</span></div>'+
      '<div class="loan-mini"><span>'+tr('Rata attuale')+' <b>'+fmt(L.rataOra)+'</b></span>'+
        '<span>'+(L.ultima?tr('ultima il {D}').replace('{D}',esc(formatShortDateY(L.ultima))):'')+'</span></div>'+
      (loanExtraTotal(r)>0?'<div class="loan-mini"><span>⬆️ '+tr('Versamenti extra')+' <b>'+fmt(loanExtraTotal(r))+'</b></span><span>'+(loanExtraInRate(r)>0?tr('circa {N} rate in meno').replace('{N}',String(loanExtraInRate(r))):'')+'</span></div>':'')+
      (cambio?'<p class="dur-note" style="margin:0;">'+cambio+'</p>':'')+
    '</div>';
  });
  return h+'</section>';
}

      '<div class="sheet-handle"></div>'+
      '<h3 style="margin:4px 0 0;">'+tr('Come funziona Spendy')+'</h3>'+
      '<p class="hint" style="margin:0;">'+tr('Tocca una sezione per scoprirla.')+'</p>'+
      '<div class="info-scroll" id="infoScroll">'+
      sections.map(cardHTML).join('')+
      '</div>'+
      '<button class="btn-secondary full-width" id="infoReplayWelcome" style="margin-top:2px;">'+tr('Rivedi il benvenuto')+'</button>'+
      '<p class="profile-footer" style="margin-top:2px;">Spendy · '+tr('versione')+' '+APP_VERSION+'</p>'+
    '</div>';
  }
  function cardEl(i){return document.querySelector('#modal-root [data-info-idx="'+i+'"]');}
  function wireCard(i){
    var c=cardEl(i);if(!c)return;
    var h=c.querySelector('.info-head');
    if(h)h.onclick=function(){toggle(i);};
  }
  function swapCard(i){
    var c=cardEl(i);if(!c)return;
    c.outerHTML=cardHTML(sections[i],i);
    wireCard(i);
  }
  function toggle(i){
    var box=document.getElementById('infoScroll');
    var y=box?box.scrollTop:0;
    var prima=openIdx;
    openIdx=(openIdx===i)?-1:i;
    if(prima>-1&&prima!==i)swapCard(prima);
    swapCard(i);
    if(!box)return;
    box.scrollTop=y;                 /* il punto in cui stavi resta quello */
    if(openIdx!==i)return;
    /* se la sezione appena aperta finisce fuori vista la si accompagna
       dentro, senza saltare in cima al foglio */
    var c=cardEl(i);if(!c)return;
    var top=c.offsetTop,alt=c.offsetHeight,h=box.clientHeight;
    if(!h||!alt)return;   /* niente misure attendibili: meglio non toccare nulla */
    if(top<box.scrollTop)box.scrollTop=Math.max(top-8,0);
    else if(top+alt>box.scrollTop+h)box.scrollTop=Math.max(Math.min(top-8,top+alt-h+8),0);
  }
  function render(){
    var w=rerenderSheetWrap(sheetHTML());
    if(!w)return;
    var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;
    sections.forEach(function(x,i){wireCard(i);});
    var rw=document.getElementById('infoReplayWelcome');
    if(rw)rw.onclick=function(){closeModal();openWelcome();};
  }
  openModal('<div class="sheet"></div>');
  render();
}

function lastNMonthKeys(n){var out=[],k=currentMonthKey();for(var i=n-1;i>=0;i--)out.push(shiftMonth(k,-i));return out;}
function monthShortLabel(key){return monthAbbrev(parseInt(key.slice(5,7),10)-1);}
function sixMonthChartSVG(keys,incs,exps){
  var W=360,H=170,TOP=12,BTM=24,chartH=H-TOP-BTM;
  var maxVal=Math.max.apply(null,[1].concat(incs).concat(exps));
  var gW=W/keys.length,bW=14,gap=3,out='';
  var baseY=TOP+chartH;
  for(var i=0;i<keys.length;i++){
    var x=i*gW,gx=x+(gW-bW*2-gap)/2;
    var ih=incs[i]/maxVal*chartH,eh=exps[i]/maxVal*chartH;
    if(ih>0.5)out+='<rect x="'+gx.toFixed(1)+'" y="'+(baseY-ih).toFixed(1)+'" width="'+bW+'" height="'+ih.toFixed(1)+'" rx="3" fill="var(--accent)"/>';
    if(eh>0.5)out+='<rect x="'+(gx+bW+gap).toFixed(1)+'" y="'+(baseY-eh).toFixed(1)+'" width="'+bW+'" height="'+eh.toFixed(1)+'" rx="3" fill="var(--red)"/>';
    out+='<text x="'+(x+gW/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="var(--ink-faint)">'+monthShortLabel(keys[i])+'</text>';
    out+='<rect x="'+x.toFixed(1)+'" y="0" width="'+gW.toFixed(1)+'" height="'+H+'" fill="transparent" data-chart-idx="'+i+'"/>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%"><line x1="0" y1="'+baseY+'" x2="'+W+'" y2="'+baseY+'" stroke="var(--border)" stroke-width="1"/>'+out+'</svg>';
}
function dashboardData(){
  var mk=currentMonthKey();
  var keys=lastNMonthKeys(6);
  return{
    mk:mk,
    totalBal:totalBalance(),
    totals:periodTotals(mk,'all'),
    prevExp:periodTotals(shiftMonth(mk,-1),'all').expense,
    keys:keys,
    incs:keys.map(function(k){return periodTotals(k,'all').income;}),
    exps:keys.map(function(k){return periodTotals(k,'all').expense;})
  };
}

function openBalancesSheet(){
  var today=todayISO();
  var m={mode:'always',day:today,from:firstOfMonthISO(),to:today};
  function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function firstOfMonthISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';}
  function balCell(v,accId){return (accId?balHiddenAcc(accId):balHidden())?'••••':((v>=0?'':'−')+fmt(Math.abs(v)));}
  function rowsHTML(){
    var rows='',tot=0,tot2=0;
    state.accounts.forEach(function(a){
      var main,sub='';
      if(m.mode==='always'){main=accBalance(a.id);}
      else if(m.mode==='day'){main=accBalanceAt(a.id,m.day);}
      else{
        var flow=accFlowBetween(a.id,m.from,m.to),endBal=accBalanceAt(a.id,m.to);
        main=endBal;if(accInTotal(a))tot2+=flow;
        sub='<span class="bal-flow '+(flow>=0?'saldo-pos':'saldo-neg')+'">'+(flow>=0?'+':'−')+(balHiddenAcc(a.id)?'••••':fmt(Math.abs(flow)))+' '+tr('nel periodo')+'</span>';
      }
      if(accInTotal(a))tot+=main;
      var fuori=accInTotal(a)?'':' <span class="bal-out">'+tr('fuori bilancio')+'</span>';
      rows+='<div class="bal-row"><span class="dot" style="background:'+colorHex(a.color)+'"></span><span class="bal-name">'+esc(a.name)+fuori+sub+'</span><strong class="'+(main>=0?'saldo-pos':'saldo-neg')+'">'+balCell(main,a.id)+'</strong></div>';
    });
    var totLbl=m.mode==='range'?tr('Totale a fine periodo'):tr('Totale');
    rows+='<div class="bal-row bal-total"><span class="bal-name">'+totLbl+'</span><strong class="'+(tot>=0?'saldo-pos':'saldo-neg')+'">'+balCell(tot)+'</strong></div>';
    if(m.mode==='range')rows+='<div class="bal-row bal-total"><span class="bal-name">'+tr('Variazione nel periodo')+'</span><strong class="'+(tot2>=0?'saldo-pos':'saldo-neg')+'">'+(tot2>=0?'+':'−')+(balHidden()?'••••':fmt(Math.abs(tot2)))+'</strong></div>';
    return rows;
  }
  function subHint(){
    if(m.mode==='always')return tr('Saldo attuale di ogni conto, dall\'inizio.');
    if(m.mode==='day')return tr('Com\'erano i saldi alla fine del giorno scelto.');
    return tr('Saldo a fine periodo e quanto è cambiato tra le due date.');
  }
  function sheetHTML(){
    return '<div class="sheet">'+
      '<div class="sheet-handle"></div>'+
      '<div class="sheet-title-row"><h3 style="margin:0;">'+tr('Saldi dei conti')+'</h3><button class="icon-btn" id="balEye" aria-label="'+tr('Mostra o nascondi i saldi')+'">'+(balHidden()?eyeOffSVG():eyeOnSVG())+'</button></div>'+
      '<div class="segmented small"><button class="'+(m.mode==='always'?'active':'')+'" data-bal-mode="always">'+tr('Sempre')+'</button><button class="'+(m.mode==='day'?'active':'')+'" data-bal-mode="day">'+tr('Giorno')+'</button><button class="'+(m.mode==='range'?'active':'')+'" data-bal-mode="range">'+tr('Intervallo')+'</button></div>'+
      '<div id="balBody">'+bodyHTML()+'</div>'+
    '</div>';
  }
  /* Solo questa parte cambia quando si passa da Sempre a Giorno a Intervallo:
     ridisegnare tutto il foglio faceva "saltare" il pulsante appena premuto. */
  function bodyHTML(){
    return '<p class="hint" style="margin:2px 0 0;">'+subHint()+'</p>'+
      (m.mode==='day'?'<div class="field-group"><label class="field-label">'+tr('Giorno')+'</label><input type="date" class="text-input" id="balDay" value="'+m.day+'" max="'+today+'"></div>':'')+
      (m.mode==='range'?'<div class="bal-range-row"><div class="field-group"><label class="field-label">'+tr('Dal')+'</label><input type="date" class="text-input" id="balFrom" value="'+m.from+'" max="'+today+'"></div><div class="field-group"><label class="field-label">'+tr('Al')+'</label><input type="date" class="text-input" id="balTo" value="'+m.to+'" max="'+today+'"></div></div>':'')+
      '<div class="card" style="padding:6px 14px;">'+rowsHTML()+'</div>';
  }
  function renderBody(){
    var b=document.getElementById('balBody');
    if(!b){render();return;}
    b.innerHTML=bodyHTML();
    wireBody();
  }
  function wireBody(){
    var de=document.getElementById('balDay');if(de)de.onchange=function(){if(de.value)m.day=de.value;renderBody();};
    var fe=document.getElementById('balFrom');if(fe)fe.onchange=function(){if(fe.value)m.from=fe.value;if(m.from>m.to)m.to=m.from;renderBody();};
    var te=document.getElementById('balTo');if(te)te.onchange=function(){if(te.value)m.to=te.value;if(m.to<m.from)m.from=m.to;renderBody();};
  }
  function render(){
    var w=rerenderSheetWrap(sheetHTML());
    if(!w)return;
    var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;
    document.querySelectorAll('[data-bal-mode]').forEach(function(b){b.onclick=function(){
      m.mode=b.dataset.balMode;
      document.querySelectorAll('[data-bal-mode]').forEach(function(x){x.classList.toggle('active',x===b);});
      renderBody();
    };});
    wireBody();
    var eye=document.getElementById('balEye');if(eye)eye.onclick=function(){
      state.hideBalances=!state.hideBalances;saveState();
      eye.innerHTML=balHidden()?eyeOffSVG():eyeOnSVG();
      renderBody();
    };
  }
  openModal('<div class="sheet"></div>');
  render();
}

/* iPhone con l'app installata dalla schermata Home: dentro questa modalita'
   Safari blocca sia i pop-up sia il rientro dal redirect di Google, quindi
   l'accesso Google li' spesso non va. La via che funziona sempre e' collegare
   una password allo stesso account Google e usare email+password sul telefono. */
function isIOSStandalone(){
  try{
    var ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
    var standalone=window.navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
    return ios&&standalone;
  }catch(e){return false;}
}
function isIOS(){
  try{
    if(/iPad|iPhone|iPod/.test(navigator.userAgent))return true;
    // iPad con iPadOS si presenta come Mac ma ha il touch
    return navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1;
  }catch(e){return false;}
}
function openLinkPasswordModal(){
  var m={busy:false,err:'',ok:false};
  function html(){
    if(m.ok){
      return '<div class="sheet"><div class="sheet-handle"></div><h3 style="margin:4px 0 0;">'+tr('Password aggiunta ✅')+'</h3>'+
        '<p class="hint">Ora sull\'iPhone puoi accedere con <strong>'+esc(sync.email||'')+'</strong> e questa password: entri nello <strong>stesso account</strong> e vedi gli stessi dati dell\'accesso Google.</p>'+
        '<button class="btn-primary full-width" id="lpClose">Ho capito</button></div>';
    }
    return '<div class="sheet"><div class="sheet-handle"></div><h3 style="margin:4px 0 0;">'+tr('Aggiungi una password')+'</h3>'+
      '<p class="hint">Serve per accedere <strong>allo stesso account</strong> dall\'iPhone, dove l\'accesso con Google non funziona dentro l\'app installata. L\'account resta uno solo: '+esc(sync.email||'')+'.</p>'+
      '<div class="field-group"><label class="field-label">'+tr('Nuova password (almeno 6 caratteri)')+'</label><input type="password" class="text-input" id="lpPwd" autocomplete="new-password"></div>'+
      (m.err?'<p class="hint" style="color:var(--red);">⚠️ '+esc(m.err)+'</p>':'')+
      '<button class="btn-primary full-width" id="lpGo" '+(m.busy?'disabled':'')+'>'+(m.busy?tr('Collegamento…'):tr('Collega la password'))+'</button>'+
      '<button class="btn-secondary full-width" id="lpCancel">'+tr('Annulla')+'</button></div>';
  }
  function render(){
    var w=rerenderSheetWrap(html());
    if(!w)return;
    var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;
    var c=document.getElementById('lpCancel');if(c)c.onclick=closeModal;
    var cl=document.getElementById('lpClose');if(cl)cl.onclick=closeModal;
    var go=document.getElementById('lpGo');
    if(go)go.onclick=async function(){
      var pwd=document.getElementById('lpPwd').value;
      if(!pwd||pwd.length<6){m.err=tr('La password deve avere almeno 6 caratteri.');render();return;}
      m.busy=true;m.err='';render();
      try{
        var cred=firebase.auth.EmailAuthProvider.credential(sync.email,pwd);
        await sync.auth.currentUser.linkWithCredential(cred);
        sync.providers.push('password');
        m.ok=true;
      }catch(e){
        if(e&&e.code==='auth/provider-already-linked')m.ok=true;
        else if(e&&e.code==='auth/requires-recent-login')m.err='Per sicurezza Firebase chiede un accesso recente: esci e rientra con Google, poi riprova subito.';
        else if(e&&e.code==='auth/email-already-in-use')m.err='Esiste già un account con questa email e password: usalo direttamente sull\'iPhone.';
        else m.err=(e&&e.message)?e.message:'Non è riuscito.';
      }
      m.busy=false;render();
      if(m.ok)renderActiveTab();
    };
  }
  openModal('<div class="sheet"></div>');render();
}

/* Salvadanai in Home: riquadri con anello di progresso, due per riga. */
function goalRingSVG(pct,color,done){
  var r=26,c=2*Math.PI*r,off=c*(1-Math.min(pct,100)/100);
  return '<svg class="goal-ring" viewBox="0 0 64 64" aria-hidden="true">'+
    '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="7"/>'+
    '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 32 32)"/>'+
    '<text x="32" y="'+(done?36:37)+'" text-anchor="middle" class="goal-ring-txt">'+(done?'✓':pct.toFixed(0)+'%')+'</text>'+
  '</svg>';
}
function goalsSummaryHTML(){
  var goals=state.goals||[];
  if(!goals.length)return '';
  var cards=goals.slice().sort(function(a,b){
    var pa=a.target>0?goalSaved(a)/a.target:0,pb=b.target>0?goalSaved(b)/b.target:0;
    return pb-pa;
  }).map(function(g){
    var saved=goalSaved(g),pct=g.target>0?Math.min(saved/g.target*100,100):0,done=g.target>0&&saved>=g.target;
    return '<button class="goal-tile" data-goal-open="'+g.id+'">'+
      '<div class="goal-tile-ring">'+goalRingSVG(pct,colorHex(g.color),done)+'<span class="goal-tile-emoji">'+esc(g.emoji||'🎯')+'</span></div>'+
      '<div class="goal-tile-name">'+esc(g.name)+'</div>'+
      '<div class="goal-tile-amt">'+(balHidden()?'••••':fmt(saved))+' <span>/ '+fmt(g.target)+'</span></div>'+
    '</button>';
  }).join('');

function goalsSectionHTML(){

      '<span class="goal-emoji">'+esc(g.emoji||'🎯')+'</span>'+

      '<span class="goal-bar"><span class="goal-fill" style="width:'+pct.toFixed(1)+'%;background:'+colorHex(g.color)+';"></span></span>'+
      '<span class="goal-sub">'+(balHidden()?'••••':fmt(saved))+' di '+fmt(g.target)+(done?'':' · mancano '+(balHidden()?'••••':fmt(left)))+'</span></span>'+
      '<span class="goal-pct">'+pct.toFixed(0)+'%</span>'+
    '</button>';
  }).join('');

    '<p class="hint" style="margin-top:-4px;">'+tr('I salvadanai sono "buste" virtuali: versare o prelevare qui non modifica i saldi dei conti.')+'</p>'+
