/* ================================================================
   GESTO "INDIETRO": si trascina dal bordo sinistro verso destra e si
   torna di un passo, come su iPhone. La zona sensibile e' larga 44px
   (comoda col pollice, senza rubare tocchi al resto della schermata) e
   il gesto si conferma dopo 70px. Cosa vuol dire "un passo" dipende da
   dov'e' l'utente: si chiude prima la cosa piu' interna.
================================================================ */
var EDGE_ZONE=44,EDGE_TRIGGER=70;
/* L'elemento che segue il dito durante il trascinamento. */
function edgeBackTarget(){
  var cl=document.getElementById('confirmLayer');
  if(cl)return cl.querySelector('.confirm-wrap')||cl;
  var d=document.getElementById('impDetailWrap');
  if(d)return d.querySelector('.imp-detail-box')||d;
  var m=document.getElementById('modal-root');
  if(m&&m.classList.contains('open'))return m.querySelector('.sheet-wrap')||m.querySelector('.confirm-wrap');
  var ip=document.getElementById('invPage');
  if(ip)return ip;
  return document.getElementById('content');
}
function goBackOneStep(){
  /* Benvenuto: si torna al pannello precedente. Sul primo non si esce
     dall'app di soppiatto: si resta li'. */
  if(welcomeLive()){
    if(WC.i>0)welcomeGo(WC.i-1);
    return true;
  }
  /* 0. dialogo di conferma appoggiato sopra un foglio */
  var cl=document.getElementById('confirmLayer');
  if(cl){closeConfirmLayer();return true;}
  /* 1. finestrella dei dettagli dell'import */
  var d=document.getElementById('impDetailWrap');
  if(d){if(d.parentNode)d.parentNode.removeChild(d);return true;}
  /* 2. foglio aperto: se ha un passo precedente ci torna, altrimenti si chiude */
  var m=document.getElementById('modal-root');
  if(m&&m.classList.contains('open')){
    var b=m.querySelector('[data-back]');
    if(b){b.click();return true;}
    closeModal();return true;
  }
  /* 3. pagina Investimenti: dal dettaglio alla lista, poi si esce */
  var ip=document.getElementById('invPage');
  if(ip){
    var ib=document.getElementById('ipBack');
    if(ib){ib.click();return true;}
    closeInvestPage();return true;
  }
  /* 4. altrimenti: scheda precedente */
  var i=TAB_ORDER.indexOf(ui.activeTab);
  if(i>0){ui.activeTab=TAB_ORDER[i-1];renderActiveTab('right');return true;}
  return false;
}
/* ---- Tasto e gesto INDIETRO di sistema (Android) ----------------
   Su Android il gesto dal bordo appartiene al sistema operativo: l'app non
   lo vede mai, e infatti chiudeva Spendy invece di tornare indietro. La
   soluzione e' la cronologia del browser: ogni volta che si apre un
   "livello" (un foglio, la finestrella dei dettagli, la pagina
   Investimenti, una scheda diversa dalla prima) si aggiunge una tappa alla
   cronologia. Quando il sistema chiede "indietro", il browser ci avvisa con
   popstate e noi chiudiamo quel livello invece di uscire.
   Su iPhone e sul web il gesto dal bordo continua a funzionare come prima,
   ma passa anch'esso da qui, cosi' i due meccanismi non litigano. */
var histDepth=0,skipPop=0;
/* Quanti livelli sono aperti in questo momento. */
function layerDepth(){
  var n=0;
  if(welcomeLive())return 1+WC.i;   // durante il benvenuto non c'e' altro sotto
  if(document.getElementById('confirmLayer'))n++;
  if(document.getElementById('impDetailWrap'))n++;
  var m=document.getElementById('modal-root');
  if(m&&m.classList.contains('open')){
    n++;
    if(m.querySelector('[data-back]'))n++;   // il foglio ha un passo precedente
  }
  var ip=document.getElementById('invPage');
  if(ip){n++;if(typeof IPAGE!=='undefined'&&IPAGE&&IPAGE.view==='detail')n++;}
  if(TAB_ORDER.indexOf(ui.activeTab)>0)n++;  // non siamo sulla prima scheda
  return n;
}
/* Allinea la cronologia ai livelli davvero aperti. Va chiamata dopo ogni
   apertura o chiusura. */
function syncBackHistory(){
  if(typeof history==='undefined'||!history.pushState)return;
  var want=layerDepth();
  if(want>histDepth){
    while(histDepth<want){histDepth++;try{history.pushState({sp:histDepth},'');}catch(e){break;}}
  }else if(want<histDepth){
    var d=histDepth-want;histDepth=want;skipPop+=d;
    try{history.go(-d);}catch(e){skipPop=0;}
  }
}
/* Punto d'ingresso per il gesto dal bordo della PAGINA (web e iPhone):
   li' la cronologia funziona, quindi conviene passare da quella per tenere
   allineato anche il tasto indietro del browser. */
function requestBack(){
  if(histDepth>0){try{history.back();return true;}catch(e){}}
  return goBackOneStep();
}
/* Punto d'ingresso per i percorsi NATIVI (Android).
   Perche' esiste separato: nel WebView di Capacitor la cronologia non e'
   navigabile — `history.back()` non consegna mai il `popstate`. Delegando a
   quella, la pagina rispondeva ad Android "ho gestito io" (quindi l'app
   restava aperta, giustamente) ma poi non chiudeva niente: il gesto sembrava
   morto. Qui il livello si chiude SUBITO, e solo dopo si riallinea la
   cronologia — se il popstate arriva comunque (WebView piu' generosi),
   `syncBackHistory` lo fa assorbire da `skipPop`, quindi non si torna
   indietro due volte. */
function backNow(){
  var ok=false;
  try{ok=goBackOneStep()!==false;}catch(e){ok=false;}
  try{syncBackHistory();}catch(e){}
  return ok;
}
/* ---- PONTE COL TASTO/GESTO INDIETRO DI ANDROID -------------------
   Il gesto di sistema di Android non arriva mai alla pagina: lo intercetta
   il sistema operativo e lo consegna all'app nativa. La MainActivity, a quel
   punto, esegue questa funzione dentro la pagina per chiedere: "hai qualcosa
   da chiudere?". Se rispondiamo di si', l'app resta aperta e noi chiudiamo un
   livello; se rispondiamo di no, l'app si chiude come deve.
   E' l'unica strada che non dipende dalla cronologia del WebView, che in
   questa configurazione non risultava navigabile. */
var BACK_MODE='web';
var BACK_BRIDGE_KEY='spendy-back-bridge-v2';
/* Due conteggi salvati sul dispositivo (l'app si chiude, quindi devono
   sopravvivere): quante volte Android ci ha interpellati e quante volte
   abbiamo risposto "ho chiuso qualcosa". Bastano per capire da che parte
   guardare se qualcosa non va. */
function backBridgeStats(){
  try{
    var raw=window.localStorage.getItem(BACK_BRIDGE_KEY);
    if(!raw)return{calls:0,handled:0};
    var o=JSON.parse(raw);
    return{calls:+o.calls||0,handled:+o.handled||0};
  }catch(e){return{calls:0,handled:0};}
}
function bumpBackBridge(handled){
  try{
    var st=backBridgeStats();
    st.calls++;
    if(handled)st.handled++;
    window.localStorage.setItem(BACK_BRIDGE_KEY,JSON.stringify(st));
  }catch(e){}
}
/* Questa e' la funzione che la MainActivity esegue dentro la pagina quando su
   Android si preme indietro. Deve essere impossibile da rompere: qualunque
   errore imprevisto non deve tradursi in "chiudi l'app" se c'era qualcosa da
   chiudere. */
/* Effetto ripple al tocco su bottoni, chip, tasti e righe. Solo estetica:
   aggiunge uno <span> dietro al contenuto e lo rimuove da solo. */
(function initTapRipple(){
  try{
    if(!document||!document.addEventListener)return;
    var SEL='.btn-primary,.btn-secondary,.btn-danger,.btn-primary-sm,.key,.chip,.pick-row,.menu-row,.segmented button,.bd-row,.invp-row,.inv-row,.invp-back';
    document.addEventListener('pointerdown',function(e){
      if(e.button&&e.button!==0)return;
      var el=e.target&&e.target.closest?e.target.closest(SEL):null;
      if(!el||el.disabled)return;
      var r=el.getBoundingClientRect();if(!r.width)return;
      var size=Math.max(r.width,r.height)*1.15;
      var sp=document.createElement('span');
      sp.className='tap-ripple';
      sp.style.width=sp.style.height=size+'px';
      sp.style.left=(e.clientX-r.left)+'px';
      sp.style.top=(e.clientY-r.top)+'px';
      el.insertBefore(sp,el.firstChild);
      setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp);},520);
    },{passive:true});
  }catch(_){}
})();
window.spendyHandleBack=function(){
  var aperto=false;
  try{aperto=layerDepth()>0;}catch(e){
    /* Se il conteggio dei livelli fallisce, guardiamo direttamente lo schermo. */
    try{
      aperto=!!(document.getElementById('confirmLayer')||
                document.getElementById('impDetailWrap')||
                document.getElementById('invPage')||
                (document.getElementById('modal-root')&&document.getElementById('modal-root').classList.contains('open'))||
                (TAB_ORDER.indexOf(ui.activeTab)>0));
    }catch(e2){aperto=false;}
  }
  if(!aperto){bumpBackBridge(false);return false;}
  try{backNow();}catch(e){
    try{goBackOneStep();}catch(e2){}
  }
  bumpBackBridge(true);
  return true;   // c'era qualcosa di aperto: l'app NON deve chiudersi
};
function backModeLabel(){
  if(window.Capacitor&&typeof Capacitor.isNativePlatform==='function'&&Capacitor.isNativePlatform())return 'app nativa';
  if(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)return 'app installata';
  return 'browser';
}
function initSystemBack(){
  /* 1) Strada principale: la cronologia della pagina. La usa il browser, la
        PWA installata e anche l'app Android (la MainActivity chiama goBack()
        sul WebView, che qui arriva come popstate). */
  window.addEventListener('popstate',function(){
    if(skipPop>0){skipPop--;return;}
    if(histDepth>0){
      histDepth--;
      goBackOneStep();
      setTimeout(syncBackHistory,0);
    }
  });
  /* 2) Rete di sicurezza: alcuni contenitori nativi (Cordova e certe versioni
        di Capacitor) annunciano il tasto indietro con un evento sul documento
        invece di toccare la cronologia. Se arriva quello, lo gestiamo noi. */
  document.addEventListener('backbutton',function(e){
    if(e&&e.preventDefault)e.preventDefault();
    if(layerDepth()>0)backNow();
  });
  /* 3) Se il contenitore nativo espone il plugin App di Capacitor, ci
        agganciamo anche li'. Se non c'e', non succede nulla. */
  try{
    if(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App&&Capacitor.Plugins.App.addListener){
      Capacitor.Plugins.App.addListener('backButton',function(info){
        if(layerDepth()>0){backNow();return;}
        if(info&&info.canGoBack===false&&Capacitor.Plugins.App.exitApp)Capacitor.Plugins.App.exitApp();
      });
      BACK_MODE='plugin';
    }
  }catch(e){}
  syncBackHistory();
}

function initEdgeBack(){
  var startX=0,startY=0,active=false,decided=false,dx=0,el=null;
  function reset(){
    if(el){el.style.transition='';el.style.transform='';el.style.opacity='';}
    active=false;decided=false;dx=0;el=null;ui._edgeSwipe=false;
  }
  /* In fase di CATTURA: cosi' arriva prima dello swipe tra schede e puo'
     zittirlo, evitando di fare due passi indietro insieme. */
  document.addEventListener('touchstart',function(e){
    reset();
    if(e.touches.length!==1)return;
    var t=e.target;
    if(t&&t.closest&&t.closest('.carousel,.chip-row,.keypad,input,select,textarea'))return;
    if(e.touches[0].clientX>EDGE_ZONE)return;
    startX=e.touches[0].clientX;startY=e.touches[0].clientY;
    active=true;ui._edgeSwipe=true;
  },{passive:true,capture:true});
  document.addEventListener('touchmove',function(e){
    if(!active)return;
    dx=e.touches[0].clientX-startX;
    var dy=e.touches[0].clientY-startY;
    if(!decided){
      if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
      decided=true;
      if(!(dx>0&&Math.abs(dx)>Math.abs(dy))){reset();return;}
      el=edgeBackTarget();
      if(!el){reset();return;}
    }
    if(!el)return;
    if(e.cancelable)e.preventDefault();
    el.style.transition='none';
    el.style.transform='translateX('+Math.min(dx,170)+'px)';
    el.style.opacity=String(Math.max(0.5,1-dx/450));
  },{passive:false,capture:true});
  document.addEventListener('touchend',function(){
    if(!active||!el){reset();return;}
    var target=el,go=dx>=EDGE_TRIGGER;
    active=false;ui._edgeSwipe=false;el=null;decided=false;dx=0;
    target.style.transition='transform .2s var(--ease-out),opacity .2s var(--ease-out)';
    target.style.transform=go?'translateX(70px)':'';
    target.style.opacity=go?'0':'';
    setTimeout(function(){
      target.style.transition='';target.style.transform='';target.style.opacity='';
      if(go)requestBack();
    },go?170:210);
  },{passive:true,capture:true});
  document.addEventListener('touchcancel',reset,{passive:true,capture:true});
}

/* ================================================================
   GESTI: swipe tra schede + pull-to-refresh + chiusura fogli
================================================================ */
function initSwipeTabs(){
  var c=document.getElementById('content');
  var sx=0,sy=0,tracking=false,horiz=null;
  c.addEventListener('touchstart',function(e){
    if(e.touches.length!==1)return;
    if(ui._edgeSwipe)return;   // sta partendo il gesto "indietro" dal bordo
    if(document.getElementById('modal-root').classList.contains('open'))return;
    var t=e.target;
    if(t.closest&&t.closest('.chip-row,.carousel,input,select,textarea,.month-table,.keypad'))return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;tracking=true;horiz=null;
  },{passive:true});
  c.addEventListener('touchmove',function(e){
    if(!tracking)return;
    var dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(horiz===null&&(Math.abs(dx)>14||Math.abs(dy)>14))horiz=Math.abs(dx)>Math.abs(dy)*1.8;
  },{passive:true});
  c.addEventListener('touchend',function(e){
    if(!tracking)return;
    tracking=false;
    if(!horiz)return;
    var dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)<60)return;
    var i=TAB_ORDER.indexOf(ui.activeTab);
    if(i===-1)return;
    var ni=dx<0?i+1:i-1;
    if(ni<0||ni>=TAB_ORDER.length)return;
    ui.activeTab=TAB_ORDER[ni];
    renderActiveTab(dx<0?'left':'right');
  },{passive:true});
}

/* Se la sincronizzazione è attiva, il refresh chiede a Firestore l'ultima
   versione dei dati (stessa logica del listener in tempo reale). Senza
   sincronizzazione si limita a ridisegnare la schermata. */
async function refreshFromCloud(){
  if(sync.status!=='connected'||!sync.db||!sync.uid)return;
  await reconcileWithCloud();
}
async function doRefresh(){
  var ptr=document.getElementById('ptr');
  ptr.classList.add('refreshing');
  var t0=Date.now();
  try{await refreshFromCloud();}catch(e){}
  renderActiveTab();
  setTimeout(function(){
    ptr.classList.remove('refreshing');
    ptr.classList.add('hiding');
    setTimeout(function(){ptr.classList.remove('hiding');},320);
    showToast(tr('Aggiornato'));
  },Math.max(0,650-(Date.now()-t0)));
}
function initPullToRefresh(){
  var c=document.getElementById('content');
  var ptr=document.getElementById('ptr');
  var wheel=ptr.querySelector('.ptr-wheel');
  var startY=0,startX=0,pulling=false,locked=false,dist=0;
  function busy(){return ptr.classList.contains('refreshing');}
  function resetWheel(){wheel.style.transition='';wheel.style.opacity='';wheel.style.transform='';}
  c.addEventListener('touchstart',function(e){
    if(busy())return;
    if(e.touches.length!==1)return;
    if(document.getElementById('modal-root').classList.contains('open'))return;
    if(c.scrollTop>0)return;
    startY=e.touches[0].clientY;startX=e.touches[0].clientX;pulling=true;locked=false;dist=0;
  },{passive:true});
  c.addEventListener('touchmove',function(e){
    if(!pulling||busy())return;
    if(c.scrollTop>0){pulling=false;resetWheel();return;}
    var dy=e.touches[0].clientY-startY;
    var dx=e.touches[0].clientX-startX;
    /* Finché la direzione non è decisa: se il movimento è più orizzontale
       (o verso l'alto) lascio perdere, così non si attiva durante lo scroll
       o lo swipe tra schede. Si "aggancia" solo a un tiro chiaro verso il basso. */
    if(!locked){
      if(Math.abs(dx)>Math.abs(dy)){pulling=false;resetWheel();return;}
      if(dy<0){pulling=false;resetWheel();return;}
      if(dy>10)locked=true; else return;
    }
    dist=dy;
    if(dist<=0){resetWheel();return;}
    var d=Math.min(dist*0.45,90);
    wheel.style.transition='none';
    wheel.style.opacity=String(Math.min(d/40,1));
    wheel.style.transform='translateY('+(d-40)+'px) rotate('+(d*3.2)+'deg)';
  },{passive:true});
  c.addEventListener('touchend',function(){
    if(!pulling||busy())return;
    pulling=false;
    var d=Math.min(Math.max(dist,0)*0.45,90);
    resetWheel();
    if(d>=62)doRefresh();
  },{passive:true});
}

/* Chiusura dei bottom-sheet trascinandoli verso il basso: quando il
   foglio è già in cima (scrollTop 0) un trascinamento verso il basso
   segue il dito e, superata la soglia, lo chiude. Delegato su
   #modal-root così sopravvive ai re-render interni dei fogli. */
function initSheetDismiss(){
  var root=document.getElementById('modal-root');
  var wrap=null,sheet=null,startX=0,startY=0,dragging=false,decided=false,dy=0;
  root.addEventListener('touchstart',function(e){
    if(e.touches.length!==1){decided=true;dragging=false;return;}
    var t=e.target;
    sheet=t.closest?t.closest('.sheet'):null;
    wrap=t.closest?t.closest('.sheet-wrap'):null;
    if(!sheet||!wrap){decided=true;dragging=false;return;}
    startX=e.touches[0].clientX;startY=e.touches[0].clientY;
    dragging=false;decided=false;dy=0;
  },{passive:true});
  root.addEventListener('touchmove',function(e){
    if(!sheet||!wrap)return;
    if(decided&&!dragging)return;
    var y=e.touches[0].clientY,x=e.touches[0].clientX;
    dy=y-startY;var dx=x-startX;
    if(!decided){
      if(Math.abs(dy)<6&&Math.abs(dx)<6)return;
      decided=true;
      dragging=(dy>0&&Math.abs(dy)>Math.abs(dx)&&sheet.scrollTop<=0);
      if(!dragging)return;
    }
    if(dragging){
      if(e.cancelable)e.preventDefault();
      wrap.style.transition='none';
      wrap.style.transform='translateY('+(dy<0?0:dy)+'px)';
    }
  },{passive:false});
  root.addEventListener('touchend',function(){
    if(dragging&&wrap){
      if(dy>110){
        wrap.style.transition='transform .26s var(--ease-out)';
        wrap.style.transform='translateY(100%)';
        setTimeout(closeModal,230);
      }else{
        wrap.style.transition='transform .26s var(--ease-out)';
        wrap.style.transform='';
      }
    }
    dragging=false;decided=false;sheet=null;wrap=null;dy=0;
  },{passive:true});
}

/* ================================================================
   BENVENUTO AL PRIMO AVVIO
   Tre pannelli che si scorrono col dito. Non e' un foglio modale: e' uno
   strato sopra la shell, cosi' non litiga con i fogli veri. Tutti i colori
   arrivano dalle variabili CSS, quindi segue da solo il tema del telefono.
   Si vede UNA volta sola, e solo su un'installazione nuova: chi aggiorna
   avendo gia' dei dati non se lo ritrova davanti.
================================================================ */
var WELCOME_KEY='spendy-welcome-v1';
var WC={i:0};

function welcomeSeen(){
  try{return !!window.localStorage.getItem(WELCOME_KEY);}catch(e){return true;}
}
function markWelcomeSeen(){
  try{window.localStorage.setItem(WELCOME_KEY,'1');}catch(e){}
}
/* Vuoto = nessun movimento, nessun trasferimento, nessuna ricorrente,
   nessun obiettivo, nessun titolo. I due conti di partenza non contano:
   ci sono anche in un'installazione appena fatta. */
function stateIsEmpty(){
  var s=state||{};
  return !((s.transactions||[]).length||(s.transfers||[]).length||
           (s.recurring||[]).length||(s.goals||[]).length||
           (s.investments||[]).length);
}
function welcomeNeeded(){
  /* Richiamo a mano: aprendo l'indirizzo con ?benvenuto in fondo il
     carosello si rivede anche a dati gia' dentro. Serve a controllarlo
     su un telefono vero senza dover reinstallare l'app. */
  try{if(/[?&]benvenuto\b/.test(String(location.search||'')))return true;}catch(e){}
  if(welcomeSeen())return false;
  return stateIsEmpty();
}

/* Contenuto della prima schermata: scelta lingua + nome. */
function welcomeIntroHTML(){
  var langs=['it','en','es','fr'].map(function(c){
    var on=(LANG===c);
    return '<button class="wc-lang" data-wc-lang="'+c+'" style="padding:8px 13px;border-radius:99px;border:1px solid '+(on?'var(--accent)':'var(--hairline)')+';background:'+(on?'var(--accent)':'var(--surface)')+';color:'+(on?'var(--on-accent)':'var(--ink)')+';font-size:13px;font-weight:600;">'+LANG_FLAG[c]+' '+esc(LANG_NAMES[c])+'</button>';
  }).join('');
  return '<div style="text-align:center;font-size:56px;line-height:1;margin:6px 0 4px;">\ud83d\udc4b</div>'+
    '<h2 class="wc-title">'+esc(tr('Benvenuto in Spendy'))+'</h2>'+
    '<p class="wc-text">'+esc(tr('Scegli la lingua e dimmi come ti chiami.'))+'</p>'+
    '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 14px;">'+langs+'</div>'+
    '<input class="text-input" id="wcName" maxlength="24" style="text-align:center;max-width:260px;margin:0 auto;" placeholder="'+tr('Il tuo nome')+'" value="'+esc(profileName())+'" autocomplete="off">';
}
function welcomePanelInner(p){
  if(p.k==='intro')return welcomeIntroHTML();
  return welcomeIllus(p.k)+'<h2 class="wc-title">'+esc(tr(p.t))+'</h2>'+'<p class="wc-text">'+esc(tr(p.d))+'</p>';
}
/* Ridisegna i pannelli (dopo il cambio lingua), mantenendo nome e posizione. */
function welcomeRerender(){
  var track=document.getElementById('wcTrack');if(!track)return;
  var ni=document.getElementById('wcName');var nameVal=ni?ni.value:'';
  var panels='';
  for(var i=0;i<WELCOME_PANELS.length;i++){panels+='<section class="wc-panel" data-wc-panel="'+i+'">'+welcomePanelInner(WELCOME_PANELS[i])+'</section>';}
  track.innerHTML=panels;
  var ni2=document.getElementById('wcName');if(ni2&&nameVal)ni2.value=nameVal;
  var sk=document.getElementById('wcSkip');if(sk)sk.textContent=tr('Salta');
  welcomeWireIntro();
  welcomePaint();
}
function welcomeWireIntro(){
  document.querySelectorAll('[data-wc-lang]').forEach(function(b){b.onclick=function(){setLang(b.dataset.wcLang);welcomeRerender();};});
  var nm=document.getElementById('wcName');if(nm)nm.oninput=function(){saveProfileName(nm.value);};
}
/* Pop-up 'Ciao {nome}', poi si prosegue col carosello. */
function welcomeHello(name,cb){
  var el=document.getElementById('welcome');if(!el){if(cb)cb();return;}
  var h=document.createElement('div');h.className='wc-hello';
  h.setAttribute('style','position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--app-bg);text-align:center;padding:24px;animation:fadein .2s var(--ease-out);');
  h.innerHTML='<div style="font-size:64px;line-height:1;">\ud83d\udc4b</div><h2 class="wc-title">'+esc(tr('Ciao {N}!').replace('{N}',esc(name)))+'</h2><button class="btn-primary" id="wcHelloGo" style="min-width:190px;">'+esc(tr('Iniziamo'))+'</button>';
  el.appendChild(h);
  var g=document.getElementById('wcHelloGo');if(g)g.onclick=function(){if(h.parentNode)h.parentNode.removeChild(h);if(cb)cb();};
}
/* Uscita dalla prima schermata: salva il nome e mostra il saluto. */
function welcomeLeaveIntro(){
  var inp=document.getElementById('wcName');
  var nm=(inp?inp.value:'').trim().slice(0,24);
  saveProfileName(nm);
  if(nm)welcomeHello(nm,function(){welcomeGo(1);});
  else welcomeGo(1);
}
function welcomeOpen(){
  return !!document.getElementById('welcome');
}
/* Durante la dissolvenza di chiusura lo strato c'e' ancora ma non conta
   piu': serve al tasto indietro per non contarlo due volte. */
function welcomeLive(){
  var el=document.getElementById('welcome');
  return !!(el&&!el.classList.contains('closing'));
}

function welcomePaint(){
  var i=WC.i;
  var dots=document.querySelectorAll('[data-wc-dot]');
  for(var k=0;k<dots.length;k++){
    if(Number(dots[k].getAttribute('data-wc-dot'))===i)dots[k].classList.add('on');
    else dots[k].classList.remove('on');
  }
  var b=document.getElementById('wcNext');
  if(b)b.textContent=(i>=WELCOME_PANELS.length-1)?tr('Comincia'):tr('Avanti');
  var sk=document.getElementById('wcSkip');
  if(sk)sk.disabled=(i>=WELCOME_PANELS.length-1);
}

function welcomeGo(i){
  if(i<0)i=0;
  if(i>WELCOME_PANELS.length-1)i=WELCOME_PANELS.length-1;
  WC.i=i;
  var t=document.getElementById('wcTrack');
  /* jsdom (e il primo istante sul telefono) non sa ancora quanto e' largo:
     in quel caso si aggiorna solo lo stato, senza far scorrere niente. */
  if(t&&t.clientWidth){
    try{t.scrollTo({left:i*t.clientWidth,behavior:'smooth'});}
    catch(e){t.scrollLeft=i*t.clientWidth;}
  }
  welcomePaint();
  syncBackHistory();
}

function closeWelcome(){
  markWelcomeSeen();
  var el=document.getElementById('welcome');
  if(!el)return;
  el.classList.add('closing');
  syncBackHistory();
  setTimeout(function(){
    if(el.parentNode)el.parentNode.removeChild(el);
  },240);
}

function openWelcome(){
  if(welcomeOpen())return;
  var app=document.getElementById('app');
  if(!app)return;
  WC.i=0;
  var panels='',dots='';
  for(var i=0;i<WELCOME_PANELS.length;i++){
    var p=WELCOME_PANELS[i];
    panels+='<section class="wc-panel" data-wc-panel="'+i+'">'+welcomePanelInner(p)+'</section>';
    dots+='<span class="wc-dot'+(i===0?' on':'')+'" data-wc-dot="'+i+'"></span>';
  }
  var el=document.createElement('div');
  el.id='welcome';
  el.setAttribute('role','dialog');
  el.setAttribute('aria-modal','true');
  el.setAttribute('aria-label',tr('Benvenuto in Spendy'));
  el.innerHTML='<div class="wc-track" id="wcTrack">'+panels+'</div>'+
    '<div class="wc-foot">'+
      '<div class="wc-dots">'+dots+'</div>'+
      '<button class="btn-primary full-width" id="wcNext">'+esc(tr('Avanti'))+'</button>'+
      '<button class="wc-skip" id="wcSkip">'+esc(tr('Salta'))+'</button>'+
    '</div>';
  app.appendChild(el);
  wireWelcome();
  welcomePaint();
  syncBackHistory();
}

function wireWelcome(){
  var next=document.getElementById('wcNext');
  if(next)next.onclick=function(){
    if(WC.i===0){welcomeLeaveIntro();return;}
    if(WC.i>=WELCOME_PANELS.length-1)closeWelcome();
    else welcomeGo(WC.i+1);
  };
  welcomeWireIntro();
  var skip=document.getElementById('wcSkip');
  if(skip)skip.onclick=function(){closeWelcome();};
  var track=document.getElementById('wcTrack');
  if(track)track.addEventListener('scroll',function(){
    var w=track.clientWidth;
    if(!w)return;
    var i=Math.round(track.scrollLeft/w);
    if(i!==WC.i&&i>=0&&i<WELCOME_PANELS.length){
      WC.i=i;
      welcomePaint();
      syncBackHistory();
    }
  },{passive:true});
}

/* ================================================================
   FOTOGRAFIA DELLO SCHERMO PER IL PROSSIMO AVVIO
   Poche decine di byte in localStorage: il patrimonio GIA' scritto come
   va mostrato, l'etichetta tradotta e il mese. Li rilegge lo script in
   cima alla pagina e li ridisegna dentro lo splash, cosi' il primo
   fotogramma somiglia alla schermata di ieri invece di essere vuoto.
   Non e' una copia dei dati: se sparisce non si perde niente, e all'uscita
   dall'account viene cancellata insieme al resto.
================================================================ */
var SNAP_KEY='spendy-snap-v1';

function saveScreenSnapshot(){
  try{
    if(!state)return;
    var bal=totalBalance();
    var val=balHidden()?'\u2022\u2022\u2022\u2022':((bal<0?'\u2212':'')+fmt(Math.abs(bal)));
    window.localStorage.setItem(SNAP_KEY,JSON.stringify({
      v:1,
      lab:tr('Patrimonio complessivo'),
      val:val,
      sub:formatMonthLabel(currentMonthKey())
    }));
  }catch(e){}
}
function clearScreenSnapshot(){
  try{window.localStorage.removeItem(SNAP_KEY);}catch(e){}
}
/* La schermata vera e' gia' disegnata: l'anteprima si dissolve sopra di
   essa invece di sparire di colpo. */
function fadeOutSplash(){
  var sp=document.getElementById('splash');
  if(!sp)return;
  sp.classList.add('fading');
  setTimeout(function(){sp.classList.add('hidden');},260);
}

  await loadState();

  try{document.documentElement.lang=LANG;}catch(e){}
  applyStaticI18n();
  renderActiveTab();
  if(welcomeNeeded())openWelcome();
  fadeOutSplash();
  updateAvatarFab();
  loadPrices();
  document.querySelectorAll('.nav-btn').forEach(function(b){b.onclick=function(){
    if(b.dataset.tab===ui.activeTab)return;
    var oi=TAB_ORDER.indexOf(ui.activeTab),ni=TAB_ORDER.indexOf(b.dataset.tab);
    ui.activeTab=b.dataset.tab;
    renderActiveTab(ni>oi?'left':'right');
  };});
  document.getElementById('fabAdd').onclick=function(){openEntrySheet({mode:lastUsedMode});};
  document.getElementById('openSearch').onclick=openSearchOverlay;
  document.getElementById('openInfo').onclick=openInfoSheet;
  document.getElementById('openAccounts').onclick=openAccountsSheet;
  initSwipeTabs();
  initPullToRefresh();
  initSheetDismiss();
  initEdgeBack();
  initSystemBack();
  var hasWorkingStorage=usingClaudeStorage||(function(){try{window.localStorage.setItem('__t','1');window.localStorage.removeItem('__t');return true;}catch(e){return false;}})();
  if(!hasWorkingStorage)showToast(tr('Salvataggio non disponibile in questa sessione'));
  if(!usingClaudeStorage&&'serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  }
  /* Chi aveva gia' un portafoglio prima della v51 si ritrova il conto
     Investimenti senza dover ricomprare niente. */
  try{if(isPremium()&&(state.investments||[]).length&&!investAccount()){ensureInvestAccount();saveState();}}catch(e){}
  loadSyncMeta();
  initConnectivityWatch();
  initSyncFromSavedConfig();
  initNativeNotificationBridge();
  initRecurringReminders();
  pushWidgetData();
  setTimeout(checkWidgetAction,600);
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden)checkWidgetAction();
    /* Uscendo dall'app si aggiorna la fotografia: al rientro il primo
       fotogramma e' quello giusto. */
    else saveScreenSnapshot();
  });
  saveScreenSnapshot();
}
