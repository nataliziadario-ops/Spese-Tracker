/* ================================================================
   IMPORT DEI TUOI DATI (CSV · XLSX)
   Ogni file diventa una tabella; poi si decide quali colonne sono
   data / descrizione / importo, e come capire se è una spesa o un'entrata.
   Nulla viene salvato prima dell'anteprima riga per riga.
================================================================ */
function rowsFromCSV(text){
  var lines=String(text||'').split(/\r?\n/).filter(function(l){return l.trim()!=='';});
  if(!lines.length)return [];
  var d=detectDelim(lines[0]);
  return lines.map(function(l){return splitCSV(l,d);});
}
var KW_DATE=['data','date','giorno','valuta'];
var KW_DESC=['descrizione','causale','description','memo','dettag','operazione','beneficiario','esercente','note'];
var KW_AMT=['importo','amount','valore','somma','totale'];
var KW_OUT=['uscite','uscita','addebiti','addebito','dare','spese','spesa','pagamenti','debito','debit','withdraw','negativo'];
var KW_IN=['entrate','entrata','accrediti','accredito','avere','ricavi','credito','credit','deposit','positivo'];
var KW_TYPE=['tipo','type','segno','movimento','operazione','d/a','dare/avere'];
function hasKW(h,list){h=String(h||'').toLowerCase();return list.some(function(k){return h.indexOf(k)>-1;});}

/* Trova la riga di intestazione: nelle esportazioni bancarie spesso ci sono
   righe di titolo, intestatario, IBAN… prima della tabella vera. */
function findHeaderRow(rows){
  var limit=Math.min(rows.length,25);
  for(var i=0;i<limit;i++){
    var r=rows[i]||[];
    var score=0;
    if(r.some(function(c){return hasKW(c,KW_DATE);}))score++;
    if(r.some(function(c){return hasKW(c,KW_AMT)||hasKW(c,KW_OUT)||hasKW(c,KW_IN);}))score++;
    if(r.some(function(c){return hasKW(c,KW_DESC);}))score++;
    if(score>=2)return i;
  }
  return -1;
}
/* Quando l'intestazione non c'è (o non dice niente), si capiscono le colonne
   dal contenuto: dove ci sono date, dove ci sono soldi, dove c'è testo. */
function guessColMapByContent(rows,start){
  var cols=0;
  rows.forEach(function(r){cols=Math.max(cols,r.length);});
  var dateScore=[],moneyScore=[],textScore=[];
  for(var c=0;c<cols;c++){dateScore[c]=0;moneyScore[c]=0;textScore[c]=0;}
  var n=0;
  for(var i=start;i<rows.length&&n<200;i++,n++){
    var r=rows[i]||[];
    for(var c2=0;c2<cols;c2++){
      var v=String(r[c2]==null?'':r[c2]).trim();
      if(!v)continue;
      if(parseDateFlexible(v))dateScore[c2]++;
      else if(isMoneyCell(v)||(!isNaN(parseAmount(v))&&/[.,]\d{2}$/.test(v)))moneyScore[c2]++;
      else if(/[a-zA-Z]{3}/.test(v))textScore[c2]+=v.length;
    }
  }
  function best(arr){var bi=-1,bv=0;arr.forEach(function(v,i){if(v>bv){bv=v;bi=i;}});return bi;}
  var money=[];
  moneyScore.forEach(function(v,i){if(v>0)money.push({i:i,v:v});});
  money.sort(function(a,b){return b.v-a.v;});
  return{
    date:best(dateScore),
    description:best(textScore),
    amount:money.length?money[0].i:-1,
    moneyCols:money.map(function(m){return m.i;}).sort(function(a,b){return a-b;})
  };
}

/* Sceglie la colonna delle date confrontando quante ne legge davvero.
   Cambia idea solo se un'altra colonna e' NETTAMENTE migliore (+25%): cosi'
   il nome dell'intestazione resta il criterio principale. */
function bestDateColumn(rows,start,preferred,alternative){
  var cols=0;
  rows.forEach(function(r){cols=Math.max(cols,r.length);});
  if(cols===0)return preferred;
  function score(c){
    if(c==null||c<0||c>=cols)return -1;
    var r=readDateColumn(rows,start,c);
    return r.total?r.ok/r.total:0;
  }
  var bestC=preferred,bestS=score(preferred);
  [alternative].concat(function(){var a=[];for(var i=0;i<cols;i++)a.push(i);return a;}())
    .forEach(function(c){
      var sc=score(c);
      if(sc>bestS+0.25){bestS=sc;bestC=c;}
    });
  return bestC>-1?bestC:0;
}

function openImportModal(){
  var imp={step:1,accountId:(pickableAccounts()[0]||state.accounts[0]).id,source:'csv',fileName:'',rawText:'',rows:[],sheets:[],refSheet:null,
           hasHeader:true,headers:[],mapping:{date:0,description:1,amount:2,amountIn:-1,amountOut:-1,typeCol:-1},
           amountMode:'single',signRule:'auto',analyzed:false,
           parsed:[],error:'',warn:'',busy:false,applyAll:true,_groups:{},dateFails:0};

  function renderStep(){var r=document.querySelector('#modal-root .sheet-wrap');if(r){r.innerHTML=stepHTML();wireStep();syncBackHistory();}}
  function stepDots(){var h='<div class="step-dots">';for(var i=1;i<=3;i++)h+='<span class="step-dot'+(i===imp.step?' active':'')+'"></span>';return h+'</div>';}
  function stepHTML(){return imp.step===1?step1():imp.step===2?step2():step3();}

  /* ---------- passo 1: il file ---------- */
  function step1(){
    var usable=pickableAccounts().filter(function(a){return !isLocked('accounts',a.id);});
    if(!usable.some(function(a){return a.id===imp.accountId;})&&usable[0])imp.accountId=usable[0].id;
    var opts=usable.map(function(a){return'<option value="'+a.id+'" '+(a.id===imp.accountId?'selected':'')+'>'+esc(a.name)+'</option>';}).join('');
    var status='';
    if(imp.busy)status='<p class="hint">'+tr('Lettura del file in corso…')+'</p>';
    else if(imp.error)status='<p class="hint" style="color:var(--red);">⚠️ '+esc(imp.error)+'</p>';
    else if(imp.rows.length)status='<p class="hint">✅ '+esc(imp.fileName||'File')+': '+imp.rows.length+' righe lette.</p>';
    return'<div class="sheet">'+stepDots()+
      '<h3 style="margin:4px 0 0;">'+tr('Importa i tuoi dati')+'</h3>'+
      '<div class="field-group"><label class="field-label">'+tr('Conto di destinazione')+'</label><select class="select" id="impAcc">'+opts+'</select></div>'+
      '<div class="field-group"><label class="field-label">'+tr('File (CSV o Excel .xlsx)')+'</label><input type="file" accept=".csv,.txt,.xlsx,text/csv,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" id="impFile"></div>'+
      status+
      '<div class="field-group"><label class="field-label">'+tr('Oppure incolla il contenuto (CSV)')+'</label><textarea class="text-input" id="impText" placeholder="data;descrizione;importo">'+esc(imp.rawText)+'</textarea></div>'+
      '<p class="hint">'+tr('Scarica dalla banca il file CSV o Excel dei movimenti: sono i formati che si leggono senza errori.')+'</p>'+
      '<button class="btn-primary full-width" id="impNext1" '+(imp.rows.length?'':'disabled')+'>Continua</button>'+
      '<button class="btn-secondary full-width" id="impCancel1">'+tr('Annulla')+'</button></div>';
  }

  /* ---------- analisi automatica delle colonne ---------- */
  function looksLikeTwoColumns(a,b,start){
    var both=0,either=0;
    for(var i=start;i<imp.rows.length;i++){
      var r=imp.rows[i]||[];
      var va=!isNaN(parseAmount(r[a]))&&parseAmount(r[a])!==0;
      var vb=!isNaN(parseAmount(r[b]))&&parseAmount(r[b])!==0;
      if(va||vb)either++;
      if(va&&vb)both++;
    }
    return either>=2&&(both/either)<0.25;
  }
  function analyze(){
    if(imp.analyzed||!imp.rows.length)return;
    imp.analyzed=true;
    /* Ogni foglio puo' avere le sue righe di titolo prima della tabella. */
    imp.sheets.forEach(function(sh){
      var h=findHeaderRow(sh.rows);
      if(h>0)sh.rows=sh.rows.slice(h);
      sh.hasHeader=h>-1;
      sh.forced=sheetForcedType(sh.name);
    });
    if(imp.refSheet)imp.rows=imp.refSheet.rows;
    var hr=findHeaderRow(imp.rows);
    imp.hasHeader=hr>-1?true:imp.hasHeader;
    var head=imp.hasHeader?imp.rows[0].map(String):[];
    var start=imp.hasHeader?1:0;
    var byName={date:-1,description:-1,amount:-1,out:-1,in:-1,type:-1};
    head.forEach(function(h,i){
      if(byName.date<0&&hasKW(h,KW_DATE))byName.date=i;
      if(byName.description<0&&hasKW(h,KW_DESC))byName.description=i;
      if(byName.out<0&&hasKW(h,KW_OUT))byName.out=i;
      if(byName.in<0&&hasKW(h,KW_IN))byName.in=i;
      if(byName.amount<0&&hasKW(h,KW_AMT))byName.amount=i;
      if(byName.type<0&&hasKW(h,KW_TYPE)&&!hasKW(h,KW_DESC))byName.type=i;
    });
    var g=guessColMapByContent(imp.rows,start);
    imp.mapping.date=byName.date>-1?byName.date:(g.date>-1?g.date:0);
    /* Il nome dell'intestazione puo' mentire ("Data valuta" con dentro del
       testo). Prima di fidarsi si controlla quante date si leggono davvero, e
       se un'altra colonna fa molto meglio si usa quella. */
    imp.mapping.date=bestDateColumn(imp.rows,start,imp.mapping.date,g.date);
    imp.mapping.description=byName.description>-1?byName.description:(g.description>-1?g.description:Math.min(1,imp.rows[0].length-1));
    imp.mapping.typeCol=byName.type;

    if(byName.out>-1&&byName.in>-1){
      imp.amountMode='dual';
      imp.mapping.amountOut=byName.out;
      imp.mapping.amountIn=byName.in;
    }else if(g.moneyCols.length>=2&&looksLikeTwoColumns(g.moneyCols[0],g.moneyCols[1],start)){
      /* Due colonne di soldi che non sono quasi mai piene insieme:
         è il classico schema "uscite | entrate" (tipico dei PDF e degli
         Excel bancari, dove i numeri sono tutti positivi). */
      imp.amountMode='dual';
      imp.mapping.amountOut=g.moneyCols[0];
      imp.mapping.amountIn=g.moneyCols[1];
    }else{
      imp.amountMode='single';
      imp.mapping.amount=byName.amount>-1?byName.amount:(g.amount>-1?g.amount:imp.rows[0].length-1);
    }

    /* Segno: se nella colonna importo non c'è NESSUN numero negativo,
       trattarli tutti come entrate sarebbe assurdo → di default sono spese
       (tipico dei file Excel). Se c'è una colonna "tipo", si usa quella. */
    if(imp.amountMode==='single'){
      var neg=0,tot=0;
      for(var i=start;i<imp.rows.length;i++){
        var v=(imp.rows[i]||[])[imp.mapping.amount];
        var a=parseAmount(v);
        if(isNaN(a)||a===0)continue;
        tot++;
        if(a<0||/[-−]\s*$/.test(String(v)))neg++;
      }
      var allForced=imp.sheets.length>0&&imp.sheets.every(function(sh){return !!sh.forced;});
      if(imp.mapping.typeCol>-1)imp.signRule='column';
      else if(allForced)imp.signRule='auto';
      else if(tot>0&&neg===0){imp.signRule='expense';imp.warn='Nel file non ci sono importi negativi: li tratto tutti come spese. Se non è così, cambia qui sotto o correggi le singole righe nel passo successivo.';}
      else imp.signRule='auto';
    }
  }

  /* ---------- passo 2: colonne e segno ---------- */
  function colOptions(field,sel,allowNone){
    var head=imp.hasHeader?imp.rows[0]:[];
    var cols=imp.rows[0]?imp.rows[0].length:0;
    var out='<select class="select" data-map-field="'+field+'">';
    if(allowNone)out+='<option value="-1" '+(sel===-1?'selected':'')+'>'+tr('— nessuna —')+'</option>';
    for(var i=0;i<cols;i++){
      var label=imp.hasHeader?(String(head[i]||'').trim()||'Colonna '+(i+1)):'Colonna '+(i+1);
      out+='<option value="'+i+'" '+(sel===i?'selected':'')+'>'+esc(label)+'</option>';
    }
    return out+'</select>';
  }
  /* Mostra subito se le date si leggono o no, con due esempi veri presi dal
     file: e' il controllo che evita di ritrovarsi tutte le righe con la
     stessa data. */
  function datePreviewHTML(){
    if(!imp.rows.length)return '';
    var start=imp.hasHeader?1:0;
    var dc=readDateColumn(imp.rows,start,imp.mapping.date);
    if(!dc.total)return '<p class="hint" style="color:var(--red);margin-top:-4px;">⚠️ '+tr('Questa colonna e\' vuota: scegline un\'altra.')+'</p>';
    var ex=[],i;
    for(i=start;i<imp.rows.length&&ex.length<2;i++){
      var raw=String((imp.rows[i]||[])[imp.mapping.date]==null?'':(imp.rows[i]||[])[imp.mapping.date]).trim();
      var iso=dc.dates[i-start];
      if(raw&&iso)ex.push(esc(raw)+' → '+esc(formatDayHeader(iso)+' '+iso.slice(0,4)));
    }
    var pct=dc.total?Math.round(dc.ok/dc.total*100):0;
    var bad=pct<90;
    return '<p class="hint" style="margin-top:-4px;'+(bad?'color:var(--red);':'')+'">'+
      (bad?'⚠️ ':'')+tr('Date riconosciute')+': <strong>'+dc.ok+'/'+dc.total+'</strong>'+
      (dc.serial?' ('+tr('numeri di Excel')+')':'')+
      (dc.order==='mdy'?' · '+tr('formato mese/giorno'):'')+
      (ex.length?'<br>'+ex.join('<br>'):'')+
      (bad?'<br>'+tr('Prova un\'altra colonna: se le date non si leggono, tutti i movimenti finiscono con la data di oggi.'):'')+
      '</p>';
  }
  function step2(){
    analyze();
    var dual=imp.amountMode==='dual';
    var multi='';
    if(imp.sheets.length>1){
      multi='<p class="hint">📑 Il file ha '+imp.sheets.length+' fogli: '+
        imp.sheets.map(function(sh){
          var f=sh.forced==='expense'?' → tutte spese':sh.forced==='income'?' → tutte entrate':'';
          return '<strong>'+esc(sh.name)+'</strong> ('+Math.max(0,sh.rows.length-(sh.hasHeader?1:0))+' righe)'+f;
        }).join(' · ')+
        '. Le colonne scelte qui sotto valgono per tutti (sugli altri fogli le ritrovo dai nomi di intestazione).</p>';
    }
    return'<div class="sheet">'+stepDots()+'<h3 style="margin:4px 0 0;">'+tr('Associa le colonne')+'</h3>'+
      multi+
      (imp.warn?'<p class="hint" style="color:var(--red);">⚠️ '+esc(imp.warn)+'</p>':'')+
      '<label class="toggle-row"><span>'+tr('Prima riga come intestazione')+'</span><input type="checkbox" id="impHeader" '+(imp.hasHeader?'checked':'')+'></label>'+
      '<div class="field-group"><label class="field-label">'+tr('Colonna data')+'</label>'+colOptions('date',imp.mapping.date)+datePreviewHTML()+'</div>'+
      '<div class="field-group"><label class="field-label">'+tr('Colonna descrizione')+'</label>'+colOptions('description',imp.mapping.description)+'</div>'+
      '<div class="field-group"><label class="field-label">'+tr('Come sono scritti gli importi')+'</label><div class="segmented small">'+
        '<button class="'+(dual?'':'active')+'" data-amt-mode="single">'+tr('Una colonna')+'</button>'+
        '<button class="'+(dual?'active':'')+'" data-amt-mode="dual">Due colonne</button>'+
      '</div></div>'+
      (dual
        ? '<div class="field-group"><label class="field-label">'+tr('Colonna SPESE (uscite / addebiti / dare)')+'</label>'+colOptions('amountOut',imp.mapping.amountOut,true)+'</div>'+
          '<div class="field-group"><label class="field-label">'+tr('Colonna ENTRATE (accrediti / avere)')+'</label>'+colOptions('amountIn',imp.mapping.amountIn,true)+'</div>'
        : '<div class="field-group"><label class="field-label">'+tr('Colonna importo')+'</label>'+colOptions('amount',imp.mapping.amount)+'</div>'+
          '<div class="field-group"><label class="field-label">'+tr('Spesa o entrata?')+'</label><div class="segmented small">'+
            '<button class="'+(imp.signRule==='auto'?'active':'')+'" data-sign="auto">Dal segno −</button>'+
            '<button class="'+(imp.signRule==='expense'?'active':'')+'" data-sign="expense">'+tr('Tutte spese')+'</button>'+
            '<button class="'+(imp.signRule==='income'?'active':'')+'" data-sign="income">'+tr('Tutte entrate')+'</button>'+
            '<button class="'+(imp.signRule==='column'?'active':'')+'" data-sign="column">'+tr('Da colonna')+'</button>'+
          '</div></div>'+
          (imp.signRule==='column'?'<div class="field-group"><label class="field-label">'+tr('Colonna che dice spesa/entrata')+'</label>'+colOptions('typeCol',imp.mapping.typeCol,true)+'</div>':'')
      )+
      '<p class="hint">'+tr('Nel passo successivo puoi ancora cambiare riga per riga: c\'è un pulsante per passare da spesa a entrata.')+'</p>'+
      '<button class="btn-primary full-width" id="impNext2">Continua</button>'+
      '<button class="btn-secondary full-width" id="impBack2" data-back="1">'+tr('Indietro')+'</button></div>';
  }

  function typeFromColumn(v,val){
    var t=String(v||'').toLowerCase();
    if(/entrat|accredit|avere|credit|income|incasso|ricev|\+/.test(t))return 'income';
    if(/uscit|addebit|dare|debit|spesa|spese|pagament|prelie|-/.test(t))return 'expense';
    return val<0?'expense':'income';
  }
  /* Le colonne scelte valgono per il foglio di riferimento; sugli altri fogli
     si riconoscono per NOME di intestazione (se ce l'hanno), altrimenti si usa
     la stessa posizione. */
  function mappingForSheet(sh){
    var m=imp.mapping;
    if(!imp.refSheet||sh===imp.refSheet)return m;
    if(!imp.hasHeader||!sh.hasHeader||!sh.rows.length)return m;
    var refHead=(imp.rows[0]||[]).map(function(x){return String(x||'').toLowerCase().trim();});
    var head=(sh.rows[0]||[]).map(function(x){return String(x||'').toLowerCase().trim();});
    function conv(idx){
      if(idx==null||idx<0)return idx;
      var nm=refHead[idx];
      if(!nm)return idx;
      var j=head.indexOf(nm);
      return j>-1?j:idx;
    }
    return{date:conv(m.date),description:conv(m.description),amount:conv(m.amount),
           amountIn:conv(m.amountIn),amountOut:conv(m.amountOut),typeCol:conv(m.typeCol)};
  }
  function buildParsed(){
    var out=[];
    imp.dateFails=0;
    imp.sheets.forEach(function(sh){parseSheet(sh,out);});
    imp.parsed=out;
  }
  function parseSheet(sh,out){
    var rows=sh.rows||[];
    var hasHead=(sh===imp.refSheet)?imp.hasHeader:(sh.hasHeader!==false&&imp.hasHeader);
    var start=hasHead?1:0,m=mappingForSheet(sh),lastDate='';
    /* Le date si leggono guardando tutta la colonna in una volta, non riga
       per riga: solo cosi' si capisce se 06/07 e' 6 luglio o 7 giugno. */
    var dc=readDateColumn(rows,start,m.date);
    for(var i=start;i<rows.length;i++){
      var cols=rows[i]||[];
      var type,amount;
      if(imp.amountMode==='dual'){
        var o=m.amountOut>-1?parseAmount(cols[m.amountOut]):NaN;
        var e=m.amountIn>-1?parseAmount(cols[m.amountIn]):NaN;
        o=isNaN(o)?0:Math.abs(o);
        e=isNaN(e)?0:Math.abs(e);
        if(!o&&!e)continue;
        if(o>=e){type='expense';amount=o;}
        else{type='income';amount=e;}
      }else{
        var rawV=cols[m.amount];
        var ra=parseAmount(rawV);
        if(isNaN(ra)||ra===0)continue;
        if(/[-−]\s*$/.test(String(rawV))&&ra>0)ra=-ra;
        if(imp.signRule==='expense')type='expense';
        else if(imp.signRule==='income')type='income';
        else if(imp.signRule==='column')type=typeFromColumn(m.typeCol>-1?cols[m.typeCol]:'',ra);
        else type=ra<0?'expense':'income';
        amount=Math.abs(ra);
      }
      var rawDate=String(cols[m.date]==null?'':cols[m.date]).trim();
      var date=dc.dates[i-start]||null;
      var dateOk=!!date;
      if(!date){
        /* Cella vuota: e' la classica riga di continuazione, eredita la data
           di sopra. Cella PIENA ma illeggibile: e' un problema vero e va
           segnalato, non nascosto dietro la data di oggi. */
        if(!rawDate&&lastDate){date=lastDate;dateOk=true;}
        else{date=lastDate||todayISO();imp.dateFails++;}
      }
      lastDate=date;
      var desc=String(cols[m.description]==null?'':cols[m.description]).trim();
      if(sh.forced)type=sh.forced;   // foglio "Spese" o "Entrate": decide lui
      out.push({id:uid('imp'),date:date,desc:desc,amount:amount,include:true,type:type,
                sheet:sh.name||'',raw:cols,head:hasHead?(rows[0]||null):null,
                dateOk:dateOk,rawDate:rawDate,
                mkey:merchantKey(desc),categoryId:guessCat(desc,type)});
    }
  }

  /* ---------- passo 3: anteprima ---------- */
  function catOptsGrouped(sel){return'<optgroup label="Spese">'+catsByType('expense').map(function(c){return'<option value="'+c.id+'" '+(c.id===sel?'selected':'')+'>'+esc(c.emoji)+' '+esc(c.name)+'</option>';}).join('')+'</optgroup><optgroup label="Entrate">'+catsByType('income').map(function(c){return'<option value="'+c.id+'" '+(c.id===sel?'selected':'')+'>'+esc(c.emoji)+' '+esc(c.name)+'</option>';}).join('')+'</optgroup>';}
  /* Quante righe condividono lo stesso esercente: serve sia per il contatore
     "x12" accanto alla riga, sia per propagare la categoria. */
  function groupKey(r){return r.mkey?(r.type+'|'+r.mkey):'';}
  function buildGroups(){
    var g={};
    imp.parsed.forEach(function(r){var k=groupKey(r);if(k)g[k]=(g[k]||0)+1;});
    imp._groups=g;
  }
  function impCounts(){
    var cnt=0,inc=0;
    imp.parsed.forEach(function(r){if(r.include){cnt++;if(r.type==='income')inc++;}});
    return{cnt:cnt,inc:inc,exp:cnt-inc};
  }
  function impRowHTML(r,i){
    var n=(imp._groups&&imp._groups[groupKey(r)])||1;
    return'<div class="import-row-item'+(r.include?'':' is-off')+'" data-row="'+i+'">'+
      '<div class="imp-line1">'+
        '<input type="checkbox" data-inc="'+i+'" '+(r.include?'checked':'')+'>'+
        '<span class="imp-date'+(r.dateOk===false?' imp-date-bad':'')+'">'+(r.dateOk===false?'⚠ ':'')+formatShortDate(r.date)+'</span>'+
        '<span class="imp-desc" data-info="'+i+'">'+esc(r.desc||'—')+'</span>'+
        '<span class="imp-amt'+(r.type==='income'?' amt-income':'')+'">'+(r.type==='income'?'+':'−')+fmt(r.amount)+'</span>'+
      '</div>'+
      '<div class="imp-line2">'+
        '<button class="chip imp-flip" data-flip="'+i+'">'+(r.type==='income'?tr('Entrata'):tr('Spesa'))+'</button>'+
        '<select data-cat="'+i+'">'+catOptsGrouped(r.categoryId)+'</select>'+
        (n>1?'<span class="imp-grp" data-info="'+i+'">×'+n+'</span>':'')+
        (r.sheet&&imp.sheets.length>1?'<span class="imp-sheet">'+esc(r.sheet)+'</span>':'')+
        '<button class="imp-info" data-info="'+i+'" aria-label="'+tr('Dettagli')+'">i</button>'+
      '</div>'+
    '</div>';
  }
  function step3(){
    buildGroups();
    var c=impCounts();
    return'<div class="sheet">'+stepDots()+'<h3 style="margin:4px 0 0;">'+tr('Controlla e importa')+'</h3>'+
      '<p class="hint">'+imp.parsed.length+' '+tr('righe')+' · <strong id="impCnt">'+c.cnt+'</strong> '+tr('pronte per')+' "'+esc(accById(imp.accountId).name)+'" (<span id="impInc">'+c.inc+'</span> '+tr('entrate')+', <span id="impExp">'+c.exp+'</span> '+tr('spese')+'). '+tr('Tocca la descrizione o il tasto <strong>i</strong> per vedere tutti i dettagli della riga.')+'</p>'+
      (imp.dateFails?'<p class="hint" style="color:var(--red);">⚠️ '+imp.dateFails+' '+tr('righe senza data leggibile: hanno preso la data della riga precedente o quella di oggi. Torna indietro e controlla la colonna data.')+'</p>':'')+
      '<label class="toggle-row"><span>'+tr('Cambiando categoria, aggiorna tutte le righe dello stesso esercente')+'</span><input type="checkbox" id="impApplyAll" '+(imp.applyAll===false?'':'checked')+'></label>'+
      '<div class="card import-table">'+(imp.parsed.length?imp.parsed.map(function(r,i){
        return impRowHTML(r,i);
      }).join(''):'<p class="empty-note">'+tr('Nessuna riga valida: torna indietro e controlla le colonne.')+'</p>')+'</div>'+
      '<button class="btn-primary full-width" id="impConfirm" '+(c.cnt?'':'disabled')+'>'+tr('Importa')+' '+c.cnt+' '+tr('movimenti')+'</button>'+
      '<button class="btn-secondary full-width" id="impBack3" data-back="1">'+tr('Indietro')+'</button></div>';
  }

  /* ---------- finestrella dei dettagli di una riga ---------- */
  function impDetailHTML(i){
    var r=imp.parsed[i];
    if(!r)return '';
    var head=r.head||[],kv='';
    (r.raw||[]).forEach(function(v,ci){
      var val=String(v==null?'':v).trim();
      if(!val)return;
      var lab=String(head[ci]||'').trim()||(tr('Colonna')+' '+(ci+1));
      kv+='<div class="imp-kv"><span>'+esc(lab)+'</span><strong>'+esc(val)+'</strong></div>';
    });
    if(!kv)kv='<div class="imp-kv"><span>'+tr('Riga originale')+'</span><strong>—</strong></div>';
    var n=(imp._groups&&imp._groups[groupKey(r)])||1;
    var cat=catById(r.categoryId);
    return'<div class="imp-detail-wrap" id="impDetailWrap">'+
      '<div class="imp-detail-back" id="impDetailBack"></div>'+
      '<div class="imp-detail-box">'+
        '<h3 style="margin:0;">'+tr('Dettagli del movimento')+'</h3>'+
        '<p class="imp-detail-desc">'+esc(r.desc||'—')+'</p>'+
        '<div class="imp-detail-amt'+(r.type==='income'?' amt-income':'')+'">'+(r.type==='income'?'+':'−')+fmt(r.amount)+'</div>'+
        '<div class="imp-kv"><span>'+tr('Data')+'</span><strong>'+esc(formatDayHeader(r.date)+' '+r.date.slice(0,4))+
          (r.dateOk===false?'<br><span style="color:var(--red);font-weight:600;">⚠️ '+tr('data non riconosciuta')+(r.rawDate?': "'+esc(r.rawDate)+'"':'')+'</span>':'')+'</strong></div>'+
        '<div class="imp-kv"><span>'+tr('Tipo')+'</span><strong>'+(r.type==='income'?tr('Entrata'):tr('Spesa'))+'</strong></div>'+
        '<div class="imp-kv"><span>'+tr('Categoria')+'</span><strong>'+esc(cat.emoji+' '+cat.name)+'</strong></div>'+
        '<div class="imp-kv"><span>'+tr('Esercente riconosciuto')+'</span><strong>'+esc(merchantLabel(r.desc)||tr('non riconosciuto'))+'</strong></div>'+
        '<div class="imp-kv"><span>'+tr('Righe che cambiano insieme')+'</span><strong>'+n+'</strong></div>'+
        (r.sheet?'<div class="imp-kv"><span>'+tr('Foglio')+'</span><strong>'+esc(r.sheet)+'</strong></div>':'')+
        '<div class="imp-kv"><span>'+tr('Nel conto')+'</span><strong>'+esc(accById(imp.accountId).name)+'</strong></div>'+

        kv+
        '<div class="field-group" style="margin-top:10px;"><label class="field-label">'+tr('Cambia categoria')+'</label>'+
          '<select class="select" id="impDetailCat">'+catOptsGrouped(r.categoryId)+'</select></div>'+

  }
  function closeImpDetail(){
    var w=document.getElementById('impDetailWrap');
    if(w&&w.parentNode)w.parentNode.removeChild(w);
    syncBackHistory();
  }
  /* La finestrella si AGGIUNGE al modale senza ridisegnarlo: cosi' la lunga
     lista dietro non perde la posizione di scorrimento. */
  function openImpDetail(i){
    closeImpDetail();
    var root=document.getElementById('modal-root');
    if(!root)return;
    root.insertAdjacentHTML('beforeend',impDetailHTML(i));
    syncBackHistory();
    document.getElementById('impDetailBack').onclick=closeImpDetail;
    document.getElementById('impDetailClose').onclick=closeImpDetail;
    document.getElementById('impDetailCat').onchange=function(e){
      applyCategory(i,e.target.value);
      closeImpDetail();openImpDetail(i);
    };
    document.getElementById('impDetailFlip').onclick=function(){
      flipRow(i);closeImpDetail();openImpDetail(i);
    };
    document.getElementById('impDetailSkip').onclick=function(){
      var r=imp.parsed[i];
      r.include=!r.include;
      refreshRow(i);refreshCounts();
      closeImpDetail();openImpDetail(i);
    };
  }

  /* ---------- modifiche riga per riga (senza ridisegnare tutta la lista) ---------- */
  function refreshRow(i){
    var el=document.querySelector('.import-row-item[data-row="'+i+'"]');
    if(!el)return;
    var box=document.createElement('div');
    box.innerHTML=impRowHTML(imp.parsed[i],i);
    var nu=box.firstChild;
    el.parentNode.replaceChild(nu,el);
    wireRow(nu);
  }
  function refreshCounts(){
    var c=impCounts();
    var a=document.getElementById('impCnt');if(a)a.textContent=c.cnt;
    var b=document.getElementById('impInc');if(b)b.textContent=c.inc;
    var d=document.getElementById('impExp');if(d)d.textContent=c.exp;
    var btn=document.getElementById('impConfirm');
    if(btn){btn.disabled=!c.cnt;btn.textContent=tr('Importa')+' '+c.cnt+' '+tr('movimenti');}
  }
  function flipRow(i){
    var r=imp.parsed[i];
    r.type=r.type==='income'?'expense':'income';
    r.categoryId=guessCat(r.desc,r.type);
    buildGroups();
    refreshRow(i);refreshCounts();
  }
  /* Cuore della modifica: cambiando categoria a una riga, se l'interruttore e'
     acceso la stessa categoria va a TUTTE le righe dello stesso esercente che
     hanno lo stesso verso (spesa o entrata), e la scelta viene ricordata per
     gli import futuri. */
  function applyCategory(i,catId){
    var r=imp.parsed[i];
    if(!r)return;
    var cat=catById(catId);
    var wasType=r.type;
    var targets=[i];
    if(imp.applyAll!==false&&r.mkey){
      targets=[];
      imp.parsed.forEach(function(x,j){
        if(x.mkey===r.mkey&&(j===i||x.type===wasType))targets.push(j);
      });
    }
    var flips=(wasType!==cat.type);
    targets.forEach(function(j){
      imp.parsed[j].categoryId=catId;
      imp.parsed[j].type=cat.type;
      imp.parsed[j].touched=true;   // scelta esplicita: solo queste fanno regola
    });
    setMerchantRule(r.desc,cat.type,catId);
    if(flips){
      /* Il verso e' cambiato: vanno ridisegnate le righe (segno, colore, chip). */
      buildGroups();
      targets.forEach(refreshRow);
    }else{
      /* Solo la categoria: basta spostare il menu a tendina. Su un estratto
         conto di centinaia di righe evita di ricostruire mezza lista. */
      targets.forEach(function(j){
        var se=document.querySelector('.import-row-item[data-row="'+j+'"] select[data-cat]');
        if(se)se.value=catId;
      });
    }
    refreshCounts();
    if(targets.length>1){
      showToast(tr('Categoria applicata a')+' '+targets.length+' '+tr('righe di')+' “'+(merchantLabel(r.desc)||tr('questo esercente'))+'”');
    }
  }
  function wireRow(el){
    var i=+el.dataset.row;
    var c=el.querySelector('[data-inc]');
    if(c)c.onchange=function(){imp.parsed[i].include=c.checked;refreshRow(i);refreshCounts();};
    var f=el.querySelector('[data-flip]');
    if(f)f.onclick=function(){flipRow(i);};
    var se=el.querySelector('[data-cat]');
    if(se)se.onchange=function(){applyCategory(i,se.value);};
    el.querySelectorAll('[data-info]').forEach(function(b){
      b.onclick=function(ev){ev.preventDefault();openImpDetail(+b.dataset.info);};
    });
  }

  async function readFile(f){
    imp.busy=true;imp.error='';imp.warn='';imp.fileName=f.name;imp.analyzed=false;renderStep();
    var name=(f.name||'').toLowerCase();
    try{
      if(/\.xlsx$/.test(name)||(f.type||'').indexOf('spreadsheetml')>-1){
        imp.source='xlsx';
        imp.sheets=await xlsxToSheets(await f.arrayBuffer());
        imp.refSheet=imp.sheets[0];
        imp.sheets.forEach(function(sh){if(sh.rows.length>imp.refSheet.rows.length)imp.refSheet=sh;});
        imp.rows=imp.refSheet.rows;
        imp.hasHeader=true;imp.rawText='';
      }else if(/\.pdf$/.test(name)||f.type==='application/pdf'){
        /* L'import da PDF e' stato rimosso: i PDF delle banche sono impaginati
           in mille modi diversi e il risultato era troppo spesso sbagliato.
           CSV ed Excel danno dati puliti. */
        throw new Error(tr('I PDF non si possono importare. Scarica dalla banca il file CSV o Excel (.xlsx) degli stessi movimenti.'));
      }else{
        imp.source='csv';
        var text=await f.text();
        imp.rawText=text;
        imp.rows=rowsFromCSV(text);
        imp.hasHeader=true;
        if(!imp.rows.length)throw new Error(tr('Il file risulta vuoto.'));
      }
    }catch(e){
      imp.rows=[];imp.sheets=[];
      imp.error=(e&&e.message)?e.message:tr('Non sono riuscito a leggere il file.');
    }
    if(imp.rows.length&&imp.source!=='xlsx'){
      imp.sheets=[{name:'',rows:imp.rows}];
      imp.refSheet=imp.sheets[0];
    }
    imp.busy=false;
    renderStep();
  }

  function wireStep(){
    var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;
    if(imp.step===1){
      var fi=document.getElementById('impFile'),ta=document.getElementById('impText'),n1=document.getElementById('impNext1');
      fi.onchange=function(){var f=fi.files[0];if(f)readFile(f);};
      ta.oninput=function(){
        imp.rawText=ta.value;imp.source='csv';imp.fileName='';imp.error='';imp.analyzed=false;
        imp.rows=rowsFromCSV(imp.rawText);
        imp.sheets=imp.rows.length?[{name:'',rows:imp.rows}]:[];
        imp.refSheet=imp.sheets[0]||null;
        n1.disabled=!imp.rows.length;
      };
      document.getElementById('impAcc').onchange=function(e){imp.accountId=e.target.value;};
      n1.onclick=function(){if(!imp.rows.length)return;imp.step=2;renderStep();};
      document.getElementById('impCancel1').onclick=closeModal;
    }else if(imp.step===2){
      document.getElementById('impHeader').onchange=function(e){imp.hasHeader=e.target.checked;renderStep();};
      document.querySelectorAll('[data-map-field]').forEach(function(s){
        s.onchange=function(){imp.mapping[s.dataset.mapField]=parseInt(s.value,10);renderStep();};
      });
      document.querySelectorAll('[data-amt-mode]').forEach(function(b){
        b.onclick=function(){
          imp.amountMode=b.dataset.amtMode;
          if(imp.amountMode==='dual'&&imp.mapping.amountOut<0){
            var g=guessColMapByContent(imp.rows,imp.hasHeader?1:0);
            imp.mapping.amountOut=g.moneyCols[0]!==undefined?g.moneyCols[0]:0;
            imp.mapping.amountIn=g.moneyCols[1]!==undefined?g.moneyCols[1]:-1;
          }
          imp.warn='';renderStep();
        };
      });
      document.querySelectorAll('[data-sign]').forEach(function(b){
        b.onclick=function(){imp.signRule=b.dataset.sign;imp.warn='';renderStep();};
      });
      document.getElementById('impNext2').onclick=function(){buildParsed();imp.step=3;renderStep();};
      document.getElementById('impBack2').onclick=function(){imp.step=1;renderStep();};
    }else{
      var ap=document.getElementById('impApplyAll');
      if(ap)ap.onchange=function(){imp.applyAll=ap.checked;};
      document.querySelectorAll('.import-row-item[data-row]').forEach(wireRow);
      document.getElementById('impBack3').onclick=function(){closeImpDetail();imp.step=2;renderStep();};
      document.getElementById('impConfirm').onclick=function(){
        var chosen=imp.parsed.filter(function(r){return r.include;});
        chosen.forEach(function(r){state.transactions.push({id:uid('tx'),type:r.type,amount:r.amount,accountId:imp.accountId,categoryId:r.categoryId,merchant:'',note:r.desc,date:r.date,tags:[],createdAt:Date.now(),source:'import'});});
        /* Diventano regola per il futuro SOLO le categorie scelte a mano: le
           ipotesi automatiche non devono cementarsi. */
        chosen.forEach(function(r){if(r.touched)setMerchantRule(r.desc,r.type,r.categoryId);});
        saveState();closeImpDetail();closeModal();showToast(tr('Importati')+' '+chosen.length+' '+tr('movimenti'));renderActiveTab();
      };
    }
  }
  openModal('<div class="sheet"></div>');renderStep();
}

/* ================================================================
   PAGAMENTI RICORRENTI
   Un ricorrente è un modello di spesa (o entrata) che si ripete:
   abbonamenti, rate, tasse, bollette fisse. "Segna pagato" crea un
   movimento reale (che entra in saldi/totali/storico) con associata
   la data di ricorrenza, e fa avanzare la scadenza successiva.
================================================================ */
var CADENCES=[
  {id:'weekly',label:'Settimanale',per:'sett.',adj:'settimanale'},
  {id:'monthly',label:'Mensile',per:'mese',adj:'mensile'},
  {id:'quarterly',label:'Trimestrale',per:'trim.',adj:'trimestrale'},
  {id:'yearly',label:'Annuale',per:'anno',adj:'annuale'}
];
function cadenceById(id){for(var i=0;i<CADENCES.length;i++)if(CADENCES[i].id===id)return CADENCES[i];return CADENCES[1];}
function addCadenceISO(iso,cadence){
  var p=(iso||todayISO()).split('-');var dt=new Date(+p[0],+p[1]-1,+p[2]);
  if(cadence==='weekly')dt.setDate(dt.getDate()+7);
  else if(cadence==='quarterly')dt.setMonth(dt.getMonth()+3);
  else if(cadence==='yearly')dt.setFullYear(dt.getFullYear()+1);
  else dt.setMonth(dt.getMonth()+1);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
/* Somma mesi a una data tenendo il giorno dentro il mese: il 31 gennaio
   piu' un mese fa il 28 (o 29) febbraio, non il 3 marzo. */
function addMonthsISO(iso,n){
  var p=(iso||todayISO()).split('-');
  var y=+p[0],m=+p[1]-1,g=+p[2];
  var d=new Date(y,m+n,1);
  var ultimo=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  d.setDate(Math.min(g,ultimo));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ================================================================
   DURATA DI UN RICORRENTE
   Fino alla v51 un ricorrente andava avanti per sempre. Ora puo' avere
   una durata: X anni e X mesi a partire dalla prima scadenza. Quando le
   scadenze finiscono il ricorrente diventa "concluso": non chiede piu'
   di essere pagato, non entra nelle stime mensili, ma resta nell'elenco
   con il suo storico.
   Durata assente o a zero = indefinito, cioe' il comportamento di prima.
================================================================ */
function recDurMonths(item){return Math.max(0,(item.durY||0)*12+(item.durM||0));}
function recHasDuration(item){return recDurMonths(item)>0;}
function recStartDate(item){return item.startDate||item.nextDate||todayISO();}
/* Primo giorno NON piu' coperto: una scadenza vale se cade prima di questo. */
function recEndBound(item){
  if(!recHasDuration(item))return null;
  return addMonthsISO(recStartDate(item),recDurMonths(item));
}
/* Quante scadenze contiene la durata, con la cadenza scelta. */
function recTotalCount(item){
  var fine=recEndBound(item);
  if(!fine)return null;
  var d=recStartDate(item),n=0;
  while(d<fine&&n<5000){n++;d=addCadenceISO(d,item.cadence);}
  return n;
}
/* Rate gia' pagate: quelle registrate nell'app piu' quelle dichiarate come
   gia' pagate prima (per un finanziamento iniziato prima di usare Spendy). */
function recPaidCount(item){
  var prima=Math.max(0,item.paidBefore||0);
  var qui=(state.transactions||[]).filter(function(t){return t.recurringId===item.id&&!t.extraPayment;}).length;
  return prima+qui;
}
/* I versamenti in piu' rispetto alle rate. */
function loanExtras(item){
  if(!item)return [];
  return (state.transactions||[]).filter(function(t){return t.recurringId===item.id&&t.extraPayment;})
    .slice().sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:0);});
}
function loanExtraTotal(item){
  return loanExtras(item).reduce(function(sm,t){return sm+(t.amount||0);},0);
}
/* Quante rate "valgono" i versamenti fatti in piu': una stima, detta
   come stima. Serve a rispondere alla domanda vera, cioe' "e allora
   quando finisco?". */
function loanExtraInRate(item){
  var r=recCurrentAmount(item);
  if(!(r>0))return 0;
  return Math.floor(loanExtraTotal(item)/r);
}
function addLoanExtra(item,importo,dataISO,accountId,interessi){
  if(!item||!(importo>0))return null;
  var t={
    id:uid('tx'),type:'expense',amount:importo,
    accountId:accountId||item.accountId,categoryId:item.categoryId,
    merchant:item.name||'',note:tr('Versamento extra'),
    date:dataISO||todayISO(),tags:[],createdAt:Date.now(),
    source:'loan',recurringId:item.id,extraPayment:true
  };
  if(interessi>0)t.interestSaved=interessi;
  state.transactions.push(t);
  saveState();
  return t;
}
function recRemainingCount(item){
  var tot=recTotalCount(item);
  if(tot==null)return null;
  return Math.max(0,tot-recPaidCount(item));
}
/* Concluso = non ci sono piu' scadenze da onorare. */
function recFinished(item){
  if(!recHasDuration(item))return false;
  var fine=recEndBound(item);
  if((item.nextDate||'')>=fine)return true;
  var tot=recTotalCount(item);
  return tot!=null&&recPaidCount(item)>=tot;
}
/* Data dell'ultima scadenza prevista. Si conta dalle scadenze che RESTANO,
   non dalla data di partenza: cosi' tiene conto sia delle rate dichiarate
   come gia' pagate, sia di quelle registrate in anticipo. */
function recLastDueDate(item){
  var rim=recRemainingCount(item);
  if(rim==null)return null;
  if(rim<=0)return item.lastPaidDate||item.nextDate||null;
  var d=item.nextDate||todayISO();
  for(var i=1;i<rim&&i<5000;i++)d=addCadenceISO(d,item.cadence);
  return d;
}

/* ================================================================
   FINANZIAMENTI
   Un finanziamento e' un ricorrente con kind:'loan' e in piu':
   - loanTotal: quanto c'e' da restituire in tutto
   - phases: gli scaglioni della rata, es. 290 euro per 3 anni e poi
     400 per altri 3. La durata del ricorrente e' la somma degli scaglioni.
   La rata cambia da sola quando si passa allo scaglione dopo, e ogni
   pagamento registrato abbassa il residuo.
================================================================ */
function isLoan(item){return !!(item&&item.kind==='loan');}
function loanPhases(item){
  var f=(item&&item.phases)||[];
  f=f.filter(function(p){return p&&p.amount>0&&((p.y||0)*12+(p.m||0))>0;});
  if(!f.length)f=[{amount:item&&item.amount||0,y:item&&item.durY||0,m:item&&item.durM||0}];
  return f;
}
/* Quante rate cade dentro ogni scaglione, con la cadenza scelta. */
function loanPhaseCounts(item){
  var f=loanPhases(item),d=recStartDate(item),out=[],n=0;
  for(var i=0;i<f.length;i++){
    var fine=addMonthsISO(d,(f[i].y||0)*12+(f[i].m||0)),c=0;
    while(d<fine&&n<5000){c++;n++;d=addCadenceISO(d,item.cadence);}
    out.push(c);
  }
  return out;
}
/* Importo della rata numero i (si conta da 0). */
function loanAmountForIndex(item,i){
  var f=loanPhases(item),c=loanPhaseCounts(item),acc=0;
  for(var k=0;k<f.length;k++){
    acc+=c[k];
    if(i<acc)return f[k].amount;
  }
  return f[f.length-1].amount;
}
/* La rata da pagare adesso. Per tutto il resto vale l'importo di sempre. */
function recCurrentAmount(item){
  if(!isLoan(item))return item.amount||0;
  return loanAmountForIndex(item,recPaidCount(item));
}
/* Quanto e' gia' stato restituito: le rate dichiarate prima piu' quelle
   davvero registrate (cosi' un pagamento in anticipo conta subito). */
function loanPaidAmount(item){
  var prima=0,n=Math.max(0,item.paidBefore||0);
  for(var i=0;i<n;i++)prima+=loanAmountForIndex(item,i);
  var qui=(state.transactions||[]).filter(function(t){return t.recurringId===item.id;})
          .reduce(function(sm,t){return sm+(t.amount||0)+(t.interestSaved||0);},0);
  return prima+qui;
}
function loanRemaining(item){return Math.max(0,(item.loanTotal||0)-loanPaidAmount(item));}
/* Quanto si pagherebbe in tutto seguendo il piano delle rate: se non
   coincide con l'importo del finanziamento e' giusto dirlo. */
function loanPlannedTotal(item){
  var f=loanPhases(item),c=loanPhaseCounts(item),t=0;
  for(var i=0;i<f.length;i++)t+=f[i].amount*c[i];
  return t;
}
function loanProgressPct(item){
  var tot=item.loanTotal||0;
  if(!(tot>0))return 0;
  return Math.max(0,Math.min(100,loanPaidAmount(item)/tot*100));
}
/* Riepilogo pronto da mostrare: rate, residuo, quando si finisce. */
function loanSummary(item){
  var tot=recTotalCount(item)||0,pagate=Math.min(recPaidCount(item),tot);
  return {
    totale:item.loanTotal||0,
    pagato:loanPaidAmount(item),
    residuo:loanRemaining(item),
    pct:loanProgressPct(item),
    rate:tot,
    ratePagate:pagate,
    rateResidue:Math.max(0,tot-pagate),
    rataOra:recCurrentAmount(item),
    ultima:recLastDueDate(item),
    previsto:loanPlannedTotal(item),
    finito:recFinished(item)
  };
}
/* Mesi che mancano alla fine, per le statistiche. */
function durataTesto(mesi){
  if(mesi==null)return '—';
  var a=Math.floor(mesi/12),m=mesi%12;
  if(!a&&!m)return tr('meno di un mese');
  if(a&&m)return tr('{A} anni e {M} mesi').replace('{A}',String(a)).replace('{M}',String(m));
  if(a)return a===1?tr('1 anno'):tr('{A} anni').replace('{A}',String(a));
  return m===1?tr('1 mese'):tr('{M} mesi').replace('{M}',String(m));
}
function loanMonthsLeft(item){
  var u=recLastDueDate(item);
  if(!u)return null;
  var a=new Date(todayISO()+'T00:00:00'),b=new Date(u+'T00:00:00');
  var m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
  return Math.max(0,m);
}
function allLoans(){return (state.recurring||[]).filter(isLoan);}

function recMonthlyEquiv(item){
  if(recFinished(item))return 0;
  var a=recCurrentAmount(item);
  switch(item.cadence){case 'weekly':return a*52/12;case 'quarterly':return a/3;case 'yearly':return a/12;default:return a;}
}
function recStatus(item){
  if(recFinished(item))return 'done';
  if(item.status==='paused')return 'paused';
  if((item.nextDate||'')<todayISO())return 'overdue';
  return 'active';
}
function daysUntil(iso){
  var p=(iso||todayISO()).split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);var t=new Date();t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
function nextDueLabel(item){
  var st=recStatus(item);
  if(st==='done'){
    var u=recLastDueDate(item);
    return u?tr('Conclusa il {D}').replace('{D}',formatShortDate(u)):tr('Conclusa');
  }
  if(st==='paused')return 'In pausa';
  var n=daysUntil(item.nextDate);
  if(n<0)return 'Scaduta il '+formatShortDate(item.nextDate);
  if(n===0)return tr('In scadenza oggi');
  if(n===1)return 'Domani';
  return 'Prossima '+formatShortDate(item.nextDate);
}
/* Una ricorrente e' "pagata in avanti" quando l'ultimo pagamento registrato
   ha una data che deve ancora arrivare: e' il caso dell'affitto di agosto
   saldato a luglio. Senza questo, la scheda direbbe solo "prossima 3 set" e
   di agosto non ci sarebbe traccia. */
function recPaidAhead(item){
  return !!(item&&item.lastPaidDate&&item.lastPaidDate>todayISO());
}
function sortedRecurring(){
  return state.recurring.slice().sort(function(a,b){
    /* in fondo prima i conclusi, poi quelli in pausa */
    var fa=recFinished(a)?1:0,fb=recFinished(b)?1:0;
    if(fa!==fb)return fa-fb;
    var pa=a.status==='paused'?1:0,pb=b.status==='paused'?1:0;
    if(pa!==pb)return pa-pb;
    return (a.nextDate||'')<(b.nextDate||'')?-1:1;
  });
}
function payRecurring(id){
  var item=state.recurring.find(function(r){return r.id===id;});
  if(!item)return;
  if(item.kind==='pac'&&!isPremium()){premiumBlock('investments');return;}
  if(item.kind==='pac'){var d0=item.nextDate||todayISO();var pr=executePac(item,d0);if(!pr){showToast(tr('Prezzo non disponibile: riprova più tardi'));return;}saveState();showToast(tr('Investito {A}: {Q} quote di {S}').replace('{A}',fmt(pr.amount)).replace('{Q}',ipQty(pr.units)).replace('{S}',pr.symbol));renderActiveTab();return;}
  if(recFinished(item)){showToast(tr('Questo ricorrente è già concluso: non ci sono altre scadenze.'));return;}
  var due=item.nextDate||todayISO();
  var oggi=todayISO();
  /* Per un finanziamento l'importo e' quello dello scaglione in corso,
     non un numero fisso: e' proprio il punto della rata che cambia. */
  var rata=recCurrentAmount(item);
  /* Pagamento in ANTICIPO: il movimento porta la data della scadenza (il 3
     agosto resta il 3 agosto), ma teniamo da parte anche il giorno in cui
     l'hai davvero registrato. Servono tutte e due: la prima per far quadrare
     il mese, la seconda per poterti dire "l'hai gia' pagato". */
  var anticipo=(due>oggi);
  state.transactions.push({
    id:uid('tx'),type:item.type||'expense',amount:rata,
    accountId:item.accountId,categoryId:item.categoryId,
    merchant:item.name||'',note:item.note||(anticipo?tr('Pagamento anticipato di {N} previsto per il {D}').replace('{N}',item.name||'').replace('{D}',formatShortDate(due)):''),
    date:anticipo?oggi:due,tags:[],createdAt:Date.now(),
    source:isLoan(item)?'loan':'recurring',recurringId:item.id,recurrenceDate:due,
    paidAt:oggi,earlyPaid:anticipo
  });
  item.lastPaidDate=due;
  item.lastPaidAt=oggi;
  item.nextDate=addCadenceISO(due,item.cadence);
  /* la rata mostrata in elenco diventa quella nuova (utile quando si
     cambia scaglione: 290 diventa 400 senza dover toccare niente) */
  if(isLoan(item))item.amount=recCurrentAmount(item);
  saveState();
  if(recFinished(item))showToast(tr('Era l\'ultima rata: {R} è concluso.').replace('{R}',item.name||''));
  else if(anticipo)showToast(tr('Registrato oggi in anticipo (scadenza del {D}).').replace('{D}',formatShortDate(due)));
  else showToast((item.type==='income'?'Entrata':'Pagamento')+' registrato: '+fmt(rata));
  renderActiveTab();
}
/* L'ultimo pagamento registrato (non i versamenti extra) di un ricorrente. */
function recLastPayment(item){
  if(!item)return null;
  return (state.transactions||[]).filter(function(t){return t.recurringId===item.id&&!t.extraPayment;})
    .sort(function(a,b){var ka=a.recurrenceDate||a.date||'',kb=b.recurrenceDate||b.date||'';if(ka!==kb)return ka<kb?1:-1;return (a.createdAt||0)<(b.createdAt||0)?1:-1;})[0]||null;
}
/* Torna alla scadenza precedente: annulla l'ultimo pagamento. */
function recStepBack(id){
  var item=(state.recurring||[]).find(function(r){return r.id===id;});
  if(!item)return false;
  if(item.kind==='pac'){showToast(tr('Per il piano di accumulo annulla l\'acquisto dallo storico del titolo.'));return false;}
  var last=recLastPayment(item);
  if(!last){showToast(tr('Non c\'\u00e8 un pagamento da annullare.'));return false;}
  var prevDue=last.recurrenceDate||last.date;
  state.transactions=(state.transactions||[]).filter(function(t){return t.id!==last.id;});
  item.nextDate=prevDue;
  var prev2=recLastPayment(item);
  item.lastPaidDate=prev2?(prev2.recurrenceDate||prev2.date):null;
  item.lastPaidAt=prev2?(prev2.paidAt||null):null;
  if(isLoan(item))item.amount=recCurrentAmount(item);
  saveState();renderActiveTab();
  showToast(tr('Tornato alla scadenza del {D}').replace('{D}',formatShortDate(prevDue)));
  return true;
}
function askStepBack(id){
  var it=(state.recurring||[]).find(function(r){return r.id===id;});
  if(!it)return;
  if(it.kind==='pac'){recStepBack(id);return;}
  if(!recLastPayment(it)){showToast(tr('Non c\'\u00e8 un pagamento da annullare.'));return;}
  confirmDialog(tr('Annullare l\'ultimo pagamento di \u00ab{N}\u00bb? Il movimento verr\u00e0 rimosso e la scadenza torner\u00e0 indietro.').replace('{N}',esc(it.name||'')),function(){recStepBack(id);},tr('Annulla pagamento'));
}
/* Chiede conferma prima di registrare una ricorrente. Se la scadenza non e'
   ancora arrivata lo dice chiaro e tondo, con la data che avra' il movimento:
   e' la differenza fra "ho pagato oggi" e "il movimento risulta al 3 agosto". */
function askPayRecurring(id){
  var it=(state.recurring||[]).find(function(r){return r.id===id;});
  if(!it)return;
  if(isLoan(it)&&!isPremium()){premiumBlock('loans');return;}
  if(it.kind==='pac'){
    if(!isPremium()){premiumBlock('investments');return;}
    var _pu=pacUnits(it.amount,it.assetSymbol);
    confirmDialog(tr('Eseguire ora l\'acquisto')+' '+fmt(it.amount)+' → '+esc(it.assetSymbol)+(_pu?' ('+ipQty(_pu.units)+' '+tr('quote')+')':'')+'?',function(){payRecurring(id);},tr('Investi'));
    return;
  }
  var due=it.nextDate||todayISO(),oggi=todayISO(),rata=recCurrentAmount(it);
  var testo;
  if(due>oggi){
    testo=tr('Vuoi spesare adesso «{N}» ({I}) e passare alla scadenza successiva? Il movimento sarà datato oggi e nelle note risulterà come pagamento anticipato della scadenza del {D}.')
      .replace('{N}',esc(it.name||'')).replace('{I}',fmt(rata)).replace('{D}',formatShortDate(due));
  }else{
    testo='Registrare '+(it.type==='income'?'l\'entrata':'il pagamento')+' di '+fmt(rata)+' su "'+esc(it.name||'')+'"? Verrà creato un movimento e la scadenza passerà alla successiva.';
  }
  if(isLoan(it)){
    var rr=Math.max(0,loanRemaining(it)-rata);
    testo=tr('Rata di {I} su "{N}". Dopo averla registrata il residuo del finanziamento sarà {R}.')
      .replace('{I}',fmt(rata)).replace('{N}',esc(it.name||'')).replace('{R}',fmt(rr));
  }
  confirmDialog(testo,function(){payRecurring(id);},tr('Registra'));
}

/* ================================================================
   PROMEMORIA RICORRENTI
   Avvisa quando un pagamento ricorrente arriva a scadenza, così lo si
   può registrare. Due canali: una notifica di sistema (se l'utente ha
   dato il permesso) e comunque un banner dentro l'app. Il controllo gira
   all'avvio e quando l'app torna in primo piano; ogni scadenza avvisa
   una volta sola al giorno (memorizzato per non ripetere). */
var RECNOTIF_KEY='expense-tracker-recnotif-v1';
function recNotifLog(){
  try{var r=window.localStorage.getItem(RECNOTIF_KEY);return r?JSON.parse(r):{};}catch(e){return {};}
}
function recNotifSave(log){try{window.localStorage.setItem(RECNOTIF_KEY,JSON.stringify(log));}catch(e){}}
function dueRecurringToday(){
  return state.recurring.filter(function(r){
    return r.status!=='paused'&&!recFinished(r)&&daysUntil(r.nextDate)<=0&&
           !isLocked('recurring',r.id)&&!isLocked('accounts',r.accountId);
  });
}
function notifSupported(){try{return 'Notification' in window;}catch(e){return false;}}
function notifEnabled(){return notifSupported()&&Notification.permission==='granted';}
function requestRecNotifPermission(cb){
  if(!notifSupported()){showToast(tr('Le notifiche non sono disponibili in questo browser'));if(cb)cb(false);return;}
  if(Notification.permission==='granted'){if(cb)cb(true);return;}
  if(Notification.permission==='denied'){showToast(tr('Le notifiche sono bloccate: attivale dalle impostazioni del telefono per questa app'));if(cb)cb(false);return;}
  Notification.requestPermission().then(function(p){
    if(p==='granted'){showToast(tr('Notifiche attivate'));checkRecurringDue(true);}
    else showToast(tr('Notifiche non attivate'));
    if(cb)cb(p==='granted');
    renderActiveTab();
  }).catch(function(){if(cb)cb(false);});
}
function fireRecNotification(due){
  if(!notifEnabled())return;
  try{
    var title=due.length===1?'Pagamento ricorrente in scadenza':due.length+' pagamenti ricorrenti in scadenza';
    var body=due.slice(0,4).map(function(r){return (r.type==='income'?'↓ ':'↑ ')+r.name+' · '+fmt(r.amount);}).join('\n');
    if(due.length>4)body+='\n…e altri '+(due.length-4);
    var opts={body:body,tag:'ricorrenti'};
    var reg=(navigator.serviceWorker&&navigator.serviceWorker.controller&&navigator.serviceWorker.getRegistration)?true:false;
    var shown=false;
    function fallback(){if(shown)return;shown=true;try{new Notification(title,opts);}catch(e){}}
    if(!usingClaudeStorage&&navigator.serviceWorker&&navigator.serviceWorker.getRegistration){
      var t=setTimeout(fallback,600);
      navigator.serviceWorker.getRegistration().then(function(r){
        if(shown)return;
        if(r&&r.showNotification){shown=true;clearTimeout(t);try{r.showNotification(title,Object.assign({icon:'icon-192.png',badge:'icon-192.png'},opts));}catch(e){fallback();}}
        else{clearTimeout(t);fallback();}
      }).catch(function(){clearTimeout(t);fallback();});
    }else{
      fallback();
    }
  }catch(e){}
}
function checkRecurringDue(force){
  autoRunDuePacs();
  var due=dueRecurringToday();
  if(!due.length)return;
  var today=todayISO(),log=recNotifLog();
  var fresh=due.filter(function(r){return log[r.id]!==today;});
  if(fresh.length||force){
    fireRecNotification(due);
    due.forEach(function(r){log[r.id]=today;});
    recNotifSave(log);
  }
  if(ui.activeTab==='home')renderActiveTab();
}

    var sp=totalOf(filteredTx(currentMonthKey(),'all',c.id,'expense')),lm=b[c.id];

function fireBudgetNotification(items){

    }).join('\n');

    var opts={body:body,tag:'budget'};
    var shown=false;
    function fallback(){if(shown)return;shown=true;try{new Notification(title,opts);}catch(e){}}
    if(!usingClaudeStorage&&navigator.serviceWorker&&navigator.serviceWorker.getRegistration){
      var t=setTimeout(fallback,600);
      navigator.serviceWorker.getRegistration().then(function(r){
        if(shown)return;
        if(r&&r.showNotification){shown=true;clearTimeout(t);try{r.showNotification(title,Object.assign({icon:'icon-192.png',badge:'icon-192.png'},opts));}catch(e){fallback();}}
        else{clearTimeout(t);fallback();}
      }).catch(function(){clearTimeout(t);fallback();});

function checkBudgetAlerts(){
  if(!isPremium())return;
  if(!state||!state.categories)return;
  var mk=currentMonthKey(),log=budgetNotifLog(),fresh=[];
  budgetStatusList().forEach(function(a){
    var lvl=a.pct>=100?100:(a.pct>=80?80:0);
    if(!lvl)return;
    var key=mk+'|'+a.cat.id;
    if((log[key]||0)>=lvl)return;
    log[key]=lvl;
    fresh.push({cat:a.cat,spent:a.spent,limit:a.limit,pct:a.pct,level:lvl});
  });
  if(fresh.length){budgetNotifSave(log);fireBudgetNotification(fresh);}
}

/* ================================================================
   PAC — Piano di Accumulo (investimento ricorrente)
   Un PAC e' una ricorrente speciale (kind:'pac'): a ogni scadenza sposta
   un importo in euro dal conto scelto (registra una spesa) e compra quote
   dell'asset al prezzo del giorno (da prezzi.json), aggiornando il prezzo
   medio di carico. Puo' scattare da solo all'apertura dell'app oppure
   essere confermato a mano dal banner delle scadenze. Se manca il prezzo,
   rimanda al prossimo avvio. Solo monitoraggio: non e' consulenza.
================================================================ */
function ensureInvestCategory(){
  var byFlag=(state.categories||[]).filter(function(x){return x.type==='expense'&&x._invest;})[0];
  if(byFlag)return byFlag.id;
  var byName=(state.categories||[]).filter(function(x){return x.type==='expense'&&/investiment/i.test(x.name||'');})[0];
  if(byName){byName._invest=true;return byName.id;}
  var cat={id:uid('cat'),name:'Investimenti',emoji:'📈',color:0,type:'expense',custom:true,_invest:true};
  state.categories=state.categories||[];state.categories.push(cat);
  return cat.id;
}
function pacLastPrice(symbol){
  var e=priceEntry(symbol);
  if(!e)return null;
  var d=e.asof||null;
  if(!d&&Array.isArray(e.history)&&e.history.length&&e.history[e.history.length-1])d=e.history[e.history.length-1][0];
  if(typeof e.price==='number')return {price:e.price,currency:e.currency||'EUR',date:d};
  if(Array.isArray(e.history)&&e.history.length){var last=e.history[e.history.length-1];if(last&&typeof last[1]==='number')return {price:last[1],currency:e.currency||'EUR',date:d};}
  return null;
}
function pacUnits(amountEur,symbol){
  var p=pacLastPrice(symbol);if(!p)return null;
  if(p.date&&/^\d{4}-\d{2}-\d{2}/.test(String(p.date))&&daysUntil(String(p.date).slice(0,10))<-10)return null;
  var priceEur=p.price*fxToEur(p.currency);
  if(!(priceEur>0))return null;
  return {units:amountEur/priceEur, price:p.price, currency:p.currency, priceEur:priceEur};
}
function pacHolding(symbol){
  var s=String(symbol).toUpperCase();
  return (state.investments||[]).filter(function(h){return String(h.ticker).toUpperCase()===s;})[0]||null;
}
/* Esegue un PAC per la scadenza 'due'. Ritorna un riepilogo o null se manca il prezzo. */
function executePac(item,due){
  due=due||item.nextDate||todayISO();
  var u=pacUnits(item.amount,item.assetSymbol);
  if(!u)return null;
  var ce=catalogEntry(item.assetSymbol)||{};
  state.transactions.push({
    id:uid('tx'),type:'expense',amount:item.amount,
    accountId:item.accountId,categoryId:ensureInvestCategory(),
    merchant:item.name||('PAC '+item.assetSymbol),
    note:item.note||('Piano di accumulo · '+item.assetSymbol),
    date:due,tags:[],createdAt:Date.now(),
    source:'pac',recurringId:item.id,recurrenceDate:due,units:u.units,symbol:String(item.assetSymbol).toUpperCase(),unitPrice:u.price,unitCur:u.currency
  });
  state.investments=state.investments||[];
  ensureInvestAccount();
  var h=pacHolding(item.assetSymbol);
  if(h){
    var oldQty=invNum(h.qty),oldBuy=invNum(h.buyPrice);
    var newQty=oldQty+u.units;
    h.qty=newQty;
    h.buyPrice=newQty>0?((oldQty*oldBuy)+(u.units*u.price))/newQty:u.price;
    h.currency=u.currency;h.updatedAt=Date.now();
    if(!h.name&&ce.name)h.name=ce.name;
  }else{
    state.investments.push({id:uid('inv'),ticker:String(item.assetSymbol).toUpperCase(),name:ce.name||item.assetSymbol,kind:ce.kind||'etf',qty:u.units,buyPrice:u.price,price:null,currency:u.currency,date:due,createdAt:Date.now(),updatedAt:Date.now()});
  }
  item.lastPaidDate=due;
  item.nextDate=addCadenceISO(due,item.cadence);
  return {symbol:String(item.assetSymbol).toUpperCase(),units:u.units,amount:item.amount,price:u.price,currency:u.currency};
}
/* Esegue automaticamente i PAC scaduti (all'avvio / ritorno in primo piano / dopo il caricamento prezzi). */
function autoRunDuePacs(){
  if(!state||!state.recurring)return;
  /* I piani di accumulo comprano da soli solo con Premium attivo. Se
     l'abbonamento scade restano fermi: il portafoglio si vede lo stesso,
     ma non si aprono posizioni nuove alle spalle di chi non paga piu'. */
  if(!isPremium())return;
  var due=state.recurring.filter(function(r){
    return r.kind==='pac'&&r.status!=='paused'&&r.auto!==false&&daysUntil(r.nextDate)<=0&&
           !isLocked('recurring',r.id)&&!isLocked('accounts',r.accountId);
  });
  if(!due.length)return;
  var done=[],guard=0;
  due.forEach(function(item){
    var loops=0;
    while(item.status!=='paused'&&daysUntil(item.nextDate)<=0&&loops<24&&guard<200){
      var r=executePac(item,item.nextDate);
      loops++;guard++;
      if(!r)break; // prezzo mancante: riprova al prossimo avvio
      done.push(r);
    }
  });
  if(done.length){
    saveState();
    var tot={};done.forEach(function(r){var e=tot[r.symbol]||{a:0,u:0};e.a+=r.amount;e.u+=r.units;tot[r.symbol]=e;});
    var parts=Object.keys(tot).map(function(s){return fmt(tot[s].a)+' → '+ipQty(tot[s].u)+' '+s;});
    showToast(tr('Piano di accumulo eseguito')+': '+parts.join(', '));
    firePacNotification(done);
    if(ui.activeTab==='home'||ui.activeTab==='recurring')renderActiveTab();
  }
}
function firePacNotification(done){
  if(!notifEnabled())return;
  try{
    var title=done.length===1?tr('Piano di accumulo eseguito'):done.length+' '+tr('acquisti PAC eseguiti');
    var body=done.slice(0,4).map(function(r){return '📈 '+fmt(r.amount)+' → '+r.symbol+' ('+(r.units>=1?r.units.toFixed(3):r.units.toFixed(6))+' '+tr('quote')+')';}).join('\n');
    var opts={body:body,tag:'pac'};
    if(!usingClaudeStorage&&navigator.serviceWorker&&navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(function(r){
        if(r&&r.showNotification){try{r.showNotification(title,Object.assign({icon:'icon-192.png',badge:'icon-192.png'},opts));}catch(e){try{new Notification(title,opts);}catch(e2){}}}
        else{try{new Notification(title,opts);}catch(e){}}
      }).catch(function(){try{new Notification(title,opts);}catch(e){}});
    }else{try{new Notification(title,opts);}catch(e){}}
  }catch(e){}
}

/* ================================================================
   FINANZIAMENTI — modulo di inserimento (Premium)

   uno o piu' scaglioni, per esempio 290 euro per 3 anni e poi 400 per

   quanto si sara' pagato in tutto; se il conto non torna con l'importo
   dichiarato lo dice, invece di far finta di niente.
================================================================ */
/* Un solo pulsante in cima alla pagina Ricorrenti: da qui si sceglie che
   cosa aggiungere. Prima erano tre pulsanti in fondo all'elenco e con
   dieci ricorrenti bisognava scorrere fino in fondo per trovarli. */

  function fasiPulite(){

    }).filter(function(p){return p.amount>0&&((p.y*12+p.m)>0);});

  function recapBlock(){
    var a=anteprima();

    var durata=durataTesto(a.durM);

      avviso='<p class="loan-warn">'+(diff>0
        ? tr('Le rate previste sommano {P}, cioè {X} in più dell\'importo indicato: di solito è la parte di interessi.').replace('{P}',fmt(previsto)).replace('{X}',fmt(Math.abs(diff)))
        : tr('Le rate previste sommano {P}, cioè {X} in meno dell\'importo indicato: controlla durata o importi.').replace('{P}',fmt(previsto)).replace('{X}',fmt(Math.abs(diff))))+'</p>';

      avviso+

          '<div class="dur-cell wide"><label>'+tr('Importo (€)')+'</label><input type="text" inputmode="decimal" class="text-input" id="lnExAmt" value="'+esc(m.exStr)+'" placeholder="0,00"></div>'+

        '<p class="hint" style="margin:4px 0 2px;">'+tr('Facoltativo: interessi che non pagherai più. Abbassano il residuo ma non escono da nessun conto.')+'</p>'+
        '<div class="chip-row" style="margin-top:2px;">'+conti+'</div>'+

  /* Senza Premium un finanziamento gia' creato si guarda e si elimina,
     niente di piu': registrare rate o cambiare il piano sono azioni. */

      '<div class="field-group"><label class="field-label">'+tr('Importo del finanziamento')+'</label><div class="amount-field"><span class="amount-cur">€</span><input type="text" inputmode="decimal" id="lnTotal" class="text-input amount-input" value="'+esc(m.totalStr)+'" placeholder="0,00"></div><p class="hint" style="margin:6px 0 0;">'+tr('Quanto c\'è da restituire in tutto. Il residuo cala a ogni rata registrata.')+'</p></div>'+
      accChips()+catChips()+cadChips()+

      extraBlock()+
      '<div class="field-group"><label class="field-label">'+tr('Rate già pagate prima di oggi')+'</label><input type="number" min="0" max="999" inputmode="numeric" id="lnPaidBefore" class="text-input" value="'+(m.paidBefore||0)+'"><p class="hint" style="margin:6px 0 0;">'+tr('Se il finanziamento è già partito, scrivi quante rate hai già versato: verranno tolte dal residuo senza creare movimenti.')+'</p></div>'+
      '<label class="toggle-row" style="padding:2px 2px;"><span>'+tr('In pausa (non conta nelle scadenze)')+'</span><input type="checkbox" id="lnPaused" '+(m.status==='paused'?'checked':'')+'></label>'+
      '<div class="field-group"><label class="field-label">'+tr('Nota (opzionale)')+'</label><input type="text" id="lnNote" class="text-input" value="'+esc(m.note)+'" placeholder="'+tr('Es. finanziaria, numero pratica')+'"></div>'+
      delBtn+
      '<button class="btn-primary full-width sticky-save" id="lnSave">'+(m.isEdit?tr('Salva modifiche'):tr('Aggiungi finanziamento'))+'</button>';
  }
  function sheetHTML(){
    return '<div class="sheet"><div class="sheet-handle"></div><h3 style="margin:4px 0 0;font-family:var(--font-display);font-size:18px;letter-spacing:-0.01em;">🚗 '+(m.isEdit?tr('Modifica finanziamento'):tr('Nuovo finanziamento'))+'</h3><div id="lnBody" style="display:flex;flex-direction:column;gap:16px;">'+bodyHTML()+'</div></div>';
  }
  /* si ridisegna solo il blocco delle rate, non tutto il modulo */
  function rerenderFasi(){var el=document.getElementById('lnPhases');if(el){el.outerHTML=fasiBlock();wireFasi();}}
  function wireFasi(){
    document.querySelectorAll('[data-ln-pham]').forEach(function(i){i.oninput=function(){m.phases[+i.dataset.lnPham].amountStr=i.value;};i.onchange=function(){rerenderFasi();};});
    document.querySelectorAll('[data-ln-phy]').forEach(function(i){i.onchange=function(){m.phases[+i.dataset.lnPhy].y=Math.max(0,parseInt(i.value,10)||0);rerenderFasi();};});
    document.querySelectorAll('[data-ln-phm]').forEach(function(i){i.onchange=function(){m.phases[+i.dataset.lnPhm].m=Math.max(0,parseInt(i.value,10)||0);rerenderFasi();};});
    document.querySelectorAll('[data-ln-delph]').forEach(function(b){b.onclick=function(){m.phases.splice(+b.dataset.lnDelph,1);if(!m.phases.length)m.phases=[{amountStr:'',y:0,m:0}];rerenderFasi();};});
    var add=document.getElementById('lnAddPh');if(add)add.onclick=function(){m.phases.push({amountStr:'',y:0,m:0});rerenderFasi();};
  }
  function rerenderExtra(){var el=document.getElementById('lnExtra');if(el){el.outerHTML=extraBlock();wireExtra();}}
  function wireExtra(){
    var am=document.getElementById('lnExAmt');if(am)am.oninput=function(){m.exStr=am.value;};
    var it0=document.getElementById('lnExInt');if(it0)it0.oninput=function(){m.exIntStr=it0.value;};
    var dt=document.getElementById('lnExDate');if(dt)dt.onchange=function(){m.exDate=dt.value||todayISO();};
    document.querySelectorAll('[data-ln-exacc]').forEach(function(b){b.onclick=function(){m.exAcc=b.dataset.lnExacc;document.querySelectorAll('[data-ln-exacc]').forEach(function(q){q.classList.toggle('selected',q===b);});};});
    document.querySelectorAll('[data-ln-exdel]').forEach(function(b){b.onclick=function(){
      var id=b.dataset.lnExdel;
      confirmDialog(tr('Eliminare questo versamento extra? Il residuo tornerà a salire.'),function(){
        state.transactions=state.transactions.filter(function(t){return t.id!==id;});
        saveState();rerenderExtra();renderActiveTab();showToast(tr('Versamento eliminato'));
      },tr('Elimina'));
    };});
    var add=document.getElementById('lnExAdd');
    if(add)add.onclick=function(){
      var it=state.recurring.find(function(r){return r.id===m.id;});
      if(!it)return;
      var v=parseAmount(String(m.exStr).replace(',','.'));
      if(!(v>0)){showToast(tr('Inserisci l\'importo del versamento'));return;}
      var vi=parseAmount(String(m.exIntStr||'').replace(',','.'))||0;
      addLoanExtra(it,v,m.exDate,m.exAcc,vi>0?vi:0);
      m.exStr='';m.exIntStr='';
      rerenderExtra();
      renderActiveTab();
      showToast(tr('Versamento registrato: residuo {R}').replace('{R}',fmt(loanRemaining(it))));
    };
  }
  function wireBody(){
    if(m.isEdit&&!isPremium()){
      var pb=document.getElementById('lnPrem');if(pb)pb.onclick=function(){closeModal();openPremiumSheet();};
      var db0=document.getElementById('lnDel');
      if(db0)db0.onclick=function(){confirmDialog(tr('Eliminare il finanziamento')+' "'+esc(m.name)+'"? '+tr('Le rate già registrate restano nello storico.'),function(){state.recurring=state.recurring.filter(function(r){return r.id!==m.id;});saveState();closeModal();showToast(tr('Finanziamento eliminato'));renderActiveTab();},tr('Elimina'));};
      return;
    }
    var nm=document.getElementById('lnName');if(nm)nm.oninput=function(){m.name=nm.value;};
    var tt=document.getElementById('lnTotal');if(tt){tt.oninput=function(){m.totalStr=tt.value;};tt.onchange=function(){rerenderFasi();};}
    var nt=document.getElementById('lnNote');if(nt)nt.oninput=function(){m.note=nt.value;};
    var dt=document.getElementById('lnDate');if(dt)dt.onchange=function(){m.nextDate=dt.value||todayISO();rerenderFasi();};
    var pb=document.getElementById('lnPaidBefore');if(pb)pb.onchange=function(){m.paidBefore=Math.max(0,parseInt(pb.value,10)||0);};
    var pz=document.getElementById('lnPaused');if(pz)pz.onchange=function(){m.status=pz.checked?'paused':'active';};
    document.querySelectorAll('[data-ln-cat]').forEach(function(b){b.onclick=function(){m.categoryId=b.dataset.lnCat;document.querySelectorAll('[data-ln-cat]').forEach(function(q){q.classList.toggle('selected',q===b);});};});
    document.querySelectorAll('[data-ln-acc]').forEach(function(b){b.onclick=function(){if(b.dataset.locked){lockedBlock('accounts');return;}m.accountId=b.dataset.lnAcc;document.querySelectorAll('[data-ln-acc]').forEach(function(q){q.classList.toggle('selected',q===b);});};});
    document.querySelectorAll('[data-ln-cad]').forEach(function(b){b.onclick=function(){m.cadence=b.dataset.lnCad;document.querySelectorAll('[data-ln-cad]').forEach(function(q){q.classList.toggle('active',q===b);});rerenderFasi();};});
    wireFasi();
    wireExtra();
    var db=document.getElementById('lnDel');if(db)db.onclick=function(){confirmDialog(tr('Eliminare il finanziamento')+' "'+esc(m.name)+'"? '+tr('Le rate già registrate restano nello storico.'),function(){state.recurring=state.recurring.filter(function(r){return r.id!==m.id;});saveState();closeModal();showToast(tr('Finanziamento eliminato'));renderActiveTab();},tr('Elimina'));};
    var sv=document.getElementById('lnSave');if(sv)sv.onclick=salva;
  }
  function salva(){
    var name=(m.name||'').trim();
    if(!name){showToast(tr('Dai un nome al finanziamento'));return;}
    var tot=parseAmount(String(m.totalStr).replace(',','.'));
    if(!(tot>0)){showToast(tr('Inserisci l\'importo del finanziamento'));return;}
    var f=fasiPulite();
    if(!f.length){showToast(tr('Inserisci almeno una rata con la sua durata.'));return;}
    if(!m.accountId){showToast(tr('Scegli il conto da cui scalare la rata'));return;}
    var mesi=f.reduce(function(t,p){return t+p.y*12+p.m;},0);
    var date=m.nextDate||todayISO();
    var dati={name:name,type:'expense',categoryId:m.categoryId,accountId:m.accountId,
      cadence:m.cadence,nextDate:date,note:(m.note||'').trim(),status:m.status,
      kind:'loan',loanTotal:tot,phases:f,durY:0,durM:mesi,
      paidBefore:Math.max(0,m.paidBefore||0)};
    if(m.isEdit){
      var it=state.recurring.find(function(r){return r.id===m.id;});
      if(it){Object.keys(dati).forEach(function(k){it[k]=dati[k];});if(!it.startDate)it.startDate=date;it.amount=recCurrentAmount(it);}
    }else{
      if(!isPremium()){premiumBlock('loans');return;}
      if(!canAdd('recurring')){premiumBlock('recurring');return;}
      var nuovo=Object.assign({id:uid('rec'),startDate:date,lastPaidDate:null,createdAt:Date.now()},dati);
      nuovo.amount=recCurrentAmount(nuovo);
      state.recurring.push(nuovo);
    }
    saveState();closeModal();
    showToast(m.isEdit?tr('Finanziamento aggiornato'):tr('Finanziamento aggiunto'));
    renderActiveTab();
  }
  function render(){var wrap=rerenderSheetWrap(sheetHTML());if(!wrap)return;wireBody();var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;}
  openModal('<div class="sheet"></div>');
  render();
}
/* Apre il modulo giusto a seconda di che cosa e': rata, piano di accumulo

function openRecurringEditor(id){
  var it=(state.recurring||[]).find(function(r){return r.id===id;});
  if(it&&it.kind==='pac'){openPacSheet({id:id});return;}
  if(it&&it.kind==='loan'){openLoanSheet({id:id});return;}
  openRecurringSheet({id:id});
}
function openRecurringSheet(opts){
  opts=opts||{};
  var edit=opts.id?state.recurring.find(function(r){return r.id===opts.id;}):null;
  var m={
    isEdit:!!edit,
    id:edit?edit.id:null,
    name:edit?(edit.name||''):'',
    type:edit?(edit.type||'expense'):'expense',
    amountStr:edit?String(edit.amount).replace('.',','):'',
    categoryId:edit?edit.categoryId:(catsByType('expense')[0]||{}).id,
    accountId:edit?edit.accountId:(lastUsedAccId&&state.accounts.some(function(a){return a.id===lastUsedAccId;})?lastUsedAccId:state.accounts[0].id),
    cadence:edit?(edit.cadence||'monthly'):'monthly',
    nextDate:edit?edit.nextDate:todayISO(),
    note:edit?(edit.note||''):'',
    status:edit?(edit.status||'active'):'active',
    startDate:edit?(edit.startDate||edit.nextDate||todayISO()):todayISO(),
    durY:edit?(edit.durY||0):0,
    durM:edit?(edit.durM||0):0,
    showCatForm:false,newCatName:'',newCatEmoji:'',newCatColor:0
  };
  m.durMode=((m.durY||0)+(m.durM||0))>0?'fixed':'forever';
  if(!m.categoryId){var fc=catsByType(m.type==='income'?'income':'expense')[0];m.categoryId=fc?fc.id:null;}

  function catChips(){
    var chips=catsByType(m.type==='income'?'income':'expense').map(function(c){return'<button class="chip'+(c.id===m.categoryId?' selected':'')+'" data-rc-cat="'+c.id+'"><span class="dot" style="background:'+colorHex(c.color)+'"></span>'+esc(c.emoji)+' '+esc(c.name)+'</button>';}).join('');
    chips+='<button class="chip" id="rcNewCatBtn">+ '+tr('Nuova')+'</button>';
