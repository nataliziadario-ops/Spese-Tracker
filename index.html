function filteredTx(monthKey,accFilter,catFilter,typeFilter){
  return state.transactions.filter(function(t){
    if(t.date.slice(0,7)!==monthKey)return false;
    if(accFilter&&accFilter!=='all'&&t.accountId!==accFilter)return false;
    if(catFilter&&catFilter!=='all'&&t.categoryId!==catFilter)return false;
    if(typeFilter&&typeFilter!=='all'&&t.type!==typeFilter)return false;
    return true;
  });
}
function totalOf(list){return list.reduce(function(s,e){return s+e.amount;},0);}
function breakdown(list){
  var map={};list.forEach(function(e){map[e.categoryId]=(map[e.categoryId]||0)+e.amount;});
  var tot=totalOf(list);
  return Object.keys(map).map(function(id){return{catId:id,total:map[id],pct:tot>0?map[id]/tot*100:0};}).sort(function(a,b){return b.total-a.total;});
}
function periodTotals(monthKey,accFilter){
  var inc=totalOf(filteredTx(monthKey,accFilter,'all','income'));
  var exp=totalOf(filteredTx(monthKey,accFilter,'all','expense'));
  return{income:inc,expense:exp,net:inc-exp};
}
function accBalance(accId){
  var b=0;
  state.transactions.forEach(function(t){if(t.accountId!==accId)return;b+=t.type==='income'?t.amount:-t.amount;});
  state.transfers.forEach(function(tr){if(tr.fromAccountId===accId)b-=tr.amount;if(tr.toAccountId===accId)b+=tr.amount;});
  return b;
}
function accMonthExp(accId){return totalOf(filteredTx(currentMonthKey(),accId,'all','expense'));}
function annualData(year,accFilter){
  var incM=new Array(12).fill(0),expM=new Array(12).fill(0),catExp={},catInc={};
  state.transactions.forEach(function(t){
    if(t.date.slice(0,4)!==String(year))return;
    if(accFilter!=='all'&&t.accountId!==accFilter)return;
    var m=parseInt(t.date.slice(5,7),10)-1;
    if(t.type==='income'){incM[m]+=t.amount;catInc[t.categoryId]=(catInc[t.categoryId]||0)+t.amount;}
    else{expM[m]+=t.amount;catExp[t.categoryId]=(catExp[t.categoryId]||0)+t.amount;}
  });
  var totInc=incM.reduce(function(a,b){return a+b;},0);
  var totExp=expM.reduce(function(a,b){return a+b;},0);
  return{incomeByMonth:incM,expenseByMonth:expM,totalIncome:totInc,totalExpense:totExp,net:totInc-totExp,catExp:catExp,catInc:catInc};
}
function combinedEntries(monthKey,accFilter,catFilter,typeFilter,tagFilter){
  var out=[];
  if(typeFilter!=='transfer'){
    filteredTx(monthKey,accFilter,catFilter,typeFilter==='all'?'all':typeFilter).filter(function(t){
      if(!tagFilter)return true;return t.tags&&t.tags.indexOf(tagFilter)>-1;
    }).forEach(function(t){out.push({kind:'tx',date:t.date,createdAt:t.createdAt,data:t});});
  }
  if((typeFilter==='all'||typeFilter==='transfer')&&(!catFilter||catFilter==='all')){
    state.transfers.filter(function(tr){
      if(tr.date.slice(0,7)!==monthKey)return false;
      if(accFilter!=='all'&&tr.fromAccountId!==accFilter&&tr.toAccountId!==accFilter)return false;
      if(tagFilter)return tr.tags&&tr.tags.indexOf(tagFilter)>-1;
      return true;
    }).forEach(function(tr){out.push({kind:'transfer',date:tr.date,createdAt:tr.createdAt,data:tr});});
  }
  out.sort(function(a,b){return(b.date+(b.createdAt||0))>(a.date+(a.createdAt||0))?1:-1;});
  return out;
}
function allEntries(){
  var out=state.transactions.map(function(t){return{kind:'tx',date:t.date,createdAt:t.createdAt,data:t};})
    .concat(state.transfers.map(function(tr){return{kind:'transfer',date:tr.date,createdAt:tr.createdAt,data:tr};}));
  out.sort(function(a,b){return(b.date+(b.createdAt||0))>(a.date+(a.createdAt||0))?1:-1;});
  return out;
}
function recentEntries(n){return allEntries().slice(0,n);}
function searchEntries(query){
  if(!query||!query.trim())return recentEntries(20);
  var q=query.toLowerCase().trim();
  return allEntries().filter(function(entry){
    if(entry.kind==='tx'){
      var t=entry.data,cat=catById(t.categoryId),acc=accById(t.accountId);
      if((t.note||'').toLowerCase().indexOf(q)>-1)return true;
      if((t.merchant||'').toLowerCase().indexOf(q)>-1)return true;
      if(cat.name.toLowerCase().indexOf(q)>-1)return true;
      if(acc.name.toLowerCase().indexOf(q)>-1)return true;
      if(t.amount.toFixed(2).replace('.',',').indexOf(q)>-1)return true;
      if(t.tags){for(var i=0;i<t.tags.length;i++){var tg=tagById(t.tags[i]);if(tg&&tg.name.toLowerCase().indexOf(q)>-1)return true;}}
      return false;
    }else{
      var tr=entry.data,fa=accById(tr.fromAccountId),ta=accById(tr.toAccountId);
      if((tr.note||'').toLowerCase().indexOf(q)>-1)return true;
      if(fa.name.toLowerCase().indexOf(q)>-1)return true;
      if(ta.name.toLowerCase().indexOf(q)>-1)return true;
      if(tr.amount.toFixed(2).replace('.',',').indexOf(q)>-1)return true;
      if(tr.tags){for(var i=0;i<tr.tags.length;i++){var tg=tagById(tr.tags[i]);if(tg&&tg.name.toLowerCase().indexOf(q)>-1)return true;}}
      return false;
    }
  });
}

function donutSVG(bd){
  var sz=110,sw=18,r=(sz-sw)/2,ci=2*Math.PI*r,cx=sz/2,cy=sz/2;
  if(!bd.length)return '<svg viewBox="0 0 '+sz+' '+sz+'" class="donut"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+sw+'"/></svg>';
  var off=0,circles='',gapPx=bd.length>1?2.4:0;
  bd.forEach(function(b){var cat=catById(b.catId),full=(b.pct/100)*ci,len=Math.max(full-gapPx,0.8);circles+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colorHex(cat.color)+'" stroke-width="'+sw+'" stroke-dasharray="'+len.toFixed(2)+' '+(ci-len).toFixed(2)+'" stroke-dashoffset="'+(-(off+gapPx/2)).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')" stroke-linecap="butt"/>';off+=full;});
  return '<svg viewBox="0 0 '+sz+' '+sz+'" class="donut">'+circles+'</svg>';
}

function barChartSVG(incM,expM){
  var W=360,H=160,BTM=20,TOP=8,chartH=H-BTM-TOP;
  var maxVal=Math.max.apply(null,[1].concat(incM).concat(expM));
  var gW=W/12,bW=11,gap=2,circles='';
  for(var i=0;i<12;i++){
    var x=i*gW,gx=x+(gW-bW*2-gap)/2;
    var ih=(incM[i]/maxVal)*chartH,eh=(expM[i]/maxVal)*chartH;
    var baseY=TOP+chartH;
    if(ih>0)circles+='<rect x="'+gx.toFixed(1)+'" y="'+(baseY-ih).toFixed(1)+'" width="'+bW+'" height="'+ih.toFixed(1)+'" rx="3" fill="var(--accent)"/>';
    if(eh>0)circles+='<rect x="'+(gx+bW+gap).toFixed(1)+'" y="'+(baseY-eh).toFixed(1)+'" width="'+bW+'" height="'+eh.toFixed(1)+'" rx="3" fill="var(--red)"/>';
    circles+='<text x="'+(x+gW/2).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" font-size="9" fill="var(--ink-faint)">'+MONTH_ABBREVS[i]+'</text>';
  }
  var baseY2=TOP+chartH;
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%"><line x1="0" y1="'+baseY2+'" x2="'+W+'" y2="'+baseY2+'" stroke="var(--border)" stroke-width="1"/>'+circles+'</svg>';
}

function wireDashChart(){
  var card=document.getElementById('dashChartCard'),tip=document.getElementById('dashTip');
  if(!card||!tip)return;
  var d=dashboardData();
  document.querySelectorAll('[data-chart-idx]').forEach(function(r){
    function show(){
      var i=+r.dataset.chartIdx;
      tip.textContent=monthShortLabel(d.keys[i])+' · +'+fmt(d.incs[i])+' · −'+fmt(d.exps[i]);
      var rb=r.getBoundingClientRect(),cb=card.getBoundingClientRect();
      tip.style.left=(rb.left-cb.left+rb.width/2)+'px';
      tip.style.top=(rb.top-cb.top+18)+'px';
      tip.classList.add('show');
    }
    r.addEventListener('pointerenter',show);
    r.addEventListener('pointerdown',show);
    r.addEventListener('pointerleave',function(){tip.classList.remove('show');});
  });
}

  var base=Math.max(limit||0,spent||0,100);

function catUsageCount(id){
  var n=0;
  state.transactions.forEach(function(t){if(t.categoryId===id)n++;});
  state.recurring.forEach(function(r){if(r.categoryId===id)n++;});
  return n;

     ricostruire l'intero foglio: niente flash né scroll che salta. */
  function refreshCard(id){
    var card=document.querySelector('.budget-card[data-budget-id="'+id+'"]');
    if(!card)return;
    var sp=totalOf(filteredTx(currentMonthKey(),'all',id,'expense')),lm=state.budgets[id]||0;
    var pct=lm>0?Math.min(sp/lm*100,100):0;
    var bar=lm>0?(sp/lm>=1?'var(--red)':sp/lm>=0.8?'var(--amber)':'var(--accent)'):'var(--track)';
    var fill=card.querySelector('.progress-fill');if(fill){fill.style.width=pct+'%';fill.style.background=bar;}
    var fig=card.querySelector('.budget-figures');if(fig)fig.textContent=lm>0?fmt(sp)+' / '+fmt(lm):fmt(sp);
  }
  function wire(){
    var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;
    document.querySelectorAll('[data-budget-slider]').forEach(function(sl){
      var id=sl.dataset.budgetSlider,card=sl.closest('.budget-card');
      sl.oninput=function(){
        var v=parseFloat(sl.value)||0,mx=parseFloat(sl.max)||1;
        sl.style.setProperty('--slider-pct',(v/mx*100).toFixed(1)+'%');
        var num=card.querySelector('[data-budget-cat]');if(num)num.value=v>0?v:'';
        var fig=card.querySelector('.budget-figures');
        var sp=totalOf(filteredTx(currentMonthKey(),'all',id,'expense'));
        if(fig)fig.textContent=v>0?fmt(sp)+' / '+fmt(v):fmt(sp);
      };
      sl.onchange=function(){setBudgetLimit(id,parseFloat(sl.value)||0);refreshCard(id);};
    });
    document.querySelectorAll('[data-budget-cat]').forEach(function(inp){
      inp.onchange=function(){
        var id=inp.dataset.budgetCat;
        setBudgetLimit(id,parseFloat(String(inp.value).replace(',','.')));
        var v=state.budgets[id]||0,card=inp.closest('.budget-card'),sl=card.querySelector('[data-budget-slider]');
        if(sl){var mx=parseFloat(sl.max)||1;if(v>mx){sl.max=Math.max(mx,Math.ceil(v*1.6/50)*50);mx=parseFloat(sl.max);}sl.value=Math.min(v,mx);sl.style.setProperty('--slider-pct',(sl.value/mx*100).toFixed(1)+'%');}
        refreshCard(id);
      };
    });
    document.querySelectorAll('[data-newcat-type]').forEach(function(b){b.onclick=function(){
      ui.newCatType=b.dataset.newcatType;
      document.querySelectorAll('[data-newcat-type]').forEach(function(q){q.classList.remove('active','mode-income');});
      b.classList.add('active');if(ui.newCatType==='income')b.classList.add('mode-income');
    };});
    var ab=document.getElementById('addCatBtn');
    if(ab)ab.onclick=function(){
      var name=document.getElementById('newCatName').value.trim(),emoji=document.getElementById('newCatEmoji').value.trim()||(ui.newCatType==='income'?'💰':'🏷️');
      if(!name){showToast('Dai un nome alla categoria');return;}
      state.categories.push({id:uid('cat'),name:name,emoji:emoji,color:state.categories.length%8,type:ui.newCatType,custom:true});
      saveState();showToast('Categoria aggiunta');render();
    };
    /* --- gestione categorie: modifica / elimina --- */
    document.querySelectorAll('[data-cat-edit]').forEach(function(b){b.onclick=function(){ui.editingCatId=b.dataset.catEdit;ui.editingTagId=null;render();};});
    document.querySelectorAll('[data-cat-canceledit]').forEach(function(b){b.onclick=function(){ui.editingCatId=null;render();};});
    document.querySelectorAll('[data-cat-save]').forEach(function(b){b.onclick=function(){
      var c=catById(b.dataset.catSave);
      var nm=(document.getElementById('editCatName').value||'').trim();
      var em=(document.getElementById('editCatEmoji').value||'').trim();
      if(!nm){showToast('Il nome non può essere vuoto');return;}
      c.name=nm;if(em)c.emoji=em;
      ui.editingCatId=null;saveState();showToast('Categoria aggiornata');render();
    };});
    document.querySelectorAll('[data-cat-del]').forEach(function(b){b.onclick=function(){
      var id=b.dataset.catDel,c=catById(id),n=catUsageCount(id);
      if(state.categories.filter(function(x){return x.type===c.type;}).length<=1){showToast('Deve restare almeno una categoria di questo tipo');return;}
      var others=state.categories.filter(function(x){return x.type===c.type&&x.id!==id;});
      var target=others[0];
      var warn=n===0?'Nessun movimento usa questa categoria.':(n+' movimenti/ricorrenti passeranno a "'+target.emoji+' '+target.name+'".');
      confirmDialog('Eliminare la categoria "'+c.emoji+' '+c.name+'"? '+warn,function(){
        state.transactions.forEach(function(t){if(t.categoryId===id)t.categoryId=target.id;});
        state.recurring.forEach(function(r){if(r.categoryId===id)r.categoryId=target.id;});
        delete state.budgets[id];
        state.categories=state.categories.filter(function(x){return x.id!==id;});
        ui.editingCatId=null;saveState();showToast('Categoria eliminata');render();
      },'Elimina');
    };});
    /* --- gestione tag: modifica / elimina --- */
    document.querySelectorAll('[data-tag-edit]').forEach(function(b){b.onclick=function(){ui.editingTagId=b.dataset.tagEdit;ui.editingCatId=null;render();};});
    document.querySelectorAll('[data-tag-canceledit]').forEach(function(b){b.onclick=function(){ui.editingTagId=null;render();};});
    document.querySelectorAll('[data-tag-save]').forEach(function(b){b.onclick=function(){
      var t=tagById(b.dataset.tagSave);
      var nm=(document.getElementById('editTagName').value||'').trim();
      if(!nm){showToast('Il nome non può essere vuoto');return;}
      t.name=nm;ui.editingTagId=null;saveState();showToast('Tag aggiornato');render();
    };});
    document.querySelectorAll('[data-tag-del]').forEach(function(b){b.onclick=function(){
      var id=b.dataset.tagDel,t=tagById(id),n=tagUsageCount(id);
      var warn=n===0?'Nessun movimento usa questo tag.':('Verrà tolto da '+n+' movimenti (i movimenti restano).');
      confirmDialog('Eliminare il tag "'+t.name+'"? '+warn,function(){
        state.transactions.forEach(function(x){if(x.tags)x.tags=x.tags.filter(function(g){return g!==id;});});
        state.transfers.forEach(function(x){if(x.tags)x.tags=x.tags.filter(function(g){return g!==id;});});
        state.tags=state.tags.filter(function(x){return x.id!==id;});
        if(ui.tagFilter===id)ui.tagFilter=null;
        ui.editingTagId=null;saveState();showToast('Tag eliminato');render();
      },'Elimina');
    };});
  }
  openModal('<div class="sheet"></div>');
  render();
}

function lastNMonthKeys(n){var out=[],k=currentMonthKey();for(var i=n-1;i>=0;i--)out.push(shiftMonth(k,-i));return out;}
function monthShortLabel(key){return MONTH_ABBREVS[parseInt(key.slice(5,7),10)-1];}
function sixMonthChartSVG(keys,incs,exps){
  var W=360,H=170,TOP=12,BTM=24,chartH=H-TOP-BTM;
  var maxVal=Math.max.apply(null,[1].concat(incs).concat(exps));
  var gW=W/keys.length,bW=14,gap=3,out='';
  var baseY=TOP+chartH;
  for(var i=0;i<keys.length;i++){
    var x=i*gW,gx=x+(gW-bW*2-gap)/2;
    var ih=incs[i]/maxVal*chartH,eh=exps[i]/maxVal*chartH;
    if(ih>0.5)out+='<rect x="'+gx.toFixed(1)+'" y="'+(baseY-ih).toFixed(1)+'" width="'+bW+'" height="'+ih.toFixed(1)+'" rx="3" fill="var(--accent)"/>';
    if(eh>0.5)out+='<rect x="'+(gx+bW+gap).toFixed(1)+'" y="'+(baseY-eh).toFixed(1)+'" width="'+bW+'" height="'+eh.toFixed(1)+'" rx="3" fill="var(--red)"/>';
    out+='<text x="'+(x+gW/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="var(--ink-faint)">'+monthShortLabel(keys[i])+'</text>';
    out+='<rect x="'+x.toFixed(1)+'" y="0" width="'+gW.toFixed(1)+'" height="'+H+'" fill="transparent" data-chart-idx="'+i+'"/>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%"><line x1="0" y1="'+baseY+'" x2="'+W+'" y2="'+baseY+'" stroke="var(--border)" stroke-width="1"/>'+out+'</svg>';
}
function dashboardData(){
  var mk=currentMonthKey();
  var keys=lastNMonthKeys(6);
  return{
    mk:mk,
    totalBal:state.accounts.reduce(function(sm,a){return sm+accBalance(a.id);},0),
    totals:periodTotals(mk,'all'),
    prevExp:periodTotals(shiftMonth(mk,-1),'all').expense,
    keys:keys,
    incs:keys.map(function(k){return periodTotals(k,'all').income;}),
    exps:keys.map(function(k){return periodTotals(k,'all').expense;})
  };
}

/* iPhone con l'app installata dalla schermata Home: dentro questa modalita'
   Safari blocca sia i pop-up sia il rientro dal redirect di Google, quindi
   l'accesso Google li' spesso non va. La via che funziona sempre e' collegare
   una password allo stesso account Google e usare email+password sul telefono. */
function isIOSStandalone(){
  try{
    var ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
    var standalone=window.navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
    return ios&&standalone;
  }catch(e){return false;}
}
function isIOS(){
  try{
    if(/iPad|iPhone|iPod/.test(navigator.userAgent))return true;
    // iPad con iPadOS si presenta come Mac ma ha il touch
    return navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1;
  }catch(e){return false;}
}
function openLinkPasswordModal(){
  var m={busy:false,err:'',ok:false};
  function html(){
    if(m.ok){
      return '<div class="sheet"><div class="sheet-handle"></div><h3 style="margin:4px 0 0;">Password aggiunta ✅</h3>'+
        '<p class="hint">Ora sull\'iPhone puoi accedere con <strong>'+esc(sync.email||'')+'</strong> e questa password: entri nello <strong>stesso account</strong> e vedi gli stessi dati dell\'accesso Google.</p>'+
        '<button class="btn-primary full-width" id="lpClose">Ho capito</button></div>';
    }
    return '<div class="sheet"><div class="sheet-handle"></div><h3 style="margin:4px 0 0;">Aggiungi una password</h3>'+
      '<p class="hint">Serve per accedere <strong>allo stesso account</strong> dall\'iPhone, dove l\'accesso con Google non funziona dentro l\'app installata. L\'account resta uno solo: '+esc(sync.email||'')+'.</p>'+
      '<div class="field-group"><label class="field-label">Nuova password (almeno 6 caratteri)</label><input type="password" class="text-input" id="lpPwd" autocomplete="new-password"></div>'+
      (m.err?'<p class="hint" style="color:var(--red);">⚠️ '+esc(m.err)+'</p>':'')+
      '<button class="btn-primary full-width" id="lpGo" '+(m.busy?'disabled':'')+'>'+(m.busy?'Collegamento…':'Collega la password')+'</button>'+
      '<button class="btn-secondary full-width" id="lpCancel">Annulla</button></div>';
  }
  function render(){
    var w=document.querySelector('#modal-root .sheet-wrap');
    if(!w)return;
    w.innerHTML=html();
    var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;
    var c=document.getElementById('lpCancel');if(c)c.onclick=closeModal;
    var cl=document.getElementById('lpClose');if(cl)cl.onclick=closeModal;
    var go=document.getElementById('lpGo');
    if(go)go.onclick=async function(){
      var pwd=document.getElementById('lpPwd').value;
      if(!pwd||pwd.length<6){m.err='La password deve avere almeno 6 caratteri.';render();return;}
      m.busy=true;m.err='';render();
      try{
        var cred=firebase.auth.EmailAuthProvider.credential(sync.email,pwd);
        await sync.auth.currentUser.linkWithCredential(cred);
        sync.providers.push('password');
        m.ok=true;
      }catch(e){
        if(e&&e.code==='auth/provider-already-linked')m.ok=true;
        else if(e&&e.code==='auth/requires-recent-login')m.err='Per sicurezza Firebase chiede un accesso recente: esci e rientra con Google, poi riprova subito.';
        else if(e&&e.code==='auth/email-already-in-use')m.err='Esiste già un account con questa email e password: usalo direttamente sull\'iPhone.';
        else m.err=(e&&e.message)?e.message:'Non è riuscito.';
      }
      m.busy=false;render();
      if(m.ok)renderActiveTab();
    };
  }
  openModal('<div class="sheet"></div>');render();
}

function notifCardHTML(){
  /* La registrazione automatica delle spese ha senso solo su iPhone
     (tramite l'automazione Comandi Rapidi che apre registra.html).
     La mostriamo solo lì, e solo se l'utente attiva la spunta apposta. */

function wireAccounts(){
  document.querySelectorAll('[data-account-id]').forEach(function(inp){inp.onchange=function(){var a=accById(inp.dataset.accountId);a.name=inp.value.trim()||a.name;inp.value=a.name;saveState();};});
  document.querySelectorAll('[data-del-account]').forEach(function(btn){
    btn.onclick=function(){
      var id=btn.dataset.delAccount,a=accById(id),n=state.transactions.filter(function(t){return t.accountId===id;}).length+state.transfers.filter(function(t){return t.fromAccountId===id||t.toAccountId===id;}).length;
      var warn=n===0?'':(n===1?'Verrà eliminato anche il movimento collegato a questo conto.':'Verranno eliminati anche i '+n+' movimenti collegati a questo conto.');
      confirmDialog('Eliminare "'+a.name+'"? '+warn,function(){
        state.transactions=state.transactions.filter(function(t){return t.accountId!==id;});
        state.transfers=state.transfers.filter(function(t){return t.fromAccountId!==id&&t.toAccountId!==id;});
        state.accounts=state.accounts.filter(function(a){return a.id!==id;});
        if(state.paypalAccountId===id)state.paypalAccountId=null;
        if(ui.accountFilter===id)ui.accountFilter='all';
        saveState();showToast('Conto eliminato');renderActiveTab();
      },'Elimina');
    };
  });
  var addB=document.getElementById('addAccBtn');if(addB)addB.onclick=function(){ui.addingAccount=true;renderActiveTab();};
  var confB=document.getElementById('confirmNewAcc');if(confB)confB.onclick=function(){var n=document.getElementById('newAccName').value.trim();if(!n){showToast('Dai un nome al conto');return;}state.accounts.push({id:uid('acc'),name:n,color:state.accounts.length%8});ui.addingAccount=false;saveState();showToast('Conto creato');renderActiveTab();};
  var syncBtn=document.getElementById('openSyncBtn');if(syncBtn)syncBtn.onclick=openSyncModal;
  var syncNowBtn=document.getElementById('syncNowBtn');if(syncNowBtn)syncNowBtn.onclick=syncNow;
  var lpBtn=document.getElementById('linkPwdBtn');if(lpBtn)lpBtn.onclick=openLinkPasswordModal;
  var gBtn=document.getElementById('googleSyncBtn');
  if(gBtn)gBtn.onclick=async function(){
    var cfg=loadSyncConfig();
    if(!cfg||!cfg.firebaseConfig){openSyncModal();return;}
    gBtn.disabled=true;gBtn.textContent='Accesso in corso…';
    var res=await connectSyncWithGoogle(cfg.firebaseConfig);
    if(res.ok&&!res.redirect)showToast('Sincronizzazione connessa');
    else if(!res.ok)showToast(res.error||'Accesso non riuscito');
    renderActiveTab();
  };
  document.querySelectorAll('[data-copy-target]').forEach(function(btn){
    btn.onclick=function(){
      var field=document.getElementById(btn.dataset.copyTarget);
      if(!field)return;
      field.select();field.setSelectionRange(0,99999);
      var done=false;
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(field.value).then(function(){showToast('Copiato');}).catch(function(){try{document.execCommand('copy');showToast('Copiato');}catch(e){showToast('Copia manualmente il testo selezionato');}});
        done=true;
      }
      if(!done){try{document.execCommand('copy');showToast('Copiato');}catch(e){showToast('Copia manualmente il testo selezionato');}}
    };
  });
  var autoTog=document.getElementById('autoRegisterToggle');
  if(autoTog)autoTog.onchange=function(){state.autoRegister=autoTog.checked;saveState();renderActiveTab();};
  var notifTog=document.getElementById('notifAutomToggle');
  if(notifTog)notifTog.onchange=function(){state.notifAutomation=notifTog.checked;saveState();renderActiveTab();};
  var hideTog=document.getElementById('hideBalToggle');
  if(hideTog)hideTog.onchange=function(){state.hideBalances=hideTog.checked;saveState();renderActiveTab();};
  var discBtn=document.getElementById('disconnectSyncBtn');if(discBtn)discBtn.onclick=function(){
    var warn=sync.pendingPush&&!isOnline()?' ⚠️ Ci sono modifiche non ancora sincronizzate: collegati a internet e premi «Sincronizza» prima di uscire, altrimenti le perdi.':'';
    confirmDialog('Uscire dall\'account '+(sync.email||'')+'? I dati restano al sicuro nel cloud, ma vengono rimossi da questo dispositivo: non saranno più visibili finché non rientri. Potrai poi accedere con un altro account.'+warn,function(){
      signOutFromCloud().then(function(){showToast('Uscito dall\'account');});
    },'Esci');
  };
  document.getElementById('openImportBtn').onclick=openImportModal;
  var expBtn=document.getElementById('openExportBtn');if(expBtn)expBtn.onclick=openExportModal;
  document.getElementById('resetBtn').onclick=function(){
    confirmDialog('Eliminare definitivamente tutti i dati? Questa azione non si può annullare.',function(){
      state=ensureV3Fields(defaultState());ui={activeTab:'accounts',viewMonth:currentMonthKey(),viewYear:new Date().getFullYear(),homeView:'monthly',accountFilter:'all',categoryFilter:'all',typeFilter:'all',tagFilter:null,breakdownType:'expense',addingAccount:false,newCatType:'expense'};
      saveState();showToast('Dati reimpostati');renderActiveTab();
    },'Elimina tutto');
  };
}

/* ================================================================
   ENTRY SHEET
================================================================ */
var lastUsedAccId=null,lastUsedMode='expense';

function openEntrySheet(opts){
  opts=opts||{};
  var editTx=opts.txId?state.transactions.find(function(t){return t.id===opts.txId;}):null;
  var editTr=opts.transferId?state.transfers.find(function(t){return t.id===opts.transferId;}):null;
  if(!editTx&&!editTr&&opts.mode==='transfer'&&state.accounts.length<2){showToast('Servono almeno 2 conti per un trasferimento');return;}
  var entry={
    mode:editTx?editTx.type:(editTr?'transfer':(opts.mode||lastUsedMode)),
    amountStr:editTx?editTx.amount.toFixed(2).replace('.',','):(editTr?editTr.amount.toFixed(2).replace('.',','):''),
    accountId:editTx?editTx.accountId:(lastUsedAccId&&state.accounts.some(function(a){return a.id===lastUsedAccId;})?lastUsedAccId:state.accounts[0].id),
    categoryId:editTx?editTx.categoryId:null,
    fromAccountId:editTr?editTr.fromAccountId:state.accounts[0].id,
    toAccountId:editTr?editTr.toAccountId:(state.accounts[1]?state.accounts[1].id:state.accounts[0].id),
    merchant:editTx?(editTx.merchant||''):'',
    note:editTx?(editTx.note||''):(editTr?(editTr.note||''):''),
    date:editTx?editTx.date:(editTr?editTr.date:todayISO()),
    tags:editTx?(editTx.tags||[]).slice():(editTr?(editTr.tags||[]).slice():[]),
    showTagForm:false,newTagName:'',newTagColor:0,
    showCatForm:false,newCatName:'',newCatEmoji:'',newCatColor:0,
    isEditTx:!!editTx,isEditTr:!!editTr
  };
  if(!entry.categoryId){var fc=catsByType(entry.mode==='income'?'income':'expense')[0];entry.categoryId=fc?fc.id:null;}
  if(entry.fromAccountId===entry.toAccountId&&state.accounts.length>1){var alt=state.accounts.find(function(a){return a.id!==entry.fromAccountId;});if(alt)entry.toAccountId=alt.id;}

  function accChips(selId,attr){return state.accounts.map(function(a){return'<button class="chip'+(a.id===selId?' selected':'')+'" data-'+attr+'="'+a.id+'"><span class="dot" style="background:'+colorHex(a.color)+'"></span>'+esc(a.name)+'</button>';}).join('');}
  function catChips(){return catsByType(entry.mode==='income'?'income':'expense').map(function(c){return'<button class="chip'+(c.id===entry.categoryId?' selected':'')+'" data-sel-cat="'+c.id+'"><span class="dot" style="background:'+colorHex(c.color)+'"></span>'+esc(c.emoji)+' '+esc(c.name)+'</button>';}).join('');}
  function catSectionHTML(){
    var chips=catChips()+'<button class="chip" id="newCatChip">+ Nuova</button>';
    var form='';
    if(entry.showCatForm){
      form='<div class="new-tag-card" style="margin-top:8px;"><div style="display:flex;gap:8px;"><input id="entryNewCatEmoji" class="emoji-input" maxlength="2" placeholder="🙂" value="'+esc(entry.newCatEmoji)+'"><input id="entryNewCatName" class="text-input" placeholder="Nome categoria" value="'+esc(entry.newCatName)+'"></div><div class="color-dots-row">'+(isDarkTheme()?COLORS_DARK:COLORS_LIGHT).map(function(c,i){return'<button class="color-dot'+(entry.newCatColor===i?' active':'')+'" data-ecat-color="'+i+'" aria-label="Colore '+(i+1)+'" style="background:'+c+';"></button>';}).join('')+'</div><div style="display:flex;gap:8px;"><button class="btn-primary-sm" id="createCatBtn">Aggiungi categoria</button><button class="btn-secondary" style="padding:10px 14px;font-size:13px;" id="cancelCatBtn">Annulla</button></div></div>';
    }
    return '<div id="catSection" class="field-group"><label class="field-label">Categoria</label><div class="chip-row wrap" id="catChips">'+chips+'</div>'+form+'</div>';
  }
  function ticketClass(){return'ticket'+(entry.mode==='income'?' ticket-income':entry.mode==='transfer'?' ticket-transfer':'');}
  function ticketLabel(){if(entry.mode==='transfer')return entry.isEditTr?'Modifica trasferimento':'Nuovo trasferimento';if(entry.mode==='income')return entry.isEditTx?'Modifica entrata':'Nuova entrata';return entry.isEditTx?'Modifica spesa':'Nuova spesa';}
  function amountPrefix(){return entry.mode==='income'?'+ € ':'€ ';}
  function saveLabel(){if(entry.mode==='transfer')return'Salva trasferimento';if(entry.mode==='income')return'Salva entrata';return'Salva spesa';}

  function tagSectionHTML(){
    var h='<div id="tagSection" class="field-group"><label class="field-label">Tag</label><div class="tag-picker-row">';
    state.tags.forEach(function(t){var sel=entry.tags.indexOf(t.id)>-1;h+='<button class="chip sm'+(sel?' selected':'')+'" data-tag-tog="'+t.id+'"><span class="dot" style="background:'+colorHex(t.color)+'"></span>'+esc(t.name)+'</button>';});
    h+='<button class="chip sm" id="newTagBtn">+ Nuovo</button></div>';
    if(entry.showTagForm){
      h+='<div class="new-tag-card"><input id="newTagNameInp" class="text-input" placeholder="Nome tag" value="'+esc(entry.newTagName)+'"><div class="color-dots-row">'+(isDarkTheme()?COLORS_DARK:COLORS_LIGHT).map(function(c,i){return'<button class="color-dot'+(entry.newTagColor===i?' active':'')+'" data-tag-color="'+i+'" aria-label="Colore '+(i+1)+'" style="background:'+c+';"></button>';}).join('')+'</div><div style="display:flex;gap:8px;"><button class="btn-primary-sm" id="createTagBtn">Aggiungi tag</button><button class="btn-secondary" style="padding:10px 14px;font-size:13px;" id="cancelTagBtn">Annulla</button></div></div>';
    }
    h+='</div>';
    return h;
  }

  function dateRowHTML(){
    return '<div class="field-group"><label class="field-label">Data</label><div class="date-quick-row"><button class="chip sm'+(isToday(entry.date)?' selected':'')+'" data-qdate="today">📅 Oggi</button><button class="chip sm'+(isYesterday(entry.date)?' selected':'')+'" data-qdate="yesterday">📅 Ieri</button><input type="date" id="entryDate" class="text-input" value="'+entry.date+'"></div></div>';
  }

  function bodyHTML(){
    var delBtn='';
    if(entry.isEditTx)delBtn='<button class="btn-danger full-width" id="delEntryBtn">Elimina movimento</button>';
    if(entry.isEditTr)delBtn='<button class="btn-danger full-width" id="delEntryBtn">Elimina trasferimento</button>';
    if(entry.mode==='transfer'){
      return '<div class="field-group"><label class="field-label">Da</label><div class="chip-row" id="fromChips">'+accChips(entry.fromAccountId,'sel-from')+'</div></div>'+
        '<div class="swap-hint">⇅ sposta il saldo tra conti senza influire sul bilancio</div>'+
        '<div class="field-group"><label class="field-label">A</label><div class="chip-row" id="toChips">'+accChips(entry.toAccountId,'sel-to')+'</div></div>'+
        dateRowHTML()+tagSectionHTML()+
        '<div class="field-group"><label class="field-label">Nota (opzionale)</label><input type="text" id="entryNote" class="text-input" value="'+esc(entry.note)+'" placeholder="Es. nota del movimento"></div>'+
        delBtn+'<button class="btn-primary full-width sticky-save" id="saveEntryBtn" disabled>'+saveLabel()+'</button>';
    }
    return '<div class="field-group"><label class="field-label">Conto</label><div class="chip-row" id="accountChips">'+accChips(entry.accountId,'sel-account')+'</div></div>'+
      catSectionHTML()+
      dateRowHTML()+tagSectionHTML()+
      '<div class="field-group"><label class="field-label">Esercente (opzionale)</label><input type="text" id="entryMerchant" class="text-input" value="'+esc(entry.merchant)+'" placeholder="Es. negozio o persona"></div>'+
      '<div class="field-group"><label class="field-label">Nota (opzionale)</label><input type="text" id="entryNote" class="text-input" value="'+esc(entry.note)+'" placeholder="Es. dettaglio del movimento"></div>'+
      delBtn+'<button class="btn-primary full-width sticky-save" id="saveEntryBtn" disabled>'+saveLabel()+'</button>';
  }

  function modeToggleHTML(){
    if(entry.isEditTr)return '';
    if(entry.isEditTx)return '<div class="segmented"><button class="'+(entry.mode==='expense'?'active':'')+'" data-mode="expense">Spesa</button><button class="'+(entry.mode==='income'?'active mode-income':'')+'" data-mode="income">Entrata</button></div>';
    return '<div class="segmented"><button class="'+(entry.mode==='expense'?'active':'')+'" data-mode="expense">Spesa</button><button class="'+(entry.mode==='income'?'active mode-income':'')+'" data-mode="income">Entrata</button><button class="'+(entry.mode==='transfer'?'active mode-transfer':'')+'" data-mode="transfer" '+(state.accounts.length<2?'disabled':'')+'>Trasferimento</button></div>';
  }

  function fullHTML(){
    return '<div class="sheet entry-sheet">'+
      '<div class="sheet-handle"></div>'+modeToggleHTML()+
      '<div class="'+ticketClass()+'"><button class="icon-btn ticket-close" id="closeEntryModal">✕</button><div class="ticket-label">'+esc(ticketLabel())+'</div><div class="ticket-amount" id="amtDisplay">'+amountPrefix()+(entry.amountStr||'0,00')+'</div></div>'+
      '<div class="keypad">'+['1','2','3','4','5','6','7','8','9',',','0','⌫'].map(function(k){return'<button type="button" class="key" data-key="'+k+'">'+k+'</button>';}).join('')+'</div>'+
      '<div id="entryBody" style="display:flex;flex-direction:column;gap:16px;">'+bodyHTML()+'</div>'+
    '</div>';
  }

  function refreshSaveBtn(){
    var n=parseAmount(entry.amountStr.replace(',','.'));
    var ok=n>0;
    if(entry.mode==='transfer'&&entry.fromAccountId===entry.toAccountId)ok=false;
    var btn=document.getElementById('saveEntryBtn');if(btn)btn.disabled=!ok;
    var disp=document.getElementById('amtDisplay');if(disp)disp.textContent=amountPrefix()+(entry.amountStr||'0,00');
  }

  function wireTagSection(){
    document.querySelectorAll('[data-tag-tog]').forEach(function(b){b.onclick=function(){var id=b.dataset.tagTog;var idx=entry.tags.indexOf(id);if(idx>-1)entry.tags.splice(idx,1);else entry.tags.push(id);var el=document.getElementById('tagSection');if(el)el.outerHTML=tagSectionHTML();wireTagSection();};});
    var ntb=document.getElementById('newTagBtn');if(ntb)ntb.onclick=function(){entry.showTagForm=true;var el=document.getElementById('tagSection');if(el)el.outerHTML=tagSectionHTML();wireTagSection();setTimeout(function(){var ni=document.getElementById('newTagNameInp');if(ni)ni.focus();},50);};
    var ni=document.getElementById('newTagNameInp');if(ni)ni.oninput=function(){entry.newTagName=ni.value;};
    document.querySelectorAll('[data-tag-color]').forEach(function(dot){dot.onclick=function(){entry.newTagColor=parseInt(dot.dataset.tagColor,10);document.querySelectorAll('.color-dot').forEach(function(d){d.classList.toggle('active',d===dot);});};});
    var ctb=document.getElementById('createTagBtn');
    if(ctb)ctb.onclick=function(){var n=(document.getElementById('newTagNameInp').value||'').trim();if(!n){showToast('Dai un nome al tag');return;}var t={id:uid('tag'),name:n,color:entry.newTagColor};state.tags.push(t);entry.tags.push(t.id);entry.showTagForm=false;entry.newTagName='';entry.newTagColor=0;saveState();var el=document.getElementById('tagSection');if(el)el.outerHTML=tagSectionHTML();wireTagSection();};
    var canb=document.getElementById('cancelTagBtn');if(canb)canb.onclick=function(){entry.showTagForm=false;entry.newTagName='';var el=document.getElementById('tagSection');if(el)el.outerHTML=tagSectionHTML();wireTagSection();};
  }

  function wireCatSection(){
    document.querySelectorAll('[data-sel-cat]').forEach(function(b){b.onclick=function(){entry.categoryId=b.dataset.selCat;document.querySelectorAll('[data-sel-cat]').forEach(function(q){q.classList.toggle('selected',q===b);});};});
    var nc=document.getElementById('newCatChip');if(nc)nc.onclick=function(){entry.showCatForm=true;var el=document.getElementById('catSection');if(el)el.outerHTML=catSectionHTML();wireCatSection();setTimeout(function(){var e=document.getElementById('entryNewCatName');if(e)e.focus();},40);};
    var ne=document.getElementById('entryNewCatEmoji');if(ne)ne.oninput=function(){entry.newCatEmoji=ne.value;};
    var nn=document.getElementById('entryNewCatName');if(nn)nn.oninput=function(){entry.newCatName=nn.value;};
    document.querySelectorAll('[data-ecat-color]').forEach(function(d){d.onclick=function(){entry.newCatColor=parseInt(d.dataset.ecatColor,10);document.querySelectorAll('[data-ecat-color]').forEach(function(q){q.classList.toggle('active',q===d);});};});
    var cc=document.getElementById('createCatBtn');if(cc)cc.onclick=function(){var n=(entry.newCatName||'').trim();if(!n){showToast('Dai un nome alla categoria');return;}var cat={id:uid('cat'),name:n,emoji:(entry.newCatEmoji||'').trim()||(entry.mode==='income'?'💰':'🏷️'),color:entry.newCatColor,type:entry.mode==='income'?'income':'expense',custom:true};state.categories.push(cat);entry.categoryId=cat.id;entry.showCatForm=false;entry.newCatName='';entry.newCatEmoji='';entry.newCatColor=0;saveState();showToast('Categoria aggiunta');var el=document.getElementById('catSection');if(el)el.outerHTML=catSectionHTML();wireCatSection();};
    var xc=document.getElementById('cancelCatBtn');if(xc)xc.onclick=function(){entry.showCatForm=false;entry.newCatName='';entry.newCatEmoji='';var el=document.getElementById('catSection');if(el)el.outerHTML=catSectionHTML();wireCatSection();};
  }

  function wireBody(){
    var merchInp=document.getElementById('entryMerchant');if(merchInp)merchInp.oninput=function(){entry.merchant=merchInp.value;};
    var noteInp=document.getElementById('entryNote');if(noteInp)noteInp.oninput=function(){entry.note=noteInp.value;};
    var dateInp=document.getElementById('entryDate');
    if(dateInp){
      dateInp.onchange=function(){entry.date=dateInp.value||todayISO();document.querySelectorAll('[data-qdate]').forEach(function(b){b.classList.toggle('selected',(b.dataset.qdate==='today'&&isToday(entry.date))||(b.dataset.qdate==='yesterday'&&isYesterday(entry.date)));});};
    }
    document.querySelectorAll('[data-qdate]').forEach(function(b){b.onclick=function(){entry.date=b.dataset.qdate==='today'?todayISO():yesterdayISO();if(dateInp)dateInp.value=entry.date;document.querySelectorAll('[data-qdate]').forEach(function(q){q.classList.toggle('selected',(q.dataset.qdate==='today'&&isToday(entry.date))||(q.dataset.qdate==='yesterday'&&isYesterday(entry.date)));});};});
    if(entry.mode==='transfer'){
      document.querySelectorAll('[data-sel-from]').forEach(function(b){b.onclick=function(){entry.fromAccountId=b.dataset.selFrom;if(entry.fromAccountId===entry.toAccountId){var alt=state.accounts.find(function(a){return a.id!==entry.fromAccountId;});if(alt)entry.toAccountId=alt.id;}var bd=document.getElementById('entryBody');if(bd){bd.innerHTML=bodyHTML();wireBody();}refreshSaveBtn();};});
      document.querySelectorAll('[data-sel-to]').forEach(function(b){b.onclick=function(){entry.toAccountId=b.dataset.selTo;document.querySelectorAll('[data-sel-to]').forEach(function(q){q.classList.toggle('selected',q===b);});refreshSaveBtn();};});
    }else{
      document.querySelectorAll('[data-sel-account]').forEach(function(b){b.onclick=function(){entry.accountId=b.dataset.selAccount;document.querySelectorAll('[data-sel-account]').forEach(function(q){q.classList.toggle('selected',q===b);});};});
      wireCatSection();
    }
    wireTagSection();
    var delBtn=document.getElementById('delEntryBtn');
    if(delBtn)delBtn.onclick=function(){
      if(entry.isEditTx)confirmDialog('Eliminare questo movimento?',function(){state.transactions=state.transactions.filter(function(t){return t.id!==editTx.id;});saveState();closeModal();showToast('Eliminato');renderActiveTab();},'Elimina');
      else if(entry.isEditTr)confirmDialog('Eliminare questo trasferimento?',function(){state.transfers=state.transfers.filter(function(t){return t.id!==editTr.id;});saveState();closeModal();showToast('Eliminato');renderActiveTab();},'Elimina');
    };
    var saveBtn=document.getElementById('saveEntryBtn');
    if(saveBtn)saveBtn.onclick=function(){
      var amount=parseAmount(entry.amountStr.replace(',','.'));if(!(amount>0))return;
      var date=entry.date||todayISO();
      if(entry.mode==='transfer'){
        if(entry.fromAccountId===entry.toAccountId){showToast('Scegli due conti diversi');return;}
        if(entry.isEditTr){editTr.amount=amount;editTr.fromAccountId=entry.fromAccountId;editTr.toAccountId=entry.toAccountId;editTr.note=entry.note;editTr.date=date;editTr.tags=entry.tags.slice();}
        else state.transfers.push({id:uid('trf'),amount:amount,fromAccountId:entry.fromAccountId,toAccountId:entry.toAccountId,note:entry.note,date:date,tags:entry.tags.slice(),createdAt:Date.now()});
        lastUsedMode='transfer';
      }else{
        lastUsedAccId=entry.accountId;lastUsedMode=entry.mode;

      }

    };
  }

  function wireAll(){
    document.getElementById('closeEntryModal').onclick=closeModal;
    document.getElementById('modalBackdrop').onclick=closeModal;
    document.querySelectorAll('.key').forEach(function(btn){btn.onclick=function(){
      var k=btn.dataset.key;
      if(k==='⌫')entry.amountStr=entry.amountStr.slice(0,-1);
      else if(k===','){if(entry.amountStr.indexOf(',')===-1)entry.amountStr+=',';}
      else{
        if(entry.amountStr.indexOf(',')>-1&&entry.amountStr.split(',')[1].length>=2)return;
        if(entry.amountStr.replace(',','').length>=7)return;
        if(entry.amountStr==='0')entry.amountStr=k;else entry.amountStr+=k;
      }
      refreshSaveBtn();
    };});
    document.querySelectorAll('[data-mode]').forEach(function(b){if(b.disabled)return;b.onclick=function(){
      if(b.dataset.mode===entry.mode)return;

      entry.showCatForm=false;
      if(entry.mode!=='transfer'){var fc=catsByType(entry.mode==='income'?'income':'expense');if(!fc.some(function(c){return c.id===entry.categoryId;}))entry.categoryId=fc[0]?fc[0].id:null;}
      render();
    };});
    wireBody();refreshSaveBtn();
  }

  function render(){openModal(fullHTML());wireAll();}
  render();
}

      (m.errorMsg?'<p class="hint" style="color:var(--red);">⚠️ '+esc(m.errorMsg)+'</p>':'')+
      '<button class="btn-primary full-width" id="syncSubmit" '+(m.busy?'disabled':'')+'>'+(m.busy?'Connessione…':(m.mode==='signup'?'Crea account e connetti':'Accedi'))+'</button>'+

    var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;

      document.getElementById('syncCancel1').onclick=closeModal;
      document.getElementById('syncNext1').onclick=function(){
        var raw=document.getElementById('syncConfigInput').value;
        var parsed=parseFirebaseConfigInput(raw);

        m.parsedConfig=parsed;m.configText=raw;m.errorMsg=null;m.step=2;renderStep();
      };
    }else{
      document.querySelectorAll('[data-sync-mode]').forEach(function(b){b.onclick=function(){m.mode=b.dataset.syncMode;m.errorMsg=null;renderStep();};});
      document.getElementById('syncBack2').onclick=function(){m.step=1;renderStep();};
      document.getElementById('syncGoogle').onclick=async function(){
        m.busy=true;m.errorMsg=null;renderStep();
        var res=await connectSyncWithGoogle(m.parsedConfig);
        m.busy=false;
        if(res.ok&&!res.redirect){closeModal();showToast('Sincronizzazione connessa');renderActiveTab();}

        else{m.errorMsg=res.error;renderStep();}

        if(res.ok){closeModal();showToast('Sincronizzazione connessa');renderActiveTab();}
        else{m.errorMsg=res.error;renderStep();}
      };
    }
  }

  openModal('<div class="sheet"></div>');
  renderStep();

/* ================================================================
   FILE IN ENTRATA E IN USCITA (CSV · XLSX · PDF)
   Tutto scritto a mano, senza librerie esterne: l'app resta un file
   solo e continua a funzionare anche offline.
   - .xlsx = archivio ZIP con dentro XML: qui c'è un lettore ZIP
     (usa DecompressionStream del browser) e uno scrittore ZIP senza
     compressione (valido per Excel, Numbers e Fogli Google).
   - .pdf  = il testo viene estratto dagli "stream" del documento.
     Funziona con i PDF digitali (estratti conto scaricati dalla banca),
     NON con le scansioni/foto, che non contengono testo.
================================================================ */
var CRC_TABLE=(function(){
  var t=new Uint32Array(256);
  for(var n=0;n<256;n++){
    var c=n;
    for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
    t[n]=c>>>0;
  }
  return t;
})();
function crc32(u8){
  var c=0xFFFFFFFF;
  for(var i=0;i<u8.length;i++)c=CRC_TABLE[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function strBytes(s){return new TextEncoder().encode(s);}
function latinBytes(s){var u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&0xFF;return u;}

/* ---- ZIP: scrittura (metodo "stored", nessuna compressione) ---- */
function zipStore(files,mime){
  var chunks=[],central=[],offset=0;
  files.forEach(function(f){
    var name=strBytes(f.name),data=f.data,crc=crc32(data);
    var lh=new Uint8Array(30+name.length),dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0,true);
    dv.setUint16(8,0,true);dv.setUint16(10,0,true);dv.setUint16(12,0,true);
    dv.setUint32(14,crc,true);dv.setUint32(18,data.length,true);dv.setUint32(22,data.length,true);
    dv.setUint16(26,name.length,true);dv.setUint16(28,0,true);
    lh.set(name,30);
    chunks.push(lh,data);
    var ch=new Uint8Array(46+name.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(8,0,true);cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,0,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);
    cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,offset,true);
    ch.set(name,46);
    central.push(ch);
    offset+=lh.length+data.length;
  });
  var cdSize=central.reduce(function(s,c){return s+c.length;},0);
  var eocd=new Uint8Array(22),ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);
  ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,offset,true);ev.setUint16(20,0,true);
  return new Blob(chunks.concat(central).concat([eocd]),{type:mime||'application/zip'});
}

/* ---- ZIP: lettura ---- */
async function inflateBytes(bytes,format){
  if(typeof DecompressionStream==='undefined')throw new Error('Questo browser non sa aprire i file .xlsx: prova a esportare in CSV dalla banca.');
  var ds=new DecompressionStream(format);
  var stream=new Blob([bytes]).stream().pipeThrough(ds);
  var ab=await new Response(stream).arrayBuffer();
  return new Uint8Array(ab);
}
async function zipRead(arrayBuffer){
  var u8=new Uint8Array(arrayBuffer),dv=new DataView(arrayBuffer);
  var eo=-1,min=Math.max(0,u8.length-65558);
  for(var i=u8.length-22;i>=min;i--){if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}}
  if(eo<0)throw new Error('Il file non sembra un .xlsx valido.');
  var count=dv.getUint16(eo+10,true),cdOff=dv.getUint32(eo+16,true);
  var out={},p=cdOff,dec=new TextDecoder();
  for(var k=0;k<count;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    var method=dv.getUint16(p+10,true);
    var csize=dv.getUint32(p+20,true);
    var nlen=dv.getUint16(p+28,true),elen=dv.getUint16(p+30,true),clen=dv.getUint16(p+32,true);
    var lo=dv.getUint32(p+42,true);
    var name=dec.decode(u8.subarray(p+46,p+46+nlen));
    var lnlen=dv.getUint16(lo+26,true),lelen=dv.getUint16(lo+28,true);
    var start=lo+30+lnlen+lelen;
    var raw=u8.subarray(start,start+csize);
    out[name]=method===0?raw:await inflateBytes(raw,'deflate-raw');
    p+=46+nlen+elen+clen;
  }
  return out;
}

/* ---- XLSX: lettura ---- */
function xmlUnesc(s){
  return String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")
    .replace(/&#x([0-9a-fA-F]+);/g,function(_,h){return String.fromCharCode(parseInt(h,16));})
    .replace(/&#(\d+);/g,function(_,d){return String.fromCharCode(parseInt(d,10));})
    .replace(/&amp;/g,'&');
}
function xlsxColIndex(ref){
  var m=/^([A-Z]+)/.exec(ref||'');
  if(!m)return 0;
  var n=0;
  for(var i=0;i<m[1].length;i++)n=n*26+(m[1].charCodeAt(i)-64);
  return n-1;
}
function excelSerialToISO(n){
  var d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000);
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
}
function xlsxSharedStrings(xml){
  var out=[];
  if(!xml)return out;
  var re=/<si\b[^>]*>([\s\S]*?)<\/si>/g,m;
  while((m=re.exec(xml))){
    var ts=m[1].match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[];
    out.push(ts.map(function(x){return xmlUnesc(x.replace(/<[^>]+>/g,''));}).join(''));
  }
  return out;
}
function xlsxDateStyles(xml){
  var out=[];
  if(!xml)return out;
  var codes={},m,re=/<numFmt[^>]*numFmtId="(\d+)"[^>]*formatCode="([^"]*)"/g;
  while((m=re.exec(xml)))codes[m[1]]=xmlUnesc(m[2]);
  var block=/<cellXfs[^>]*>([\s\S]*?)<\/cellXfs>/.exec(xml);
  if(!block)return out;
  var xre=/<xf\b[^>]*?numFmtId="(\d+)"[^>]*>/g,x;
  while((x=xre.exec(block[1]))){
    var id=parseInt(x[1],10),code=codes[x[1]]||'';
    var isDate=(id>=14&&id<=22)||(id>=45&&id<=47)||(code&&/[dmy]/i.test(code.replace(/\[[^\]]*\]/g,'').replace(/"[^"]*"/g,'')));
    out.push(!!isDate);
  }
  return out;
}
function xlsxSheetRows(xml,shared,dateStyles){
  var rows=[],rowRe=/<row\b[^>]*>([\s\S]*?)<\/row>/g,rm;
  while((rm=rowRe.exec(xml))){
    var cells=[],cre=/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g,cm;
    while((cm=cre.exec(rm[1]))){
      var attrs=cm[1]||'',inner=cm[2]||'';
      var refm=/r="([A-Z]+\d+)"/.exec(attrs);
      var t=(/t="([^"]+)"/.exec(attrs)||[])[1]||'n';
      var sm=/s="(\d+)"/.exec(attrs);
      var idx=refm?xlsxColIndex(refm[1]):cells.length;
      var val='';
      if(t==='inlineStr'){
        var ts=inner.match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[];
        val=ts.map(function(x){return xmlUnesc(x.replace(/<[^>]+>/g,''));}).join('');
      }else{
        var v=/<v[^>]*>([\s\S]*?)<\/v>/.exec(inner);
        var raw=v?xmlUnesc(v[1]):'';
        if(t==='s')val=shared[parseInt(raw,10)]||'';
        else if(t==='b')val=raw==='1'?'VERO':'FALSO';
        else if(t==='str'||t==='e')val=raw;
        else if(raw!==''&&sm&&dateStyles[parseInt(sm[1],10)]&&!isNaN(parseFloat(raw)))val=excelSerialToISO(parseFloat(raw));
        else val=raw;
      }
      while(cells.length<idx)cells.push('');
      cells[idx]=String(val).trim();
    }
    if(cells.some(function(c){return c!=='';}))rows.push(cells);
  }
  return rows;
}
/* Nomi dei fogli, nell'ordine in cui compaiono nella cartella di lavoro */
function xlsxSheetNames(wbXml){
  var out=[],re=/<sheet\b[^>]*name="([^"]*)"/g,m;
  while((m=re.exec(wbXml||'')))out.push(xmlUnesc(m[1]));
  return out;
}
/* Legge TUTTI i fogli: [{name, rows}] */
async function xlsxToSheets(arrayBuffer){
  var files=await zipRead(arrayBuffer),dec=new TextDecoder();
  var names=Object.keys(files).filter(function(n){return /^xl\/worksheets\/sheet\d+\.xml$/i.test(n);})
    .sort(function(a,b){
      var na=parseInt((/sheet(\d+)\.xml/i.exec(a)||[])[1]||'0',10);
      var nb=parseInt((/sheet(\d+)\.xml/i.exec(b)||[])[1]||'0',10);
      return na-nb;
    });
  if(!names.length)throw new Error('Nel file .xlsx non ho trovato nessun foglio di calcolo.');
  var shared=xlsxSharedStrings(files['xl/sharedStrings.xml']?dec.decode(files['xl/sharedStrings.xml']):'');
  var styles=xlsxDateStyles(files['xl/styles.xml']?dec.decode(files['xl/styles.xml']):'');
  var titles=xlsxSheetNames(files['xl/workbook.xml']?dec.decode(files['xl/workbook.xml']):'');
  var out=[];
  names.forEach(function(n,i){
    var rows=xlsxSheetRows(dec.decode(files[n]),shared,styles);
    if(rows.length)out.push({name:titles[i]||('Foglio '+(i+1)),rows:rows});
  });
  if(!out.length)throw new Error('Il foglio di calcolo risulta vuoto.');
  return out;
}
async function xlsxToRows(arrayBuffer){
  var sheets=await xlsxToSheets(arrayBuffer);
  var best=sheets[0];
  sheets.forEach(function(sh){if(sh.rows.length>best.rows.length)best=sh;});
  return best.rows;
}
/* Un foglio che si chiama "Spese"/"Uscite" contiene solo spese, e viceversa. */
function sheetForcedType(name){
  var n=String(name||'').toLowerCase();
  if(/spes|uscit|addebit|pagament|costi|debit/.test(n))return 'expense';
  if(/entrat|ricav|accredit|incass|guadagn|credit|income/.test(n))return 'income';
  return null;
}

/* ---- XLSX: scrittura ---- */
function xlsxColName(i){var s='';i++;while(i>0){var r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=Math.floor((i-1)/26);}return s;}
function xmlEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function xlsxBlob(sheetName,header,rows){
  var all=[header].concat(rows);
  var body=all.map(function(r,ri){
    var cells=r.map(function(c,ci){
      var ref=xlsxColName(ci)+(ri+1);
      if(typeof c==='number'&&isFinite(c))return '<c r="'+ref+'"><v>'+c+'</v></c>';
      return '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(c)+'</t></is></c>';
    }).join('');
    return '<row r="'+(ri+1)+'">'+cells+'</row>';
  }).join('');
  var X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  var sheet=X+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+body+'</sheetData></worksheet>';
  var wb=X+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+xmlEsc(sheetName||'Movimenti')+'" sheetId="1" r:id="rId1"/></sheets></workbook>';
  var wbRels=X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>';
  var rootRels=X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';

/* ---- PDF: scrittura ---- */
var WINANSI_MAP={8364:0x80,8218:0x82,402:0x83,8222:0x84,8230:0x85,8224:0x86,8225:0x87,710:0x88,8240:0x89,352:0x8A,8249:0x8B,338:0x8C,381:0x8E,8216:0x91,8217:0x92,8220:0x93,8221:0x94,8226:0x95,8211:0x96,8212:0x97,732:0x98,8482:0x99,353:0x9A,8250:0x9B,339:0x9C,382:0x9E,376:0x9F,8722:0x2D};
function pdfEsc(s){
  s=String(s==null?'':s);
  var out='';
  for(var i=0;i<s.length;i++){
    var ch=s[i],code=s.charCodeAt(i);
    if(code>255&&WINANSI_MAP[code]!==undefined){out+=String.fromCharCode(WINANSI_MAP[code]);continue;}
    if(ch==='('||ch===')'||ch==='\\')out+='\\'+ch;
    else if(code<32)out+=' ';
    else if(code>255)out+='?';
    else out+=ch;
  }
  return out;
}
function pdfFit(s,width,size){
  s=String(s==null?'':s);
  var max=Math.max(1,Math.floor(width/(size*0.5)));
  return s.length>max?s.slice(0,max-1)+'…':s;
}
function pdfBlob(title,subtitle,cols,rows,summary){
  var W=595.28,H=841.89,M=40,size=8,lead=13;
  var pages=[],cur=[],y=0;
  function txt(x,yy,s,bold,sz,align,width){
    sz=sz||size;
    var t=pdfEsc(pdfFit(s,width||9999,sz));
    var xx=x;
    if(align==='right')xx=x+(width||0)-t.length*sz*0.5;
    cur.push('BT /'+(bold?'F2':'F1')+' '+sz+' Tf '+xx.toFixed(1)+' '+yy.toFixed(1)+' Td ('+t+') Tj ET');
  }
  function line(yy){cur.push('0.75 0.75 0.75 RG 0.6 w '+M+' '+yy.toFixed(1)+' m '+(W-M)+' '+yy.toFixed(1)+' l S');}
  function header(first){
    y=H-M;
    if(first){
      txt(M,y,title,true,15);y-=18;
      txt(M,y,subtitle,false,9);y-=14;
    }else{
      txt(M,y,title,true,11);y-=14;
    }
    line(y+4);y-=12;
    cols.forEach(function(c){txt(M+c.x,y,c.label,true,8,c.align,c.w);});
    y-=6;line(y);y-=lead;
  }
  function newPage(first){cur=[];pages.push(cur);header(first);}
  newPage(true);
  rows.forEach(function(r){
    if(y<M+40){newPage(false);}
    cols.forEach(function(c,ci){txt(M+c.x,y,r[ci],false,8,c.align,c.w);});
    y-=lead;
  });
  if(summary&&summary.length){
    if(y<M+70)newPage(false);
    y-=6;line(y);y-=16;
    summary.forEach(function(s){txt(M,y,s,true,9);y-=13;});
  }
  var objs=[];
  function add(s){objs.push(s);return objs.length;}
  var fontR=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  var fontB=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  var pagesId=add('');
  var kids=[];
  pages.forEach(function(p){
    var content=p.join('\n');
    var cid=add('<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');
    var pid=add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 '+W.toFixed(2)+' '+H.toFixed(2)+'] /Resources << /Font << /F1 '+fontR+' 0 R /F2 '+fontB+' 0 R >> >> /Contents '+cid+' 0 R >>');
    kids.push(pid+' 0 R');
  });
  objs[pagesId-1]='<< /Type /Pages /Count '+pages.length+' /Kids ['+kids.join(' ')+'] >>';
  var catId=add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>');
  var out='%PDF-1.4\n',offsets=[];
  objs.forEach(function(o,i){
    offsets.push(out.length);
    out+=(i+1)+' 0 obj\n'+o+'\nendobj\n';
  });
  var xref=out.length;
  out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';
  offsets.forEach(function(o){out+=String(o).padStart(10,'0')+' 00000 n \n';});
  out+='trailer\n<< /Size '+(objs.length+1)+' /Root '+catId+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  return new Blob([latinBytes(out)],{type:'application/pdf'});
}

/* ---- PDF: lettura del testo ----
   I PDF veri delle banche non contengono "testo": contengono codici di
   caratteri che hanno senso solo passando dalla tabella del font
   (/ToUnicode). Senza quella tabella esce spazzatura. Qui si fa il lavoro
   completo: si leggono gli oggetti del PDF (anche quelli dentro gli
   "object stream" compressi), si trovano i font di ogni pagina, si legge
   la loro tabella ToUnicode e solo allora si decodifica il testo.
   Poi si ricostruiscono righe (stessa altezza) e colonne (stessa x). */

var WINANSI_EXTRA={128:8364,130:8218,131:402,132:8222,133:8230,134:8224,135:8225,136:710,137:8240,138:352,139:8249,140:338,142:381,145:8216,146:8217,147:8220,148:8221,149:8226,150:8211,151:8212,152:732,153:8482,154:353,155:8250,156:339,158:382,159:376};
function winAnsiChar(code){
  if(WINANSI_EXTRA[code])return String.fromCharCode(WINANSI_EXTRA[code]);
  return String.fromCharCode(code);
}
function hexToStr(hex){
  var out='';
  hex=hex.replace(/\s+/g,'');
  for(var i=0;i+3<hex.length+1;i+=4){
    var part=hex.substr(i,4);
    if(part.length<4)break;
    out+=String.fromCharCode(parseInt(part,16));
  }
  if(hex.length%4===2)out+=String.fromCharCode(parseInt(hex.substr(hex.length-2,2),16));
  return out;
}
/* Tabella ToUnicode: codice del font → carattere vero */
function parseToUnicode(txt){
  var map={},m;
  var bc=/beginbfchar([\s\S]*?)endbfchar/g;
  while((m=bc.exec(txt))){
    var re=/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g,p;
    while((p=re.exec(m[1])))map[parseInt(p[1],16)]=hexToStr(p[2]);
  }
  var br=/beginbfrange([\s\S]*?)endbfrange/g;
  while((m=br.exec(txt))){
    var re2=/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*(?:<([0-9A-Fa-f]+)>|\[([\s\S]*?)\])/g,q;
    while((q=re2.exec(m[1]))){
      var lo=parseInt(q[1],16),hi=parseInt(q[2],16);
      if(hi-lo>65535)continue;
      if(q[3]!==undefined){
        var base=parseInt(q[3],16);
        for(var c=lo;c<=hi;c++)map[c]=String.fromCharCode(base+(c-lo));
      }else if(q[4]!==undefined){
        var items=q[4].match(/<([0-9A-Fa-f]+)>/g)||[];
        for(var k=0;k<items.length&&lo+k<=hi;k++)map[lo+k]=hexToStr(items[k].replace(/[<>]/g,''));
      }
    }
  }
  return map;
}

/* Estrae gli oggetti del PDF (num → {dict, start, end}) */
function pdfScanObjects(s){
  var objs={},re=/(\d+)\s+\d+\s+obj\b/g,m;
  while((m=re.exec(s))){
    var num=parseInt(m[1],10);
    var start=m.index+m[0].length;
    var end=s.indexOf('endobj',start);
    if(end<0)end=s.length;
    objs[num]={body:s.slice(start,end),start:start};
  }
  return objs;
}
function pdfStreamBytes(u8,s,body,start){
  var st=body.indexOf('stream');
  if(st<0)return null;
  var abs=start+st+6;
  if(s[abs]==='\r')abs++;
  if(s[abs]==='\n')abs++;
  var endRel=body.indexOf('endstream',st);
  var absEnd=start+(endRel<0?body.length:endRel);
  var dict=body.slice(0,st);
  var stop=absEnd;
  var lm=/\/Length\s+(\d+)(?!\s+\d+\s+R)/.exec(dict);
  if(lm&&abs+parseInt(lm[1],10)<=absEnd)stop=abs+parseInt(lm[1],10);
  else{while(stop>abs&&(s.charCodeAt(stop-1)===10||s.charCodeAt(stop-1)===13))stop--;}
  return{dict:dict,bytes:u8.subarray(abs,stop)};
}
async function pdfDecodeStream(st,dec){
  if(!st)return null;
  if(/\/Image|\/DCTDecode|\/JPXDecode|\/CCITTFaxDecode|\/JBIG2Decode/.test(st.dict))return null;
  if(/\/FlateDecode/.test(st.dict)){
    try{return await inflateBytes(st.bytes,'deflate');}
    catch(e){try{return await inflateBytes(st.bytes,'deflate-raw');}catch(e2){return null;}}
  }
  if(/\/Filter/.test(st.dict))return null;
  return st.bytes;
}

/* Font di una pagina: nome usato nel contenuto (/F1) → tabella e larghezza codice */
async function pdfLoadFonts(resDict,objs,u8,s,dec,cache){
  var fonts={};
  var fm=/\/Font\s*<<([\s\S]*?)>>/.exec(resDict||'');
  if(!fm)return fonts;
  var re=/\/([^\s\/<>]+)\s+(\d+)\s+\d+\s+R/g,m;
  while((m=re.exec(fm[1]))){
    var name=m[1],num=parseInt(m[2],10);
    if(cache[num]){fonts[name]=cache[num];continue;}
    var fo=objs[num];
    if(!fo)continue;
    var body=fo.body;
    var twoByte=/\/Subtype\s*\/Type0/.test(body)||/Identity-H/.test(body);
    var map=null;
    var tu=/\/ToUnicode\s+(\d+)\s+\d+\s+R/.exec(body);
    if(tu){
      var to=objs[parseInt(tu[1],10)];
      if(to){
        var bytes=await pdfDecodeStream(pdfStreamBytes(u8,s,to.body,to.start),dec);
        if(bytes)map=parseToUnicode(dec.decode(bytes));
      }
    }
    var font={twoByte:twoByte,map:map};
    cache[num]=font;
    fonts[name]=font;
  }
  return fonts;
}
function pdfDecodeCodes(codes,font){
  var out='';
  if(font&&font.twoByte){
    for(var i=0;i+1<codes.length;i+=2){
      var c=(codes[i]<<8)|codes[i+1];
      out+=font.map&&font.map[c]!==undefined?font.map[c]:'';
    }
    return out;
  }
  for(var j=0;j<codes.length;j++){
    var b=codes[j];
    if(font&&font.map&&font.map[b]!==undefined)out+=font.map[b];
    else out+=winAnsiChar(b);
  }
  return out;
}

/* Percorre un content stream e restituisce i pezzetti di testo con posizione */
function pdfContentChunks(txt,fonts){
  var chunks=[],codes=[],nums=[],curX=0,curY=0,inTJ=false,i=0,n=txt.length,font=null,pendingName='';
  function push(){
    if(!codes.length)return;
    var t=pdfDecodeCodes(codes,font);
    codes=[];
    if(t&&t.trim())chunks.push({y:curY,x:curX,t:t});
  }
  while(i<n){
    var c=txt[i];
    if(c==='('){
      var d=1;i++;
      while(i<n&&d>0){
        var ch=txt[i];
        if(ch==='\\'){
          var nx=txt[i+1];
          if(nx>='0'&&nx<='7'){
            var oct=nx,k=i+2;
            while(k<n&&oct.length<3&&txt[k]>='0'&&txt[k]<='7'){oct+=txt[k];k++;}
            codes.push(parseInt(oct,8)&0xFF);i=k;continue;
          }
          var map={'n':10,'r':13,'t':9,'b':8,'f':12};
          if(map[nx]!==undefined)codes.push(map[nx]);
          else if(nx!==undefined)codes.push(nx.charCodeAt(0)&0xFF);
          i+=2;continue;
        }
        if(ch==='(')d++;
        else if(ch===')'){d--;if(d===0){i++;break;}}
        if(d>0)codes.push(ch.charCodeAt(0)&0xFF);
        i++;
      }
      continue;
    }
    if(c==='<'&&txt[i+1]==='<'){
      var depth=0;
      while(i<n){
        if(txt[i]==='<'&&txt[i+1]==='<'){depth++;i+=2;continue;}
        if(txt[i]==='>'&&txt[i+1]==='>'){depth--;i+=2;if(depth<=0)break;continue;}
        i++;
      }
      continue;
    }
    if(c==='<'){
      var e=txt.indexOf('>',i);
      if(e<0)break;
      var hex=txt.slice(i+1,e).replace(/\s+/g,'');
      for(var h=0;h+1<hex.length;h+=2)codes.push(parseInt(hex.substr(h,2),16)&0xFF);
      i=e+1;continue;
    }
    if(c==='/'){
      var j3=i+1,nm='';
      while(j3<n&&/[^\s\/\[\]<>()]/.test(txt[j3])){nm+=txt[j3];j3++;}
      pendingName=nm;i=j3;continue;
    }
    if(c==='['){inTJ=true;i++;continue;}
    if(c===']'){inTJ=false;i++;continue;}
    if(/[-+.\d]/.test(c)){
      var j=i,num='';
      while(j<n&&/[-+.\d]/.test(txt[j])){num+=txt[j];j++;}
      var val=parseFloat(num);
      if(!isNaN(val)){
        nums.push(val);
        if(inTJ&&val<=-120&&codes.length&&codes[codes.length-1]!==32)codes.push(32);
      }
      i=j;continue;
    }
    if(/[A-Za-z*'"]/.test(c)){
      var j2=i,op='';
      while(j2<n&&/[A-Za-z*'"0-9]/.test(txt[j2])){op+=txt[j2];j2++;}
      i=j2;
      if(op==='Tf'){if(fonts&&fonts[pendingName])font=fonts[pendingName];}
      else if(op==='Tj'||op==='TJ'||op==="'"||op==='"')push();
      else if(op==='Td'||op==='TD'){if(nums.length>=2){curX+=nums[nums.length-2];curY+=nums[nums.length-1];}}
      else if(op==='Tm'){if(nums.length>=6){curX=nums[nums.length-2];curY=nums[nums.length-1];}}
      else if(op==='T*')curY-=12;
      else if(op==='BT'){curX=0;curY=0;}
      nums=[];
      continue;
    }
    i++;
  }
  push();
  return chunks;
}
function chunksToGroups(chunks){
  var groups=[];
  chunks.forEach(function(ch){
    var g=null;
    for(var q=0;q<groups.length;q++){if(Math.abs(groups[q].y-ch.y)<=2.5){g=groups[q];break;}}
    if(!g){g={y:ch.y,items:[]};groups.push(g);}
    g.items.push(ch);
  });
  groups.sort(function(a,b){return b.y-a.y;});
  groups.forEach(function(g){g.items.sort(function(a,b){return a.x-b.x;});});
  return groups.filter(function(g){return g.items.length;});
}

async function pdfToGroups(arrayBuffer){
  var u8=new Uint8Array(arrayBuffer);
  var dec=new TextDecoder('windows-1252');
  var s=dec.decode(u8);
  if(s.indexOf('%PDF-')<0)throw new Error('Il file non sembra un PDF.');
  var objs=pdfScanObjects(s);

  /* Oggetti dentro gli "object stream" compressi (PDF moderni) */
  var nums=Object.keys(objs);
  for(var oi=0;oi<nums.length;oi++){
    var o=objs[nums[oi]];
    if(!/\/Type\s*\/ObjStm/.test(o.body))continue;
    var st=pdfStreamBytes(u8,s,o.body,o.start);
    var bytes=await pdfDecodeStream(st,dec);
    if(!bytes)continue;
    var txt=dec.decode(bytes);
    var N=parseInt((/\/N\s+(\d+)/.exec(o.body)||[])[1]||'0',10);
    var first=parseInt((/\/First\s+(\d+)/.exec(o.body)||[])[1]||'0',10);
    var headerNums=txt.slice(0,first).trim().split(/\s+/).map(Number);
    for(var p=0;p<N;p++){
      var onum=headerNums[p*2],off=headerNums[p*2+1];
      if(isNaN(onum)||isNaN(off))continue;
      var nextOff=(p+1<N&&!isNaN(headerNums[(p+1)*2+1]))?headerNums[(p+1)*2+1]:(txt.length-first);
      if(!objs[onum])objs[onum]={body:txt.slice(first+off,first+nextOff),start:-1,inObjStm:true};
    }
  }

  /* Pagine: risorse (font) + contenuti */
  var fontCache={},all=[];
  var pageNums=Object.keys(objs).filter(function(k){return /\/Type\s*\/Page\b/.test(objs[k].body);});
  async function resolveDict(body,key){
    var inline=new RegExp('\\/'+key+'\\s*<<([\\s\\S]*?)>>\\s*(?:\\/|>>)').exec(body);
    if(inline)return inline[0];
    var ref=new RegExp('\\/'+key+'\\s+(\\d+)\\s+\\d+\\s+R').exec(body);
    if(ref&&objs[parseInt(ref[1],10)])return objs[parseInt(ref[1],10)].body;
    return '';
  }
  for(var pi=0;pi<pageNums.length;pi++){
    var pg=objs[pageNums[pi]];
    var res=await resolveDict(pg.body,'Resources');
    var fonts=await pdfLoadFonts(res,objs,u8,s,dec,fontCache);
    var contents=[];
    var cRef=/\/Contents\s+(\d+)\s+\d+\s+R/.exec(pg.body);
    var cArr=/\/Contents\s*\[([\s\S]*?)\]/.exec(pg.body);
    if(cRef)contents.push(parseInt(cRef[1],10));
    else if(cArr){
      var rr=/(\d+)\s+\d+\s+R/g,mm;
      while((mm=rr.exec(cArr[1])))contents.push(parseInt(mm[1],10));
    }
    var pageTxt='';
    for(var ci=0;ci<contents.length;ci++){
      var co=objs[contents[ci]];
      if(!co||co.start<0)continue;
      var bytes2=await pdfDecodeStream(pdfStreamBytes(u8,s,co.body,co.start),dec);
      if(bytes2)pageTxt+=dec.decode(bytes2)+'\n';
    }
    if(!pageTxt)continue;
    all=all.concat(chunksToGroups(pdfContentChunks(pageTxt,fonts)));
  }

  /* Riserva: se non si sono trovate pagine (PDF strani), si leggono comunque
     tutti gli stream che contengono testo, senza tabella dei font. */
  if(!all.length){
    var keys=Object.keys(objs);
    for(var q2=0;q2<keys.length;q2++){
      var ob=objs[keys[q2]];
      if(ob.start<0)continue;
      var stb=pdfStreamBytes(u8,s,ob.body,ob.start);
      if(!stb)continue;
      var by=await pdfDecodeStream(stb,dec);
      if(!by)continue;
      var t2=dec.decode(by);
      if(t2.indexOf('Tj')<0&&t2.indexOf('TJ')<0)continue;
      all=all.concat(chunksToGroups(pdfContentChunks(t2,null)));
    }
  }
  if(!all.length)throw new Error('Da questo PDF non esce nessun testo: è probabilmente una scansione (immagine). Usa il CSV o l\'Excel della banca.');
  return all;
}
async function pdfToLines(arrayBuffer){
  return (await pdfToGroups(arrayBuffer)).map(function(g){
    return g.items.map(function(it){return it.t;}).join(' ').replace(/\s+/g,' ').trim();
  }).filter(function(l){return l;});
}

/* Riconoscimento di un importo: servono i centesimi (o il simbolo €),
   altrimenti si scambierebbero anni e numeri di conto per soldi. */
var MONEY_RE=/^[-+−(]?\s*(?:€|EUR)?\s*\d[\d.\s']*[.,]\d{2}\s*(?:€|EUR)?\s*[-−)]?$/i;
var DATE_RE=/^\s*(\d{1,2}[\/\.\-]\d{1,2}[\/\.\-]\d{2,4}|\d{4}-\d{2}-\d{2})\s*$/;
function isMoneyCell(t){return MONEY_RE.test(String(t||'').trim());}
function moneyValue(t){return parseAmount(String(t||'').replace(/−/g,'-').replace(/[()]/g,'').replace(/EUR/i,'').trim());}

/* Da PDF a tabella: la data, la descrizione e fino a 3 colonne di importi,
   riconosciute dalla posizione orizzontale (es. Uscite | Entrate | Saldo). */
function pdfGroupsToRows(groups){
  var moneyX=[];
  groups.forEach(function(g){
    g.items.forEach(function(it){if(isMoneyCell(it.t))moneyX.push(it.x);});
  });
  if(!moneyX.length)return [];
  moneyX.sort(function(a,b){return a-b;});
  var clusters=[],curC=[moneyX[0]];
  for(var i=1;i<moneyX.length;i++){
    if(moneyX[i]-moneyX[i-1]>40){clusters.push(curC);curC=[];}
    curC.push(moneyX[i]);
  }
  clusters.push(curC);
  if(clusters.length>3)clusters=clusters.slice(0,3);
  var centers=clusters.map(function(c){return c.reduce(function(a,b){return a+b;},0)/c.length;});
  function colOf(x){
    var best=0,bd=Infinity;
    centers.forEach(function(c,i){var d=Math.abs(c-x);if(d<bd){bd=d;best=i;}});
    return best;
  }
  var rows=[],lastDate='';
  groups.forEach(function(g){
    var date='',desc=[],amts=['','',''],found=false;
    g.items.forEach(function(it){
      var t=it.t.trim();
      if(!date&&DATE_RE.test(t)&&parseDateFlexible(t)){date=t;return;}
      if(isMoneyCell(t)){amts[colOf(it.x)]=t;found=true;return;}
      desc.push(t);
    });
    if(!found)return;
    var dtxt=desc.join(' ');
    if(/^\s*(saldo|totale|totali|riporto|segue)\b/i.test(dtxt))return;  // righe di totale, non movimenti
    if(!date&&lastDate)date=lastDate;
    if(date)lastDate=date;
    rows.push([date,desc.join(' ').replace(/\s+/g,' ').trim(),amts[0],amts[1],amts[2]]);
  });
  return rows;
}
/* Riserva: se il PDF ha ogni riga in un unico blocco di testo, si torna
   al riconoscimento con le espressioni regolari sulla riga intera. */
function pdfLinesToRows(lines){
  var AMT=/[-+−]?\s?\d{1,3}(?:[.\s]\d{3})*,\d{2}(?:\s?[-−])?/g;
  var DATE=/\b(\d{1,2}[\/\.\-]\d{1,2}[\/\.\-]\d{2,4})\b/;
  var rows=[],lastDate='';
  lines.forEach(function(l){
    var dm=DATE.exec(l);
    var rest=dm?l.slice(dm.index+dm[1].length):l;
    var amts=rest.match(AMT);
    if(!amts||!amts.length)return;
    var date=dm?parseDateFlexible(dm[1]):'';
    if(!date&&lastDate)date=lastDate;
    if(!date)return;
    lastDate=date;
    var raw=amts[0];
    var val=moneyValue(raw);
    if(isNaN(val)||val===0)return;
    if(/[-−]\s*$/.test(raw)&&val>0)val=-val;
    var desc=rest.replace(new RegExp(raw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),' ')
      .replace(/\b\d{1,2}[\/\.\-]\d{1,2}[\/\.\-]\d{2,4}\b/g,' ')
      .replace(/\s+/g,' ').trim();
    rows.push([date,desc||'Movimento',String(val).replace('.',','),'','']);
  });
  return rows;
}

/* ---- Salvataggio del file sul telefono ---- */
async function saveOrShare(filename,blob,mime){
  try{
    if(navigator.canShare&&navigator.share&&typeof File!=='undefined'){
      var file=new File([blob],filename,{type:mime});
      if(navigator.canShare({files:[file]})){
        /* Solo il file: passando anche title/text iOS allega un .txt inutile. */
        await navigator.share({files:[file]});
        return 'shared';
      }
    }
  }catch(e){
    if(e&&e.name==='AbortError')return 'cancelled';
  }
  try{
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download=filename;a.rel='noopener';
    document.body.appendChild(a);a.click();
    setTimeout(function(){try{document.body.removeChild(a);}catch(e2){}URL.revokeObjectURL(url);},5000);
    return 'downloaded';
  }catch(e3){return 'failed';}
}

================================================================ */
function exportEntries(scope){
  var txs=state.transactions.slice();
  var trs=state.transfers.slice();
  if(scope==='month'){
    var mk=ui.viewMonth||currentMonthKey();
    txs=txs.filter(function(t){return t.date.slice(0,7)===mk;});
    trs=trs.filter(function(t){return t.date.slice(0,7)===mk;});
  }else if(scope==='year'){
    var y=String(ui.viewYear||new Date().getFullYear());
    txs=txs.filter(function(t){return t.date.slice(0,4)===y;});
    trs=trs.filter(function(t){return t.date.slice(0,4)===y;});
  }
  var rows=txs.map(function(t){
    var c=catById(t.categoryId);
    return{
      date:t.date,
      type:t.type==='income'?'Entrata':'Spesa',
      signed:t.type==='income'?t.amount:-t.amount,
      amount:t.amount,
      category:c?c.name:'',
      account:accById(t.accountId).name,
      merchant:t.merchant||'',
      note:t.note||'',
      tags:(t.tags||[]).map(function(id){var g=tagById(id);return g?g.name:'';}).filter(Boolean).join(', ')
    };
  }).concat(trs.map(function(t){
    return{
      date:t.date,
      type:'Trasferimento',
      signed:0,
      amount:t.amount,
      category:'',
      account:accById(t.fromAccountId).name+' → '+accById(t.toAccountId).name,
      merchant:'',
      note:t.note||'',
      tags:(t.tags||[]).map(function(id){var g=tagById(id);return g?g.name:'';}).filter(Boolean).join(', ')
    };
  }));
  rows.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
  return rows;
}
function exportScopeLabel(scope){
  if(scope==='month')return formatMonthLabel(ui.viewMonth||currentMonthKey());
  if(scope==='year')return 'Anno '+(ui.viewYear||new Date().getFullYear());
  return 'Tutti i movimenti';
}
function exportFileBase(scope){
  var s=exportScopeLabel(scope).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return 'spese-'+s;
}
var EXPORT_HEADER=['Data','Tipo','Importo','Categoria','Conto','Esercente','Nota','Tag'];
function exportCSV(scope){
  var rows=exportEntries(scope);
  function q(v){var s=String(v==null?'':v);return '"'+s.replace(/"/g,'""')+'"';}
  var out=EXPORT_HEADER.map(q).join(';')+'\r\n';
  rows.forEach(function(r){
    out+=[r.date,r.type,String(r.signed||(r.type==='Trasferimento'?r.amount:0)).replace('.',','),r.category,r.account,r.merchant,r.note,r.tags].map(q).join(';')+'\r\n';
  });
  return {blob:new Blob(['\ufeff'+out],{type:'text/csv;charset=utf-8'}),name:exportFileBase(scope)+'.csv',mime:'text/csv',count:rows.length};
}
function exportXLSX(scope){
  var rows=exportEntries(scope);
  var body=rows.map(function(r){
    return [r.date,r.type,(r.type==='Trasferimento'?r.amount:r.signed),r.category,r.account,r.merchant,r.note,r.tags];
  });
  return {blob:xlsxBlob('Movimenti',EXPORT_HEADER,body),name:exportFileBase(scope)+'.xlsx',mime:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',count:rows.length};
}
function exportPDF(scope){
  var rows=exportEntries(scope);
  var inc=0,exp=0;
  rows.forEach(function(r){
    if(r.type==='Entrata')inc+=r.amount;
    else if(r.type==='Spesa')exp+=r.amount;
  });
  var cols=[
    {x:0,w:54,label:'Data'},
    {x:58,w:60,label:'Tipo'},
    {x:122,w:150,label:'Descrizione'},
    {x:276,w:88,label:'Categoria'},
    {x:368,w:80,label:'Conto'},
    {x:452,w:63,label:'Importo',align:'right'}
  ];
  var body=rows.map(function(r){
    var desc=r.merchant||r.note||'—';
    var amt=(r.type==='Trasferimento'?'':(r.signed<0?'-':'+'))+Math.abs(r.type==='Trasferimento'?r.amount:r.signed).toFixed(2).replace('.',',')+' €';
    return [formatShortDate(r.date),r.type,desc,r.category,r.account,amt];
  });
  var summary=[
    'Entrate: '+inc.toFixed(2).replace('.',',')+' €     Spese: '+exp.toFixed(2).replace('.',',')+' €     Saldo del periodo: '+(inc-exp).toFixed(2).replace('.',',')+' €',
    'Movimenti esportati: '+rows.length
  ];
  var blob=pdfBlob('Spese — '+exportScopeLabel(scope),'Esportato il '+formatShortDate(todayISO())+' · '+rows.length+' movimenti',cols,body,summary);
  return {blob:blob,name:exportFileBase(scope)+'.pdf',mime:'application/pdf',count:rows.length};
}
