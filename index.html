<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Spese — Tracker</title>
<meta name="description" content="Traccia spese, entrate e trasferimenti tra conti — semplice e veloce da telefono.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#146356">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spese">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFEA;--app-bg:#F5F6F4;--surface:#FFFFFF;--border:#E1E4DE;
  --ink:#1B1F1C;--ink-soft:#6B7268;--ink-faint:#9AA098;
  --accent:#146356;--accent-dark:#0E4B41;--accent-soft:#DCEAE6;
  --amber:#C9842B;--amber-soft:#F6E8D4;--red:#B3422E;--red-soft:#F5DED8;
  --transfer:#3A5A78;--transfer-soft:#DEE6EC;
  --radius-lg:20px;--radius-md:14px;--radius-sm:10px;
  --shadow:0 2px 10px rgba(27,31,28,0.07);
  --font-display:'Space Grotesk','Helvetica Neue',Arial,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.001ms!important;transition-duration:0.001ms!important;}}
html,body{margin:0;padding:0;height:100%;background:var(--bg);}
body{font-family:var(--font-body);color:var(--ink);-webkit-tap-highlight-color:transparent;overflow-x:hidden;}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--accent-soft);}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--app-bg);position:relative;display:flex;flex-direction:column;}
@media(min-width:481px){#app{box-shadow:0 0 40px rgba(27,31,28,0.10);}}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--app-bg);gap:14px;z-index:50;}
#splash.hidden{display:none;}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#shell{display:flex;flex-direction:column;min-height:100vh;}
#shell.hidden{display:none;}
.topbar{padding:14px 20px 8px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.brand{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-0.01em;}
.search-fab{background:var(--surface);border:1px solid var(--border);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink);}
main#content{flex:1;padding:8px 16px 110px;overflow-y:auto;}
.view{display:flex;flex-direction:column;gap:18px;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.bottomnav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:20;}
.nav-btn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:var(--radius-sm);color:var(--ink-faint);font-size:11px;font-weight:500;}
.nav-btn .nav-icon{font-size:20px;line-height:1;}
.nav-btn.active{color:var(--accent);}
.nav-fab{width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:26px;margin-top:-22px;box-shadow:0 4px 14px rgba(20,99,86,0.4);flex-shrink:0;}
.nav-fab:active{background:var(--accent-dark);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow);}
.section-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.section-title-row h3{font-size:15px;margin:0;font-weight:600;}
.link-btn{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;padding:4px;}
.hint{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin:0 2px;}
.month-nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:4px 0;}
.nav-label{font-family:var(--font-display);font-weight:600;font-size:16px;min-width:150px;text-align:center;}
.icon-btn{background:var(--surface);border:1px solid var(--border);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink);}
.icon-btn:disabled{opacity:0.35;}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip-row.wrap{flex-wrap:wrap;overflow:visible;}
.chip{flex-shrink:0;border:1.5px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500;color:var(--ink-soft);white-space:nowrap;display:flex;align-items:center;gap:6px;}
.chip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.chip.selected{border-color:transparent;background:var(--ink);color:#fff;}
.chip.selected .dot{background:#fff!important;}
.chip.static{cursor:default;}
.chip.sm{padding:5px 10px;font-size:12px;}
.segmented{display:flex;background:var(--app-bg);border:1.5px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
.segmented button{flex:1;border:none;background:none;padding:9px 6px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
.segmented button.active{background:var(--ink);color:#fff;}
.segmented button.active.mode-income{background:var(--accent);}
.segmented button.active.mode-transfer{background:var(--transfer);}
.segmented button:disabled{opacity:0.35;}
.segmented.small button{padding:7px 4px;font-size:12.5px;}
.stat-row{display:flex;gap:10px;}
.stat-tile{flex:1;text-align:center;padding:13px 8px;}
.stat-label{font-size:11.5px;color:var(--ink-soft);margin-bottom:3px;}
.stat-value{font-family:var(--font-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;}
.stat-value.income{color:var(--accent);}
.saldo-line{text-align:center;font-size:13px;color:var(--ink-soft);}
.saldo-line strong{font-variant-numeric:tabular-nums;}
.saldo-pos{color:var(--accent);}
.saldo-neg{color:var(--red);}
.donut-section{display:flex;align-items:center;gap:18px;margin-top:8px;}
.donut{width:110px;height:110px;flex-shrink:0;}
.legend{list-style:none;margin:0;padding:0;flex:1;display:flex;flex-direction:column;gap:7px;}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.legend-item .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.legend-name{flex:1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.legend-amount{font-variant-numeric:tabular-nums;font-weight:600;}
.legend-pct{color:var(--ink-faint);font-size:11px;min-width:28px;text-align:right;}
.empty-note{font-size:13px;color:var(--ink-faint);text-align:center;padding:18px 0;}
.alert-card{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--radius-md);font-size:13px;font-weight:500;}
.alert-card.warn{background:var(--amber-soft);color:#7A511A;}
.alert-card.over{background:var(--red-soft);color:#7E2E1E;}
.alert-card .alert-amt{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;}
.expense-row{display:flex;align-items:flex-start;gap:11px;padding:10px 2px;border-bottom:1px solid var(--border);}
.expense-row:last-child{border-bottom:none;}
.cat-bubble{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-top:1px;}
.transfer-bubble{background:var(--transfer-soft);}
.expense-info{flex:1;min-width:0;}
.expense-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.expense-sub{font-size:12px;color:var(--ink-faint);}
.expense-amt{font-variant-numeric:tabular-nums;font-weight:600;font-size:14.5px;flex-shrink:0;margin-top:2px;}
.expense-amt.amt-income{color:var(--accent);}
.expense-amt.amt-transfer{color:var(--transfer);}
.day-header{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin:6px 2px 0;}
.tags-row{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;}
.tag-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:700;line-height:1.5;white-space:nowrap;}
.select{width:100%;padding:10px 12px;border-radius:var(--radius-md);border:1.5px solid var(--border);background:var(--surface);font-size:13.5px;color:var(--ink);}
.text-input{width:100%;padding:11px 13px;border-radius:var(--radius-md);border:1.5px solid var(--border);background:var(--surface);font-size:14.5px;color:var(--ink);}
.field-group{display:flex;flex-direction:column;gap:6px;}
.field-label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.btn-primary,.btn-secondary,.btn-danger{border:none;border-radius:var(--radius-md);padding:13px 18px;font-size:14.5px;font-weight:600;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:disabled{background:#C8CDC6;color:#fff;}
.btn-secondary{background:var(--surface);color:var(--ink);border:1.5px solid var(--border);}
.btn-danger{background:var(--red-soft);color:#7E2E1E;}
.full-width{width:100%;}
.btn-primary-sm{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;font-weight:600;}
.budget-card{display:flex;flex-direction:column;gap:8px;}
.budget-top{display:flex;align-items:center;gap:10px;}
.budget-name{flex:1;font-weight:600;font-size:14px;}
.budget-figures{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.progress-track{height:8px;border-radius:99px;background:var(--border);overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;transition:width .3s ease;}
.budget-input-row{display:flex;align-items:center;gap:8px;}
.budget-input-row input{width:100px;padding:8px 10px;border-radius:var(--radius-sm);border:1.5px solid var(--border);font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums;}
.budget-input-row span{font-size:12.5px;color:var(--ink-faint);}
.new-cat-row{display:flex;gap:8px;align-items:center;}
.emoji-input{width:48px;text-align:center;padding:10px 4px;border-radius:var(--radius-sm);border:1.5px solid var(--border);font-size:17px;}
.account-card{display:flex;align-items:center;gap:12px;}
.account-card .dot-lg{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
.account-name-row{flex:1;display:flex;flex-direction:column;min-width:0;}
.account-name{font-weight:600;font-size:14.5px;background:none;border:none;padding:0;color:var(--ink);width:100%;}
.account-name:focus{outline:none;border-bottom:1.5px solid var(--accent);}
.account-balance{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--font-display);}
.account-balance.saldo-pos{color:var(--accent);}
.account-balance.saldo-neg{color:var(--red);}
.account-sub{font-size:11.5px;color:var(--ink-faint);}
.icon-btn-danger{background:var(--surface);border:1px solid var(--border);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--red);flex-shrink:0;}
.reset-link{background:none;border:none;color:var(--ink-faint);font-size:12px;text-decoration:underline;padding:6px;}
#modal-root{position:fixed;inset:0;z-index:40;display:none;}
#modal-root.open{display:block;}
.modal-backdrop{position:absolute;inset:0;background:rgba(20,24,21,0.42);animation:fadein2 .2s ease;}
@keyframes fadein2{from{opacity:0;}to{opacity:1;}}
.sheet-wrap{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;}
.sheet{width:100%;max-height:92vh;overflow-y:auto;background:var(--app-bg);border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;animation:slideup .25s cubic-bezier(.2,.8,.3,1);}
@keyframes slideup{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:2px auto 0;flex-shrink:0;}
.ticket{position:relative;background:var(--ink);color:#fff;border-radius:var(--radius-lg);padding:22px 20px 20px;text-align:center;margin-top:4px;}
.ticket.ticket-income{background:var(--accent-dark);}
.ticket.ticket-transfer{background:var(--transfer);}
.ticket::before,.ticket::after{content:'';position:absolute;width:20px;height:20px;background:var(--app-bg);border-radius:50%;top:50%;transform:translateY(-50%);}
.ticket::before{left:-10px;}
.ticket::after{right:-10px;}
.ticket-close{position:absolute;top:10px;right:12px;z-index:2;background:rgba(255,255,255,0.12);border:none;color:#fff;width:26px;height:26px;border-radius:50%;font-size:13px;display:flex;align-items:center;justify-content:center;}
.ticket-label{font-size:12px;opacity:0.7;letter-spacing:0.03em;text-transform:uppercase;margin-bottom:4px;}
.ticket-amount{font-family:var(--font-display);font-weight:700;font-size:36px;font-variant-numeric:tabular-nums;}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.key{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:13px 0;font-size:19px;font-weight:600;color:var(--ink);font-family:var(--font-display);}
.key:active{background:var(--accent-soft);}
.sticky-save{position:sticky;bottom:0;}
.swap-hint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--ink-faint);padding:2px 0;}
.confirm-box{background:var(--surface);border-radius:var(--radius-lg);padding:20px;display:flex;flex-direction:column;gap:16px;margin:auto;max-width:340px;}
.confirm-box p{margin:0;font-size:14.5px;line-height:1.5;}
.confirm-actions{display:flex;gap:10px;}
.confirm-actions button{flex:1;}
.confirm-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;}
textarea.text-input{min-height:80px;resize:vertical;font-family:monospace;font-size:12px;}
.import-table{display:flex;flex-direction:column;}
.import-row-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.import-row-item:last-child{border-bottom:none;}
.import-row-item .imp-date{width:42px;color:var(--ink-faint);flex-shrink:0;}
.import-row-item .imp-desc{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.import-row-item .imp-amt{font-variant-numeric:tabular-nums;font-weight:600;width:68px;text-align:right;flex-shrink:0;}
.import-row-item .imp-amt.amt-income{color:var(--accent);}
.import-row-item select{font-size:11.5px;border-radius:8px;border:1px solid var(--border);padding:4px;max-width:100px;flex-shrink:0;}
.import-row-item input[type=checkbox]{width:16px;height:16px;flex-shrink:0;}
.step-dots{display:flex;gap:6px;justify-content:center;}
.step-dot{width:6px;height:6px;border-radius:50%;background:var(--border);}
.step-dot.active{background:var(--accent);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink-soft);}
/* Annual view */
.annual-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
.annual-tile{text-align:center;padding:10px 4px;}
.annual-tile .alabel{font-size:11px;color:var(--ink-soft);margin-bottom:3px;}
.annual-tile .avalue{font-family:var(--font-display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;}
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow);}
.chart-legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
.chart-legend-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px;vertical-align:middle;}
.month-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.month-table th{text-align:right;padding:6px 4px;color:var(--ink-soft);font-weight:600;font-size:11px;text-transform:uppercase;border-bottom:1.5px solid var(--border);}
.month-table th:first-child{text-align:left;}
.month-table td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;}
.month-table td:first-child{text-align:left;color:var(--ink-soft);font-weight:600;}
.month-table .total-row td{font-weight:700;border-top:1.5px solid var(--border);border-bottom:none;padding-top:9px;}
.month-table .highlight-row td{background:var(--accent-soft);}
.month-table .highlight-row td:first-child{border-radius:6px 0 0 6px;}
.month-table .highlight-row td:last-child{border-radius:0 6px 6px 0;}
/* Search overlay */
.search-overlay{position:absolute;inset:0;background:var(--app-bg);display:flex;flex-direction:column;max-width:480px;margin:0 auto;}
.search-bar{display:flex;gap:10px;align-items:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.search-input-el{flex:1;border:none;background:none;font-size:16px;color:var(--ink);outline:none;font-family:inherit;}
.search-close-btn{background:none;border:none;font-size:20px;color:var(--ink-faint);cursor:pointer;padding:2px;}
.search-content{flex:1;overflow-y:auto;padding:8px 16px 40px;display:flex;flex-direction:column;gap:12px;}
.search-meta{font-size:12px;color:var(--ink-faint);padding:4px 0;}
.search-cat-grid{display:flex;flex-wrap:wrap;gap:8px;}
/* Tags */
.tag-picker-row{display:flex;flex-wrap:wrap;gap:6px;}
.new-tag-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.color-dots-row{display:flex;gap:6px;flex-wrap:wrap;}
.color-dot{width:22px;height:22px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;flex-shrink:0;}
.color-dot.active{border-color:var(--ink);}
/* Quick date */
.date-quick-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.date-quick-row input[type=date]{flex:1;min-width:130px;}
/* Toast */
#toast-root{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:60;max-width:80%;text-align:center;}
#toast-root.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">
  <div id="splash"><div class="spinner"></div><p style="color:var(--ink-soft);font-size:14px;margin:0;">Caricamento…</p></div>
  <div id="shell" class="hidden">
    <header class="topbar">
      <span class="brand">💶 Spese</span>
      <button class="search-fab" id="openSearch" aria-label="Cerca">🔍</button>
    </header>
    <main id="content"></main>
    <nav class="bottomnav">
      <button class="nav-btn" data-tab="home"><span class="nav-icon">🏠</span>Riepilogo</button>
      <button class="nav-btn" data-tab="history"><span class="nav-icon">📋</span>Storico</button>
      <button class="nav-fab" id="fabAdd" aria-label="Aggiungi movimento">＋</button>
      <button class="nav-btn" data-tab="budget"><span class="nav-icon">🎯</span>Budget</button>
      <button class="nav-btn" data-tab="accounts"><span class="nav-icon">💼</span>Conti</button>
    </nav>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="dbg-panel" style="position:fixed;left:0;right:0;top:0;max-width:480px;margin:0 auto;background:#0E4B41;color:#fff;font-family:monospace;font-size:11px;z-index:9999;max-height:42vh;display:flex;flex-direction:column;box-shadow:0 2px 12px rgba(0,0,0,0.3);">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#0a3831;">
    <strong style="font-size:11px;">🔍 DIAGNOSTICA</strong>
    <div>
      <button id="dbgRefresh" style="background:#146356;color:#fff;border:none;border-radius:6px;padding:4px 8px;font-size:10px;margin-right:4px;">Aggiorna</button>

function migrateFromRaw(raw){

/* ================================================================
   STORAGE ADAPTER
   Usa window.storage quando disponibile (dentro Claude, per continuare
   a testare e sviluppare qui). Fuori da Claude (es. ospitata su GitHub
   Pages) quell'oggetto non esiste, quindi si passa automaticamente a
   localStorage, che è persistente sul dispositivo tra una sessione e
   l'altra ed è supportato da tutti i browser desktop e mobile.
================================================================ */
var usingClaudeStorage = !!window.storage;

async function storageGet(key){
  if(usingClaudeStorage){
    try{var r=await window.storage.get(key,false);return r&&r.value?r.value:null;}
    catch(e){return null;}
  }
  try{return window.localStorage.getItem(key);}
  catch(e){return null;}
}
async function storageSet(key,value){
  if(usingClaudeStorage){
    try{var ok=await window.storage.set(key,value,false);return !!ok;}
    catch(e){return false;}
  }
  try{window.localStorage.setItem(key,value);return true;}
  catch(e){return false;}
}

async function loadState(){
  async function tryLoad(key){
    var raw=await storageGet(key);
    try{return raw?JSON.parse(raw):null;}catch(e){return null;}
  }
  var data=await tryLoad(STORAGE_KEY)||await tryLoad(STORAGE_KEY_V2);
  if(data){state=migrateFromRaw(data);await saveState();}
  else{state=defaultState();await saveState();}
}

async function saveState(){
  var ok=await storageSet(STORAGE_KEY,JSON.stringify(state));
  if(!ok)showToast('Errore nel salvataggio');
  pushStateToCloud();
}

/* ================================================================
   CLOUD SYNC (Firebase)
   Facoltativo: se l'utente configura Firebase, ogni saveState() locale
   viene anche spinto su Firestore, e un listener in tempo reale applica
   i cambiamenti arrivati da un altro dispositivo. Se non configurato,
   tutto questo modulo resta inerte e l'app si comporta come prima
   (solo storage locale).
================================================================ */
var SYNC_CONFIG_KEY='expense-tracker-sync-config-v1';
var sync={
  status:'unconfigured', // unconfigured | configured | connecting | connected | error
  email:null,
  errorMsg:null,
  firebaseApp:null,
  auth:null,
  db:null,
  unsubscribeSnapshot:null,
  unsubscribeInbox:null,
  pendingInbox:[],
  lastPushedJSON:null,
  sdkLoadPromise:null
};

function loadSyncConfig(){
  try{
    var raw=window.localStorage.getItem(SYNC_CONFIG_KEY);
    return raw?JSON.parse(raw):null;
  }catch(e){return null;}
}
function saveSyncConfig(cfg){
  try{window.localStorage.setItem(SYNC_CONFIG_KEY,JSON.stringify(cfg));return true;}
  catch(e){return false;}
}
function clearSyncConfig(){
  try{window.localStorage.removeItem(SYNC_CONFIG_KEY);}catch(e){}
}

function extractObjectAround(txt, anchor){
  var idx=txt.indexOf(anchor);
  if(idx===-1)return null;
  var start=txt.lastIndexOf('{', idx);
  if(start===-1)return null;
  var depth=0, inStr=false, strCh='';
  for(var i=start;i<txt.length;i++){
    var c=txt[i];
    if(inStr){
      if(c==='\\'){i++;continue;}
      if(c===strCh)inStr=false;
      continue;
    }
    if(c==='"'||c==="'"||c==='`'){inStr=true;strCh=c;continue;}
    if(c==='{')depth++;
    else if(c==='}'){depth--;if(depth===0)return txt.slice(start,i+1);}
  }
  return null;
}
function parseFirebaseConfigInput(raw){
  if(!raw||!raw.trim())return null;
  var txt=raw.trim();
  txt=txt.replace(/[\u2018\u2019\u201A\u201B]/g,"'").replace(/[\u201C\u201D\u201E\u201F]/g,'"');
  txt=txt.replace(/[\u200B\u200C\u200D\uFEFF]/g,'');
  txt=txt.replace(/\u00A0/g,' ');
  var candidate=extractObjectAround(txt,'apiKey');
  if(!candidate){
    var m=txt.match(/\{[\s\S]*\}/);
    candidate=m?m[0]:txt;
  }
  try{
    var obj=(new Function('return (' + candidate + ')'))();
    if(obj&&typeof obj==='object'&&obj.apiKey&&obj.projectId)return obj;
    return null;
  }catch(e){
    try{
      var obj2=JSON.parse(candidate);
      if(obj2&&obj2.apiKey&&obj2.projectId)return obj2;
    }catch(e2){}
    return null;
  }
}

function loadFirebaseSDK(){
  if(sync.sdkLoadPromise)return sync.sdkLoadPromise;
  sync.sdkLoadPromise=new Promise(function(resolve,reject){
    if(window.firebase&&window.firebase.apps){resolve();return;}
    var urls=[
      'https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js',
      'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js',
      'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js'
    ];
    function loadNext(i){
      if(i>=urls.length){resolve();return;}
      var s=document.createElement('script');
      s.src=urls[i];
      s.onload=function(){loadNext(i+1);};
      s.onerror=function(){reject(new Error('Impossibile caricare Firebase SDK'));};
      document.head.appendChild(s);
    }
    loadNext(0);
  });
  return sync.sdkLoadPromise;
}

function syncDocRef(uid){
  return sync.db.collection('syncedState').doc(uid);
}

async function rawPushStateToCloud(){
  if(!sync.db||!sync.uid)return;
  try{
    var json=JSON.stringify(state);
    sync.lastPushedJSON=json;
    await syncDocRef(sync.uid).set({data:json,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:sync.email||'device'});
  }catch(e){
    console.error('Errore sync push',e);
  }
}
async function pushStateToCloud(){
  if(sync.status!=='connected')return;
  await rawPushStateToCloud();
}

function attachSnapshotListener(){
  if(sync.unsubscribeSnapshot)sync.unsubscribeSnapshot();
  sync.unsubscribeSnapshot=syncDocRef(sync.uid).onSnapshot(function(snap){
    if(!snap.exists)return;
    var remote=snap.data();
    if(!remote||!remote.data)return;
    if(remote.data===sync.lastPushedJSON)return; // eco della nostra stessa scrittura
    try{
      var parsed=JSON.parse(remote.data);
      state=migrateFromRaw(parsed);
      sync.lastPushedJSON=remote.data;
      storageSet(STORAGE_KEY,JSON.stringify(state));
      renderActiveTab();
      showToast('Dati aggiornati da un altro dispositivo');
    }catch(e){console.error('Errore applicando dati remoti',e);}
  },function(err){
    console.error('Errore listener sync',err);
    sync.status='error';sync.errorMsg='Connessione al cloud interrotta';
  });
}

async function resolveInitialConflict(uid){
  var snap=await syncDocRef(uid).get();
  if(!snap.exists){
    await rawPushStateToCloud();
    return 'pushed-empty-remote';
  }
  var remote=snap.data();
  var localJSON=JSON.stringify(state);
  if(!remote||!remote.data||remote.data===localJSON){
    sync.lastPushedJSON=remote?remote.data:null;
    return 'identical';
  }
  return new Promise(function(resolve){
    openCenteredModal(
      '<div class="confirm-box"><p><strong>Trovati dati sincronizzati nel cloud.</strong><br>Vuoi usare quelli (i dati presenti solo su questo dispositivo verranno sostituiti) oppure caricare i dati di questo dispositivo nel cloud (sovrascrivendo quelli sincronizzati)?</p>'+
      '<div class="confirm-actions"><button class="btn-secondary" id="conflictUseLocal">Usa questo dispositivo</button><button class="btn-primary" id="conflictUseRemote">Usa il cloud</button></div></div>'
    );
    document.getElementById('conflictUseRemote').onclick=function(){
      try{
        state=migrateFromRaw(JSON.parse(remote.data));
        sync.lastPushedJSON=remote.data;
        storageSet(STORAGE_KEY,JSON.stringify(state));
        renderActiveTab();
      }catch(e){}
      closeModal();resolve('used-remote');
    };
    document.getElementById('conflictUseLocal').onclick=function(){
      rawPushStateToCloud();
      closeModal();resolve('used-local');
    };
  });
}

async function startSync(uid,email){
  sync.uid=uid;sync.email=email;sync.status='connecting';
  renderActiveTab();
  await resolveInitialConflict(uid);
  if(!state.inboxToken){state.inboxToken=randToken();await saveState();}
  attachSnapshotListener();
  try{attachInboxListener();}catch(e){console.error('Inbox notifiche non disponibile',e);}
  sync.status='connected';
  renderActiveTab();
}

function stopSync(keepConfig){
  if(sync.unsubscribeSnapshot){sync.unsubscribeSnapshot();sync.unsubscribeSnapshot=null;}
  if(sync.unsubscribeInbox){sync.unsubscribeInbox();sync.unsubscribeInbox=null;}
  sync.pendingInbox=[];
  if(sync.auth){try{sync.auth.signOut();}catch(e){}}
  sync.status=keepConfig?'configured':'unconfigured';
  sync.uid=null;sync.email=null;sync.db=null;sync.auth=null;sync.firebaseApp=null;
  if(!keepConfig)clearSyncConfig();
  renderActiveTab();
}

/* ================================================================
   REGISTRAZIONE AUTOMATICA DA NOTIFICHE
   Un'app di automazione sul telefono (es. MacroDroid su Android)
   inoltra il testo delle notifiche bancarie a Firestore, in una
   "casella" identificata da un token segreto. L'app la ascolta in
   tempo reale, estrae importo/descrizione/categoria e propone il
   movimento da confermare (o lo registra da sola se l'utente ha
   attivato la modalità automatica).
================================================================ */
function randToken(){
  var chars='abcdefghijklmnopqrstuvwxyz0123456789';
  var out='';
  try{
    var arr=new Uint8Array(24);crypto.getRandomValues(arr);
    for(var i=0;i<arr.length;i++)out+=chars[arr[i]%36];
  }catch(e){for(var j=0;j<24;j++)out+=chars[Math.floor(Math.random()*36)];}
  return out;
}

function parseBankNotification(item){
  var text=((item.title?item.title+' ':'')+(item.text||'')).trim();
  var m=text.match(/(?:€|eur)\s*:?\s*([0-9][0-9.,]*)/i)||text.match(/([0-9][0-9.,]*)\s*(?:€|eur)/i);
  var amount=m?Math.abs(parseAmount(m[1])):NaN;
  var lower=text.toLowerCase();
  var isIncome=/accredit|bonifico ricevuto|hai ricevuto|incasso|stipendio|rimborso/.test(lower);
  var desc='';
  var pm=text.match(/presso\s+([^.,\n]{2,40})/i);
  if(pm)desc=pm[1].trim();
  else{
    var dm=text.match(/(?:a favore di|da)\s+([^.,\n]{2,40})/i);
    if(dm)desc=dm[1].trim();
    else desc=(item.title||text).slice(0,60);
  }
  var type=isIncome?'income':'expense';
  return{amount:amount,type:type,desc:desc,categoryId:guessCat(desc+' '+text,type),valid:amount>0,raw:text};
}

function defaultAccountId(){
  if(lastUsedAccId&&state.accounts.some(function(a){return a.id===lastUsedAccId;}))return lastUsedAccId;
  return state.accounts[0].id;
}

function registerParsedNotification(p){
  state.transactions.push({id:uid('tx'),type:p.type,amount:p.amount,accountId:defaultAccountId(),categoryId:p.categoryId,note:p.desc,date:todayISO(),tags:[],createdAt:Date.now()});
}

function attachInboxListener(){
  if(sync.unsubscribeInbox){sync.unsubscribeInbox();sync.unsubscribeInbox=null;}
  if(!state.inboxToken||!sync.db){dbgLog('❌ Listener NON attivato: '+(!state.inboxToken?'manca token':'manca db'));return;}
  dbgLog('✅ Listener inbox attivato su token '+String(state.inboxToken).slice(0,8)+'…');
  sync.unsubscribeInbox=sync.db.collection('inbox').doc(state.inboxToken).collection('items').onSnapshot(function(qs){
    var items=[];
    qs.docs.forEach(function(d){var data=d.data()||{};items.push({id:d.id,title:data.title||'',text:data.text||''});});
    dbgLog('📥 Snapshot: '+items.length+' notifiche nel cloud');
    handleInboxItems(items);
  },function(err){dbgLog('⚠️ Errore listener: '+(err&&err.message?err.message:err));console.error('Errore inbox notifiche',err);});
}
function deleteInboxItem(id){
  if(!sync.db||!state.inboxToken)return;
  try{sync.db.collection('inbox').doc(state.inboxToken).collection('items').doc(id).delete();}catch(e){}
}
function handleInboxItems(items){
  var natives=sync.pendingInbox.filter(function(x){return x.native;});
  if(state.autoRegister){
    dbgLog('⚙️ autoRegister ACCESO → registro in automatico');
    var added=0;
    var leftovers=[];
    items.forEach(function(it){
      var p=parseBankNotification(it);
      if(p.valid){registerParsedNotification(p);deleteInboxItem(it.id);added++;}
      else leftovers.push(it);
    });
    sync.pendingInbox=natives.concat(leftovers);
    if(added){saveState();showToast(added===1?'Registrato 1 movimento dalla notifica':'Registrati '+added+' movimenti dalle notifiche');}
  }else{
    sync.pendingInbox=natives.concat(items);
    dbgLog('⚙️ autoRegister SPENTO → '+sync.pendingInbox.length+' in attesa (tab attuale: '+ui.activeTab+')');
  }
  renderActiveTab();
  dbgUpdate();
}
function registerInboxItem(itemId){
  var it=sync.pendingInbox.find(function(x){return x.id===itemId;});
  if(!it)return;
  var p=parseBankNotification(it);
  if(!p.valid){showToast('Importo non riconosciuto in questa notifica');return;}
  registerParsedNotification(p);
  saveState();
  if(!it.native)deleteInboxItem(itemId);
  sync.pendingInbox=sync.pendingInbox.filter(function(x){return x.id!==itemId;});
  showToast('Movimento registrato');
  renderActiveTab();
}
function ignoreInboxItem(itemId){
  var it=sync.pendingInbox.find(function(x){return x.id===itemId;});
  if(it&&!it.native)deleteInboxItem(itemId);
  sync.pendingInbox=sync.pendingInbox.filter(function(x){return x.id!==itemId;});
  renderActiveTab();
}

/* ---- Ponte nativo (app Android via Capacitor) ----
   Quando l'app gira dentro il contenitore nativo Android, il plugin
   SpeseNotifiche legge le notifiche direttamente sul dispositivo e le
   consegna qui, senza passare da MacroDroid né dal cloud. Le notifiche
   senza un importo riconoscibile vengono scartate in silenzio (il
   listener nativo riceve le notifiche di tutte le app, non solo la
   banca, quindi mostrare quelle non valide creerebbe solo rumore). */
function handleNativeNotification(data){
  var item={id:uid('nat'),title:(data&&data.title)||'',text:(data&&data.text)||'',native:true};
  var p=parseBankNotification(item);
  if(!p.valid)return;
  if(state.autoRegister){
    registerParsedNotification(p);
    saveState();
    showToast('Registrato dalla notifica: '+fmt(p.amount));
  }else{
    sync.pendingInbox.push(item);
  }
  renderActiveTab();
}
function initNativeNotificationBridge(){
  try{
    if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SpeseNotifiche){
      window.Capacitor.Plugins.SpeseNotifiche.addListener('bancaNotifica',function(data){
        try{handleNativeNotification(data);}catch(e){console.error('Errore notifica nativa',e);}
      });
      return true;
    }
  }catch(e){}
  return false;
}
function inboxEndpointURL(){
  var cfg=loadSyncConfig();
  if(!cfg||!cfg.firebaseConfig||!state.inboxToken)return '';
  return 'https://firestore.googleapis.com/v1/projects/'+cfg.firebaseConfig.projectId+'/databases/(default)/documents/inbox/'+state.inboxToken+'/items';
}

async function initSyncFromSavedConfig(){
  var cfg=loadSyncConfig();
  if(!cfg||!cfg.firebaseConfig){sync.status='unconfigured';return;}
  sync.status='configured';
  try{
    await loadFirebaseSDK();
    sync.firebaseApp=firebase.apps.length?firebase.apps[0]:firebase.initializeApp(cfg.firebaseConfig);
    sync.auth=firebase.auth();
    sync.db=firebase.firestore();
    sync.auth.onAuthStateChanged(function(user){
      if(user){startSync(user.uid,user.email);}
      else{sync.status='configured';renderActiveTab();}
    });
  }catch(e){
    sync.status='error';sync.errorMsg='Impossibile inizializzare Firebase. Controlla la configurazione.';
    renderActiveTab();
  }
}

async function connectSyncWithCredentials(firebaseConfig,email,password,mode){
  sync.status='connecting';renderActiveTab();
  try{
    await loadFirebaseSDK();
    sync.firebaseApp=firebase.apps.length?firebase.apps[0]:firebase.initializeApp(firebaseConfig);
    sync.auth=firebase.auth();
    sync.db=firebase.firestore();
    var cred;
    if(mode==='signup')cred=await sync.auth.createUserWithEmailAndPassword(email,password);
    else cred=await sync.auth.signInWithEmailAndPassword(email,password);
    saveSyncConfig({firebaseConfig:firebaseConfig,email:email});
    await startSync(cred.user.uid,cred.user.email);
    return {ok:true};
  }catch(e){
    sync.status='configured';renderActiveTab();
    var msg='Errore di connessione.';
    if(e&&e.code){
      if(e.code==='auth/email-already-in-use')msg='Questa email è già registrata: prova ad accedere invece di creare un account.';
      else if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')msg='Password errata.';
      else if(e.code==='auth/user-not-found')msg='Nessun account con questa email: crealo prima dal primo dispositivo.';
      else if(e.code==='auth/weak-password')msg='Password troppo corta (minimo 6 caratteri).';
      else if(e.code==='auth/invalid-email')msg='Email non valida.';
      else if(e.code==='auth/network-request-failed')msg='Connessione di rete non disponibile.';
    }
    return {ok:false,error:msg};
  }
}

/* ================================================================
   HELPERS
================================================================ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function catById(id){return state.categories.find(function(c){return c.id===id;})||state.categories[state.categories.length-1];}
function accById(id){return state.accounts.find(function(a){return a.id===id;})||state.accounts[0];}
function tagById(id){return state.tags.find(function(t){return t.id===id;});}
function colorHex(i){return COLORS[((i%8)+8)%8];}
function tagBg(i){return TAG_BG[((i%8)+8)%8];}
function tagFg(i){return TAG_FG[((i%8)+8)%8];}
function catsByType(type){return state.categories.filter(function(c){return c.type===type;});}

function fmt(n){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0);}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function yesterdayISO(){var d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function isToday(iso){return iso===todayISO();}
function isYesterday(iso){return iso===yesterdayISO();}
function currentMonthKey(){return todayISO().slice(0,7);}
function shiftMonth(key,delta){var p=key.split('-');var y=+p[0],m=+p[1]+delta;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return y+'-'+String(m).padStart(2,'0');}
function formatMonthLabel(key){var p=key.split('-');var d=new Date(+p[0],+p[1]-1,1);var l=new Intl.DateTimeFormat('it-IT',{month:'long',year:'numeric'}).format(d);return l.charAt(0).toUpperCase()+l.slice(1);}
function formatDayHeader(iso){var d=new Date(iso+'T00:00:00');var l=new Intl.DateTimeFormat('it-IT',{weekday:'short',day:'numeric',month:'long'}).format(d);return l.charAt(0).toUpperCase()+l.slice(1);}
function formatShortDate(iso){var d=new Date(iso+'T00:00:00');return new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'short'}).format(d);}
function formatMonthShort(idx){return MONTH_ABBREVS[idx];}

function parseAmount(raw){
  if(raw==null)return NaN;
  var s=String(raw).trim();if(!s)return NaN;
  var neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  s=s.replace(/[€$\s]/g,'');
  if(s[0]==='-'){neg=true;s=s.slice(1);}else if(s[0]==='+')s=s.slice(1);
  var lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>-1&&ld>-1){if(lc>ld)s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');}
  else if(lc>-1){if(s.length-lc-1===3&&s.indexOf(',')===lc)s=s.replace(',','');else s=s.replace(',','.');}
  else if(ld>-1){if(s.length-ld-1===3&&s.indexOf('.')===ld)s=s.replace('.','')}
  var n=parseFloat(s);return isNaN(n)?NaN:(neg?-n:n);
}
function parseDateFlexible(str){
  if(!str)return null;
  str=String(str).trim();
  var m=str.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=str.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{4})/);
  if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return null;
}
function splitCSV(line,d){var out=[],cur='',inQ=false;for(var i=0;i<line.length;i++){var c=line[i];if(inQ){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++;}else inQ=false;}else cur+=c;}else{if(c==='"')inQ=true;else if(c===d){out.push(cur);cur='';}else cur+=c;}}out.push(cur);return out.map(function(s){return s.trim();});}
function detectDelim(h){var s=(h.match(/;/g)||[]).length,c=(h.match(/,/g)||[]).length,t=(h.match(/\t/g)||[]).length;if(t>s&&t>c)return '\t';return s>=c?';':',';}
function guessColMap(headers){var lo=headers.map(function(h){return h.toLowerCase();});function fi(kw){for(var i=0;i<lo.length;i++)if(kw.some(function(k){return lo[i].indexOf(k)>-1}))return i;return -1;}return{date:fi(['data','date']),description:fi(['descrizione','causale','description','memo','dettag']),amount:fi(['importo','amount','valore'])};}
function guessCat(desc,type){var d=(desc||'').toLowerCase(),map=type==='income'?INCOME_KW:EXPENSE_KW;for(var cat in map){var ws=map[cat];for(var i=0;i<ws.length;i++)if(d.indexOf(ws[i])>-1)return cat;}return type==='income'?'altro_entrata':'altro';}

================================================================ */
function filteredTx(monthKey,accFilter,catFilter,typeFilter){
  return state.transactions.filter(function(t){
    if(t.date.slice(0,7)!==monthKey)return false;
    if(accFilter&&accFilter!=='all'&&t.accountId!==accFilter)return false;
    if(catFilter&&catFilter!=='all'&&t.categoryId!==catFilter)return false;
    if(typeFilter&&typeFilter!=='all'&&t.type!==typeFilter)return false;
    return true;
  });
}
function totalOf(list){return list.reduce(function(s,e){return s+e.amount;},0);}
function breakdown(list){
  var map={};list.forEach(function(e){map[e.categoryId]=(map[e.categoryId]||0)+e.amount;});
  var tot=totalOf(list);
  return Object.keys(map).map(function(id){return{catId:id,total:map[id],pct:tot>0?map[id]/tot*100:0};}).sort(function(a,b){return b.total-a.total;});
}
function periodTotals(monthKey,accFilter){
  var inc=totalOf(filteredTx(monthKey,accFilter,'all','income'));
  var exp=totalOf(filteredTx(monthKey,accFilter,'all','expense'));
  return{income:inc,expense:exp,net:inc-exp};
}
function accBalance(accId){
  var b=0;
  state.transactions.forEach(function(t){if(t.accountId!==accId)return;b+=t.type==='income'?t.amount:-t.amount;});
  state.transfers.forEach(function(tr){if(tr.fromAccountId===accId)b-=tr.amount;if(tr.toAccountId===accId)b+=tr.amount;});
  return b;
}
function accMonthExp(accId){return totalOf(filteredTx(currentMonthKey(),accId,'all','expense'));}
function annualData(year,accFilter){
  var incM=new Array(12).fill(0),expM=new Array(12).fill(0),catExp={},catInc={};
  state.transactions.forEach(function(t){
    if(t.date.slice(0,4)!==String(year))return;
    if(accFilter!=='all'&&t.accountId!==accFilter)return;
    var m=parseInt(t.date.slice(5,7),10)-1;
    if(t.type==='income'){incM[m]+=t.amount;catInc[t.categoryId]=(catInc[t.categoryId]||0)+t.amount;}
    else{expM[m]+=t.amount;catExp[t.categoryId]=(catExp[t.categoryId]||0)+t.amount;}
  });
  var totInc=incM.reduce(function(a,b){return a+b;},0);
  var totExp=expM.reduce(function(a,b){return a+b;},0);
  return{incomeByMonth:incM,expenseByMonth:expM,totalIncome:totInc,totalExpense:totExp,net:totInc-totExp,catExp:catExp,catInc:catInc};
}
function combinedEntries(monthKey,accFilter,catFilter,typeFilter,tagFilter){
  var out=[];
  if(typeFilter!=='transfer'){
    filteredTx(monthKey,accFilter,catFilter,typeFilter==='all'?'all':typeFilter).filter(function(t){
      if(!tagFilter)return true;return t.tags&&t.tags.indexOf(tagFilter)>-1;
    }).forEach(function(t){out.push({kind:'tx',date:t.date,createdAt:t.createdAt,data:t});});
  }
  if((typeFilter==='all'||typeFilter==='transfer')&&(!catFilter||catFilter==='all')){
    state.transfers.filter(function(tr){
      if(tr.date.slice(0,7)!==monthKey)return false;
      if(accFilter!=='all'&&tr.fromAccountId!==accFilter&&tr.toAccountId!==accFilter)return false;
      if(tagFilter)return tr.tags&&tr.tags.indexOf(tagFilter)>-1;
      return true;
    }).forEach(function(tr){out.push({kind:'transfer',date:tr.date,createdAt:tr.createdAt,data:tr});});
  }
  out.sort(function(a,b){return(b.date+(b.createdAt||0))>(a.date+(a.createdAt||0))?1:-1;});
  return out;
}
function allEntries(){
  var out=state.transactions.map(function(t){return{kind:'tx',date:t.date,createdAt:t.createdAt,data:t};})
    .concat(state.transfers.map(function(tr){return{kind:'transfer',date:tr.date,createdAt:tr.createdAt,data:tr};}));
  out.sort(function(a,b){return(b.date+(b.createdAt||0))>(a.date+(a.createdAt||0))?1:-1;});
  return out;
}
function recentEntries(n){return allEntries().slice(0,n);}
function searchEntries(query){
  if(!query||!query.trim())return recentEntries(20);
  var q=query.toLowerCase().trim();
  return allEntries().filter(function(entry){
    if(entry.kind==='tx'){
      var t=entry.data,cat=catById(t.categoryId),acc=accById(t.accountId);
      if((t.note||'').toLowerCase().indexOf(q)>-1)return true;
      if(cat.name.toLowerCase().indexOf(q)>-1)return true;
      if(acc.name.toLowerCase().indexOf(q)>-1)return true;
      if(t.amount.toFixed(2).replace('.',',').indexOf(q)>-1)return true;
      if(t.tags){for(var i=0;i<t.tags.length;i++){var tg=tagById(t.tags[i]);if(tg&&tg.name.toLowerCase().indexOf(q)>-1)return true;}}
      return false;
    }else{
      var tr=entry.data,fa=accById(tr.fromAccountId),ta=accById(tr.toAccountId);
      if((tr.note||'').toLowerCase().indexOf(q)>-1)return true;
      if(fa.name.toLowerCase().indexOf(q)>-1)return true;
      if(ta.name.toLowerCase().indexOf(q)>-1)return true;
      if(tr.amount.toFixed(2).replace('.',',').indexOf(q)>-1)return true;
      if(tr.tags){for(var i=0;i<tr.tags.length;i++){var tg=tagById(tr.tags[i]);if(tg&&tg.name.toLowerCase().indexOf(q)>-1)return true;}}
      return false;
    }
  });
}

function donutSVG(bd){
  var sz=110,sw=18,r=(sz-sw)/2,ci=2*Math.PI*r,cx=sz/2,cy=sz/2;
  if(!bd.length)return '<svg viewBox="0 0 '+sz+' '+sz+'" class="donut"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#E1E4DE" stroke-width="'+sw+'"/></svg>';
  var off=0,circles='';
  bd.forEach(function(b){var cat=catById(b.catId),len=(b.pct/100)*ci;circles+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colorHex(cat.color)+'" stroke-width="'+sw+'" stroke-dasharray="'+len.toFixed(2)+' '+(ci-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')" stroke-linecap="butt"/>';off+=len;});
  return '<svg viewBox="0 0 '+sz+' '+sz+'" class="donut">'+circles+'</svg>';
}

function barChartSVG(incM,expM){
  var W=360,H=160,BTM=20,TOP=8,chartH=H-BTM-TOP;
  var maxVal=Math.max.apply(null,[1].concat(incM).concat(expM));
  var gW=W/12,bW=11,gap=2,circles='';
  for(var i=0;i<12;i++){
    var x=i*gW,gx=x+(gW-bW*2-gap)/2;
    var ih=(incM[i]/maxVal)*chartH,eh=(expM[i]/maxVal)*chartH;
    var baseY=TOP+chartH;
    if(ih>0)circles+='<rect x="'+gx.toFixed(1)+'" y="'+(baseY-ih).toFixed(1)+'" width="'+bW+'" height="'+ih.toFixed(1)+'" rx="3" fill="var(--accent)"/>';
    if(eh>0)circles+='<rect x="'+(gx+bW+gap).toFixed(1)+'" y="'+(baseY-eh).toFixed(1)+'" width="'+bW+'" height="'+eh.toFixed(1)+'" rx="3" fill="var(--red)"/>';
    circles+='<text x="'+(x+gW/2).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" font-size="9" fill="var(--ink-faint)">'+MONTH_ABBREVS[i]+'</text>';
  }
  var baseY2=TOP+chartH;
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%"><line x1="0" y1="'+baseY2+'" x2="'+W+'" y2="'+baseY2+'" stroke="var(--border)" stroke-width="1"/>'+circles+'</svg>';
}

function tagBadgesHTML(tags){

    return '<span class="tag-badge" style="background:'+tagBg(t.color)+';color:'+tagFg(t.color)+'">'+esc(t.name)+'</span>';
  }).join('');
  var more=tags.length>3?'<span class="tag-badge" style="background:var(--border);color:var(--ink-soft)">+' +(tags.length-3)+'</span>':'';
  return '<div class="tags-row">'+shown+more+'</div>';
}

================================================================ */
var lastUsedAccId=null,lastUsedMode='expense';

function openEntrySheet(opts){
  opts=opts||{};
  var editTx=opts.txId?state.transactions.find(function(t){return t.id===opts.txId;}):null;
  var editTr=opts.transferId?state.transfers.find(function(t){return t.id===opts.transferId;}):null;
  if(!editTx&&!editTr&&opts.mode==='transfer'&&state.accounts.length<2){showToast('Servono almeno 2 conti per un trasferimento');return;}
  var entry={
    mode:editTx?editTx.type:(editTr?'transfer':(opts.mode||lastUsedMode)),
    amountStr:editTx?editTx.amount.toFixed(2).replace('.',','):(editTr?editTr.amount.toFixed(2).replace('.',','):''),
    accountId:editTx?editTx.accountId:(lastUsedAccId&&state.accounts.some(function(a){return a.id===lastUsedAccId;})?lastUsedAccId:state.accounts[0].id),
    categoryId:editTx?editTx.categoryId:null,
    fromAccountId:editTr?editTr.fromAccountId:state.accounts[0].id,
    toAccountId:editTr?editTr.toAccountId:(state.accounts[1]?state.accounts[1].id:state.accounts[0].id),
    note:editTx?(editTx.note||''):(editTr?(editTr.note||''):''),
    date:editTx?editTx.date:(editTr?editTr.date:todayISO()),
    tags:editTx?(editTx.tags||[]).slice():(editTr?(editTr.tags||[]).slice():[]),
    showTagForm:false,newTagName:'',newTagColor:0,
    isEditTx:!!editTx,isEditTr:!!editTr
  };
  if(!entry.categoryId){var fc=catsByType(entry.mode==='income'?'income':'expense')[0];entry.categoryId=fc?fc.id:null;}
  if(entry.fromAccountId===entry.toAccountId&&state.accounts.length>1){var alt=state.accounts.find(function(a){return a.id!==entry.fromAccountId;});if(alt)entry.toAccountId=alt.id;}

  function accChips(selId,attr){return state.accounts.map(function(a){return'<button class="chip'+(a.id===selId?' selected':'')+'" data-'+attr+'="'+a.id+'"><span class="dot" style="background:'+colorHex(a.color)+'"></span>'+esc(a.name)+'</button>';}).join('');}
  function catChips(){return catsByType(entry.mode==='income'?'income':'expense').map(function(c){return'<button class="chip'+(c.id===entry.categoryId?' selected':'')+'" data-sel-cat="'+c.id+'"><span class="dot" style="background:'+colorHex(c.color)+'"></span>'+esc(c.emoji)+' '+esc(c.name)+'</button>';}).join('');}
  function ticketClass(){return'ticket'+(entry.mode==='income'?' ticket-income':entry.mode==='transfer'?' ticket-transfer':'');}
  function ticketLabel(){if(entry.mode==='transfer')return entry.isEditTr?'Modifica trasferimento':'Nuovo trasferimento';if(entry.mode==='income')return entry.isEditTx?'Modifica entrata':'Nuova entrata';return entry.isEditTx?'Modifica spesa':'Nuova spesa';}
  function amountPrefix(){return entry.mode==='income'?'+ € ':'€ ';}
  function saveLabel(){if(entry.mode==='transfer')return'Salva trasferimento';if(entry.mode==='income')return'Salva entrata';return'Salva spesa';}

  function tagSectionHTML(){
    var h='<div id="tagSection" class="field-group"><label class="field-label">Tag</label><div class="tag-picker-row">';
    state.tags.forEach(function(t){var sel=entry.tags.indexOf(t.id)>-1;h+='<button class="chip sm'+(sel?' selected':'')+'" data-tag-tog="'+t.id+'"><span class="dot" style="background:'+colorHex(t.color)+'"></span>'+esc(t.name)+'</button>';});
    h+='<button class="chip sm" id="newTagBtn">+ Nuovo</button></div>';
    if(entry.showTagForm){
      h+='<div class="new-tag-card"><input id="newTagNameInp" class="text-input" placeholder="Nome tag" value="'+esc(entry.newTagName)+'"><div class="color-dots-row">'+COLORS.map(function(c,i){return'<button class="color-dot'+(entry.newTagColor===i?' active':'')+'" data-tag-color="'+i+'" style="background:'+c+';"></button>';}).join('')+'</div><div style="display:flex;gap:8px;"><button class="btn-primary-sm" id="createTagBtn">Aggiungi tag</button><button class="btn-secondary" style="padding:10px 14px;font-size:13px;" id="cancelTagBtn">Annulla</button></div></div>';
    }
    h+='</div>';
    return h;
  }

  function dateRowHTML(){
    return '<div class="field-group"><label class="field-label">Data</label><div class="date-quick-row"><button class="chip sm'+(isToday(entry.date)?' selected':'')+'" data-qdate="today">📅 Oggi</button><button class="chip sm'+(isYesterday(entry.date)?' selected':'')+'" data-qdate="yesterday">📅 Ieri</button><input type="date" id="entryDate" class="text-input" value="'+entry.date+'"></div></div>';
  }

  function bodyHTML(){
    var delBtn='';
    if(entry.isEditTx)delBtn='<button class="btn-danger full-width" id="delEntryBtn">Elimina movimento</button>';
    if(entry.isEditTr)delBtn='<button class="btn-danger full-width" id="delEntryBtn">Elimina trasferimento</button>';
    if(entry.mode==='transfer'){
      return '<div class="field-group"><label class="field-label">Da</label><div class="chip-row" id="fromChips">'+accChips(entry.fromAccountId,'sel-from')+'</div></div>'+
        '<div class="swap-hint">⇅ sposta il saldo tra conti senza influire sul bilancio</div>'+
        '<div class="field-group"><label class="field-label">A</label><div class="chip-row" id="toChips">'+accChips(entry.toAccountId,'sel-to')+'</div></div>'+
        dateRowHTML()+tagSectionHTML()+
        '<div class="field-group"><label class="field-label">Nota (opzionale)</label><input type="text" id="entryNote" class="text-input" value="'+esc(entry.note)+'" placeholder="Es. Accantonamento risparmi"></div>'+
        delBtn+'<button class="btn-primary full-width sticky-save" id="saveEntryBtn" disabled>'+saveLabel()+'</button>';
    }
    return '<div class="field-group"><label class="field-label">Conto</label><div class="chip-row" id="accountChips">'+accChips(entry.accountId,'sel-account')+'</div></div>'+
      '<div class="field-group"><label class="field-label">Categoria</label><div class="chip-row wrap" id="catChips">'+catChips()+'</div></div>'+
      dateRowHTML()+tagSectionHTML()+
      '<div class="field-group"><label class="field-label">Nota (opzionale)</label><input type="text" id="entryNote" class="text-input" value="'+esc(entry.note)+'" placeholder="Es. Spesa al supermercato"></div>'+
      delBtn+'<button class="btn-primary full-width sticky-save" id="saveEntryBtn" disabled>'+saveLabel()+'</button>';
  }

  function modeToggleHTML(){
    if(entry.isEditTr)return '';
    if(entry.isEditTx)return '<div class="segmented"><button class="'+(entry.mode==='expense'?'active':'')+'" data-mode="expense">Spesa</button><button class="'+(entry.mode==='income'?'active mode-income':'')+'" data-mode="income">Entrata</button></div>';
    return '<div class="segmented"><button class="'+(entry.mode==='expense'?'active':'')+'" data-mode="expense">Spesa</button><button class="'+(entry.mode==='income'?'active mode-income':'')+'" data-mode="income">Entrata</button><button class="'+(entry.mode==='transfer'?'active mode-transfer':'')+'" data-mode="transfer" '+(state.accounts.length<2?'disabled':'')+'>Trasferimento</button></div>';
  }

  function fullHTML(){
    return '<div class="sheet entry-sheet">'+
      '<div class="sheet-handle"></div>'+modeToggleHTML()+
      '<div class="'+ticketClass()+'"><button class="icon-btn ticket-close" id="closeEntryModal">✕</button><div class="ticket-label">'+esc(ticketLabel())+'</div><div class="ticket-amount" id="amtDisplay">'+amountPrefix()+(entry.amountStr||'0,00')+'</div></div>'+
      '<div class="keypad">'+['1','2','3','4','5','6','7','8','9',',','0','⌫'].map(function(k){return'<button type="button" class="key" data-key="'+k+'">'+k+'</button>';}).join('')+'</div>'+
      '<div id="entryBody" style="display:flex;flex-direction:column;gap:16px;">'+bodyHTML()+'</div>'+
    '</div>';
  }

  function refreshSaveBtn(){
    var n=parseAmount(entry.amountStr.replace(',','.'));
    var ok=n>0;
    if(entry.mode==='transfer'&&entry.fromAccountId===entry.toAccountId)ok=false;
    var btn=document.getElementById('saveEntryBtn');if(btn)btn.disabled=!ok;
    var disp=document.getElementById('amtDisplay');if(disp)disp.textContent=amountPrefix()+(entry.amountStr||'0,00');
  }

  function wireTagSection(){
    document.querySelectorAll('[data-tag-tog]').forEach(function(b){b.onclick=function(){var id=b.dataset.tagTog;var idx=entry.tags.indexOf(id);if(idx>-1)entry.tags.splice(idx,1);else entry.tags.push(id);var el=document.getElementById('tagSection');if(el)el.outerHTML=tagSectionHTML();wireTagSection();};});
    var ntb=document.getElementById('newTagBtn');if(ntb)ntb.onclick=function(){entry.showTagForm=true;var el=document.getElementById('tagSection');if(el)el.outerHTML=tagSectionHTML();wireTagSection();setTimeout(function(){var ni=document.getElementById('newTagNameInp');if(ni)ni.focus();},50);};
    var ni=document.getElementById('newTagNameInp');if(ni)ni.oninput=function(){entry.newTagName=ni.value;};
    document.querySelectorAll('[data-tag-color]').forEach(function(dot){dot.onclick=function(){entry.newTagColor=parseInt(dot.dataset.tagColor,10);document.querySelectorAll('.color-dot').forEach(function(d){d.classList.toggle('active',d===dot);});};});
    var ctb=document.getElementById('createTagBtn');
    if(ctb)ctb.onclick=function(){var n=(document.getElementById('newTagNameInp').value||'').trim();if(!n){showToast('Dai un nome al tag');return;}var t={id:uid('tag'),name:n,color:entry.newTagColor};state.tags.push(t);entry.tags.push(t.id);entry.showTagForm=false;entry.newTagName='';entry.newTagColor=0;saveState();var el=document.getElementById('tagSection');if(el)el.outerHTML=tagSectionHTML();wireTagSection();};
    var canb=document.getElementById('cancelTagBtn');if(canb)canb.onclick=function(){entry.showTagForm=false;entry.newTagName='';var el=document.getElementById('tagSection');if(el)el.outerHTML=tagSectionHTML();wireTagSection();};
  }

  function wireBody(){
    var noteInp=document.getElementById('entryNote');if(noteInp)noteInp.oninput=function(){entry.note=noteInp.value;};
    var dateInp=document.getElementById('entryDate');
    if(dateInp){
      dateInp.onchange=function(){entry.date=dateInp.value||todayISO();document.querySelectorAll('[data-qdate]').forEach(function(b){b.classList.toggle('selected',(b.dataset.qdate==='today'&&isToday(entry.date))||(b.dataset.qdate==='yesterday'&&isYesterday(entry.date)));});};
    }
    document.querySelectorAll('[data-qdate]').forEach(function(b){b.onclick=function(){entry.date=b.dataset.qdate==='today'?todayISO():yesterdayISO();if(dateInp)dateInp.value=entry.date;document.querySelectorAll('[data-qdate]').forEach(function(q){q.classList.toggle('selected',(q.dataset.qdate==='today'&&isToday(entry.date))||(q.dataset.qdate==='yesterday'&&isYesterday(entry.date)));});};});
    if(entry.mode==='transfer'){
      document.querySelectorAll('[data-sel-from]').forEach(function(b){b.onclick=function(){entry.fromAccountId=b.dataset.selFrom;if(entry.fromAccountId===entry.toAccountId){var alt=state.accounts.find(function(a){return a.id!==entry.fromAccountId;});if(alt)entry.toAccountId=alt.id;}var bd=document.getElementById('entryBody');if(bd){bd.innerHTML=bodyHTML();wireBody();}refreshSaveBtn();};});
      document.querySelectorAll('[data-sel-to]').forEach(function(b){b.onclick=function(){entry.toAccountId=b.dataset.selTo;document.querySelectorAll('[data-sel-to]').forEach(function(q){q.classList.toggle('selected',q===b);});refreshSaveBtn();};});
    }else{
      document.querySelectorAll('[data-sel-account]').forEach(function(b){b.onclick=function(){entry.accountId=b.dataset.selAccount;document.querySelectorAll('[data-sel-account]').forEach(function(q){q.classList.toggle('selected',q===b);});};});
      document.querySelectorAll('[data-sel-cat]').forEach(function(b){b.onclick=function(){entry.categoryId=b.dataset.selCat;document.querySelectorAll('[data-sel-cat]').forEach(function(q){q.classList.toggle('selected',q===b);});};});
    }
    wireTagSection();
    var delBtn=document.getElementById('delEntryBtn');
    if(delBtn)delBtn.onclick=function(){
      if(entry.isEditTx)confirmDialog('Eliminare questo movimento?',function(){state.transactions=state.transactions.filter(function(t){return t.id!==editTx.id;});saveState();closeModal();showToast('Eliminato');renderActiveTab();},'Elimina');
      else if(entry.isEditTr)confirmDialog('Eliminare questo trasferimento?',function(){state.transfers=state.transfers.filter(function(t){return t.id!==editTr.id;});saveState();closeModal();showToast('Eliminato');renderActiveTab();},'Elimina');
    };
    var saveBtn=document.getElementById('saveEntryBtn');
    if(saveBtn)saveBtn.onclick=function(){
      var amount=parseAmount(entry.amountStr.replace(',','.'));if(!(amount>0))return;
      var date=entry.date||todayISO();
      if(entry.mode==='transfer'){
        if(entry.fromAccountId===entry.toAccountId){showToast('Scegli due conti diversi');return;}
        if(entry.isEditTr){editTr.amount=amount;editTr.fromAccountId=entry.fromAccountId;editTr.toAccountId=entry.toAccountId;editTr.note=entry.note;editTr.date=date;editTr.tags=entry.tags.slice();}
        else state.transfers.push({id:uid('trf'),amount:amount,fromAccountId:entry.fromAccountId,toAccountId:entry.toAccountId,note:entry.note,date:date,tags:entry.tags.slice(),createdAt:Date.now()});
        lastUsedMode='transfer';
      }else{
        lastUsedAccId=entry.accountId;lastUsedMode=entry.mode;
        if(entry.isEditTx){editTx.amount=amount;editTx.accountId=entry.accountId;editTx.categoryId=entry.categoryId;editTx.note=entry.note;editTx.date=date;editTx.type=entry.mode;editTx.tags=entry.tags.slice();}
        else state.transactions.push({id:uid('tx'),type:entry.mode,amount:amount,accountId:entry.accountId,categoryId:entry.categoryId,note:entry.note,date:date,tags:entry.tags.slice(),createdAt:Date.now()});
      }
      saveState();closeModal();showToast(entry.isEditTx||entry.isEditTr?'Aggiornato':'Salvato');renderActiveTab();
    };
  }

  function wireAll(){
    document.getElementById('closeEntryModal').onclick=closeModal;
    document.getElementById('modalBackdrop').onclick=closeModal;
    document.querySelectorAll('.key').forEach(function(btn){btn.onclick=function(){
      var k=btn.dataset.key;
      if(k==='⌫')entry.amountStr=entry.amountStr.slice(0,-1);
      else if(k===','){if(entry.amountStr.indexOf(',')===-1)entry.amountStr+=',';}
      else{
        if(entry.amountStr.indexOf(',')>-1&&entry.amountStr.split(',')[1].length>=2)return;
        if(entry.amountStr.replace(',','').length>=7)return;
        if(entry.amountStr==='0')entry.amountStr=k;else entry.amountStr+=k;
      }
      refreshSaveBtn();
    };});
    document.querySelectorAll('[data-mode]').forEach(function(b){if(b.disabled)return;b.onclick=function(){
      if(b.dataset.mode===entry.mode)return;
      entry.mode=b.dataset.mode;
      if(entry.mode!=='transfer'){var fc=catsByType(entry.mode==='income'?'income':'expense');if(!fc.some(function(c){return c.id===entry.categoryId;}))entry.categoryId=fc[0]?fc[0].id:null;}
      render();
    };});
    wireBody();refreshSaveBtn();
  }

  function render(){openModal(fullHTML());wireAll();}
  render();
}

function openSearchOverlay(){
  var query='';
  function resultsHTML(q){
    var entries=searchEntries(q);
    if(!entries.length)return'<p class="search-meta">Nessun risultato'+(q?' per "'+esc(q)+'"':'')+'.</p>';
    var label=q?entries.length+' '+(entries.length===1?'risultato':'risultati'):'Movimenti recenti';
    var groups=[],lastDate=null;
    entries.forEach(function(e){if(e.date!==lastDate){groups.push({date:e.date,items:[]});lastDate=e.date;}groups[groups.length-1].items.push(e);});
    return'<p class="search-meta">'+esc(label)+'</p>'+groups.map(function(g){return'<div class="day-header">'+formatDayHeader(g.date)+'</div><div class="card" style="padding:4px 14px;">'+g.items.map(entryRowHTML).join('')+'</div>';}).join('');
  }
  function html(){
    return'<div class="search-overlay">'+
      '<div class="search-bar"><button class="search-close-btn" id="searchClose">←</button><input id="searchInput" class="search-input-el" placeholder="Cerca movimenti, categorie, tag…" type="search" autocomplete="off" value="'+esc(query)+'"><button class="search-close-btn" id="searchClear" style="'+(query?'':'display:none;')+'">✕</button></div>'+
      '<div class="search-content" id="searchResults">'+resultsHTML(query)+'</div>'+
    '</div>';
  }
  var root=document.getElementById('modal-root');
  root.innerHTML='<div class="modal-backdrop" id="modalBackdrop" style="opacity:0;pointer-events:none;"></div>'+html();
  root.classList.add('open');
  var inp=document.getElementById('searchInput');
  if(inp){inp.focus();inp.setSelectionRange(query.length,query.length);}
  var debounce=null;
  function updateResults(){
    var res=document.getElementById('searchResults');
    if(res){res.innerHTML=resultsHTML(query);wireEntryRows(res);var cl=document.getElementById('searchClear');if(cl)cl.style.display=query?'':'none';}
  }
  function wireSearch(){
    var inp=document.getElementById('searchInput');
    if(inp)inp.oninput=function(){query=inp.value;clearTimeout(debounce);debounce=setTimeout(updateResults,150);};
    var cl=document.getElementById('searchClose');if(cl)cl.onclick=closeModal;
    var clx=document.getElementById('searchClear');if(clx)clx.onclick=function(){query='';inp.value='';updateResults();inp.focus();};
    wireEntryRows(document.getElementById('searchResults'));
  }
  wireSearch();
}

================================================================ */
function openSyncModal(){
  var cfg=loadSyncConfig();
  var m={
    step: cfg&&cfg.firebaseConfig?2:1,
    configText: cfg&&cfg.firebaseConfig?JSON.stringify(cfg.firebaseConfig,null,2):'',
    parsedConfig: cfg&&cfg.firebaseConfig?cfg.firebaseConfig:null,
    mode:'login',
    email:cfg&&cfg.email?cfg.email:'',
    password:'',
    errorMsg:null,
    busy:false
  };

  function renderStep(){
    var r=document.querySelector('#modal-root .sheet-wrap');
    if(r){r.innerHTML=stepHTML();wireStep();}
  }
  function stepDots(){var h='<div class="step-dots">';for(var i=1;i<=2;i++)h+='<span class="step-dot'+(i===m.step?' active':'')+'"></span>';return h+'</div>';}

  function step1HTML(){
    return '<div class="sheet">'+stepDots()+
      '<h3 style="margin:4px 0 0;">Configura Firebase</h3>'+
      '<p class="hint">Incolla qui l\'oggetto <code>firebaseConfig</code> che trovi nella pagina delle impostazioni del tuo progetto Firebase (Impostazioni progetto → Generali → Le tue app → configurazione SDK).</p>'+
      '<textarea class="text-input" id="syncConfigInput" placeholder="{ apiKey: &quot;...&quot;, authDomain: &quot;...&quot;, projectId: &quot;...&quot;, ... }">'+esc(m.configText)+'</textarea>'+
      (m.errorMsg?'<p class="hint" style="color:var(--red);">'+esc(m.errorMsg)+'</p>':'')+
      '<button class="btn-primary full-width" id="syncNext1">Continua</button>'+
      '<button class="btn-secondary full-width" id="syncCancel1">Annulla</button>'+
    '</div>';
  }
  function step2HTML(){
    return '<div class="sheet">'+stepDots()+
      '<h3 style="margin:4px 0 0;">Accedi alla sincronizzazione</h3>'+
      '<div class="segmented"><button class="'+(m.mode==='login'?'active':'')+'" data-sync-mode="login">Accedi</button><button class="'+(m.mode==='signup'?'active mode-income':'')+'" data-sync-mode="signup">Crea account</button></div>'+
      '<p class="hint">'+(m.mode==='signup'?'Crea le credenziali la prima volta, da questo dispositivo. Userai le stesse email e password per accedere dagli altri dispositivi.':'Usa le stesse email e password create sul primo dispositivo.')+'</p>'+
      '<div class="field-group"><label class="field-label">Email</label><input type="email" class="text-input" id="syncEmail" value="'+esc(m.email)+'" autocomplete="email"></div>'+
      '<div class="field-group"><label class="field-label">Password</label><input type="password" class="text-input" id="syncPassword" autocomplete="'+(m.mode==='signup'?'new-password':'current-password')+'" placeholder="'+(m.mode==='signup'?'Almeno 6 caratteri':'')+'"></div>'+
      (m.errorMsg?'<p class="hint" style="color:var(--red);">⚠️ '+esc(m.errorMsg)+'</p>':'')+
      '<button class="btn-primary full-width" id="syncSubmit" '+(m.busy?'disabled':'')+'>'+(m.busy?'Connessione…':(m.mode==='signup'?'Crea account e connetti':'Accedi'))+'</button>'+
      '<button class="btn-secondary full-width" id="syncBack2">Indietro</button>'+
    '</div>';
  }
  function stepHTML(){return m.step===1?step1HTML():step2HTML();}

  function wireStep(){
    var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;
    if(m.step===1){
      document.getElementById('syncCancel1').onclick=closeModal;
      document.getElementById('syncNext1').onclick=function(){
        var raw=document.getElementById('syncConfigInput').value;
        var parsed=parseFirebaseConfigInput(raw);
        if(!parsed){m.errorMsg='Configurazione non valida: assicurati di aver incollato l\'intero oggetto con apiKey e projectId.';renderStep();return;}
        m.parsedConfig=parsed;m.configText=raw;m.errorMsg=null;m.step=2;renderStep();
      };
    }else{
      document.querySelectorAll('[data-sync-mode]').forEach(function(b){b.onclick=function(){m.mode=b.dataset.syncMode;m.errorMsg=null;renderStep();};});
      document.getElementById('syncBack2').onclick=function(){m.step=1;renderStep();};
      document.getElementById('syncSubmit').onclick=async function(){
        var email=document.getElementById('syncEmail').value.trim();
        var password=document.getElementById('syncPassword').value;
        if(!email||!password){m.errorMsg='Inserisci email e password.';renderStep();return;}
        m.email=email;m.password=password;m.busy=true;m.errorMsg=null;renderStep();
        var res=await connectSyncWithCredentials(m.parsedConfig,email,password,m.mode);
        m.busy=false;
        if(res.ok){closeModal();showToast('Sincronizzazione connessa');renderActiveTab();}
        else{m.errorMsg=res.error;renderStep();}
      };
    }
  }

  openModal('<div class="sheet"></div>');
  renderStep();
}

function openImportModal(){
  var imp={step:1,accountId:state.accounts[0].id,rawText:'',hasHeader:true,delimiter:';',headers:[],mapping:{date:0,description:1,amount:2},mappingGuessed:false,parsed:[]};
  function renderStep(){var r=document.querySelector('#modal-root .sheet-wrap');if(r){r.innerHTML=stepHTML();wireStep();}}
  function stepDots(){var h='<div class="step-dots">';for(var i=1;i<=3;i++)h+='<span class="step-dot'+(i===imp.step?' active':'')+'"></span>';return h+'</div>';}
  function stepHTML(){return imp.step===1?step1():imp.step===2?step2():step3();}
  function step1(){var opts=state.accounts.map(function(a){return'<option value="'+a.id+'" '+(a.id===imp.accountId?'selected':'')+'>'+esc(a.name)+'</option>';}).join('');return'<div class="sheet">'+stepDots()+'<h3 style="margin:4px 0 0;">Importa estratto conto</h3><div class="field-group"><label class="field-label">Conto di destinazione</label><select class="select" id="impAcc">'+opts+'</select></div><div class="field-group"><label class="field-label">File CSV</label><input type="file" accept=".csv,text/csv,text/plain" id="impFile"></div><div class="field-group"><label class="field-label">Oppure incolla il contenuto</label><textarea class="text-input" id="impText" placeholder="data;descrizione;importo">'+esc(imp.rawText)+'</textarea></div><button class="btn-primary full-width" id="impNext1" disabled>Continua</button><button class="btn-secondary full-width" id="impCancel1">Annulla</button></div>';}
  function deriveHeaders(){var lines=imp.rawText.split(/\r?\n/).filter(function(l){return l.trim()!=='';});if(!lines.length)return;imp.delimiter=detectDelim(lines[0]);var first=splitCSV(lines[0],imp.delimiter);imp.headers=imp.hasHeader?first:first.map(function(_,i){return'Colonna '+(i+1);});if(!imp.mappingGuessed){var g=guessColMap(imp.hasHeader?first:[]);imp.mapping={date:g.date>-1?g.date:0,description:g.description>-1?g.description:1,amount:g.amount>-1?g.amount:(first.length-1)};imp.mappingGuessed=true;}}
  function step2(){deriveHeaders();function sel(f){return'<select class="select" data-map-field="'+f+'">'+imp.headers.map(function(h,i){return'<option value="'+i+'" '+(imp.mapping[f]===i?'selected':'')+'>'+esc(h)+'</option>';}).join('')+'</select>';}return'<div class="sheet">'+stepDots()+'<h3 style="margin:4px 0 0;">Associa le colonne</h3><label class="toggle-row"><span>Prima riga come intestazione</span><input type="checkbox" id="impHeader" '+(imp.hasHeader?'checked':'')+'></label><div class="field-group"><label class="field-label">Colonna data</label>'+sel('date')+'</div><div class="field-group"><label class="field-label">Colonna descrizione</label>'+sel('description')+'</div><div class="field-group"><label class="field-label">Colonna importo</label>'+sel('amount')+'</div><p class="hint">Importi negativi → spese. Positivi → entrate. Potrai correggere nel passo successivo.</p><button class="btn-primary full-width" id="impNext2">Continua</button><button class="btn-secondary full-width" id="impBack2">Indietro</button></div>';}
  function buildParsed(){var lines=imp.rawText.split(/\r?\n/).filter(function(l){return l.trim()!=='';});var out=[];for(var i=imp.hasHeader?1:0;i<lines.length;i++){var cols=splitCSV(lines[i],imp.delimiter);if(cols.length<=Math.max(imp.mapping.date,imp.mapping.description,imp.mapping.amount))continue;var ra=parseAmount(cols[imp.mapping.amount]);if(isNaN(ra)||ra===0)continue;var date=parseDateFlexible(cols[imp.mapping.date])||todayISO();var desc=cols[imp.mapping.description]||'';var type=ra<0?'expense':'income';out.push({id:uid('imp'),date:date,desc:desc,amount:Math.abs(ra),include:true,type:type,categoryId:guessCat(desc,type)});}imp.parsed=out;}
  function catOptsGrouped(sel){return'<optgroup label="Spese">'+catsByType('expense').map(function(c){return'<option value="'+c.id+'" '+(c.id===sel?'selected':'')+'>'+esc(c.emoji)+' '+esc(c.name)+'</option>';}).join('')+'</optgroup><optgroup label="Entrate">'+catsByType('income').map(function(c){return'<option value="'+c.id+'" '+(c.id===sel?'selected':'')+'>'+esc(c.emoji)+' '+esc(c.name)+'</option>';}).join('')+'</optgroup>';}
  function step3(){var cnt=imp.parsed.filter(function(r){return r.include;}).length;return'<div class="sheet">'+stepDots()+'<h3 style="margin:4px 0 0;">Controlla e importa</h3><p class="hint">'+imp.parsed.length+' righe · <strong id="impCnt">'+cnt+'</strong> pronte per "'+esc(accById(imp.accountId).name)+'"</p><div class="card import-table">'+(imp.parsed.length?imp.parsed.map(function(r,i){return'<div class="import-row-item"><input type="checkbox" data-inc="'+i+'" '+(r.include?'checked':'')+'><span class="imp-date">'+formatShortDate(r.date)+'</span><span class="imp-desc">'+esc(r.desc||'—')+'</span><span class="imp-amt'+(r.type==='income'?' amt-income':'')+'">'+(r.type==='income'?'+':'−')+fmt(r.amount)+'</span><select data-cat="'+i+'">'+catOptsGrouped(r.categoryId)+'</select></div>';}).join(''):'<p class="empty-note">Nessuna riga valida.</p>')+'</div><button class="btn-primary full-width" id="impConfirm" '+(cnt?'':'disabled')+'>Importa '+cnt+' movimenti</button><button class="btn-secondary full-width" id="impBack3">Indietro</button></div>';}
  function wireStep(){
    var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;
    if(imp.step===1){
      var fi=document.getElementById('impFile'),ta=document.getElementById('impText'),n1=document.getElementById('impNext1');
      function chk(){n1.disabled=!imp.rawText.trim();}
      fi.onchange=function(){var f=fi.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){imp.rawText=String(rd.result||'');ta.value=imp.rawText;chk();};rd.readAsText(f);};
      ta.oninput=function(){imp.rawText=ta.value;chk();};
      document.getElementById('impAcc').onchange=function(e){imp.accountId=e.target.value;};
      n1.onclick=function(){imp.step=2;renderStep();};
      document.getElementById('impCancel1').onclick=closeModal;chk();
    }else if(imp.step===2){
      document.getElementById('impHeader').onchange=function(e){imp.hasHeader=e.target.checked;renderStep();};
      document.querySelectorAll('[data-map-field]').forEach(function(s){s.onchange=function(){imp.mapping[s.dataset.mapField]=parseInt(s.value,10);};});
      document.getElementById('impNext2').onclick=function(){buildParsed();imp.step=3;renderStep();};
      document.getElementById('impBack2').onclick=function(){imp.step=1;renderStep();};
    }else{
      document.querySelectorAll('[data-inc]').forEach(function(c){c.onchange=function(){imp.parsed[+c.dataset.inc].include=c.checked;var cnt=imp.parsed.filter(function(r){return r.include;}).length;document.getElementById('impCnt').textContent=cnt;document.getElementById('impConfirm').textContent='Importa '+cnt+' movimenti';document.getElementById('impConfirm').disabled=!cnt;};});
      document.querySelectorAll('[data-cat]').forEach(function(s){s.onchange=function(){var idx=+s.dataset.cat,cat=catById(s.value);imp.parsed[idx].categoryId=s.value;imp.parsed[idx].type=cat.type;renderStep();};});
      document.getElementById('impBack3').onclick=function(){imp.step=2;renderStep();};
      document.getElementById('impConfirm').onclick=function(){
        imp.parsed.filter(function(r){return r.include;}).forEach(function(r){state.transactions.push({id:uid('tx'),type:r.type,amount:r.amount,accountId:imp.accountId,categoryId:r.categoryId,note:r.desc,date:r.date,tags:[],createdAt:Date.now()});});
        saveState();closeModal();showToast('Importati '+imp.parsed.filter(function(r){return r.include;}).length+' movimenti');renderActiveTab();
      };
    }
  }
  openModal('<div class="sheet"></div>');renderStep();
}

/* ================================================================
   INIT
================================================================ */
async function init(){
  await loadState();
  ui.viewMonth=currentMonthKey();
  document.getElementById('splash').classList.add('hidden');
  document.getElementById('shell').classList.remove('hidden');
  renderActiveTab();
  document.querySelectorAll('.nav-btn').forEach(function(b){b.onclick=function(){ui.activeTab=b.dataset.tab;renderActiveTab();};});
  document.getElementById('fabAdd').onclick=function(){openEntrySheet({mode:lastUsedMode});};
  document.getElementById('openSearch').onclick=openSearchOverlay;
  var hasWorkingStorage=usingClaudeStorage||(function(){try{window.localStorage.setItem('__t','1');window.localStorage.removeItem('__t');return true;}catch(e){return false;}})();
  if(!hasWorkingStorage)showToast('Salvataggio non disponibile in questa sessione');
  // NB: in questa build diagnostica NON registriamo il service worker,
  // così la pagina è sempre fresca e non serve svuotare cache.
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}).catch(function(){});
  }
  initSyncFromSavedConfig();
  initNativeNotificationBridge();
  dbgInit();
  dbgLog('App diagnostica avviata');
}

init();
})();
</script>
