/* ================================================================
   IMPORT DEI TUOI DATI (CSV · XLSX · PDF)
   Ogni file diventa una tabella; poi si decide quali colonne sono
   data / descrizione / importo, e come capire se è una spesa o un'entrata.
   Nulla viene salvato prima dell'anteprima riga per riga.
================================================================ */
function rowsFromCSV(text){
  var lines=String(text||'').split(/\r?\n/).filter(function(l){return l.trim()!=='';});
  if(!lines.length)return [];
  var d=detectDelim(lines[0]);
  return lines.map(function(l){return splitCSV(l,d);});
}
var KW_DATE=['data','date','giorno','valuta'];
var KW_DESC=['descrizione','causale','description','memo','dettag','operazione','beneficiario','esercente','note'];
var KW_AMT=['importo','amount','valore','somma','totale'];
var KW_OUT=['uscite','uscita','addebiti','addebito','dare','spese','spesa','pagamenti','debito','debit','withdraw','negativo'];
var KW_IN=['entrate','entrata','accrediti','accredito','avere','ricavi','credito','credit','deposit','positivo'];
var KW_TYPE=['tipo','type','segno','movimento','operazione','d/a','dare/avere'];
function hasKW(h,list){h=String(h||'').toLowerCase();return list.some(function(k){return h.indexOf(k)>-1;});}

/* Trova la riga di intestazione: nelle esportazioni bancarie spesso ci sono
   righe di titolo, intestatario, IBAN… prima della tabella vera. */
function findHeaderRow(rows){
  var limit=Math.min(rows.length,25);
  for(var i=0;i<limit;i++){
    var r=rows[i]||[];
    var score=0;
    if(r.some(function(c){return hasKW(c,KW_DATE);}))score++;
    if(r.some(function(c){return hasKW(c,KW_AMT)||hasKW(c,KW_OUT)||hasKW(c,KW_IN);}))score++;
    if(r.some(function(c){return hasKW(c,KW_DESC);}))score++;
    if(score>=2)return i;
  }
  return -1;
}
/* Quando l'intestazione non c'è (o non dice niente), si capiscono le colonne
   dal contenuto: dove ci sono date, dove ci sono soldi, dove c'è testo. */
function guessColMapByContent(rows,start){
  var cols=0;
  rows.forEach(function(r){cols=Math.max(cols,r.length);});
  var dateScore=[],moneyScore=[],textScore=[];
  for(var c=0;c<cols;c++){dateScore[c]=0;moneyScore[c]=0;textScore[c]=0;}
  var n=0;
  for(var i=start;i<rows.length&&n<200;i++,n++){
    var r=rows[i]||[];
    for(var c2=0;c2<cols;c2++){
      var v=String(r[c2]==null?'':r[c2]).trim();
      if(!v)continue;
      if(parseDateFlexible(v))dateScore[c2]++;
      else if(isMoneyCell(v)||(!isNaN(parseAmount(v))&&/[.,]\d{2}$/.test(v)))moneyScore[c2]++;
      else if(/[a-zA-Z]{3}/.test(v))textScore[c2]+=v.length;
    }
  }
  function best(arr){var bi=-1,bv=0;arr.forEach(function(v,i){if(v>bv){bv=v;bi=i;}});return bi;}
  var money=[];
  moneyScore.forEach(function(v,i){if(v>0)money.push({i:i,v:v});});
  money.sort(function(a,b){return b.v-a.v;});
  return{
    date:best(dateScore),
    description:best(textScore),
    amount:money.length?money[0].i:-1,
    moneyCols:money.map(function(m){return m.i;}).sort(function(a,b){return a-b;})
  };
}

function openImportModal(){
  var imp={step:1,accountId:state.accounts[0].id,source:'csv',fileName:'',rawText:'',rows:[],rawLines:[],sheets:[],refSheet:null,
           hasHeader:true,headers:[],mapping:{date:0,description:1,amount:2,amountIn:-1,amountOut:-1,typeCol:-1},
           amountMode:'single',signRule:'auto',analyzed:false,
           parsed:[],error:'',warn:'',busy:false};

  function renderStep(){var r=document.querySelector('#modal-root .sheet-wrap');if(r){r.innerHTML=stepHTML();wireStep();}}
  function stepDots(){var h='<div class="step-dots">';for(var i=1;i<=3;i++)h+='<span class="step-dot'+(i===imp.step?' active':'')+'"></span>';return h+'</div>';}
  function stepHTML(){return imp.step===1?step1():imp.step===2?step2():step3();}

  /* ---------- passo 1: il file ---------- */
  function step1(){
    var opts=state.accounts.map(function(a){return'<option value="'+a.id+'" '+(a.id===imp.accountId?'selected':'')+'>'+esc(a.name)+'</option>';}).join('');
    var status='';
    if(imp.busy)status='<p class="hint">Lettura del file in corso…</p>';
    else if(imp.error)status='<p class="hint" style="color:var(--red);">⚠️ '+esc(imp.error)+'</p>'+(imp.rawLines.length?'<div class="field-group"><label class="field-label">Testo che sono riuscito a leggere (per capire cosa non va)</label><textarea class="text-input" readonly style="font-family:monospace;font-size:11px;">'+esc(imp.rawLines.slice(0,60).join('\n'))+'</textarea></div>':'');
    else if(imp.rows.length)status='<p class="hint">✅ '+esc(imp.fileName||'File')+': '+imp.rows.length+' righe lette.</p>';
    return'<div class="sheet">'+stepDots()+
      '<h3 style="margin:4px 0 0;">Importa i tuoi dati</h3>'+
      '<div class="field-group"><label class="field-label">Conto di destinazione</label><select class="select" id="impAcc">'+opts+'</select></div>'+
      '<div class="field-group"><label class="field-label">File (CSV, Excel .xlsx o PDF)</label><input type="file" accept=".csv,.txt,.xlsx,.pdf,text/csv,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" id="impFile"></div>'+
      status+
      '<div class="field-group"><label class="field-label">Oppure incolla il contenuto (CSV)</label><textarea class="text-input" id="impText" placeholder="data;descrizione;importo">'+esc(imp.rawText)+'</textarea></div>'+
      '<p class="hint">Il PDF viene letto come testo: funziona con gli estratti conto scaricati dalla banca, non con scansioni o foto.</p>'+
      '<button class="btn-primary full-width" id="impNext1" '+(imp.rows.length?'':'disabled')+'>Continua</button>'+
      '<button class="btn-secondary full-width" id="impCancel1">Annulla</button></div>';
  }

  /* ---------- analisi automatica delle colonne ---------- */
  function looksLikeTwoColumns(a,b,start){
    var both=0,either=0;
    for(var i=start;i<imp.rows.length;i++){
      var r=imp.rows[i]||[];
      var va=!isNaN(parseAmount(r[a]))&&parseAmount(r[a])!==0;
      var vb=!isNaN(parseAmount(r[b]))&&parseAmount(r[b])!==0;
      if(va||vb)either++;
      if(va&&vb)both++;
    }
    return either>=2&&(both/either)<0.25;
  }
  function analyze(){
    if(imp.analyzed||!imp.rows.length)return;
    imp.analyzed=true;
    /* Ogni foglio puo' avere le sue righe di titolo prima della tabella. */
    imp.sheets.forEach(function(sh){
      var h=findHeaderRow(sh.rows);
      if(h>0)sh.rows=sh.rows.slice(h);
      sh.hasHeader=h>-1;
      sh.forced=sheetForcedType(sh.name);
    });
    if(imp.refSheet)imp.rows=imp.refSheet.rows;
    var hr=findHeaderRow(imp.rows);
    imp.hasHeader=hr>-1?true:imp.hasHeader;
    var head=imp.hasHeader?imp.rows[0].map(String):[];
    var start=imp.hasHeader?1:0;
    var byName={date:-1,description:-1,amount:-1,out:-1,in:-1,type:-1};
    head.forEach(function(h,i){
      if(byName.date<0&&hasKW(h,KW_DATE))byName.date=i;
      if(byName.description<0&&hasKW(h,KW_DESC))byName.description=i;
      if(byName.out<0&&hasKW(h,KW_OUT))byName.out=i;
      if(byName.in<0&&hasKW(h,KW_IN))byName.in=i;
      if(byName.amount<0&&hasKW(h,KW_AMT))byName.amount=i;
      if(byName.type<0&&hasKW(h,KW_TYPE)&&!hasKW(h,KW_DESC))byName.type=i;
    });
    var g=guessColMapByContent(imp.rows,start);
    imp.mapping.date=byName.date>-1?byName.date:(g.date>-1?g.date:0);
    imp.mapping.description=byName.description>-1?byName.description:(g.description>-1?g.description:Math.min(1,imp.rows[0].length-1));
    imp.mapping.typeCol=byName.type;

    if(byName.out>-1&&byName.in>-1){
      imp.amountMode='dual';
      imp.mapping.amountOut=byName.out;
      imp.mapping.amountIn=byName.in;
    }else if(g.moneyCols.length>=2&&looksLikeTwoColumns(g.moneyCols[0],g.moneyCols[1],start)){
      /* Due colonne di soldi che non sono quasi mai piene insieme:
         è il classico schema "uscite | entrate" (tipico dei PDF e degli
         Excel bancari, dove i numeri sono tutti positivi). */
      imp.amountMode='dual';
      imp.mapping.amountOut=g.moneyCols[0];
      imp.mapping.amountIn=g.moneyCols[1];
    }else{
      imp.amountMode='single';
      imp.mapping.amount=byName.amount>-1?byName.amount:(g.amount>-1?g.amount:imp.rows[0].length-1);
    }

    /* Segno: se nella colonna importo non c'è NESSUN numero negativo,
       trattarli tutti come entrate sarebbe assurdo → di default sono spese
       (tipico dei file Excel). Se c'è una colonna "tipo", si usa quella. */
    if(imp.amountMode==='single'){
      var neg=0,tot=0;
      for(var i=start;i<imp.rows.length;i++){
        var v=(imp.rows[i]||[])[imp.mapping.amount];
        var a=parseAmount(v);
        if(isNaN(a)||a===0)continue;
        tot++;
        if(a<0||/[-−]\s*$/.test(String(v)))neg++;
      }
      var allForced=imp.sheets.length>0&&imp.sheets.every(function(sh){return !!sh.forced;});
      if(imp.mapping.typeCol>-1)imp.signRule='column';
      else if(allForced)imp.signRule='auto';
      else if(tot>0&&neg===0){imp.signRule='expense';imp.warn='Nel file non ci sono importi negativi: li tratto tutti come spese. Se non è così, cambia qui sotto o correggi le singole righe nel passo successivo.';}
      else imp.signRule='auto';
    }
  }

  /* ---------- passo 2: colonne e segno ---------- */
  function colOptions(field,sel,allowNone){
    var head=imp.hasHeader?imp.rows[0]:[];
    var cols=imp.rows[0]?imp.rows[0].length:0;
    var out='<select class="select" data-map-field="'+field+'">';
    if(allowNone)out+='<option value="-1" '+(sel===-1?'selected':'')+'>— nessuna —</option>';
    for(var i=0;i<cols;i++){
      var label=imp.hasHeader?(String(head[i]||'').trim()||'Colonna '+(i+1)):'Colonna '+(i+1);
      out+='<option value="'+i+'" '+(sel===i?'selected':'')+'>'+esc(label)+'</option>';
    }
    return out+'</select>';
  }
  function step2(){
    analyze();
    var dual=imp.amountMode==='dual';
    var multi='';
    if(imp.sheets.length>1){
      multi='<p class="hint">📑 Il file ha '+imp.sheets.length+' fogli: '+
        imp.sheets.map(function(sh){
          var f=sh.forced==='expense'?' → tutte spese':sh.forced==='income'?' → tutte entrate':'';
          return '<strong>'+esc(sh.name)+'</strong> ('+Math.max(0,sh.rows.length-(sh.hasHeader?1:0))+' righe)'+f;
        }).join(' · ')+
        '. Le colonne scelte qui sotto valgono per tutti (sugli altri fogli le ritrovo dai nomi di intestazione).</p>';
    }
    return'<div class="sheet">'+stepDots()+'<h3 style="margin:4px 0 0;">Associa le colonne</h3>'+
      multi+
      (imp.warn?'<p class="hint" style="color:var(--red);">⚠️ '+esc(imp.warn)+'</p>':'')+
      '<label class="toggle-row"><span>Prima riga come intestazione</span><input type="checkbox" id="impHeader" '+(imp.hasHeader?'checked':'')+'></label>'+
      '<div class="field-group"><label class="field-label">Colonna data</label>'+colOptions('date',imp.mapping.date)+'</div>'+
      '<div class="field-group"><label class="field-label">Colonna descrizione</label>'+colOptions('description',imp.mapping.description)+'</div>'+
      '<div class="field-group"><label class="field-label">Come sono scritti gli importi</label><div class="segmented small">'+
        '<button class="'+(dual?'':'active')+'" data-amt-mode="single">Una colonna</button>'+
        '<button class="'+(dual?'active':'')+'" data-amt-mode="dual">Due colonne</button>'+
      '</div></div>'+
      (dual
        ? '<div class="field-group"><label class="field-label">Colonna SPESE (uscite / addebiti / dare)</label>'+colOptions('amountOut',imp.mapping.amountOut,true)+'</div>'+
          '<div class="field-group"><label class="field-label">Colonna ENTRATE (accrediti / avere)</label>'+colOptions('amountIn',imp.mapping.amountIn,true)+'</div>'
        : '<div class="field-group"><label class="field-label">Colonna importo</label>'+colOptions('amount',imp.mapping.amount)+'</div>'+
          '<div class="field-group"><label class="field-label">Spesa o entrata?</label><div class="segmented small">'+
            '<button class="'+(imp.signRule==='auto'?'active':'')+'" data-sign="auto">Dal segno −</button>'+
            '<button class="'+(imp.signRule==='expense'?'active':'')+'" data-sign="expense">Tutte spese</button>'+
            '<button class="'+(imp.signRule==='income'?'active':'')+'" data-sign="income">Tutte entrate</button>'+
            '<button class="'+(imp.signRule==='column'?'active':'')+'" data-sign="column">Da colonna</button>'+
          '</div></div>'+
          (imp.signRule==='column'?'<div class="field-group"><label class="field-label">Colonna che dice spesa/entrata</label>'+colOptions('typeCol',imp.mapping.typeCol,true)+'</div>':'')
      )+
      '<p class="hint">Nel passo successivo puoi ancora cambiare riga per riga: c\'è un pulsante per passare da spesa a entrata.</p>'+
      '<button class="btn-primary full-width" id="impNext2">Continua</button>'+
      '<button class="btn-secondary full-width" id="impBack2">Indietro</button></div>';
  }

  function typeFromColumn(v,val){
    var t=String(v||'').toLowerCase();
    if(/entrat|accredit|avere|credit|income|incasso|ricev|\+/.test(t))return 'income';
    if(/uscit|addebit|dare|debit|spesa|spese|pagament|prelie|-/.test(t))return 'expense';
    return val<0?'expense':'income';
  }
  /* Le colonne scelte valgono per il foglio di riferimento; sugli altri fogli
     si riconoscono per NOME di intestazione (se ce l'hanno), altrimenti si usa
     la stessa posizione. */
  function mappingForSheet(sh){
    var m=imp.mapping;
    if(!imp.refSheet||sh===imp.refSheet)return m;
    if(!imp.hasHeader||!sh.hasHeader||!sh.rows.length)return m;
    var refHead=(imp.rows[0]||[]).map(function(x){return String(x||'').toLowerCase().trim();});
    var head=(sh.rows[0]||[]).map(function(x){return String(x||'').toLowerCase().trim();});
    function conv(idx){
      if(idx==null||idx<0)return idx;
      var nm=refHead[idx];
      if(!nm)return idx;
      var j=head.indexOf(nm);
      return j>-1?j:idx;
    }
    return{date:conv(m.date),description:conv(m.description),amount:conv(m.amount),
           amountIn:conv(m.amountIn),amountOut:conv(m.amountOut),typeCol:conv(m.typeCol)};
  }
  function buildParsed(){
    var out=[];
    imp.sheets.forEach(function(sh){parseSheet(sh,out);});
    imp.parsed=out;
  }
  function parseSheet(sh,out){
    var rows=sh.rows||[];
    var hasHead=(sh===imp.refSheet)?imp.hasHeader:(sh.hasHeader!==false&&imp.hasHeader);
    var start=hasHead?1:0,m=mappingForSheet(sh),lastDate='';
    for(var i=start;i<rows.length;i++){
      var cols=rows[i]||[];
      var type,amount;
      if(imp.amountMode==='dual'){
        var o=m.amountOut>-1?parseAmount(cols[m.amountOut]):NaN;
        var e=m.amountIn>-1?parseAmount(cols[m.amountIn]):NaN;
        o=isNaN(o)?0:Math.abs(o);
        e=isNaN(e)?0:Math.abs(e);
        if(!o&&!e)continue;
        if(o>=e){type='expense';amount=o;}
        else{type='income';amount=e;}
      }else{
        var rawV=cols[m.amount];
        var ra=parseAmount(rawV);
        if(isNaN(ra)||ra===0)continue;
        if(/[-−]\s*$/.test(String(rawV))&&ra>0)ra=-ra;
        if(imp.signRule==='expense')type='expense';
        else if(imp.signRule==='income')type='income';
        else if(imp.signRule==='column')type=typeFromColumn(m.typeCol>-1?cols[m.typeCol]:'',ra);
        else type=ra<0?'expense':'income';
        amount=Math.abs(ra);
      }
      var date=parseDateFlexible(cols[m.date]);
      if(!date&&lastDate)date=lastDate;
      if(!date)date=todayISO();
      lastDate=date;
      var desc=String(cols[m.description]==null?'':cols[m.description]).trim();
      if(sh.forced)type=sh.forced;   // foglio "Spese" o "Entrate": decide lui
      out.push({id:uid('imp'),date:date,desc:desc,amount:amount,include:true,type:type,
                sheet:sh.name||'',categoryId:guessCat(desc,type)});
    }
  }

  /* ---------- passo 3: anteprima ---------- */
  function catOptsGrouped(sel){return'<optgroup label="Spese">'+catsByType('expense').map(function(c){return'<option value="'+c.id+'" '+(c.id===sel?'selected':'')+'>'+esc(c.emoji)+' '+esc(c.name)+'</option>';}).join('')+'</optgroup><optgroup label="Entrate">'+catsByType('income').map(function(c){return'<option value="'+c.id+'" '+(c.id===sel?'selected':'')+'>'+esc(c.emoji)+' '+esc(c.name)+'</option>';}).join('')+'</optgroup>';}
  function step3(){
    var cnt=imp.parsed.filter(function(r){return r.include;}).length;
    var inc=imp.parsed.filter(function(r){return r.include&&r.type==='income';}).length;
    return'<div class="sheet">'+stepDots()+'<h3 style="margin:4px 0 0;">Controlla e importa</h3>'+
      '<p class="hint">'+imp.parsed.length+' righe · <strong id="impCnt">'+cnt+'</strong> pronte per "'+esc(accById(imp.accountId).name)+'" ('+inc+' entrate, '+(cnt-inc)+' spese). Le categorie sono assegnate in automatico dalla descrizione — puoi cambiarle qui, e tocca <strong>S/E</strong> per invertire spesa/entrata.</p>'+
      '<div class="card import-table">'+(imp.parsed.length?imp.parsed.map(function(r,i){
        return'<div class="import-row-item"><input type="checkbox" data-inc="'+i+'" '+(r.include?'checked':'')+'>'+
          '<span class="imp-date">'+formatShortDate(r.date)+'</span>'+
          '<span class="imp-desc">'+esc(r.desc||'—')+(r.sheet&&imp.sheets.length>1?' <em style="opacity:.6;">['+esc(r.sheet)+']</em>':'')+'</span>'+
          '<button class="chip" data-flip="'+i+'" style="padding:2px 8px;font-size:11px;">'+(r.type==='income'?'E':'S')+'</button>'+
          '<span class="imp-amt'+(r.type==='income'?' amt-income':'')+'">'+(r.type==='income'?'+':'−')+fmt(r.amount)+'</span>'+
          '<select data-cat="'+i+'">'+catOptsGrouped(r.categoryId)+'</select></div>';
      }).join(''):'<p class="empty-note">Nessuna riga valida: torna indietro e controlla le colonne.</p>')+'</div>'+
      '<button class="btn-primary full-width" id="impConfirm" '+(cnt?'':'disabled')+'>Importa '+cnt+' movimenti</button>'+
      '<button class="btn-secondary full-width" id="impBack3">Indietro</button></div>';
  }

  async function readFile(f){
    imp.busy=true;imp.error='';imp.warn='';imp.fileName=f.name;imp.analyzed=false;imp.rawLines=[];renderStep();
    var name=(f.name||'').toLowerCase();
    try{
      if(/\.xlsx$/.test(name)||(f.type||'').indexOf('spreadsheetml')>-1){
        imp.source='xlsx';
        imp.sheets=await xlsxToSheets(await f.arrayBuffer());
        imp.refSheet=imp.sheets[0];
        imp.sheets.forEach(function(sh){if(sh.rows.length>imp.refSheet.rows.length)imp.refSheet=sh;});
        imp.rows=imp.refSheet.rows;
        imp.hasHeader=true;imp.rawText='';
      }else if(/\.pdf$/.test(name)||f.type==='application/pdf'){
        imp.source='pdf';
        var groups=await pdfToGroups(await f.arrayBuffer());
        imp.rawLines=groups.map(function(g){return g.items.map(function(it){return it.t;}).join(' ');});
        var rows=pdfGroupsToRows(groups);
        var good=rows.filter(function(r){return r[0]&&(r[2]||r[3]||r[4]);}).length;
        if(good<2)rows=pdfLinesToRows(imp.rawLines);
        if(!rows.length)throw new Error('Nel PDF non ho trovato righe con data e importo.');
        imp.rows=[['Data','Descrizione','Importo 1','Importo 2','Importo 3']].concat(rows);
        imp.hasHeader=true;imp.rawText='';
      }else{
        imp.source='csv';
        var text=await f.text();
        imp.rawText=text;
        imp.rows=rowsFromCSV(text);
        imp.hasHeader=true;
        if(!imp.rows.length)throw new Error('Il file risulta vuoto.');
      }
    }catch(e){
      imp.rows=[];imp.sheets=[];
      imp.error=(e&&e.message)?e.message:'Non sono riuscito a leggere il file.';
    }
    if(imp.rows.length&&imp.source!=='xlsx'){
      imp.sheets=[{name:'',rows:imp.rows}];
      imp.refSheet=imp.sheets[0];
    }
    imp.busy=false;
    renderStep();
  }

  function wireStep(){
    var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;
    if(imp.step===1){
      var fi=document.getElementById('impFile'),ta=document.getElementById('impText'),n1=document.getElementById('impNext1');
      fi.onchange=function(){var f=fi.files[0];if(f)readFile(f);};
      ta.oninput=function(){
        imp.rawText=ta.value;imp.source='csv';imp.fileName='';imp.error='';imp.analyzed=false;
        imp.rows=rowsFromCSV(imp.rawText);
        imp.sheets=imp.rows.length?[{name:'',rows:imp.rows}]:[];
        imp.refSheet=imp.sheets[0]||null;
        n1.disabled=!imp.rows.length;
      };
      document.getElementById('impAcc').onchange=function(e){imp.accountId=e.target.value;};
      n1.onclick=function(){if(!imp.rows.length)return;imp.step=2;renderStep();};
      document.getElementById('impCancel1').onclick=closeModal;
    }else if(imp.step===2){
      document.getElementById('impHeader').onchange=function(e){imp.hasHeader=e.target.checked;renderStep();};
      document.querySelectorAll('[data-map-field]').forEach(function(s){
        s.onchange=function(){imp.mapping[s.dataset.mapField]=parseInt(s.value,10);renderStep();};
      });
      document.querySelectorAll('[data-amt-mode]').forEach(function(b){
        b.onclick=function(){
          imp.amountMode=b.dataset.amtMode;
          if(imp.amountMode==='dual'&&imp.mapping.amountOut<0){
            var g=guessColMapByContent(imp.rows,imp.hasHeader?1:0);
            imp.mapping.amountOut=g.moneyCols[0]!==undefined?g.moneyCols[0]:0;
            imp.mapping.amountIn=g.moneyCols[1]!==undefined?g.moneyCols[1]:-1;
          }
          imp.warn='';renderStep();
        };
      });
      document.querySelectorAll('[data-sign]').forEach(function(b){
        b.onclick=function(){imp.signRule=b.dataset.sign;imp.warn='';renderStep();};
      });
      document.getElementById('impNext2').onclick=function(){buildParsed();imp.step=3;renderStep();};
      document.getElementById('impBack2').onclick=function(){imp.step=1;renderStep();};
    }else{
      document.querySelectorAll('[data-inc]').forEach(function(c){c.onchange=function(){imp.parsed[+c.dataset.inc].include=c.checked;renderStep();};});
      document.querySelectorAll('[data-flip]').forEach(function(b){b.onclick=function(){
        var r=imp.parsed[+b.dataset.flip];
        r.type=r.type==='income'?'expense':'income';
        r.categoryId=guessCat(r.desc,r.type);
        renderStep();
      };});
      document.querySelectorAll('[data-cat]').forEach(function(s){s.onchange=function(){var idx=+s.dataset.cat,cat=catById(s.value);imp.parsed[idx].categoryId=s.value;imp.parsed[idx].type=cat.type;renderStep();};});
      document.getElementById('impBack3').onclick=function(){imp.step=2;renderStep();};
      document.getElementById('impConfirm').onclick=function(){
        var chosen=imp.parsed.filter(function(r){return r.include;});
        chosen.forEach(function(r){state.transactions.push({id:uid('tx'),type:r.type,amount:r.amount,accountId:imp.accountId,categoryId:r.categoryId,merchant:'',note:r.desc,date:r.date,tags:[],createdAt:Date.now(),source:'import'});});
        saveState();closeModal();showToast('Importati '+chosen.length+' movimenti');renderActiveTab();
      };
    }
  }
  openModal('<div class="sheet"></div>');renderStep();
}

/* ================================================================
   PAGAMENTI RICORRENTI
   Un ricorrente è un modello di spesa (o entrata) che si ripete:
   abbonamenti, rate, tasse, bollette fisse. "Segna pagato" crea un
   movimento reale (che entra in saldi/totali/storico) con associata
   la data di ricorrenza, e fa avanzare la scadenza successiva.
================================================================ */
var CADENCES=[
  {id:'weekly',label:'Settimanale',per:'sett.',adj:'settimanale'},
  {id:'monthly',label:'Mensile',per:'mese',adj:'mensile'},
  {id:'quarterly',label:'Trimestrale',per:'trim.',adj:'trimestrale'},
  {id:'yearly',label:'Annuale',per:'anno',adj:'annuale'}
];
function cadenceById(id){for(var i=0;i<CADENCES.length;i++)if(CADENCES[i].id===id)return CADENCES[i];return CADENCES[1];}
function addCadenceISO(iso,cadence){
  var p=(iso||todayISO()).split('-');var dt=new Date(+p[0],+p[1]-1,+p[2]);
  if(cadence==='weekly')dt.setDate(dt.getDate()+7);
  else if(cadence==='quarterly')dt.setMonth(dt.getMonth()+3);
  else if(cadence==='yearly')dt.setFullYear(dt.getFullYear()+1);
  else dt.setMonth(dt.getMonth()+1);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function recMonthlyEquiv(item){
  var a=item.amount||0;
  switch(item.cadence){case 'weekly':return a*52/12;case 'quarterly':return a/3;case 'yearly':return a/12;default:return a;}
}
function recStatus(item){
  if(item.status==='paused')return 'paused';
  if((item.nextDate||'')<todayISO())return 'overdue';
  return 'active';
}
function daysUntil(iso){
  var p=(iso||todayISO()).split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);var t=new Date();t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
function nextDueLabel(item){
  var st=recStatus(item);
  if(st==='paused')return 'In pausa';
  var n=daysUntil(item.nextDate);
  if(n<0)return 'Scaduta il '+formatShortDate(item.nextDate);
  if(n===0)return 'In scadenza oggi';
  if(n===1)return 'Domani';
  return 'Prossima '+formatShortDate(item.nextDate);
}
function sortedRecurring(){
  return state.recurring.slice().sort(function(a,b){
    var pa=a.status==='paused'?1:0,pb=b.status==='paused'?1:0;
    if(pa!==pb)return pa-pb;
    return (a.nextDate||'')<(b.nextDate||'')?-1:1;
  });
}
function payRecurring(id){
  var item=state.recurring.find(function(r){return r.id===id;});
  if(!item)return;
  var due=item.nextDate||todayISO();
  state.transactions.push({
    id:uid('tx'),type:item.type||'expense',amount:item.amount,
    accountId:item.accountId,categoryId:item.categoryId,
    merchant:item.name||'',note:item.note||'',
    date:due,tags:[],createdAt:Date.now(),
    source:'recurring',recurringId:item.id,recurrenceDate:due
  });
  item.lastPaidDate=due;
  item.nextDate=addCadenceISO(due,item.cadence);
  saveState();
  showToast((item.type==='income'?'Entrata':'Pagamento')+' registrato: '+fmt(item.amount));
  renderActiveTab();
}

/* ================================================================
   PROMEMORIA RICORRENTI
   Avvisa quando un pagamento ricorrente arriva a scadenza, così lo si
   può registrare. Due canali: una notifica di sistema (se l'utente ha
   dato il permesso) e comunque un banner dentro l'app. Il controllo gira
   all'avvio e quando l'app torna in primo piano; ogni scadenza avvisa
   una volta sola al giorno (memorizzato per non ripetere). */
var RECNOTIF_KEY='expense-tracker-recnotif-v1';
function recNotifLog(){
  try{var r=window.localStorage.getItem(RECNOTIF_KEY);return r?JSON.parse(r):{};}catch(e){return {};}
}
function recNotifSave(log){try{window.localStorage.setItem(RECNOTIF_KEY,JSON.stringify(log));}catch(e){}}
function dueRecurringToday(){
  return state.recurring.filter(function(r){return r.status!=='paused'&&daysUntil(r.nextDate)<=0;});
}
function notifSupported(){try{return 'Notification' in window;}catch(e){return false;}}
function notifEnabled(){return notifSupported()&&Notification.permission==='granted';}
function requestRecNotifPermission(cb){
  if(!notifSupported()){showToast('Le notifiche non sono disponibili in questo browser');if(cb)cb(false);return;}
  if(Notification.permission==='granted'){if(cb)cb(true);return;}
  if(Notification.permission==='denied'){showToast('Le notifiche sono bloccate: attivale dalle impostazioni del telefono per questa app');if(cb)cb(false);return;}
  Notification.requestPermission().then(function(p){
    if(p==='granted'){showToast('Notifiche attivate');checkRecurringDue(true);}
    else showToast('Notifiche non attivate');
    if(cb)cb(p==='granted');
    renderActiveTab();
  }).catch(function(){if(cb)cb(false);});
}
function fireRecNotification(due){
  if(!notifEnabled())return;
  try{
    var title=due.length===1?'Pagamento ricorrente in scadenza':due.length+' pagamenti ricorrenti in scadenza';
    var body=due.slice(0,4).map(function(r){return (r.type==='income'?'↓ ':'↑ ')+r.name+' · '+fmt(r.amount);}).join('\n');
    if(due.length>4)body+='\n…e altri '+(due.length-4);
    var opts={body:body,tag:'ricorrenti'};
    var reg=(navigator.serviceWorker&&navigator.serviceWorker.controller&&navigator.serviceWorker.getRegistration)?true:false;
    var shown=false;
    function fallback(){if(shown)return;shown=true;try{new Notification(title,opts);}catch(e){}}
    if(!usingClaudeStorage&&navigator.serviceWorker&&navigator.serviceWorker.getRegistration){
      var t=setTimeout(fallback,600);
      navigator.serviceWorker.getRegistration().then(function(r){
        if(shown)return;
        if(r&&r.showNotification){shown=true;clearTimeout(t);try{r.showNotification(title,Object.assign({icon:'icon-192.png',badge:'icon-192.png'},opts));}catch(e){fallback();}}
        else{clearTimeout(t);fallback();}
      }).catch(function(){clearTimeout(t);fallback();});
    }else{
      fallback();
    }
  }catch(e){}
}
function checkRecurringDue(force){
  var due=dueRecurringToday();
  if(!due.length)return;
  var today=todayISO(),log=recNotifLog();
  var fresh=due.filter(function(r){return log[r.id]!==today;});
  if(fresh.length||force){
    fireRecNotification(due);
    due.forEach(function(r){log[r.id]=today;});
    recNotifSave(log);
  }
  if(ui.activeTab==='home')renderActiveTab();
}
function initRecurringReminders(){
  setTimeout(function(){checkRecurringDue(false);},1500);
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden)checkRecurringDue(false);
  });
}
/* Banner in-app: sempre visibile in Home quando c'è qualcosa in scadenza,
   anche se le notifiche di sistema sono spente. */
function recurringDueBannerHTML(){
  var due=dueRecurringToday();

function recurringSummaryHTML(){
  if(!state.recurring.length)return '';
  var active=state.recurring.filter(function(r){return r.status!=='paused';});
  var overdue=active.filter(function(r){return recStatus(r)==='overdue';});

  var monthly=state.recurring.reduce(function(s,r){return s+(r.status==='paused'?0:recMonthlyEquiv(r));},0);
  var upcoming=sortedRecurring().filter(function(r){return r.status!=='paused';}).slice(0,3);
  var badge=overdue.length?'<span class="rec-badge overdue">'+overdue.length+' scadut'+(overdue.length===1?'a':'e')+'</span>':(soon.length?'<span class="rec-badge soon">'+soon.length+' in arrivo</span>':'');
  var rows=upcoming.map(function(r){var c=catById(r.categoryId),st=recStatus(r);
    return '<div class="rec-mini" data-rec-open="'+r.id+'"><div class="cat-bubble sm" style="background:'+colorHex(c.color)+'22;">'+esc(c.emoji)+'</div><div class="rec-mini-info"><div class="rec-mini-name">'+esc(r.name)+'</div><div class="rec-mini-sub '+(st==='overdue'?'is-overdue':'')+'">'+esc(nextDueLabel(r))+'</div></div><div class="rec-mini-amt">'+fmt(r.amount)+'</div></div>';

  return '<section class="card rec-summary"><div class="section-title-row" style="margin-bottom:8px;"><h3>Prossimi pagamenti '+badge+'</h3><button class="link-btn" data-goto="recurring">Gestisci</button></div>'+
    rows+
    '<div class="rec-summary-foot"><span>Totale ricorrente</span><strong>'+fmt(monthly)+'/mese</strong></div></section>';
}

function recurringHTML(){
  var all=sortedRecurring();
  var filtered=all.filter(function(r){
    if(ui.recurringFilter==='active')return r.status!=='paused';
    if(ui.recurringFilter==='paused')return r.status==='paused';
    return true;
  });
  var monthly=state.recurring.reduce(function(s,r){return s+(r.status==='paused'?0:recMonthlyEquiv(r));},0);
  var yearly=monthly*12;
  var activeN=state.recurring.filter(function(r){return r.status!=='paused';}).length;
  var pausedN=state.recurring.length-activeN;
  var head='<section class="hero-card rec-hero"><div class="hero-label">Spesa ricorrente stimata</div><div class="hero-value">'+fmt(monthly)+'<span class="hero-unit">/mese</span></div><div class="hero-sub"><span>'+fmt(yearly)+' l\'anno</span><span class="hero-delta">'+activeN+' attiv'+(activeN===1?'o':'i')+(pausedN?' · '+pausedN+' in pausa':'')+'</span></div></section>';
  var filters='<div class="chip-row">'+

  var addBtn='<button class="btn-primary full-width" id="recAddBtn"><span style="display:inline-flex;align-items:center;gap:8px;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>Nuovo pagamento ricorrente</span></button>';
  if(!state.recurring.length){
    return '<div class="view">'+head+
      '<section class="card" style="text-align:center;padding:34px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;">'+

      '<strong style="font-family:var(--font-display);font-size:16px;">Nessun pagamento ricorrente</strong>'+
      '<p class="hint" style="max-width:260px;">Aggiungi abbonamenti, rate, tasse o bollette fisse: l\'app tiene traccia delle scadenze e, quando paghi, registra la spesa per te.</p>'+

      '<div class="rec-amt-wrap"><div class="rec-amt'+(r.type==='income'?' amt-income':'')+'">'+(r.type==='income'?'+':'')+fmt(r.amount)+'</div><div class="rec-per">/'+esc(cad.per)+'</div></div></div>'+

function openRecurringSheet(opts){
  opts=opts||{};
  var edit=opts.id?state.recurring.find(function(r){return r.id===opts.id;}):null;
  var m={
    isEdit:!!edit,
    id:edit?edit.id:null,
    name:edit?(edit.name||''):'',
    type:edit?(edit.type||'expense'):'expense',
    amountStr:edit?String(edit.amount).replace('.',','):'',
    categoryId:edit?edit.categoryId:(catsByType('expense')[0]||{}).id,
    accountId:edit?edit.accountId:(lastUsedAccId&&state.accounts.some(function(a){return a.id===lastUsedAccId;})?lastUsedAccId:state.accounts[0].id),
    cadence:edit?(edit.cadence||'monthly'):'monthly',
    nextDate:edit?edit.nextDate:todayISO(),
    note:edit?(edit.note||''):'',
    status:edit?(edit.status||'active'):'active',
    showCatForm:false,newCatName:'',newCatEmoji:'',newCatColor:0
  };
  if(!m.categoryId){var fc=catsByType(m.type==='income'?'income':'expense')[0];m.categoryId=fc?fc.id:null;}

  function catChips(){
    var chips=catsByType(m.type==='income'?'income':'expense').map(function(c){return'<button class="chip'+(c.id===m.categoryId?' selected':'')+'" data-rc-cat="'+c.id+'"><span class="dot" style="background:'+colorHex(c.color)+'"></span>'+esc(c.emoji)+' '+esc(c.name)+'</button>';}).join('');
    chips+='<button class="chip" id="rcNewCatBtn">+ Nuova</button>';
    var form='';
    if(m.showCatForm){
      form='<div class="new-tag-card" style="margin-top:8px;"><div style="display:flex;gap:8px;"><input id="rcNewCatEmoji" class="emoji-input" maxlength="2" placeholder="🙂" value="'+esc(m.newCatEmoji)+'"><input id="rcNewCatName" class="text-input" placeholder="Nome categoria" value="'+esc(m.newCatName)+'"></div><div class="color-dots-row">'+(isDarkTheme()?COLORS_DARK:COLORS_LIGHT).map(function(c,i){return'<button class="color-dot'+(m.newCatColor===i?' active':'')+'" data-rc-cat-color="'+i+'" aria-label="Colore '+(i+1)+'" style="background:'+c+';"></button>';}).join('')+'</div><div style="display:flex;gap:8px;"><button class="btn-primary-sm" id="rcCreateCatBtn">Aggiungi categoria</button><button class="btn-secondary" style="padding:10px 14px;font-size:13px;" id="rcCancelCatBtn">Annulla</button></div></div>';
    }
    return '<div id="rcCatSection" class="field-group"><label class="field-label">Categoria</label><div class="chip-row wrap">'+chips+'</div>'+form+'</div>';
  }
  function accChips(){return '<div class="field-group"><label class="field-label">Conto</label><div class="chip-row">'+state.accounts.map(function(a){return'<button class="chip'+(a.id===m.accountId?' selected':'')+'" data-rc-acc="'+a.id+'"><span class="dot" style="background:'+colorHex(a.color)+'"></span>'+esc(a.name)+'</button>';}).join('')+'</div></div>';}
  function cadChips(){return '<div class="field-group"><label class="field-label">Frequenza</label><div class="segmented small">'+CADENCES.map(function(c){return'<button class="'+(m.cadence===c.id?'active':'')+'" data-rc-cad="'+c.id+'">'+c.label+'</button>';}).join('')+'</div></div>';}
  function bodyHTML(){
    var delBtn=m.isEdit?'<button class="btn-danger full-width" id="rcDelBtn">Elimina ricorrente</button>':'';
    var payBtn=m.isEdit&&m.status!=='paused'?'<button class="btn-secondary full-width" id="rcPayNow">Segna come pagato ora</button>':'';
    return '<div class="field-group"><label class="field-label">Nome</label><input type="text" id="rcName" class="text-input" value="'+esc(m.name)+'" placeholder="Es. abbonamento, bolletta, rata"></div>'+
      '<div class="segmented"><button class="'+(m.type==='expense'?'active':'')+'" data-rc-type="expense">Spesa</button><button class="'+(m.type==='income'?'active mode-income':'')+'" data-rc-type="income">Entrata</button></div>'+
      '<div class="field-group"><label class="field-label">Importo</label><div class="amount-field"><span class="amount-cur">€</span><input type="text" inputmode="decimal" id="rcAmount" class="text-input amount-input" value="'+esc(m.amountStr)+'" placeholder="0,00"></div></div>'+
      catChips()+accChips()+cadChips()+
      '<div class="field-group"><label class="field-label">Prossima scadenza</label><input type="date" id="rcDate" class="text-input" value="'+esc(m.nextDate)+'"></div>'+
      '<label class="toggle-row" style="padding:2px 2px;"><span>In pausa (non conta nelle scadenze)</span><input type="checkbox" id="rcPaused" '+(m.status==='paused'?'checked':'')+'></label>'+
      '<div class="field-group"><label class="field-label">Nota (opzionale)</label><input type="text" id="rcNote" class="text-input" value="'+esc(m.note)+'" placeholder="Es. abbonamento annuale"></div>'+
      payBtn+delBtn+
      '<button class="btn-primary full-width sticky-save" id="rcSave">'+(m.isEdit?'Salva modifiche':'Aggiungi ricorrente')+'</button>';

  function sheetHTML(){
    return '<div class="sheet"><div class="sheet-handle"></div><h3 style="margin:4px 0 0;font-family:var(--font-display);font-size:18px;letter-spacing:-0.01em;">'+(m.isEdit?'Modifica ricorrente':'Nuovo ricorrente')+'</h3><div id="rcBody" style="display:flex;flex-direction:column;gap:16px;">'+bodyHTML()+'</div></div>';
  }
  function rerenderCats(){var el=document.getElementById('rcCatSection');if(el){el.outerHTML=catChips();wireCats();}}
  function rerenderBody(){var b=document.getElementById('rcBody');if(b){b.innerHTML=bodyHTML();wireBody();}}
  function render(){var wrap=document.querySelector('#modal-root .sheet-wrap');if(!wrap)return;wrap.innerHTML=sheetHTML();wireBody();var bd=document.getElementById('modalBackdrop');if(bd)bd.onclick=closeModal;}
  function wireCats(){
    document.querySelectorAll('[data-rc-cat]').forEach(function(b){b.onclick=function(){m.categoryId=b.dataset.rcCat;document.querySelectorAll('[data-rc-cat]').forEach(function(q){q.classList.toggle('selected',q===b);});};});
    var nb=document.getElementById('rcNewCatBtn');if(nb)nb.onclick=function(){m.showCatForm=true;rerenderCats();setTimeout(function(){var e=document.getElementById('rcNewCatName');if(e)e.focus();},40);};
    var ne=document.getElementById('rcNewCatEmoji');if(ne)ne.oninput=function(){m.newCatEmoji=ne.value;};
    var nn=document.getElementById('rcNewCatName');if(nn)nn.oninput=function(){m.newCatName=nn.value;};
    document.querySelectorAll('[data-rc-cat-color]').forEach(function(d){d.onclick=function(){m.newCatColor=parseInt(d.dataset.rcCatColor,10);document.querySelectorAll('[data-rc-cat-color]').forEach(function(q){q.classList.toggle('active',q===d);});};});
    var cc=document.getElementById('rcCreateCatBtn');if(cc)cc.onclick=function(){var n=(m.newCatName||'').trim();if(!n){showToast('Dai un nome alla categoria');return;}var cat={id:uid('cat'),name:n,emoji:(m.newCatEmoji||'').trim()||(m.type==='income'?'💰':'🏷️'),color:m.newCatColor,type:m.type,custom:true};state.categories.push(cat);m.categoryId=cat.id;m.showCatForm=false;m.newCatName='';m.newCatEmoji='';m.newCatColor=0;saveState();showToast('Categoria aggiunta');rerenderCats();};
    var xc=document.getElementById('rcCancelCatBtn');if(xc)xc.onclick=function(){m.showCatForm=false;m.newCatName='';m.newCatEmoji='';rerenderCats();};
  }
  function wireBody(){
    var nm=document.getElementById('rcName');if(nm)nm.oninput=function(){m.name=nm.value;};
    var am=document.getElementById('rcAmount');if(am)am.oninput=function(){m.amountStr=am.value;};
    var nt=document.getElementById('rcNote');if(nt)nt.oninput=function(){m.note=nt.value;};
    var dt=document.getElementById('rcDate');if(dt)dt.onchange=function(){m.nextDate=dt.value||todayISO();};
    var pz=document.getElementById('rcPaused');if(pz)pz.onchange=function(){m.status=pz.checked?'paused':'active';};
    document.querySelectorAll('[data-rc-type]').forEach(function(b){b.onclick=function(){if(m.type===b.dataset.rcType)return;m.type=b.dataset.rcType;var fc=catsByType(m.type==='income'?'income':'expense');if(!fc.some(function(c){return c.id===m.categoryId;}))m.categoryId=fc[0]?fc[0].id:null;rerenderBody();};});
    document.querySelectorAll('[data-rc-cad]').forEach(function(b){b.onclick=function(){m.cadence=b.dataset.rcCad;document.querySelectorAll('[data-rc-cad]').forEach(function(q){q.classList.toggle('active',q===b);});};});
    document.querySelectorAll('[data-rc-acc]').forEach(function(b){b.onclick=function(){m.accountId=b.dataset.rcAcc;document.querySelectorAll('[data-rc-acc]').forEach(function(q){q.classList.toggle('selected',q===b);});};});
    wireCats();
    var pn=document.getElementById('rcPayNow');if(pn)pn.onclick=function(){closeModal();payRecurring(m.id);};
    var db=document.getElementById('rcDelBtn');if(db)db.onclick=function(){confirmDialog('Eliminare il ricorrente "'+esc(m.name)+'"? I movimenti già registrati restano nello storico.',function(){state.recurring=state.recurring.filter(function(r){return r.id!==m.id;});saveState();closeModal();showToast('Ricorrente eliminato');renderActiveTab();},'Elimina');};
    var sv=document.getElementById('rcSave');if(sv)sv.onclick=function(){
      var name=(m.name||'').trim();if(!name){showToast('Dai un nome al ricorrente');return;}
      var amount=parseAmount(String(m.amountStr).replace(',','.'));if(!(amount>0)){showToast('Inserisci un importo valido');return;}
      var date=m.nextDate||todayISO();
      if(m.isEdit){var it=state.recurring.find(function(r){return r.id===m.id;});if(it){it.name=name;it.type=m.type;it.amount=amount;it.categoryId=m.categoryId;it.accountId=m.accountId;it.cadence=m.cadence;it.nextDate=date;it.note=(m.note||'').trim();it.status=m.status;}}
      else state.recurring.push({id:uid('rec'),name:name,type:m.type,amount:amount,categoryId:m.categoryId,accountId:m.accountId,cadence:m.cadence,nextDate:date,note:(m.note||'').trim(),status:m.status,lastPaidDate:null,createdAt:Date.now()});
      saveState();closeModal();showToast(m.isEdit?'Ricorrente aggiornato':'Ricorrente aggiunto');renderActiveTab();
    };
  }
  openModal('<div class="sheet"></div>');
  render();
}

/* ================================================================
   GESTI: swipe tra schede + pull-to-refresh + chiusura fogli
================================================================ */
function initSwipeTabs(){
  var c=document.getElementById('content');
  var sx=0,sy=0,tracking=false,horiz=null;
  c.addEventListener('touchstart',function(e){
    if(e.touches.length!==1)return;
    if(document.getElementById('modal-root').classList.contains('open'))return;
    var t=e.target;
    if(t.closest&&t.closest('.chip-row,.carousel,input,select,textarea,.month-table,.keypad'))return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;tracking=true;horiz=null;
  },{passive:true});
  c.addEventListener('touchmove',function(e){
    if(!tracking)return;
    var dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(horiz===null&&(Math.abs(dx)>12||Math.abs(dy)>12))horiz=Math.abs(dx)>Math.abs(dy)*1.4;
  },{passive:true});
  c.addEventListener('touchend',function(e){
    if(!tracking)return;
    tracking=false;
    if(!horiz)return;
    var dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)<60)return;
    var i=TAB_ORDER.indexOf(ui.activeTab);
    if(i===-1)return;
    var ni=dx<0?i+1:i-1;
    if(ni<0||ni>=TAB_ORDER.length)return;
    ui.activeTab=TAB_ORDER[ni];
    renderActiveTab(dx<0?'left':'right');
  },{passive:true});
}

/* Se la sincronizzazione è attiva, il refresh chiede a Firestore l'ultima
   versione dei dati (stessa logica del listener in tempo reale). Senza
   sincronizzazione si limita a ridisegnare la schermata. */
async function refreshFromCloud(){
  if(sync.status!=='connected'||!sync.db||!sync.uid)return;
  await reconcileWithCloud();
}
async function doRefresh(){
  var ptr=document.getElementById('ptr');
  ptr.classList.add('refreshing');
  var t0=Date.now();
  try{await refreshFromCloud();}catch(e){}
  renderActiveTab();
  setTimeout(function(){
    ptr.classList.remove('refreshing');
    ptr.classList.add('hiding');
    setTimeout(function(){ptr.classList.remove('hiding');},320);
    showToast('Aggiornato');
  },Math.max(0,650-(Date.now()-t0)));
}
function initPullToRefresh(){
  var c=document.getElementById('content');
  var ptr=document.getElementById('ptr');
  var wheel=ptr.querySelector('.ptr-wheel');
  var startY=0,pulling=false,dist=0;
  function busy(){return ptr.classList.contains('refreshing');}
  function resetWheel(){wheel.style.transition='';wheel.style.opacity='';wheel.style.transform='';}
  c.addEventListener('touchstart',function(e){
    if(busy())return;
    if(document.getElementById('modal-root').classList.contains('open'))return;
    if(c.scrollTop>0)return;
    startY=e.touches[0].clientY;pulling=true;dist=0;
  },{passive:true});
  c.addEventListener('touchmove',function(e){
    if(!pulling||busy())return;
    if(c.scrollTop>0){pulling=false;resetWheel();return;}
    dist=e.touches[0].clientY-startY;
    if(dist<=0){resetWheel();return;}
    var d=Math.min(dist*0.45,90);
    wheel.style.transition='none';
    wheel.style.opacity=String(Math.min(d/40,1));
    wheel.style.transform='translateY('+(d-40)+'px) rotate('+(d*3.2)+'deg)';
  },{passive:true});
  c.addEventListener('touchend',function(){
    if(!pulling||busy())return;
    pulling=false;
    var d=Math.min(Math.max(dist,0)*0.45,90);
    resetWheel();
    if(d>=52)doRefresh();
  },{passive:true});
}

/* Chiusura dei bottom-sheet trascinandoli verso il basso: quando il
   foglio è già in cima (scrollTop 0) un trascinamento verso il basso
   segue il dito e, superata la soglia, lo chiude. Delegato su
   #modal-root così sopravvive ai re-render interni dei fogli. */
function initSheetDismiss(){
  var root=document.getElementById('modal-root');
  var wrap=null,sheet=null,startX=0,startY=0,dragging=false,decided=false,dy=0;
  root.addEventListener('touchstart',function(e){
    if(e.touches.length!==1){decided=true;dragging=false;return;}
    var t=e.target;
    sheet=t.closest?t.closest('.sheet'):null;
    wrap=t.closest?t.closest('.sheet-wrap'):null;
    if(!sheet||!wrap){decided=true;dragging=false;return;}
    startX=e.touches[0].clientX;startY=e.touches[0].clientY;
    dragging=false;decided=false;dy=0;
  },{passive:true});
  root.addEventListener('touchmove',function(e){
    if(!sheet||!wrap)return;
    if(decided&&!dragging)return;
    var y=e.touches[0].clientY,x=e.touches[0].clientX;
    dy=y-startY;var dx=x-startX;
    if(!decided){
      if(Math.abs(dy)<6&&Math.abs(dx)<6)return;
      decided=true;
      dragging=(dy>0&&Math.abs(dy)>Math.abs(dx)&&sheet.scrollTop<=0);
      if(!dragging)return;
    }
    if(dragging){
      if(e.cancelable)e.preventDefault();
      wrap.style.transition='none';
      wrap.style.transform='translateY('+(dy<0?0:dy)+'px)';
    }
  },{passive:false});
  root.addEventListener('touchend',function(){
    if(dragging&&wrap){
      if(dy>110){
        wrap.style.transition='transform .26s var(--ease-out)';
        wrap.style.transform='translateY(100%)';
        setTimeout(closeModal,230);
      }else{
        wrap.style.transition='transform .26s var(--ease-out)';
        wrap.style.transform='';
      }
    }
    dragging=false;decided=false;sheet=null;wrap=null;dy=0;
  },{passive:true});
}

  await loadState();

    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  }
  loadSyncMeta();
  initConnectivityWatch();
  initSyncFromSavedConfig();
  initNativeNotificationBridge();
  initRecurringReminders();
}

init();
})();
