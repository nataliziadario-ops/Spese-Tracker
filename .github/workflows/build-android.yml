# Compila automaticamente l'APK Android di PROVA (debug) nel cloud di GitHub.
# Non serve Android Studio: dopo ogni caricamento su questo ramo, vai su
# GitHub → scheda "Actions" → apri l'esecuzione più recente → scarica
# l'artefatto "spendy-debug-apk" e installalo su un telefono Android
# (serve abilitare "Origini sconosciute" sul telefono).
#
# NOTA: questo APK è solo per i test (Fase 1-3). L'APK firmato per il
# Play Store si farà nella Fase 4.
name: Build APK Android (debug)

on:
  push:
    branches: [ "Capacitor-Fase-1" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepara Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installa Capacitor
        run: npm ci

      - name: Genera il guscio Android se non è nel repository
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Copia la web app nel guscio Android
        run: npx cap sync android

      - name: Compila l'APK di prova
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Pubblica l'APK come artefatto scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: spendy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
