# Compila automaticamente l'APK Android di PROVA (debug) nel cloud di GitHub.
# Non serve Android Studio.
#
# QUANDO PARTE: ad ogni caricamento — SU QUALSIASI RAMO — che tocca l'app
# (la cartella www/ o la configurazione). Cosi' l'APK viene sempre costruito
# dal ramo su cui stai lavorando, anche se ne crei uno nuovo.
#
# DOVE PRENDERLO: GitHub -> scheda "Actions" -> apri l'esecuzione piu' recente
# -> sezione "Artifacts" -> scarica "spendy-debug-apk" e installalo sul telefono
# (serve abilitare "Origini sconosciute").
#
# NOTA: APK solo per i test (Fase 1-3). Quello firmato per il Play Store: Fase 4.
name: Build APK Android (debug)

on:
  push:
    paths:
      - 'www/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'android-config/**'
      - '.github/workflows/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Prepara Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Prepara Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Installa Capacitor
        run: npm ci

      - name: Genera il guscio Android se non è nel repository
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      # --- Fix login Google: versioni stabili del Credential Manager ---
      # Il plugin usa di default versioni "release candidate" difettose che
      # causano l'errore "Your device doesn't support credential manager".
      # Qui forziamo le versioni stabili raccomandate.
      - name: Correggi le versioni del Credential Manager (login Google)
        run: |
          if [ -f android/variables.gradle ] && ! grep -q "androidxCredentialsVersion" android/variables.gradle; then
            {
              echo ""
              echo "// Fix login Google (Credential Manager): versioni stabili."
              echo "ext.androidxCredentialsVersion = '1.3.0'"
              echo "ext.androidxCredentialsPlayServicesAuthVersion = '1.3.0'"
              echo "ext.librariesIdentityGoogleidVersion = '1.1.1'"
            } >> android/variables.gradle
            echo "variables.gradle: Credential Manager forzato a 1.3.0"
          else
            echo "variables.gradle non trovato o gia' corretto: salto."
          fi

      - name: Copia la web app nel guscio Android
        run: npx cap sync android

      # --- Login Google nativo: chiave di firma STABILE ---
      # L'APK di debug viene firmato con questa chiave fissa, cosi' l'impronta
      # SHA-1/SHA-256 non cambia a ogni build e resta valida in Firebase.
      - name: Usa la chiave di firma stabile (SHA-1 fisso)
        run: |
          mkdir -p ~/.android
          if [ -f android-config/debug.keystore ]; then
            cp android-config/debug.keystore ~/.android/debug.keystore
            echo "Chiave di debug fissa installata."
          else
            echo "ATTENZIONE: manca android-config/debug.keystore — l'SHA-1 cambiera' a ogni build."
          fi

      # --- Login Google nativo: collega Firebase ---
      # Basta questo file: il modello Android di Capacitor applica da solo il
      # plugin Google Services quando trova google-services.json nell'app.
      - name: Collega Firebase (google-services.json)
        run: |
          if [ ! -f android-config/google-services.json ]; then
            echo "############################################################"
            echo "# MANCA il file android-config/google-services.json         #"
            echo "# Registra l'app Android in Firebase (nome pacchetto        #"
            echo "# io.github.nataliziadario.spendy), scarica                 #"
            echo "# google-services.json e mettilo nel repository dentro       #"
            echo "# la cartella android-config/. Senza, il login Google        #"
            echo "# nell'app non puo' funzionare.                              #"
            echo "############################################################"
            exit 1
          fi
          cp android-config/google-services.json android/app/google-services.json
          echo "Firebase collegato: google-services.json copiato in android/app/."

      - name: Compila l'APK di prova
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Pubblica l'APK come artefatto scaricabile
        uses: actions/upload-artifact@v5
        with:
          name: spendy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
