# Compila automaticamente l'APK Android di PROVA (debug) nel cloud di GitHub.
# Non serve Android Studio.
#
# QUANDO PARTE: ad ogni caricamento — SU QUALSIASI RAMO — che tocca l'app
# (la cartella www/ o la configurazione). Cosi' l'APK viene sempre costruito
# dal ramo su cui stai lavorando, anche se ne crei uno nuovo.
#
# DOVE PRENDERLO: GitHub -> scheda "Actions" -> apri l'esecuzione piu' recente
# -> sezione "Artifacts" -> scarica "spendy-debug-apk" e installalo sul telefono
# (serve abilitare "Origini sconosciute").
#
# NOTA: APK solo per i test (Fase 1-3). Quello firmato per il Play Store: Fase 4.
name: Build APK Android (debug)

on:
  push:
    paths:
      - 'www/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'android-config/**'
      - 'android-widget/**'
      - 'android-icons/**'
      - '.github/workflows/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Prepara Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Prepara Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Installa Capacitor
        run: npm ci

      - name: Genera il guscio Android se non è nel repository
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      # --- Fix login Google (causa strutturale) ---
      # Il plugin, di default, NON include davvero il provider Google a runtime
      # (rgcfaIncludeGoogle=false): le librerie del Credential Manager restano
      # "solo in compilazione" e a runtime arrivano da firebase-auth nella
      # versione difettosa 1.2.0-rc01 (errore "device doesn't support credential
      # manager"). Qui attiviamo il provider Google e fissiamo una versione
      # stabile del Credential Manager (1.5.0), coerente fra compile e runtime.
      - name: Attiva il provider Google e fissa il Credential Manager
        run: |
          if [ -f android/variables.gradle ] && ! grep -q "rgcfaIncludeGoogle" android/variables.gradle; then
            {
              echo ""
              echo "// Login Google nativo: includi il provider a runtime + versione stabile."
              echo "ext.rgcfaIncludeGoogle = true"
              echo "ext.androidxCredentialsVersion = '1.5.0'"
              echo "ext.androidxCredentialsPlayServicesAuthVersion = '1.5.0'"
            } >> android/variables.gradle
            echo "variables.gradle: provider Google attivo + Credential Manager 1.5.0"
          else
            echo "variables.gradle non trovato o gia' corretto: salto."
          fi

      - name: Copia la web app nel guscio Android
        run: npx cap sync android

      # --- WIDGET IN SCHERMATA HOME (Android) ---
      # Il progetto android/ viene rigenerato a ogni build, quindi i file dei
      # widget NON possono stare li' dentro: vivono in android-widget/ e li
      # iniettiamo qui. Tre cose: file Java, risorse grafiche, e due ritocchi
      # (MainActivity registra il plugin; il Manifest dichiara i due widget).
      - name: Inietta i widget Android
        run: |
          set -e
          PKG_DIR=android/app/src/main/java/io/github/nataliziadario/spendy
          RES_DIR=android/app/src/main/res
          mkdir -p "$PKG_DIR" "$RES_DIR/layout" "$RES_DIR/xml" "$RES_DIR/drawable"

          cp android-widget/java/*.java "$PKG_DIR"/
          cp android-widget/MainActivity.java "$PKG_DIR"/MainActivity.java
          cp android-widget/res/layout/*.xml "$RES_DIR/layout"/
          cp android-widget/res/xml/*.xml "$RES_DIR/xml"/
          cp android-widget/res/drawable/*.xml "$RES_DIR/drawable"/
          echo "File dei widget copiati nel progetto Android."

          # Icone dell'app (Capacitor ne mette di sue: qui rimettiamo quelle di Spendy)
          # e anteprime mostrate nel selettore dei widget.
          cp -r android-icons/res/. "$RES_DIR"/
          echo "Icone Spendy e anteprime widget copiate."

          python3 android-widget/patch_manifest.py "android/app/src/main/AndroidManifest.xml"

      # Controllo che ogni pezzo sia al suo posto PRIMA di compilare: se manca
      # qualcosa e' molto piu' chiaro leggerlo qui che in un errore di Gradle.
      - name: Controllo file dei widget
        run: |
          set -e
          PKG_DIR=android/app/src/main/java/io/github/nataliziadario/spendy
          RES_DIR=android/app/src/main/res
          for f in WidgetStore.java SpendyWidgetPlugin.java SpendySimpleWidget.java SpendyRichWidget.java SpendyQuickWidget.java MainActivity.java; do
            if [ -f "$PKG_DIR/$f" ]; then echo "  OK      $f"; else echo "  MANCA   $f"; exit 1; fi
          done
          for f in layout/widget_simple.xml layout/widget_rich.xml layout/widget_quick.xml \
                   xml/widget_simple_info.xml xml/widget_rich_info.xml xml/widget_quick_info.xml \
                   drawable/widget_bg.xml drawable/widget_progress.xml \
                   drawable/widget_quick_btn.xml drawable/widget_quick_btn_accent.xml \
                   mipmap-xxxhdpi/ic_launcher.png mipmap-xxxhdpi/ic_spendy_foreground.png \
                   mipmap-anydpi-v26/ic_launcher.xml drawable/ic_spendy_bg.xml \
                   values/spendy_widget_strings.xml \
                   drawable-nodpi/widget_preview_simple.png drawable-nodpi/widget_preview_rich.png drawable-nodpi/widget_preview_quick.png; do
            if [ -f "$RES_DIR/$f" ]; then echo "  OK      res/$f"; else echo "  MANCA   res/$f"; exit 1; fi
          done
          grep -q "SpendySimpleWidget" "$RES_DIR/../AndroidManifest.xml" && echo "  OK      Manifest: widget semplice" || { echo "  MANCA nel Manifest: widget semplice"; exit 1; }
          grep -q "SpendyRichWidget" "$RES_DIR/../AndroidManifest.xml" && echo "  OK      Manifest: widget completo" || { echo "  MANCA nel Manifest: widget completo"; exit 1; }
          grep -q "SpendyQuickWidget" "$RES_DIR/../AndroidManifest.xml" && echo "  OK      Manifest: widget spesa rapida" || { echo "  MANCA nel Manifest: widget spesa rapida"; exit 1; }
          grep -q "registerPlugin(SpendyWidgetPlugin.class)" "$PKG_DIR/MainActivity.java" && echo "  OK      plugin registrato in MainActivity" || { echo "  plugin NON registrato in MainActivity"; exit 1; }
          echo "Tutti i pezzi del widget sono al loro posto."

      # --- Login Google nativo: chiave di firma STABILE (metodo robusto) ---
      # CAUSA STORICA DELL'ERRORE 10: copiare il keystore in ~/.android/ NON
      # bastava — Gradle in certe build ne generava/usava uno diverso (chiave
      # casuale), cosi' l'APK usciva firmato con un'impronta NON registrata in
      # Firebase. Qui NON ci affidiamo piu' a ~/.android: IMPONIAMO a Gradle,
      # per iscritto nel build.gradle, di firmare la build di debug con il
      # NOSTRO file keystore, indicando percorso, password, alias e keypass
      # espliciti. Cosi' l'impronta e' deterministica a ogni compilazione.
      - name: Imponi la firma con la chiave fissa (signingConfig esplicito)
        run: |
          set -e
          if [ ! -f android-config/debug.keystore ]; then
            echo "ERRORE: manca android-config/debug.keystore — impossibile firmare in modo stabile."
            exit 1
          fi
          # Copio il keystore DENTRO il progetto app e uso un percorso assoluto,
          # cosi' non dipende da ~/.android ne' dalla cartella di lavoro.
          cp android-config/debug.keystore android/app/debug.keystore
          KS="$GITHUB_WORKSPACE/android/app/debug.keystore"
          GRADLE=android/app/build.gradle

          # Se non l'ho gia' fatto in questa build, appendo un blocco android {}
          # che riconfigura la signingConfig 'debug' con la nostra chiave.
          # (In Groovy piu' blocchi android {} si fondono: e' valido e stabile.)
          # Niente heredoc: costruisco il blocco con printf per non rompere lo YAML.
          if ! grep -q "SPENDY_FIXED_SIGNING" "$GRADLE"; then
            {
              printf '\n'
              printf '// SPENDY_FIXED_SIGNING — firma di debug deterministica (login Google)\n'
              printf 'android {\n'
              printf '    signingConfigs {\n'
              printf '        debug {\n'
              printf "            storeFile file('%s')\n" "$KS"
              printf "            storePassword 'android'\n"
              printf "            keyAlias 'androiddebugkey'\n"
              printf "            keyPassword 'android'\n"
              printf '        }\n'
              printf '    }\n'
              printf '}\n'
            } >> "$GRADLE"
            echo "signingConfig 'debug' forzata su: $KS"
            echo "----- blocco aggiunto a build.gradle -----"
            tail -n 13 "$GRADLE"
            echo "------------------------------------------"
          else
            echo "signingConfig gia' presente: salto."
          fi

      # --- Verifica (diagnostica): impronta del keystore che firmera' l'APK ---
      # Leggiamo l'impronta dal keystore che abbiamo appena imposto nel
      # build.gradle (android/app/debug.keystore). Questo e' un controllo
      # sull'INGREDIENTE; il controllo definitivo sul PRODOTTO (l'APK finito)
      # e' piu' avanti, nello step "VERIFICA FORENSE".
      - name: Mostra l'impronta del keystore imposto (controllo)
        run: |
          echo "===================================================="
          echo "IMPRONTA DEL KEYSTORE CHE FIRMERA' L'APK (confrontala con Firebase):"
          keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -E "SHA1:|SHA256:"
          echo "===================================================="
          echo "Attesa (registrata in Firebase):"
          echo "  SHA1:   75:AB:38:DD:7C:86:E1:4C:8A:76:6F:66:E4:D2:F7:D6:20:4D:C5:C3"
          echo "  SHA256: D8:89:09:2F:89:61:BD:6D:74:90:2B:0F:51:2E:AD:68:53:2E:4C:38:AD:5D:C3:82:20:50:0C:9D:DB:6D:3B:E0"
          echo "===================================================="

      # --- Login Google nativo: collega Firebase ---
      # Basta questo file: il modello Android di Capacitor applica da solo il
      # plugin Google Services quando trova google-services.json nell'app.
      - name: Collega Firebase (google-services.json)
        run: |
          if [ ! -f android-config/google-services.json ]; then
            echo "############################################################"
            echo "# MANCA il file android-config/google-services.json         #"
            echo "# Registra l'app Android in Firebase (nome pacchetto        #"
            echo "# io.github.nataliziadario.spendy), scarica                 #"
            echo "# google-services.json e mettilo nel repository dentro       #"
            echo "# la cartella android-config/. Senza, il login Google        #"
            echo "# nell'app non puo' funzionare.                              #"
            echo "############################################################"
            exit 1
          fi
          cp android-config/google-services.json android/app/google-services.json
          echo "Firebase collegato: google-services.json copiato in android/app/."

      - name: Compila l'APK di prova
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # --- VERIFICA FORENSE: cosa contiene DAVVERO l'APK compilato ---
      # Controlliamo il PRODOTTO FINITO (l'APK), non gli ingredienti:
      #   1. l'impronta SHA-1 del certificato che lo firma davvero
      #      (con apksigner, che legge anche le firme moderne v2/v3);
      #   2. il nome pacchetto reale;
      #   3. il client ID web (default_web_client_id) incorporato a runtime
      #      (cercato sia nei file generati sia, in riserva, dentro l'APK).
      # Tre "OK" = lato app matematicamente a posto: la causa dell'errore 10
      # e' al 100% lato server Google (Cloud Console / Firebase / propagazione).
      - name: VERIFICA FORENSE dell'APK (firma, pacchetto, client web)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ATTESO_SHA1="75ab38dd7c86e14c8a766f66e4d2f7d6204dc5c3"
          ATTESO_PKG="io.github.nataliziadario.spendy"
          ATTESO_WEB="963457320900-kvomkesmunacee4o8jgs62epl5r8mnks.apps.googleusercontent.com"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)

          echo "==================================================="
          echo "1) Certificato che firma l'APK (letto dall'APK stesso):"
          SHA1_APK=""
          if [ -x "$BT/apksigner" ]; then
            CERTOUT=$("$BT/apksigner" verify --print-certs "$APK" 2>/dev/null || true)
            echo "$CERTOUT" | grep -Ei "SHA-1 digest|SHA-256 digest" || true
            SHA1_APK=$(echo "$CERTOUT" | grep -i "SHA-1 digest" | head -1 | grep -oE '[0-9a-fA-F]{40}' | tr 'A-F' 'a-f')
          fi
          if [ -z "$SHA1_APK" ]; then
            CERT=$(keytool -printcert -jarfile "$APK" 2>/dev/null || true)
            echo "$CERT" | grep -E "SHA1:|SHA256:" || echo "  (certificato non leggibile ne' con apksigner ne' con keytool)"
            SHA1_APK=$(echo "$CERT" | grep "SHA1:" | head -1 | sed 's/.*SHA1: //' | tr -d ' :' | tr 'A-F' 'a-f')
          fi

          echo "---------------------------------------------------"
          echo "2) Nome pacchetto reale dell'APK:"
          PKG=""
          if [ -x "$BT/aapt" ]; then
            PKG=$("$BT/aapt" dump badging "$APK" 2>/dev/null | grep -o "package: name='[^']*'" | cut -d"'" -f2)
          fi
          echo "  ${PKG:-(aapt non disponibile)}"

          echo "---------------------------------------------------"
          echo "3) Client ID web incorporato (default_web_client_id):"
          WEB_ID=$(grep -rh --include='*.xml' "default_web_client_id" android/app/build 2>/dev/null \
                   | grep -o '[0-9a-z-]*\.apps\.googleusercontent\.com' | head -1)
          if [ -z "$WEB_ID" ] && [ -x "$BT/aapt" ]; then
            WEB_ID=$("$BT/aapt" dump resources "$APK" 2>/dev/null | grep -A3 "default_web_client_id" \
                     | grep -o '[0-9a-z-]*\.apps\.googleusercontent\.com' | head -1)
          fi
          echo "  ${WEB_ID:-(non trovato)}"

          echo "==================================================="
          echo "VERDETTO LATO APP:"
          [ "$SHA1_APK" = "$ATTESO_SHA1" ] \
            && echo "  OK  firma APK = impronta registrata in Firebase" \
            || echo "  ERRORE  firma APK ($SHA1_APK) DIVERSA da quella attesa"
          [ "$PKG" = "$ATTESO_PKG" ] \
            && echo "  OK  pacchetto = $ATTESO_PKG" \
            || echo "  ERRORE  pacchetto ($PKG) diverso da quello registrato"
          [ "$WEB_ID" = "$ATTESO_WEB" ] \
            && echo "  OK  client web incorporato = quello del progetto Firebase" \
            || echo "  ERRORE  client web incorporato ($WEB_ID) diverso dall'atteso"
          echo "==================================================="
          echo "Con tre OK il problema NON e' nell'app: segui GUIDA-LOGIN-GOOGLE-DIAGNOSI.md."

      - name: Pubblica l'APK come artefatto scaricabile
        uses: actions/upload-artifact@v5
        with:
          name: spendy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
