# Compila automaticamente l'app iOS (iPhone) di PROVA nel cloud di GitHub,
# usando un Mac messo a disposizione da GitHub (obbligatorio per iOS).
#
# QUANDO PARTE: ad ogni caricamento — SU QUALSIASI RAMO — che tocca l'app
# (la cartella www/ o la configurazione). Cosi' l'IPA viene sempre costruito
# dal ramo su cui stai lavorando, anche se ne crei uno nuovo.
#
# RISULTATO: "Spendy-unsigned.ipa" NON FIRMATO. Da solo NON si installa: la
# firma la mette il TUO iPhone con SideStore (gratis, col tuo ID Apple).
#
# DOVE PRENDERLO: GitHub -> "Actions" -> esecuzione piu' recente -> "Artifacts"
# -> "spendy-unsigned-ipa".
#
# NOTA (login nativo): da questa versione l'app include Firebase nativo per il
# login Google/Apple. Su iOS questo aggiunge dipendenze (Firebase/GoogleSignIn)
# e richiede iOS 15+. Il Login con Apple si attivera' solo con account Apple
# Developer a pagamento e build FIRMATE: qui la build resta non firmata.
name: Build iOS (non firmato, per SideStore)

on:
  push:
    paths:
      - 'www/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'ios-config/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Prepara Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installa Capacitor
        run: npm ci

      - name: Genera il guscio iOS se non e' nel repository
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi

      - name: Copia la web app nel guscio iOS (e installa i Pod)
        run: npx cap sync ios

      # Opzionale: se un giorno aggiungi GoogleService-Info.plist in ios-config/,
      # viene copiato nel progetto. Senza, la build funziona lo stesso ma il
      # login Google/Apple su iOS non e' attivo (per ora va bene cosi').
      - name: (Opzionale) Collega Firebase su iOS se presente
        run: |
          if [ -f ios-config/GoogleService-Info.plist ]; then
            cp ios-config/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
            echo "GoogleService-Info.plist copiato in ios/App/App/."
          else
            echo "Nessun GoogleService-Info.plist: login Google/Apple su iOS non attivo (ok per ora)."
          fi

      - name: Compila l'app iPhone SENZA firma
        working-directory: ios/App
        run: |
          if [ -d "App.xcworkspace" ]; then
            echo "Rilevato progetto CocoaPods (workspace)."
            TARGET="-workspace App.xcworkspace"
          else
            echo "Rilevato progetto Swift Package Manager (Capacitor 8)."
            TARGET="-project App.xcodeproj"
          fi
          xcodebuild $TARGET \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build

      - name: Impacchetta in un file .ipa (non firmato)
        working-directory: ios/App
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Compilazione non riuscita: App.app non trovata."
            exit 1
          fi
          rm -rf Payload Spendy-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" "Payload/App.app"
          zip -qry Spendy-unsigned.ipa Payload
          echo "Creato Spendy-unsigned.ipa"
          ls -lh Spendy-unsigned.ipa

      - name: Pubblica l'IPA come artefatto scaricabile
        uses: actions/upload-artifact@v5
        with:
          name: spendy-unsigned-ipa
          path: ios/App/Spendy-unsigned.ipa
          retention-days: 30
