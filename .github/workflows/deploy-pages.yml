# Pubblica il SITO (GitHub Pages) prendendo i file dalla cartella www/.
#
# COME FUNZIONA ORA (cambiato apposta):
# Prima usavamo l'azione "deploy-pages", che pubblica passando dall'ambiente
# "github-pages". Quell'ambiente accetta una sola pubblicazione alla volta e,
# se resta incastrato, tutti i deploy successivi restano appesi su
# "deployment_in_progress" fino al timeout.
#
# Adesso il workflow copia semplicemente la cartella www/ dentro un ramo
# chiamato "gh-pages" e lo aggiorna. Alla pubblicazione vera ci pensa GitHub
# da sola, leggendo quel ramo. Non usiamo piu' l'ambiente che si inceppa e non
# restiamo in attesa di nessuno stato: il workflow finisce in pochi secondi.
#
# IMPOSTAZIONE DA FARE UNA VOLTA SOLA:
#   GitHub -> Settings -> Pages -> "Source" = "Deploy from a branch"
#   Branch = "gh-pages", cartella = "/ (root)" -> Save
name: Pubblica il sito (GitHub Pages) da www

on:
  push:
    paths:
      - 'www/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: "pubblica-sito"
  cancel-in-progress: false

jobs:
  pubblica:
    # Pubblica solo se il push (o l'avvio manuale) e' sul ramo PREDEFINITO.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Prepara i file del sito
        run: |
          set -e
          rm -rf /tmp/site
          mkdir -p /tmp/site
          cp -r www/. /tmp/site/
          # Evita che GitHub provi a "interpretare" i file: li pubblica come sono.
          touch /tmp/site/.nojekyll
          echo "File pronti:"
          ls -a /tmp/site | head -20

      - name: Aggiorna il ramo gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd /tmp/site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Pubblica il sito da www (${GITHUB_SHA})"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "Ramo gh-pages aggiornato."

      - name: Fatto
        run: |
          echo "Sito aggiornato dal commit ${GITHUB_SHA}."
          echo "GitHub pubblica il ramo gh-pages entro un minuto circa."
