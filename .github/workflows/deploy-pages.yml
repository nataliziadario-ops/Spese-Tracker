# Pubblica il SITO (GitHub Pages) prendendo i file dalla cartella www/.
# Cosi' la cartella www/ e' l'UNICA sorgente: da lei nascono sito, APK e IPA.
#
# QUANDO PARTE: quando aggiorni la cartella www/ SUL RAMO PREDEFINITO del repo
# (quello marcato come "default" su GitHub = il ramo su cui lavori). Un ramo di
# prova NON tocca il sito pubblico. Se cambi ramo principale, imposta il nuovo
# ramo come "default" su GitHub: il sito lo seguira' da solo, senza modificare
# questo file.
#
# IMPORTANTE: perche' funzioni, in GitHub -> Settings -> Pages -> "Source" deve
# essere impostato su "GitHub Actions" (una volta sola).
name: Pubblica il sito (GitHub Pages) da www

on:
  push:
    paths:
      - 'www/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # NON annullare un deploy gia' in corso: l'ambiente github-pages ammette
  # una sola pubblicazione alla volta, e annullarla a meta' lascia il deploy
  # "incastrato" (i run successivi restano su "deployment_in_progress" e vanno
  # in timeout). Con "false" i deploy si mettono in coda e si completano puliti.
  cancel-in-progress: false

jobs:
  deploy:
    # Pubblica solo se il push (o l'avvio manuale) e' sul ramo PREDEFINITO.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # Rete di sicurezza: se Pages restasse impantanato, il job fallisce entro
    # 15 minuti invece di restare appeso a lungo.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Prepara GitHub Pages
        uses: actions/configure-pages@v5

      - name: Impacchetta la cartella www come sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
